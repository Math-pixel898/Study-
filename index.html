        <button class="cal-nav" data-action="bilan-mois" data-sens="-1" type="button" aria-label="Mois précédent"${mois <= premier ? ' disabled' : ''}>${ic('chevronGauche')}</button>
        <h2>Bilan de ${nomMois(mois)}${b.enCours ? ' <small class="aide">(en cours)</small>' : ''}</h2>
        <button class="cal-nav" data-action="bilan-mois" data-sens="1" type="button" aria-label="Mois suivant"${mois >= actuel ? ' disabled' : ''}>${ic('chevron')}</button>
      </div>
      ${tuilesBilan(b)}
      <ul class="liste-bilan">${lignes.map(([icone, texte]) => `<li>${icone}<span>${texte}</span></li>`).join('')}</ul>
    </section>`;
}

// Série de jours d'affilée (streak) + record.
function carteSerie(jour) {
  const s = series(donnees, jour);
  const message = s.aujourdhuiFait
    ? "Tu as étudié aujourd'hui ✓"
    : (s.actuelle ? "Fais un bloc aujourd'hui pour continuer ta série !" : "Un bloc aujourd'hui, et c'est reparti !");
  // Les 7 derniers jours : une flamme pour chaque jour où tu as étudié.
  const etudie = new Set(donnees.blocs.filter(b => b.minutes > 0).map(b => b.date));
  let jours = '';
  for (let k = 6; k >= 0; k--) {
    const j = ajouterJours(jour, -k);
    const lettre = JOURS_COURTS[dateDepuisCle(j).getDay()].charAt(0).toUpperCase();
    jours += `<span class="${etudie.has(j) ? 'fait' : ''}${j === jour ? ' auj' : ''}"><i>${etudie.has(j) ? ic('flamme') : ''}</i><small>${lettre}</small></span>`;
  }
  return `<section class="carte serie-carte" aria-label="Ma série">
      <div class="serie">
        <span class="flamme flamme-grande${s.aujourdhuiFait ? ' allumee' : ''}">${ic('flamme')}</span>
        <div class="serie-num"><span class="serie-valeur">${s.actuelle}</span><span class="tuile-label">jour${s.actuelle > 1 ? 's' : ''} d'affilée</span></div>
        <div class="serie-record"><span class="tuile-valeur">${s.record}</span><span class="tuile-label">record</span></div>
      </div>
      <div class="jours-flammes" role="img" aria-label="Les 7 derniers jours : ${pluriel([...Array(7)].filter((x, k) => etudie.has(ajouterJours(jour, -k))).length, 'jour')} d'étude">${jours}</div>
      <p class="aide">${message} Les jours où ton temps dispo est à 0 ne cassent pas la série.</p>
    </section>`;
}

// Temps par matière, cette semaine ou ce mois-ci.
function carteParMatiere(jour, L) {
  const debut = periodeStats === 'mois' ? jour.slice(0, 8) + '01' : lundiDe(jour);
  const lignes = etudeParMatiere(donnees.blocs, debut, jour);
  const total = lignes.reduce((s, x) => s + x.minutes, 0);
  const quand = periodeStats === 'mois' ? 'ce mois-ci' : 'cette semaine';
  let h = `<section class="carte"><div class="carte-titre"><h2>${ic('horloge')}Temps par matière</h2><span class="etiquette">${formaterDuree(total)}</span></div>
      <div class="bascule" role="group" aria-label="Période">
        <button type="button" data-action="periode-stats" data-periode="semaine" aria-pressed="${periodeStats === 'semaine'}">Cette semaine</button>
        <button type="button" data-action="periode-stats" data-periode="mois" aria-pressed="${periodeStats === 'mois'}">Ce mois-ci</button>
      </div>`;
  if (!lignes.length) {
    let aide = `Pas encore de bloc ${quand}.`;
    if (periodeStats === 'semaine') {
      const avant = etudeParMatiere(donnees.blocs, ajouterJours(debut, -7), ajouterJours(debut, -1)).reduce((s, x) => s + x.minutes, 0);
      if (avant) aide += ` La semaine dernière : ${formaterDuree(avant)}.`;
    }
    return h + `<p class="aide centre">${aide}</p></section>`;
  }
  h += graphiqueBarres(
    lignes.map(x => ({ nom: nomCourtId(x.id), couleur: couleurId(x.id), valeur: x.minutes, texte: formaterDuree(x.minutes) })),
    L, `Temps d'étude par matière ${quand}`);
  return h + `</section>`;
}

// Mes lectures : pages lues cette semaine, et où tu en es dans chaque livre.
function carteLectures(jour) {
  const livres = donnees.echeances
    .filter(e => estLecture(e) && (!e.terminee || (e.termineeLe && e.termineeLe >= ajouterJours(jour, -30))))
    .sort((a, b) => (a.terminee !== b.terminee ? (a.terminee ? 1 : -1) : a.date < b.date ? -1 : 1));
  if (!livres.length) return '';
  const lundi = lundiDe(jour);
  const tousLivres = donnees.echeances.filter(estLecture);
  const semaine = tousLivres.reduce((s, e) => s + pagesLues(e, donnees, b => b.date >= lundi && b.date <= jour), 0);
  const mois = tousLivres.reduce((s, e) => s + pagesLues(e, donnees, b => b.date >= jour.slice(0, 8) + '01' && b.date <= jour), 0);
  const lignes = livres.map(e => {
    const total = pagesTotal(e);
    const lues = Math.min(total, pagesLues(e));
    const pourcent = total ? Math.round(lues / total * 100) : 100;
    return `<li style="${styleMatiereRiche(e.matiereId)}">
        ${anneau(total ? lues / total : 1, { taille: 46, epaisseur: 5, contenu: pourcent >= 100 ? ic('check') : `${pourcent}<small>%</small>`, classe: pourcent >= 100 ? 'complet' : '' })}
        <span class="texte"><strong>${echapper(titreEcheance(e))}</strong><small>${lues}/${pluriel(total, 'page')} · ${e.terminee ? 'finie' : `à finir ${quandCourt(e.date, jour)}`}</small></span>
      </li>`;
  }).join('');
  return `<section class="carte"><div class="carte-titre"><h2>${ic('livre')}Mes lectures</h2><span class="etiquette">${pluriel(semaine, 'page')} cette semaine</span></div>
      <ul class="liste-livres">${lignes}</ul>
      <p class="aide">${pluriel(mois, 'page')} lue${mois > 1 ? 's' : ''} ce mois-ci · vitesse : ${formaterDecimal(vitesseLecture())} min par page${vitesseMesuree() ? ' (mesurée avec le chrono)' : ''}.</p>
    </section>`;
}

// Barres horizontales : une ligne par matière (nom à gauche, valeur au bout de la barre).
function graphiqueBarres(lignes, L, titre, max = null) {
  const hLigne = 34;
  const epaisseur = 14;
  const xBarre = Math.min(118, Math.round(L * 0.34));
  const placeTexte = Math.min(150, 12 + 7.2 * Math.max(...lignes.map(l => l.texte.length)));
  const largeurMax = Math.max(24, L - xBarre - placeTexte);
  const plafond = max || Math.max(1, ...lignes.map(l => l.valeur));
  const H = lignes.length * hLigne;
  let svg = '';
  lignes.forEach((l, k) => {
    const y = k * hLigne + (hLigne - epaisseur) / 2;
    const w = Math.max(3, l.valeur / plafond * largeurMax);
    svg += `<text class="g-nom" x="0" y="${n1(y + epaisseur / 2)}" dominant-baseline="central">${echapper(raccourcir(l.nom, Math.max(6, Math.floor((xBarre - 8) / 8))))}</text>`;
    svg += `<path d="${barreH(xBarre, y, w, epaisseur)}" fill="${l.couleur}"><title>${echapper(l.nom)} : ${echapper(l.texte)}</title></path>`;
    svg += `<text class="g-valeur" x="${n1(xBarre + w + 6)}" y="${n1(y + epaisseur / 2)}" dominant-baseline="central">${echapper(l.texte)}</text>`;
  });
  return `<svg class="graphique" viewBox="0 0 ${L} ${H}" width="${L}" height="${H}" role="img" aria-label="${echapper(titre)}">${svg}</svg>`;
}

// Temps d'étude chaque jour sur les 30 derniers jours (colonnes empilées par matière).
function carte30Jours(jour, L) {
  const debut = ajouterJours(jour, -29);
  const etude = etudeParJour(donnees.blocs);
  const jours = [];
  for (let j = debut; j <= jour; j = ajouterJours(j, 1)) jours.push({ jour: j, ...(etude[j] || { total: 0, parMatiere: {} }) });
  // Ordre fixe des matières : chacune garde toujours sa place et sa couleur.
  const presentes = new Set(jours.flatMap(x => Object.keys(x.parMatiere)));
  const ordre = [
    ...donnees.matieres.map(m => m.id).filter(id => presentes.has(id)),
    ...[...presentes].filter(id => id !== 'libre' && !trouverMatiere(id)),
    ...(presentes.has('libre') ? ['libre'] : []),
  ];
  const total = jours.reduce((s, x) => s + x.total, 0);
  const nbJours = jours.filter(x => x.total > 0).length;

  // Échelle : 3 lignes (0, la moitié, le haut) sur des valeurs rondes.
  const maxMin = Math.max(1, ...jours.map(x => x.total));
  const pas = maxMin <= 60 ? 30 : 60 * Math.ceil(maxMin / 120);
  const plafond = 2 * pas;
  const gauche = 44;
  const haut = 8;
  const hPlot = 140;
  const H = haut + hPlot + 24;
  const largeurPlot = L - gauche;
  const slot = largeurPlot / jours.length;
  const epaisseur = Math.min(24, Math.max(2, slot - 2));   // 2 px d'air entre deux colonnes

  let svg = '';
  const kChoisi = jours.findIndex(x => x.jour === jourStats);
  if (kChoisi >= 0) svg += `<rect class="g-choisi" x="${n1(gauche + kChoisi * slot)}" y="${haut}" width="${n1(slot)}" height="${hPlot}" rx="3"/>`;
  for (const v of [0, pas, plafond]) {
    const y = n1(haut + hPlot - v / plafond * hPlot);
    svg += `<line class="g-grille" x1="${gauche}" x2="${L}" y1="${y}" y2="${y}"/>`;
    svg += `<text class="g-axe" x="${gauche - 6}" y="${y}" text-anchor="end" dominant-baseline="central">${v ? formaterDuree(v) : '0'}</text>`;
  }
  jours.forEach((x, k) => {
    if (!x.total) return;
    const xb = gauche + k * slot + (slot - epaisseur) / 2;
    const parts = ordre.filter(id => x.parMatiere[id] > 0);
    const hTotal = Math.max(1.5, x.total / plafond * hPlot);
    const place = Math.max(parts.length, hTotal - 2 * (parts.length - 1));   // 2 px d'air entre les morceaux
    let yBas = haut + hPlot;
    parts.forEach((id, i) => {
      const hp = Math.max(1, x.parMatiere[id] / x.total * place);
      const y = yBas - hp;
      const forme = i === parts.length - 1 ? barreV(xb, y, epaisseur, hp) : `M${n1(xb)},${n1(y)}h${n1(epaisseur)}v${n1(hp)}h${n1(-epaisseur)}Z`;
      svg += `<path d="${forme}" fill="${couleurId(id)}"/>`;
      yBas = y - 2;
    });
  });
  // Une date par semaine sous l'axe (la dernière = aujourd'hui).
  for (let k = jours.length - 1; k >= 0; k -= 7) {
    const d = dateDepuisCle(jours[k].jour);
    const dernier = k === jours.length - 1;
    svg += `<text class="g-axe" x="${n1(dernier ? L : gauche + k * slot + slot / 2)}" y="${haut + hPlot + 16}" text-anchor="${dernier ? 'end' : 'middle'}">${dernier ? "auj." : `${d.getDate()} ${MOIS_COURTS[d.getMonth()]}`}</text>`;
  }
  // Zone tactile sur toute la largeur : le jour le plus proche du doigt est choisi.
  svg += `<rect x="${gauche}" y="0" width="${n1(largeurPlot)}" height="${haut + hPlot}" fill="transparent" data-action="stat-jour" data-debut="${debut}" data-gauche="${gauche}" data-slot="${slot}"/>`;

  let detail = "Touche une colonne pour voir le détail d'un jour.";
  if (kChoisi >= 0) {
    const x = jours[kChoisi];
    const parts = ordre.filter(id => x.parMatiere[id] > 0).map(id => `${echapper(nomCourtId(id))} ${formaterDuree(x.parMatiere[id])}`);
    detail = `<strong>${capitaliser(dateCourte(x.jour))} : ${x.total ? formaterDuree(x.total) : "pas d'étude"}</strong>${parts.length ? ' — ' + parts.join(' · ') : ''}`;
  }
  const lignesTable = jours.filter(x => x.total).reverse().map(x => [
    capitaliser(dateCourte(x.jour)),
    ordre.filter(id => x.parMatiere[id] > 0).map(id => `${echapper(nomCourtId(id))} ${formaterDuree(x.parMatiere[id])}`).join(', '),
    formaterDuree(x.total),
  ]);
  return `<section class="carte"><div class="carte-titre"><h2>${ic('calendrier')}Les 30 derniers jours</h2><span class="etiquette">${formaterDuree(total)}</span></div>
      <p class="aide" style="margin:0 0 10px">${pluriel(nbJours, 'jour')} d'étude sur 30 · en moyenne ${formaterDuree(total / 30)} par jour</p>
      <svg class="graphique" viewBox="0 0 ${L} ${H}" width="${L}" height="${H}" role="img" aria-label="Temps d'étude par jour sur les 30 derniers jours : ${formaterDuree(total)} en tout">${svg}</svg>
      ${legende(ordre)}
      <div class="detail-graphique" aria-live="polite">${detail}</div>
      ${tableauChiffres('jours', 'Voir les chiffres jour par jour', ['Jour', 'Matières', 'Total'], lignesTable)}
    </section>`;
}

// Moyenne des notes par matière.
function carteNotes(L) {
  const res = resultatsAvecEtude(donnees);
  let h = `<section class="carte"><div class="carte-titre"><h2>${ic('cible')}Mes notes</h2></div>`;
  if (!res.length) return h + `<p class="aide">Quand tu marques un test comme passé, entre ta note : tes moyennes par matière apparaîtront ici.</p></section>`;
  const echelle = donnees.reglages.echelleNote || 20;
  const enEchelle = pourcent => Math.round(pourcent / 100 * echelle * 10) / 10;
  const parMatiere = {};
  for (const x of res) (parMatiere[x.echeance.matiereId] = parMatiere[x.echeance.matiereId] || []).push(x);
  const lignes = Object.entries(parMatiere).map(([id, liste]) => {
    const moyenne = liste.reduce((s, x) => s + x.pourcent, 0) / liste.length;
    return { nom: nomMatiere(id), couleur: couleurMatiere(id), valeur: moyenne, texte: `${formaterNote(enEchelle(moyenne), echelle)} (${pluriel(liste.length, 'note')})` };
  }).sort((a, b) => b.valeur - a.valeur);
  const generale = res.reduce((s, x) => s + x.pourcent, 0) / res.length;
  const avecObjectif = res.filter(x => x.atteint !== null);
  h += `<p class="aide" style="margin:0 0 10px">Moyenne générale : <strong>${formaterNote(enEchelle(generale), echelle)}</strong> sur ${pluriel(res.length, 'note')}${avecObjectif.length ? ` · 🎯 objectif atteint ${avecObjectif.filter(x => x.atteint).length} fois sur ${avecObjectif.length}` : ''}</p>`;
  h += graphiqueBarres(lignes, L, 'Moyenne des notes par matière', 100);
  return h + `</section>`;
}

// Temps d'étude d'une échéance ↔ note obtenue : est-ce que plus d'étude = meilleure note ?
function carteEtudeEtNotes(L) {
  const res = resultatsAvecEtude(donnees);
  let h = `<section class="carte"><div class="carte-titre"><h2>${ic('graphique')}Étude et notes</h2></div>`;
  if (!res.length) return h + `<p class="aide">Ici tu verras si plus d'étude donne une meilleure note, dès que tu auras entré tes premières notes.</p></section>`;
  const echelle = donnees.reglages.echelleNote || 20;
  const gauche = 34;
  const droite = 12;
  const haut = 22;
  const hPlot = 170;
  const H = haut + hPlot + 40;
  const maxH = Math.max(1, Math.ceil(Math.max(...res.map(x => x.minutes)) / 60));
  const plafondH = maxH % 2 ? maxH + 1 : maxH;   // pair : une graduation tombe pile au milieu
  const largeurPlot = L - gauche - droite;
  const X = minutes => gauche + minutes / 60 / plafondH * largeurPlot;
  const Y = pourcent => haut + hPlot - pourcent / 100 * hPlot;

  let svg = `<text class="g-axe" x="0" y="10">Note</text>`;
  for (const p of [0, 50, 100]) {
    const y = n1(Y(p));
    svg += `<line class="g-grille" x1="${gauche}" x2="${L - droite}" y1="${y}" y2="${y}"/>`;
    svg += `<text class="g-axe" x="${gauche - 6}" y="${y}" text-anchor="end" dominant-baseline="central">${formaterDecimal(p / 100 * echelle)}</text>`;
  }
  for (const hh of [0, plafondH / 2, plafondH]) {
    svg += `<text class="g-axe" x="${n1(X(hh * 60))}" y="${haut + hPlot + 16}" text-anchor="${hh === 0 ? 'start' : hh === plafondH ? 'end' : 'middle'}">${hh} h</text>`;
  }
  svg += `<text class="g-axe" x="${n1(gauche + largeurPlot / 2)}" y="${haut + hPlot + 33}" text-anchor="middle">Temps d'étude pour l'échéance</text>`;
  for (const x of res) {
    const choisi = pointStats === x.echeance.id;
    svg += `<circle class="g-point" cx="${n1(X(x.minutes))}" cy="${n1(Y(x.pourcent))}" r="${choisi ? 7 : 5}" fill="${couleurMatiere(x.echeance.matiereId)}"/>`;
  }
  // Zones tactiles plus grandes que les points (dessinées au-dessus).
  for (const x of res) {
    svg += `<circle cx="${n1(X(x.minutes))}" cy="${n1(Y(x.pourcent))}" r="14" fill="transparent" data-action="stat-point" data-id="${x.echeance.id}"><title>${echapper(nomMatiere(x.echeance.matiereId))} : ${formaterDuree(x.minutes)} → ${formaterNote(x.echeance.resultat.note, x.echeance.resultat.sur)}</title></circle>`;
  }

  const choisi = res.find(x => x.echeance.id === pointStats);
  const detail = choisi
    ? `<strong>${echapper(capitaliser(nomEcheanceLong(choisi.echeance)))}</strong> du ${dateCourte(choisi.echeance.date)} : ${formaterDuree(choisi.minutes)} d'étude → ${formaterNote(choisi.echeance.resultat.note, choisi.echeance.resultat.sur)}${choisi.atteint ? ' 🎯' : ''}`
    : "Touche un point pour voir de quelle note il s'agit.";

  // Pour chaque matière : est-ce que plus d'étude va avec une meilleure note ?
  const parMatiere = {};
  for (const x of res) (parMatiere[x.echeance.matiereId] = parMatiere[x.echeance.matiereId] || []).push(x);
  const avis = Object.entries(parMatiere).map(([id, liste]) => {
    const r = correlation(liste.map(x => ({ x: x.minutes, y: x.pourcent })));
    const confirmer = liste.length < 3 ? ' (à confirmer avec plus de notes)' : '';
    let texte = "une seule note pour l'instant";
    if (liste.length >= 2) {
      if (r !== null && r >= 0.3) texte = `📈 plus tu étudies, meilleure est ta note${confirmer}`;
      else if (r !== null && r <= -0.3) texte = `🤔 plus d'étude n'a pas donné de meilleures notes : essaie une autre méthode${confirmer}`;
      else texte = "pas de lien net pour l'instant";
    }
    return `<li style="${styleMatiere(id)}"><span class="rond"></span><span><strong>${echapper(nomMatiere(id))}</strong> : ${texte}</span></li>`;
  }).join('');

  const lignesTable = res.slice().reverse().map(x => [
    `${echapper(nomMatiere(x.echeance.matiereId))} (${x.echeance.type})`,
    dateCourte(x.echeance.date),
    formaterDuree(x.minutes),
    formaterNote(x.echeance.resultat.note, x.echeance.resultat.sur) + (x.atteint ? ' 🎯' : ''),
  ]);
  return h + `<svg class="graphique" viewBox="0 0 ${L} ${H}" width="${L}" height="${H}" role="img" aria-label="Temps d'étude et note obtenue, pour chaque test ou examen">${svg}</svg>
      ${legende(Object.keys(parMatiere), 'point')}
      <div class="detail-graphique" aria-live="polite">${detail}</div>
      <ul class="liens-etude">${avis}</ul>
      ${tableauChiffres('notes', 'Voir toutes mes notes', ['Échéance', 'Date', 'Étude', 'Note'], lignesTable)}
    </section>`;
}

// Les badges : gagnés (avec la date) et à gagner (avec où tu en es).
function carteBadges(jour) {
  const s = series(donnees, jour);
  const tuiles = [];
  for (const b of BADGES) {
    if (b.id === 'heures-10') {
      // Celui-ci se gagne une fois par matière.
      for (const id of Object.keys(donnees.badges).filter(x => x.startsWith('heures-10:'))) {
        tuiles.push(tuileBadge(infoBadge(id), donnees.badges[id], '', 1, 'heures-10'));
      }
      const minutes = {};
      for (const bl of donnees.blocs) if (bl.matiereId) minutes[bl.matiereId] = (minutes[bl.matiereId] || 0) + bl.minutes;
      const prochaine = donnees.matieres
        .filter(m => !donnees.badges['heures-10:' + m.id])
        .map(m => ({ m, minutes: minutes[m.id] || 0 }))
        .sort((x, y) => y.minutes - x.minutes)[0];
      if (prochaine) tuiles.push(tuileBadge(b, null, `${prochaine.m.nom} : ${formaterDuree(prochaine.minutes)} / 10 h`, prochaine.minutes / 600, b.id));
      continue;
    }
    const date = donnees.badges[b.id];
    tuiles.push(tuileBadge(b, date, date ? '' : progressionBadge(b.id, s), ratioBadge(b.id, s), b.id));
  }
  const nb = Object.keys(donnees.badges).length;
  return `<section class="carte"><div class="carte-titre"><h2>${ic('medaille')}Badges</h2><span class="etiquette">${nb} gagné${nb > 1 ? 's' : ''}</span></div>
      <div class="badges-grille">${tuiles.join('')}</div>
    </section>`;
}

// La couleur de chaque médaille.
const TEINTES_BADGES = {
  'premier-bloc': '#51cf66', 'serie-3': '#ff922b', 'serie-7': '#ff6b4a', 'serie-30': '#fcc419',
  'blocs-50': '#f783ac', 'heures-10': '#4dabf7', objectif: '#ff6b6b', 'semaine-parfaite': '#ffd43b',
  // V6
  'leve-tot': '#ffa94d', 'heures-25': '#74c0fc', 'heures-100': '#e599f7', 'livres-5': '#b197fc',
  'examen-blanc': '#ff8787', 'objectif-semaine': '#69db7c', 'questions-5': '#66d9e8', 'tout-coche': '#8ce99a',
};
// Une couleur plus sombre (pour le relief des médailles).
function assombrir(hex, f) {
  const n = parseInt(hex.slice(1), 16);
  return `rgb(${Math.round(((n >> 16) & 255) * f)}, ${Math.round(((n >> 8) & 255) * f)}, ${Math.round((n & 255) * f)})`;
}

// Une médaille : en couleur si elle est gagnée, grise avec un anneau de progression sinon.
function tuileBadge(b, date, aide, ratio = 0, idBase = '') {
  const teinte = TEINTES_BADGES[idBase] || '#b0abff';
  const style = `--teinte:${teinte};--teinte-sombre:${assombrir(teinte, 0.55)};--teinte-fond:${rgba(teinte, 0.16)};--teinte-bord:${rgba(teinte, 0.35)};--teinte-lueur:${rgba(teinte, 0.7)}`;
  return `<div class="badge-tuile${date ? ' gagne' : ' verrouille'}" style="${style}">
      <span class="medaille">${date ? '' : anneau(ratio, { taille: 74, epaisseur: 4 })}<span class="emoji" aria-hidden="true">${b.emoji}</span></span>
      <strong>${echapper(b.nom)}</strong>
      <small>${date ? `le ${dateCourteSansJour(date)}` : echapper(aide)}</small>
    </div>`;
}

// Où tu en es pour une médaille pas encore gagnée (de 0 à 1).
function ratioBadge(id, s) {
  if (id.startsWith('serie-')) return Math.min(1, s.actuelle / Number(id.slice(6)));
  if (id === 'blocs-50') return Math.min(1, donnees.blocs.length / 50);
  // V6
  const total = () => donnees.blocs.reduce((t, b) => t + b.minutes, 0);
  if (id === 'heures-25') return Math.min(1, total() / 1500);
  if (id === 'heures-100') return Math.min(1, total() / 6000);
  if (id === 'livres-5') return Math.min(1, livresFinis(donnees).length / 5);
  if (id === 'objectif-semaine') { const o = etatObjectifSemaine(donnees); return o ? o.ratio : 0; }
  if (id === 'questions-5') return Math.min(1, (donnees.blocs.filter(b => b.compris).length + donnees.questions.filter(q => q.resolue).length) / 5);
  return 0;
}

function progressionBadge(id, s) {
  if (id === 'premier-bloc') return 'Termine un bloc';
  if (id.startsWith('serie-')) return `Série : ${Math.min(s.actuelle, Number(id.slice(6)))} / ${id.slice(6)} jours`;
  if (id === 'blocs-50') return `${Math.min(donnees.blocs.length, 50)} / 50 blocs`;
  if (id === 'objectif') return 'Une note ≥ ton objectif';
  if (id === 'semaine-parfaite') return "Tous les blocs prévus d'une semaine";
  // V6
  const total = donnees.blocs.reduce((t, b) => t + b.minutes, 0);
  if (id === 'leve-tot') return 'Un bloc commencé avant 9 h';
  if (id === 'heures-25') return `${formaterDuree(Math.min(total, 1500))} / 25 h`;
  if (id === 'heures-100') return `${formaterDuree(Math.min(total, 6000))} / 100 h`;
  if (id === 'livres-5') return `${Math.min(livresFinis(donnees).length, 5)} / 5 livres`;
  if (id === 'examen-blanc') return 'Fais un examen blanc';
  if (id === 'objectif-semaine') {
    const o = etatObjectifSemaine(donnees);
    return o ? `${formaterDuree(o.fait)} / ${formaterDuree(o.objectif)} cette semaine` : 'Fixe-toi un objectif (Stats)';
  }
  if (id === 'questions-5') return `${Math.min(donnees.blocs.filter(b => b.compris).length + donnees.questions.filter(q => q.resolue).length, 5)} / 5 questions`;
  if (id === 'tout-coche') return "Coche tous les chapitres d'un test";
  return '';
}

// Touché dans le graphique des 30 jours : on choisit le jour le plus proche du doigt.
function choisirJourStats(zone, ev) {
  const svg = zone.ownerSVGElement;
  const boite = svg.getBoundingClientRect();
  if (!ev || !Number.isFinite(ev.clientX) || !boite.width) return;
  const x = (ev.clientX - boite.left) * (svg.viewBox.baseVal.width / boite.width);
  const k = borner(Math.floor((x - Number(zone.dataset.gauche)) / Number(zone.dataset.slot)), 0, 29);
  jourStats = ajouterJours(zone.dataset.debut, k);
  afficherStats();
}

// Une ligne de réglage avec des boutons − et +.
function ligneReglage(chemin, libelle, precision, pas, min, max, format) {
  const valeur = lireChemin(donnees.reglages, chemin);
  return `<div class="ligne-reglage">
      <div class="libelle">${libelle}${precision ? `<small>${precision}</small>` : ''}</div>
      <div class="stepper" data-chemin="${chemin}" data-pas="${pas}" data-min="${min}" data-max="${max}">
        <button type="button" data-action="moins" aria-label="Diminuer ${libelle}">−</button>
        <output>${formaterValeur(valeur, format)}</output>
        <button type="button" data-action="plus" aria-label="Augmenter ${libelle}">+</button>
      </div>
    </div>`;
}

function ligneInterrupteur(chemin, libelle, precision) {
  return `<label class="ligne-reglage">
      <span class="libelle">${libelle}${precision ? `<small>${precision}</small>` : ''}</span>
      <span class="interrupteur"><input type="checkbox" data-reglage="${chemin}"${donnees.reglages[chemin] ? ' checked' : ''}><span></span></span>
    </label>`;
}

function formaterValeur(v, format) {
  if (format === 'duree') return formaterDuree(v);
  if (format === 'min') return `${v} min`;
  if (format === 'blocs') return pluriel(v, 'bloc');
  if (format === 'avant') return `${v} j avant`;
  if (format === 'plusjours') return `+${v} j`;
  if (format === 'fois') return `× ${formaterDecimal(v)}`;
  if (format === 'minpage') return `${formaterDecimal(v)} min`;
  if (format === 'objectif') return v > 0 ? formaterDuree(v) : 'Aucun';
  return formaterDecimal(v);
}

function changerReglage(bouton, sens) {
  const s = bouton.closest('.stepper');
  const pas = Number(s.dataset.pas);
  const valeur = lireChemin(donnees.reglages, s.dataset.chemin) + sens * pas;
  const arrondie = Math.round(valeur * 100) / 100;
  ecrireChemin(donnees.reglages, s.dataset.chemin, borner(arrondie, Number(s.dataset.min), Number(s.dataset.max)));
  sauvegarder();
  afficherReglages();
}

/* ---------- Installer l'appli sur le téléphone ---------- */

let invitationInstall = null;  // fournie par Chrome (Android / ordinateur) quand l'appli est installable

function appliInstallee() {
  return window.matchMedia('(display-mode: standalone)').matches || navigator.standalone === true;
}

function carteInstaller() {
  if (appliInstallee()) return '';
  let corps;
  if (location.protocol === 'file:') {
    corps = `<p class="aide">Tu as ouvert le <strong>fichier</strong> directement : impossible de l'installer comme ça. Ouvre l'<strong>adresse web</strong> de l'appli (qui commence par https://).</p>`;
  } else if (!window.isSecureContext) {
    corps = `<p class="aide">L'adresse doit commencer par <strong>https://</strong> pour pouvoir installer l'appli.</p>`;
  } else if (invitationInstall) {
    corps = `<div class="pile"><button class="btn btn-principal btn-plein" data-action="installer" type="button">Installer l'application</button></div>`;
  } else if (estIphone()) {
    corps = `<ol><li>Ouvre cette page dans <strong>Safari</strong> (pas dans une autre appli).</li>
        <li>Touche le bouton <strong>Partager</strong> (le carré avec une flèche vers le haut).</li>
        <li>Choisis <strong>« Sur l'écran d'accueil »</strong>, puis <strong>Ajouter</strong>.</li></ol>
        <p class="attention">Sur iPhone, l'appli installée a ses propres données : elles ne reprennent pas celles vues dans Safari.</p>`;
  } else {
    corps = `<ol><li>Ouvre cette page dans <strong>Chrome</strong>.</li>
        <li>Touche le menu <strong>⋮</strong> (en haut à droite).</li>
        <li>Choisis <strong>« Installer l'application »</strong> (ou « Ajouter à l'écran d'accueil »).</li></ol>
        <p class="aide">Pas d'option d'installation ? Recharge la page, attends quelques secondes et regarde à nouveau le menu.</p>`;
  }
  return `<section class="carte installer"><div class="carte-titre"><h2>${ic('telephone')}Installer l'appli</h2></div>${corps}</section>`;
}

async function installerAppli() {
  const invitation = invitationInstall;
  if (!invitation) return;
  invitationInstall = null;
  invitation.prompt();
  try {
    const choix = await invitation.userChoice;
    afficherToast(choix.outcome === 'accepted' ? 'Installation en cours…' : 'Installation annulée');
  } catch (erreur) { /* pas grave */ }
  if (vueActive === 'reglages') afficherReglages();
}

// Chrome prévient l'appli quand elle peut être installée.
window.addEventListener('beforeinstallprompt', ev => {
  ev.preventDefault();
  invitationInstall = ev;
  if (vueActive === 'reglages') afficherReglages();
});
window.addEventListener('appinstalled', () => {
  invitationInstall = null;
  afficherToast('Appli installée ✓');
  if (vueActive === 'reglages') afficherReglages();
});

// Le service worker (fichier sw.js) garde l'appli en mémoire : installation + mode hors ligne.
// Il ne fonctionne qu'avec une adresse https:// (pas quand on ouvre le fichier directement).
if ('serviceWorker' in navigator && location.protocol.startsWith('http')) {
  window.addEventListener('load', () => { navigator.serviceWorker.register('sw.js').catch(() => {}); });
}

/* ---------- Petits messages ---------- */

let minuteurToast = null;
// Un petit message en bas. Avec un bouton (ex : "Annuler"), il reste 7 secondes.
function afficherToast(texte, bouton = null) {
  const t = document.getElementById('toast');
  t.textContent = '';
  const span = document.createElement('span');
  span.textContent = texte;
  t.appendChild(span);
  if (bouton) {
    const b = document.createElement('button');
    b.type = 'button';
    b.className = 'toast-bouton';
    b.dataset.action = bouton.action;
    b.textContent = bouton.texte;
    t.appendChild(b);
  }
  t.classList.toggle('avec-bouton', Boolean(bouton));
  t.classList.add('visible');
  clearTimeout(minuteurToast);
  minuteurToast = setTimeout(() => t.classList.remove('visible'), bouton ? 7000 : 2800);
}

// Après une suppression : un bouton "Annuler" pendant 7 secondes.
let annulation = null;
function proposerAnnulation(message, defaire) {
  annulation = { defaire, jusqua: Date.now() + 7500 };
  afficherToast(message, { texte: 'Annuler', action: 'annuler' });
}
function annulerDerniere() {
  const a = annulation;
  annulation = null;
  if (!a || Date.now() > a.jusqua) return;
  a.defaire();
  sauvegarder();
  majVerrouEcran();
  rafraichir();
  afficherToast('Annulé ✓');
}

function flasher(couleur) {
  const f = document.getElementById('flash');
  f.style.background = couleur;
  f.classList.remove('actif');
  void f.offsetWidth;  // relance l'animation
  f.classList.add('actif');
}

/* ---------- La feuille qui monte du bas ---------- */

let minuteurFeuille = null;

function ouvrirFeuille(html) {
  const fond = document.getElementById('fond-feuille');
  const feuille = document.getElementById('feuille');
  clearTimeout(minuteurFeuille);
  feuille.innerHTML = `<div class="poignee"></div>${html}`;
  feuille.scrollTop = 0;
  fond.hidden = false;
  document.body.classList.add('bloque');

  fond.classList.add('ouvert');
}

function fermerFeuille() {
  const fond = document.getElementById('fond-feuille');
  if (fond.hidden) return;
  fond.classList.remove('ouvert');
  document.body.classList.remove('bloque');
  clearTimeout(minuteurFeuille);
  minuteurFeuille = setTimeout(() => {
    fond.hidden = true;
    document.getElementById('feuille').innerHTML = '';
  }, 250);
}

/* ---------- Boîte de confirmation ---------- */

// Affiche un message et des boutons ; renvoie (plus tard) la valeur du bouton choisi.
function choisir(message, options) {
  return new Promise(resolve => {
    const fond = document.getElementById('fond-dialogue');
    fond.innerHTML = `<div class="dialogue" role="alertdialog" aria-modal="true" aria-label="Confirmation">
        <p>${echapper(message)}</p>
        <div class="pile">${options.map((o, i) => `<button class="btn btn-plein${o.style ? ' btn-' + o.style : ''}" data-choix="${i}" type="button">${echapper(o.texte)}</button>`).join('')}</div>
      </div>`;
    fond.hidden = false;
    const echap = ev => { if (ev.key === 'Escape') fermer(null); };
    function fermer(valeur) {
      fond.hidden = true;
      fond.innerHTML = '';
      fond.onclick = null;
      document.removeEventListener('keydown', echap);
      resolve(valeur);
    }
    document.addEventListener('keydown', echap);
    fond.onclick = ev => {
      const bouton = ev.target.closest('[data-choix]');
      if (bouton) fermer(options[Number(bouton.dataset.choix)].valeur);
      else if (ev.target === fond) fermer(null);
    };
  });
}

async function confirmer(message, texteOui, danger = false) {
  const reponse = await choisir(message, [
    { valeur: true, texte: texteOui, style: danger ? 'danger-plein' : 'principal' },
    { valeur: false, texte: 'Annuler' },
  ]);
  return reponse === true;
}

function erreurForm(message) {
  const p = document.getElementById('erreur-form');
  if (!p) return;
  p.textContent = message;
  p.hidden = false;
  p.scrollIntoView({ block: 'nearest', behavior: 'smooth' });
}

        <button class="btn btn-plein btn-danger" data-action="supprimer-echeance" data-id="${e.id}" type="button">Supprimer</button>
        <button class="btn btn-plein" data-action="fermer" type="button">Fermer</button>
      </div>
    </div>`);
}

// La checklist de la veille (dans le détail de l'échéance).
function blocChecklist(e) {
  const { liste, coches } = avancementChecklist(e);
  return `<div class="veille">
      <div class="veille-titre">${ic('lune')}<strong>C'est la veille : révision rapide</strong> <span class="aide" id="compte-checklist" style="margin:0">(${coches}/${liste.length})</span></div>
      <ul class="checklist">${liste.map(item => `<li>
          <label><input type="checkbox" data-checklist="${item.id}" data-id="${e.id}"${e.checklist[item.id] ? ' checked' : ''}><span>${echapper(item.texte)}</span></label>
          ${(item.details || []).map(t => `<span class="sous">${echapper(t)}</span>`).join('')}
        </li>`).join('')}</ul>
    </div>`;
}

function cocherChecklist(id, cle, coche) {
  const e = trouverEcheance(id);
  if (!e) return;
  if (coche) e.checklist[cle] = true;
  else delete e.checklist[cle];
  sauvegarder();
  const { liste, coches } = avancementChecklist(e);
  const compte = document.getElementById('compte-checklist');
  if (compte) compte.textContent = `(${coches}/${liste.length})`;
  rafraichir();   // met à jour "x/y" sur l'écran derrière la feuille
  if (coches === liste.length) afficherToast('Checklist terminée ✓ Bonne chance demain !');
}

// La note obtenue (dans le détail d'une échéance passée).
function blocResultat(e) {
  const r = e.resultat;
  if (!r) {
    return `<div class="resultat"><div class="resultat-titre">${ic('cible')}<strong>Ta note</strong></div>
        <p class="aide" style="margin:4px 0 10px">Entre ta note quand tu l'as : elle compte dans tes stats et, avec un objectif, elle ajuste ta difficulté perso.</p>
        <button class="btn btn-plein" data-action="note-resultat" data-id="${e.id}" type="button">Entrer ma note</button>
      </div>`;
  }
  const effet = effetResultat(r);
  const compte = partsDifficulte(e.matiereId, donnees.blocs, donnees.echeances).notes.includes(e);
  let texte = "Sans objectif, ta note est gardée dans tes stats mais ne change pas ta difficulté.";
  if (r.objectif !== null) {
    if (!compte) texte = `Cette note est plus ancienne que tes ${NB_RESULTATS} dernières en ${nomMatiere(e.matiereId)} : elle ne compte plus dans la difficulté.`;
    else if (effet > 0) texte = `Sous ton objectif : ta difficulté en ${nomMatiere(e.matiereId)} monte (${signe(effet)}), tu auras un peu plus de temps la prochaine fois.`;
    else if (effet < 0) texte = `Largement au-dessus de ton objectif : ta difficulté en ${nomMatiere(e.matiereId)} baisse un peu (${signe(effet)}).`;
    else texte = 'Objectif atteint : ta difficulté ne change pas.';
  }
  return `<div class="resultat"><div class="resultat-titre">${ic('cible')}<strong>${texteResultat(r)}</strong></div>
      <p class="aide" style="margin:4px 0 10px">${echapper(texte)}</p>
      <button class="btn btn-plein" data-action="note-resultat" data-id="${e.id}" type="button">Modifier ma note</button>
    </div>`;
}

// "Test passé" : l'échéance sort du plan et va dans l'historique, puis on demande la note.
function marquerPassee(id) {
  const e = trouverEcheance(id);
  if (!e) return;
  if (estLecture(e)) {
    e.terminee = true;
    e.termineeLe = aujourdhui();
    e.rythme = null;
    e.checklist = {};
    sauvegarder();
    fermerFeuille();
    rafraichir();
    afficherToast("📖 Lecture rangée dans l'historique ✓");
    verifierBadges();
    return;
  }
  e.terminee = true;
  e.termineeLe = aujourdhui();
  e.rythme = null;
  e.checklist = {};
  sauvegarder();
  rafraichir();
  ouvrirFormResultat(id, true);   // (la feuille dit déjà "✓ Rangé dans l'historique")
}

/* ---------- Lecture : noter où tu en es (après un bloc, ou "J'ai lu" sans chrono) ---------- */

// "J'ai lu sans chrono" : tu indiques la page où tu es arrivé(e).
function ouvrirFormLecture(id) {
  const e = trouverEcheance(id);
  if (!estLecture(e)) return;

  ouvrirFeuille(`<form id="form-lecture" data-id="${e.id}" novalidate style="${styleMatiereRiche(e.matiereId)}">
      <h2>${echapper(titreEcheance(e))}</h2>
      <p class="aide" style="margin:-6px 0 16px">${avant >= e.pageDebut ? `Tu en étais à la page ${avant}` : `Tu commences à la page ${e.pageDebut}`} · le livre va jusqu'à la page ${e.pageFin}.</p>
      <label class="champ">J'en suis à la page
        <input type="number" name="page" inputmode="numeric" min="${Math.max(avant + 1, e.pageDebut)}" max="${e.pageFin}" placeholder="ex : ${Math.min(e.pageFin, Math.max(avant, e.pageDebut - 1) + 15)}" autocomplete="off">
      </label>
      <label class="champ">Note <span class="facultatif">(facultatif)</span>
        <input type="text" name="note" maxlength="120" placeholder="ex : chapitre 4, le renard" autocomplete="off">
      </label>
      <div class="estimation" id="apercu-lecture"><div class="aide">Ces pages comptent dans ton plan, ta série et tes stats (avec un temps estimé à ${formaterDecimal(vitesseLivre(e))} min par page).</div></div>
      <p class="erreur" id="erreur-form" hidden></p>
      <div class="pile">
        <button type="submit" class="btn btn-principal btn-geant">${ic('check')} Enregistrer</button>
        <button type="button" class="btn btn-plein" data-action="fermer">Annuler</button>
      </div>
    </form>`);
}

// Aperçu en direct : combien de pages, et le temps compté.
function majApercuLecture() {
  const form = document.getElementById('form-lecture');
  const e = form && trouverEcheance(form.dataset.id);
  if (!estLecture(e)) return;
  const page = lireNombre(new FormData(form).get('page'));
  const avant = pageActuelle(e);
  const zone = document.getElementById('apercu-lecture');
  if (!Number.isInteger(page) || page <= avant || page > e.pageFin) return;
  const pages = page - avant;
  zone.innerHTML = `<strong>+${pluriel(pages, 'page')}</strong> · ≈ ${formaterDuree(pages * vitesseLivre(e))} de lecture comptées
    <div class="aide">${page === e.pageFin ? 'Et le livre est fini ! 🎉' : `Encore ${pluriel(e.pageFin - page, 'page')} ensuite.`}</div>`;
}

function enregistrerLecture(form) {
  const e = trouverEcheance(form.dataset.id);
  if (!estLecture(e)) return fermerFeuille();
  const f = new FormData(form);
  const page = lireNombre(f.get('page'));
  const avant = pageActuelle(e);
  if (page === null) return erreurForm('Indique la page où tu es arrivé(e).');
  if (!Number.isInteger(page)) return erreurForm('Indique un numéro de page (un nombre entier).');
  if (page > e.pageFin) return erreurForm(`Le livre s'arrête à la page ${e.pageFin}.`);
  if (page < e.pageDebut) return erreurForm(`La lecture commence à la page ${e.pageDebut}.`);
  if (page <= avant) return erreurForm(`Tu en étais déjà à la page ${avant}. (Pour corriger une erreur, supprime une séance dans le détail du livre.)`);
  const pages = page - Math.max(avant, e.pageDebut - 1);
  const note = String(f.get('note') || '').trim().slice(0, 120);
  const jour = aujourdhui();
  // Un bloc de lecture d'aujourd'hui où la page n'a pas été notée ("Passer") ? On le complète.
  const sansPages = donnees.blocs.filter(b => b.echeanceId === e.id && b.date === jour && b.pages === undefined && !b.manuel).pop();
  if (sansPages) {
    Object.assign(sansPages, { pages, page, note: note || sansPages.note });
    if (donnees.aEvaluer === sansPages.id) donnees.aEvaluer = null;
  } else {
    donnees.blocs.push({
      id: nouvelId(), echeanceId: e.id, matiereId: e.matiereId, date: jour, debut: Date.now(),
      minutes: Math.max(1, Math.round(pages * vitesseLivre(e))), ressenti: null, note, pages, page, manuel: true,
    });
  }
  sauvegarder();
  fermerFeuille();
  rafraichir();
  apresLecture(e, pages);
}

// Après un bloc de lecture chronométré : la page atteinte.
function enregistrerPagesLues(bouton) {
  const b = donnees.blocs.find(x => x.id === donnees.aEvaluer);
  const e = b ? trouverEcheance(b.echeanceId) : null;
  const carte = bouton.closest('.ressenti');
  if (!b || !estLecture(e) || !carte) {
    donnees.aEvaluer = null;
    sauvegarder();
    rafraichir();
    return;
  }
  const page = Number(carte.querySelector('.page-lecture').value);
  const avant = pageActuelle(e);
  const minimum = Math.max(avant, e.pageDebut - 1);
  if (!Number.isInteger(page) || page < minimum || page > e.pageFin) {
    afficherToast(`⚠️ Indique une page entre ${minimum} et ${e.pageFin}`);
    return;
  }
  b.pages = page - minimum;
  b.page = page;
  b.note = (carte.querySelector('.note-bloc').value || '').trim().slice(0, 120);
  donnees.aEvaluer = null;
  brouillonNote = '';
  brouillonPage = '';
  sauvegarder();
  rafraichir();
  apresLecture(e, b.pages);
}

// "Passer" : la page n'est pas notée (tu pourras le faire avec "J'ai lu").
function passerLecture(bouton) {
  const b = donnees.blocs.find(x => x.id === donnees.aEvaluer);
  const champ = bouton.closest('.ressenti') && bouton.closest('.ressenti').querySelector('.note-bloc');
  if (b && champ) b.note = champ.value.trim().slice(0, 120);
  donnees.aEvaluer = null;
  brouillonNote = '';
  brouillonPage = '';
  sauvegarder();
  rafraichir();
  afficherToast("OK. Tu pourras noter ta page plus tard avec « J'ai lu ».");
}

// Le message après une lecture, et si le livre est fini : bravo, et on propose de le ranger.
async function apresLecture(e, pages) {
  const reste = e.pageFin - pageActuelle(e);
  if (reste > 0) {
    afficherToast(`📖 ${pluriel(pages, 'page')} lue${pages > 1 ? 's' : ''} · encore ${pluriel(reste, 'page')}`);
    verifierBadges();
    return;
  }
  celebrer(couleurMatiere(e.matiereId));
  vibrer([30, 60, 30]);
  verifierBadges(true);
  const ranger = await confirmer(`Bravo, tu as fini « ${titreEcheance(e)} » ! 🎉 Ranger cette lecture dans l'historique ?`, "Ranger dans l'historique");
  if (ranger) marquerPassee(e.id);
  else afficherToast('📖 Livre terminé ! Il reste dans tes échéances.');
}

// Supprimer une séance de lecture (depuis le détail du livre).
async function supprimerSeance(id) {
  const b = donnees.blocs.find(x => x.id === id);
  if (!b) return;
  const texte = b.pages !== undefined ? `+${pluriel(b.pages, 'page')}, ${b.minutes} min` : `${b.minutes} min`;
  if (!(await confirmer(`Supprimer cette séance de lecture (${texte}) ?`, 'Supprimer', true))) return;
  const position = donnees.blocs.indexOf(b);
  donnees.blocs = donnees.blocs.filter(x => x.id !== id);
  if (donnees.aEvaluer === id) donnees.aEvaluer = null;
  sauvegarder();
  rafraichir();
  if (b.echeanceId && trouverEcheance(b.echeanceId)) ouvrirDetailEcheance(b.echeanceId);
  proposerAnnulation('Séance supprimée', () => {
    if (!donnees.blocs.some(x => x.id === b.id)) donnees.blocs.splice(Math.min(position, donnees.blocs.length), 0, b);
    if (b.echeanceId && trouverEcheance(b.echeanceId) && !document.getElementById('fond-feuille').hidden) setTimeout(() => ouvrirDetailEcheance(b.echeanceId), 0);
  });
}

/* ---------- Ta note à un test ou un examen ---------- */

// L'objectif proposé : celui de ta dernière note dans la même matière (converti dans la bonne échelle).
function objectifPropose(matiereId, sur, saufId) {
  const precedent = donnees.echeances
    .filter(x => x.id !== saufId && x.matiereId === matiereId && x.terminee && x.resultat && x.resultat.objectif !== null)
    .sort((a, b) => (a.date < b.date ? 1 : a.date > b.date ? -1 : 0))[0];
  if (!precedent) return null;
  const pas = sur === 100 ? 1 : 0.5;
  return Math.round(precedent.resultat.objectif / precedent.resultat.sur * sur / pas) * pas;
}

function nombrePourChamp(x) {
  return x === null || x === undefined ? '' : formaterDecimal(x);
}

function ouvrirFormResultat(id, justePasse = false) {
  const e = trouverEcheance(id);
  if (!e || !e.terminee) return;
  const r = e.resultat;
  const sur = r ? r.sur : donnees.reglages.echelleNote;
  const propose = r ? null : objectifPropose(e.matiereId, sur, e.id);
  const objectif = r ? r.objectif : propose;
  ouvrirFeuille(`<form id="form-resultat" data-id="${e.id}" data-propose="${propose === null ? '' : propose}" novalidate style="${styleMatiere(e.matiereId)}">
      <h2>Ta note ${echapper(e.type === 'examen' ? "à l'examen" : e.type === 'devoir' ? 'au devoir' : 'au test')} ${echapper(de(nomMatiere(e.matiereId)))}</h2>
      <p class="aide" style="margin:-6px 0 16px">${justePasse ? `✓ Rangé dans l'historique. ` : ''}${capitaliser(dateLongue(e.date))}.
        Pas encore ta note ? Touche « Plus tard » : tu pourras l'entrer depuis l'historique.</p>
      <fieldset>
        <legend>Noté</legend>
        <div class="segments">
          ${ECHELLES.map(x => `<label><input type="radio" name="sur" value="${x.sur}"${x.sur === sur ? ' checked' : ''}><span>${x.nom}</span></label>`).join('')}
        </div>
      </fieldset>
      <div class="deux-champs">
        <label class="champ">Ma note<input type="text" name="note" inputmode="decimal" value="${nombrePourChamp(r ? r.note : null)}" placeholder="ex : 13,5" autocomplete="off"></label>
        <label class="champ">Mon objectif <span class="facultatif">(facultatif)</span><input type="text" name="objectif" inputmode="decimal" value="${nombrePourChamp(objectif)}" placeholder="ex : 14" autocomplete="off"></label>
      </div>
      <div class="estimation" id="apercu-resultat"></div>
      <p class="erreur" id="erreur-form" hidden></p>
      <div class="pile">
        <button type="submit" class="btn btn-principal btn-geant">Enregistrer ma note</button>
        <button type="button" class="btn btn-plein" data-action="fermer">${r ? 'Annuler' : 'Plus tard'}</button>
        ${r ? `<button type="button" class="btn btn-plein btn-danger" data-action="effacer-note" data-id="${e.id}">Effacer ma note</button>` : ''}
      </div>
    </form>`);
  majApercuResultat();
}

// Lit le formulaire de note. Renvoie { sur, note, objectif, erreur }.
function lireFormResultat(form) {
  const f = new FormData(form);
  const sur = [10, 20, 100].includes(Number(f.get('sur'))) ? Number(f.get('sur')) : 20;
  const note = lireNombre(f.get('note'));
  const objectif = lireNombre(f.get('objectif'));
  const valide = x => Number.isFinite(x) && x >= 0 && x <= sur;
  // "14/20" tapé alors que l'échelle choisie est "en %" : on te le signale plutôt que de se tromper.
  const echelleTapee = texte => {
    const m = String(texte || '').trim().match(/(%|\/\s*(10|20|100))$/);
    return m ? (m[1] === '%' ? 100 : Number(m[2])) : null;
  };
  const conflit = [f.get('note'), f.get('objectif')].find(t => echelleTapee(t) !== null && echelleTapee(t) !== sur);
  let erreur = null;
  if (conflit) erreur = `Tu as écrit « ${String(conflit).trim()} » mais l'échelle choisie est « ${ECHELLES.find(x => x.sur === sur).nom} » : choisis la bonne en haut.`;
  else if (note === null) erreur = 'Entre ta note.';
  else if (!valide(note)) erreur = `Ta note doit être un nombre entre 0 et ${sur}.`;
  else if (objectif !== null && !valide(objectif)) erreur = `Ton objectif doit être un nombre entre 0 et ${sur} (ou laisse la case vide).`;
  const arrondi = x => (Number.isFinite(x) ? Math.round(x * 100) / 100 : x);
  return { sur, note: arrondi(note), objectif: arrondi(objectif), erreur };
}

// Quand tu changes d'échelle (sur 10 / sur 20 / en %), l'objectif proposé suit, s'il n'a pas été touché.
function changerEchelleResultat(form) {
  const champ = form.elements.objectif;
  const propose = form.dataset.propose === '' ? null : Number(form.dataset.propose);
  if (propose === null || lireNombre(champ.value) !== propose) return;
  const sur = Number(new FormData(form).get('sur'));
  const nouveau = objectifPropose(trouverEcheance(form.dataset.id).matiereId, sur, form.dataset.id);
  champ.value = nombrePourChamp(nouveau);
  form.dataset.propose = nouveau === null ? '' : nouveau;
}

// Aperçu en direct : la note en %, l'objectif, et l'effet sur ta difficulté perso.
function majApercuResultat() {
  const form = document.getElementById('form-resultat');
  if (!form) return;
  const e = trouverEcheance(form.dataset.id);
  const zone = document.getElementById('apercu-resultat');
  const v = lireFormResultat(form);
  if (!e || v.erreur) {
    zone.innerHTML = v.erreur && v.note !== null
      ? `<div class="aide">⚠️ ${echapper(v.erreur)}</div>`
      : `<div class="aide">Avec un objectif, ta note ajuste ta difficulté perso en ${echapper(nomMatiere(e ? e.matiereId : null))} : en dessous, plus de temps de révision la prochaine fois ; largement au-dessus, un peu moins.</div>`;
    return;
  }
  let texte = `Ta note : <strong>${formaterNote(v.note, v.sur)}</strong>${v.sur !== 100 ? ` (${Math.round(v.note / v.sur * 100)} %)` : ''}`;
  if (v.objectif !== null) {
    const ecart = v.note - v.objectif;
    texte += ecart >= 0
      ? `<div>🎯 Objectif atteint${ecart > 0 ? ` (+${formaterDecimal(Math.round(ecart * 100) / 100)})` : ''}</div>`
      : `<div>Objectif ${formaterNote(v.objectif, v.sur)} : il manque ${formaterDecimal(Math.round(-ecart * 100) / 100)} point${-ecart > 1 ? 's' : ''}</div>`;
    const avant = coefMatiere(e.matiereId);
    const echeances = donnees.echeances.map(x => (x.id === e.id ? { ...x, resultat: { note: v.note, sur: v.sur, objectif: v.objectif } } : x));
    const apres = coefsDifficulte(donnees.blocs, echeances)[e.matiereId] || 1;
    texte += apres === avant
      ? `<div class="aide">Difficulté perso en ${echapper(nomMatiere(e.matiereId))} : × ${formaterDecimal(avant)} (pas de changement)</div>`
      : `<div class="aide">Difficulté perso en ${echapper(nomMatiere(e.matiereId))} : × ${formaterDecimal(avant)} → <strong>× ${formaterDecimal(apres)}</strong></div>`;
  } else {
    texte += `<div class="aide">Sans objectif, ta note compte dans tes stats mais ne change pas ta difficulté.</div>`;
  }
  zone.innerHTML = texte;
}

function enregistrerResultat(form) {
  const e = trouverEcheance(form.dataset.id);
  if (!e) return fermerFeuille();
  const v = lireFormResultat(form);
  if (v.erreur) return erreurForm(v.erreur);
  const avant = coefMatiere(e.matiereId);
  e.resultat = { note: v.note, sur: v.sur, objectif: v.objectif };
  donnees.reglages.echelleNote = v.sur;   // la prochaine fois, on te propose la même échelle
  sauvegarder();
  fermerFeuille();
  rafraichir();
  const apres = coefMatiere(e.matiereId);
  let message = v.objectif !== null && v.note >= v.objectif ? 'Note enregistrée 🎯 Objectif atteint !' : 'Note enregistrée ✓';
  if (apres !== avant) message += ` · ${nomMatiere(e.matiereId)} : difficulté × ${formaterDecimal(apres)}`;
  afficherToast(message);
  verifierBadges();
}

async function effacerNote(id) {
  const e = trouverEcheance(id);
  if (!e || !e.resultat) return;
  if (!(await confirmer(`Effacer ta note (${formaterNote(e.resultat.note, e.resultat.sur)}) ?`, 'Effacer', true))) return;
  const ancienne = e.resultat;
  e.resultat = null;
  sauvegarder();
  fermerFeuille();
  rafraichir();
  proposerAnnulation('Note effacée', () => { if (trouverEcheance(e.id) && !e.resultat) e.resultat = ancienne; });
}

function remettreDansPlan(id) {
  const e = trouverEcheance(id);
  if (!e) return;
  e.terminee = false;
  e.termineeLe = null;
  e.rythme = null;
  sauvegarder();
  fermerFeuille();
  rafraichir();
  afficherToast('Remis dans le plan ✓');
}

/* ---------- Formulaire d'une échéance ---------- */

function ouvrirFormEcheance(id, preselection = {}) {
  if (!donnees.matieres.length) {
    ouvrirFormMatiere(null, { puisEcheance: true });
    return;
  }
  const e = id ? trouverEcheance(id) : null;
  const v = e || {
    matiereId: preselection.matiereId || (donnees.matieres.length === 1 ? donnees.matieres[0].id : ''),
    type: preselection.type || 'test',
    date: ajouterJours(aujourdhui(), preselection.type === 'lecture' || preselection.type === 'devoir' ? 14 : 7),
    niveau: 2,
    chapitres: 2,
    note: '',
    travail: 'mixte',
    minutesEstimees: 120,
  };
  const minutesDevoir = v.type === 'devoir' && v.minutesEstimees ? v.minutesEstimees : 120;
  // Une lecture ou un devoir n'a pas de niveau ni de chapitres : si on le change en test, on part des valeurs habituelles.
  const sansNiveau = v.type === 'lecture' || v.type === 'devoir';
  const niveauForm = sansNiveau ? 2 : v.niveau;
  const chapitresForm = sansNiveau ? 2 : v.chapitres;
  const matieres = [...donnees.matieres].sort((a, b) => a.nom.localeCompare(b.nom, 'fr'));

  ouvrirFeuille(`<form id="form-echeance" data-id="${e ? e.id : ''}" data-genre="${genreFormulaire(v.type)}" novalidate>
      <h2>${e ? "Modifier l'échéance" : 'Nouvelle échéance'}</h2>
      <fieldset>

// Affiche en direct le temps d'étude estimé pendant qu'on remplit le formulaire.
function majEstimation() {
  const form = document.getElementById('form-echeance');
  if (!form) return;
  const f = new FormData(form);
  const r = donnees.reglages;
  form.dataset.genre = genreFormulaire(f.get('type'));
  if (f.get('type') === 'lecture') {
    document.getElementById('estimation').innerHTML = estimationLecture(f);
    return;
  }
  if (f.get('type') === 'devoir') {
    document.getElementById('estimation').innerHTML = estimationDevoir(f);
    return;
  }
  const e = {
    matiereId: f.get('matiere'),
    type: f.get('type') === 'examen' ? 'examen' : 'test',
    niveau: Number(f.get('niveau')) || 1,
    chapitres: Math.max(0, parseInt(f.get('chapitres'), 10) || 0),
    date: f.get('date'),
    travail: Object.keys(TRAVAUX).includes(f.get('travail')) ? f.get('travail') : 'mixte',
  };
  const coef = e.matiereId ? coefMatiere(e.matiereId) : 1;
  const minutes = tempsEstime(e, r, coef);
  let texte = `Temps d'étude estimé : <strong>${formaterDuree(minutes)}</strong> (${pluriel(blocsPour(minutes, r.travail), 'bloc')} de ${r.travail} min)`;
  if (coef !== 1) texte += `<div class="aide">Ta difficulté perso en ${echapper(nomMatiere(e.matiereId))} (× ${formaterDecimal(coef)}) est comptée.</div>`;
  if (e.travail === 'parcoeur') texte += `<div class="aide">Par cœur : petits morceaux, 1 bloc par jour, sur plus de jours.</div>`;
  if (e.travail === 'exercices') texte += `<div class="aide">Exercices : séances d'au moins ${pluriel(r.blocsParSession, 'bloc')} d'affilée.</div>`;
  if (estCleDate(e.date)) {
    const jour = aujourdhui();
    const debut = ajouterJours(e.date, -dureeFenetre(e, r));
    if (e.date <= jour) texte += `<div class="aide">⚠️ Cette date est aujourd'hui ou déjà passée : rien ne sera planifié.</div>`;
    else texte += `<div class="aide">Révisions ${debut > jour ? `à partir du ${dateLongue(debut)}` : "dès aujourd'hui"}, jusqu'à la veille.</div>`;
  }
  document.getElementById('estimation').innerHTML = texte;
}

// Lecture : combien de temps, et combien de pages par jour d'ici la date.
function estimationLecture(f) {
  const debut = parseInt(f.get('pageDebut'), 10) || 1;
  const fin = parseInt(f.get('pageFin'), 10);
  if (!(fin >= debut)) return `<div class="aide">Indique les pages à lire (ex : de la page 1 à la page 180) : l'appli les répartit sur les jours qui restent.</div>`;
  const pages = fin - debut + 1;
  const form = document.getElementById('form-echeance');
  const existant = form && form.dataset.id ? trouverEcheance(form.dataset.id) : null;
  const livre = { id: existant ? existant.id : '', difficulteLecture: f.get('difficulteLecture') };
  const vitesse = vitesseLivre(livre);
  const pourquoi = vitesseLivreMesuree(livre) ? ' (mesurée sur ce livre)'
    : `${vitesseMesuree() ? ' (ta vitesse mesurée' : ' (environ ' + Math.round(60 / vitesse) + ' pages par heure'}${livre.difficulteLecture === 'facile' ? ', livre facile' : livre.difficulteLecture === 'difficile' ? ', livre difficile' : ''})`;
  let texte = `<strong>${pluriel(pages, 'page')}</strong> · ≈ <strong>${formaterDuree(pages * vitesse)}</strong> de lecture
    <div class="aide">À ${formaterDecimal(vitesse)} min par page${pourquoi}.</div>`;
  const date = f.get('date');
  if (estCleDate(date)) {
    const jours = ecartJours(aujourdhui(), date);
    if (jours <= 0) texte += `<div class="aide">⚠️ Cette date est aujourd'hui ou déjà passée : rien ne sera planifié.</div>`;
    else texte += `<div class="aide">Environ <strong>${pluriel(Math.ceil(pages / jours), 'page')} par jour</strong> dès aujourd'hui, jusqu'à la veille (si ton temps dispo le permet).</div>`;
  }
  return texte;
}

// Devoir : le temps de travail prévu, et quand il sera réparti.
function estimationDevoir(f) {
  const r = donnees.reglages;
  const minutes = borner(parseInt(f.get('minutesEstimees'), 10) || 120, 15, 6000);
  let texte = `Temps de travail prévu : <strong>${formaterDuree(minutes)}</strong> (${pluriel(blocsPour(minutes, r.travail), 'bloc')} de ${r.travail} min)`;
  texte += `<div class="aide">Après l'avoir enregistré, découpe-le en étapes (recherches, plan, rédaction…) dans son détail.</div>`;
  const date = f.get('date');
  if (estCleDate(date)) {
    const jour = aujourdhui();
    const debut = ajouterJours(date, -dureeFenetre({ type: 'devoir', travail: 'mixte' }, r));
    if (date <= jour) texte += `<div class="aide">⚠️ Cette date est aujourd'hui ou déjà passée : rien ne sera planifié.</div>`;
    else texte += `<div class="aide">Travail ${debut > jour ? `à partir du ${dateLongue(debut)}` : "dès aujourd'hui"}, jusqu'à la veille de la remise.</div>`;
  }
  return texte;
}
function genreFormulaire(type) {
  return type === 'lecture' ? 'lecture' : type === 'devoir' ? 'devoir' : 'etude';
}
// Devoir : + / − sur le temps prévu (par 15 min, puis par 30 min au-delà de 2 h).
function changerTempsDevoir(sens) {
  const champ = document.querySelector('#form-echeance input[name="minutesEstimees"]');
  if (!champ) return;
  const actuel = parseInt(champ.value, 10) || 120;
  const pas = (sens > 0 ? actuel >= 120 : actuel > 120) ? 30 : 15;
  champ.value = borner(actuel + sens * pas, 15, 6000);
  const zone = document.getElementById('temps-devoir');
  if (zone) zone.textContent = formaterDuree(Number(champ.value));
  majEstimation();
}

function changerChapitres(sens) {
  const champ = document.querySelector('#form-echeance input[name="chapitres"]');
  if (!champ) return;
  champ.value = borner((parseInt(champ.value, 10) || 0) + sens, 1, 99);
  majEstimation();
}

function enregistrerEcheance(form) {
  const f = new FormData(form);
  const matiereId = f.get('matiere');
  const date = f.get('date');
  const lecture = f.get('type') === 'lecture';
  const devoir = f.get('type') === 'devoir';
  const chapitres = lecture || devoir ? 1 : parseInt(f.get('chapitres'), 10);
  if (!matiereId) return erreurForm('Choisis une matière.');
  let livre = null;
  if (lecture) {
    const debut = Number(f.get('pageDebut') || 1);
    const fin = Number(f.get('pageFin'));
    if (!(Number.isInteger(debut) && debut >= 1 && debut <= 9999)) return erreurForm('La première page doit être un nombre entier (1 si tu commences au début).');
    if (!f.get('pageFin')) return erreurForm('Indique la dernière page à lire.');
    if (!(Number.isInteger(fin) && fin >= debut && fin <= 9999)) return erreurForm(`La dernière page doit être un nombre entier, au moins ${debut}.`);
    livre = { titre: String(f.get('titre') || '').trim().replace(/\s+/g, ' ').slice(0, 80), pageDebut: debut, pageFin: fin };
    if (['facile', 'difficile'].includes(f.get('difficulteLecture'))) livre.difficulteLecture = f.get('difficulteLecture');
  }
  if (devoir) {
    livre = {
      titre: String(f.get('titreDevoir') || '').trim().replace(/\s+/g, ' ').slice(0, 80),
      minutesEstimees: borner(parseInt(f.get('minutesEstimees'), 10) || 120, 15, 6000),
    };
  }
  if (!estCleDate(date)) return erreurForm('Choisis une date.');
  if (!(chapitres >= 1 && chapitres <= 99)) return erreurForm('Le nombre de chapitres doit être entre 1 et 99.');

  const valeurs = {
    matiereId,
    type: lecture ? 'lecture' : devoir ? 'devoir' : (f.get('type') === 'examen' ? 'examen' : 'test'),
    date,
    niveau: lecture || devoir ? 1 : borner(Number(f.get('niveau')) || 2, 1, 4),
    chapitres,
    note: String(f.get('note') || '').trim(),
    travail: lecture || devoir ? 'mixte' : (Object.keys(TRAVAUX).includes(f.get('travail')) ? f.get('travail') : 'mixte'),
  };
  const id = form.dataset.id;
  if (id) {
    const e = trouverEcheance(id);
    // Si ce qui compte pour le plan change, on repart d'un rythme neuf (pas de faux retard).
    const change = ['matiereId', 'type', 'date', 'niveau', 'chapitres', 'travail'].some(cle => e[cle] !== valeurs[cle])
      || (lecture && (e.pageDebut !== livre.pageDebut || e.pageFin !== livre.pageFin || e.difficulteLecture !== livre.difficulteLecture))
      || (devoir && e.minutesEstimees !== livre.minutesEstimees);
    if (e.date !== valeurs.date) e.checklist = {};   // nouvelle date : nouvelle veille
    Object.assign(e, valeurs);
    // Les champs propres à un type (livre, devoir) partent si le type change.
    for (const cle of ['titre', 'pageDebut', 'pageFin', 'difficulteLecture', 'minutesEstimees']) delete e[cle];
    if (livre) Object.assign(e, livre);
    if (change) e.rythme = null;
  } else {
    donnees.echeances.push(Object.assign({ id: nouvelId(), ...valeurs, terminee: false, termineeLe: null, rythme: null, resultat: null, checklist: {} }, livre || {}));
  }
  sauvegarder();
  fermerFeuille();
  rafraichir();
  afficherToast(date <= aujourdhui() ? 'Enregistré (attention : date passée)' : (id ? 'Échéance modifiée ✓' : (lecture ? '📖 Lecture ajoutée ✓' : devoir ? '📝 Devoir ajouté ✓ Découpe-le en étapes dans son détail' : 'Échéance ajoutée ✓')));
}

async function supprimerEcheance(id) {
  const e = trouverEcheance(id);
  if (!e) return;
  const ok = await confirmer(`Supprimer ${nomEcheanceLong(e)} du ${dateLongue(e.date)} ?`, 'Supprimer', true);
  if (!ok) return;
  const position = donnees.echeances.indexOf(e);
  donnees.echeances = donnees.echeances.filter(x => x.id !== id);
  sauvegarder();
  fermerFeuille();
  rafraichir();
  proposerAnnulation('Échéance supprimée', () => {
    if (!trouverEcheance(e.id)) donnees.echeances.splice(Math.min(position, donnees.echeances.length), 0, e);
  });
}

/* ---------- Formulaire d'une matière ---------- */

function ouvrirFormMatiere(id, options = {}) {
  const m = id ? trouverMatiere(id) : null;
  const prises = donnees.matieres.map(x => x.couleur);
  const libre = PALETTE.find(c => !prises.includes(c.code));
  const couleur = m ? m.couleur : (libre ? libre.code : PALETTE[donnees.matieres.length % PALETTE.length].code);
  const couleurs = PALETTE.some(c => c.code === couleur) ? PALETTE : [...PALETTE, { nom: 'Actuelle', code: couleur }];

  // Difficulté perso de la matière (expliquée : part des ressentis + part des notes).
  let difficulte = '';
  if (m) {
    const p = partsDifficulte(m.id, donnees.blocs, donnees.echeances);
    const compte = Object.keys(RESSENTIS)
      .map(cle => [cle, p.ressentis.filter(x => x === cle).length])
      .filter(([, n]) => n > 0)
      .map(([cle, n]) => `${n} ${RESSENTIS[cle].emoji} ${RESSENTIS[cle].nom}`)
      .join(' · ');
    const ressentis = p.ressentis.length
      ? `tes ressentis (${p.ressentis.length > 1 ? `les ${p.ressentis.length} derniers` : 'le dernier'} : ${compte}) : ${signe(p.partRessentis)}`
      : "tes ressentis : aucun pour l'instant (Facile / Ok / Dur après chaque bloc)";
    const notes = p.notes.length
      ? `tes notes (${p.notes.map(e => `${formaterNote(e.resultat.note, e.resultat.sur)}, objectif ${formaterNote(e.resultat.objectif, e.resultat.sur)}`).join(' ; ')}) : ${signe(p.partNotes)}`
      : 'tes notes : entre ta note et ton objectif quand tu marques un test comme passé';
    difficulte = `<div class="estimation">Difficulté perso : <strong>× ${formaterDecimal(coefMatiere(m.id))}</strong>
        <div class="aide">On part de × 1, puis :<br>• ${ressentis}<br>• ${notes}<br>Le total est arrondi à 0,05 près, et reste toujours entre × 0,7 et × 1,5.</div></div>`;
  }

  ouvrirFeuille(`<form id="form-matiere" data-id="${m ? m.id : ''}" data-puis-echeance="${options.puisEcheance ? 'oui' : ''}" novalidate>
      <h2>${m ? 'Modifier la matière' : 'Nouvelle matière'}</h2>
      ${options.puisEcheance ? `<p class="aide" style="margin:-6px 0 16px">D'abord une matière, ensuite tu pourras créer ton test ou examen.</p>` : ''}
      <label class="champ">Nom<input type="text" name="nom" maxlength="30" value="${m ? echapper(m.nom) : ''}" placeholder="ex : Maths, Chimie, Philo…" autocomplete="off" enterkeyhint="done"></label>
      <fieldset>
        <legend>Couleur</legend>
        <div class="palette">
          ${couleurs.map(c => `<label class="pastille-choix" style="--couleur:${c.code}"><input type="radio" name="couleur" value="${c.code}" aria-label="${c.nom}"${c.code === couleur ? ' checked' : ''}><span></span></label>`).join('')}
        </div>
      </fieldset>
      ${difficulte}
      <p class="erreur" id="erreur-form" hidden></p>
      <div class="pile">
        <button type="submit" class="btn btn-principal btn-geant">${options.puisEcheance ? 'Continuer' : 'Enregistrer'}</button>
        <button type="button" class="btn btn-plein" data-action="fermer">Annuler</button>
        ${m ? `<button type="button" class="btn btn-plein btn-danger" data-action="supprimer-matiere" data-id="${m.id}">Supprimer cette matière</button>` : ''}
      </div>
    </form>`);
}

function enregistrerMatiere(form) {
  const f = new FormData(form);
  const nom = String(f.get('nom') || '').trim().replace(/\s+/g, ' ');
  const couleur = /^#[0-9a-f]{6}$/i.test(f.get('couleur')) ? f.get('couleur') : PALETTE[0].code;
  const id = form.dataset.id;
  if (!nom) return erreurForm('Donne un nom à la matière.');
  if (donnees.matieres.some(m => m.id !== id && m.nom.toLowerCase() === nom.toLowerCase())) return erreurForm('Cette matière existe déjà.');

  let idFinal = id;
  if (id) {
    Object.assign(trouverMatiere(id), { nom, couleur });
  } else {
    idFinal = nouvelId();
    donnees.matieres.push({ id: idFinal, nom, couleur });
  }
  sauvegarder();
  rafraichir();
  if (form.dataset.puisEcheance) {
    ouvrirFormEcheance(null, { matiereId: idFinal });
  } else {
    fermerFeuille();
    afficherToast(id ? 'Matière modifiée ✓' : 'Matière ajoutée ✓');
  }
}

async function supprimerMatiere(id) {
  const m = trouverMatiere(id);
  if (!m) return;
  const liees = donnees.echeances.filter(e => e.matiereId === id).length;
  const message = liees
    ? `Supprimer « ${m.nom} » ? ${liees > 1 ? `Ses ${liees} échéances seront aussi supprimées.` : 'Son échéance sera aussi supprimée.'}`
    : `Supprimer la matière « ${m.nom} » ?`;
  if (!(await confirmer(message, 'Supprimer', true))) return;
  const position = donnees.matieres.indexOf(m);
  const echeancesLiees = donnees.echeances.filter(e => e.matiereId === id);
  donnees.matieres = donnees.matieres.filter(x => x.id !== id);
  donnees.echeances = donnees.echeances.filter(e => e.matiereId !== id);
  sauvegarder();
  fermerFeuille();
  rafraichir();
  proposerAnnulation('Matière supprimée', () => {
    if (!trouverMatiere(m.id)) donnees.matieres.splice(Math.min(position, donnees.matieres.length), 0, m);
    for (const e of echeancesLiees) if (!trouverEcheance(e.id)) donnees.echeances.push(e);
  });
}

/* ---------- Jours spéciaux (pas dispo, vacances, autre temps) ---------- */

// "Sam. 28 nov." ou "Du 21 déc. au 3 janv."
function texteDatesSpecial(x) {
  return x.debut === x.fin ? capitaliser(dateCourte(x.debut)) : `Du ${dateCourteSansJour(x.debut)} au ${dateCourteSansJour(x.fin)}`;
}
function texteSpecial(x) {
  const temps = x.minutes === 0 ? 'Pas dispo' : `${formaterDuree(x.minutes)}${x.debut === x.fin ? ' ce jour-là' : ' par jour'}`;
  return `${texteDatesSpecial(x)} · ${temps}${x.motif ? ` · ${x.motif}` : ''}`;
}

  ouvrirFeuille(`<form id="form-special" data-id="${x ? x.id : ''}" data-genre="${genre}" novalidate>

      <p class="aide" style="margin:-6px 0 16px">Un jour où tu n'es pas dispo (sortie, malade…), ou des vacances avec plus de temps : le plan s'organise autour, sans compter de retard.</p>
      <div class="deux-champs">
        <label class="champ">Du<input type="date" name="debut" value="${v.debut}"></label>
        <label class="champ">Au <span class="facultatif">(inclus)</span><input type="date" name="fin" value="${v.fin}"></label>
      </div>
      <fieldset>
        <legend>Ces jours-là</legend>
        <div class="segments">
          <label><input type="radio" name="genre" value="off"${genre === 'off' ? ' checked' : ''}><span>Pas dispo</span></label>
          <label><input type="radio" name="genre" value="temps"${genre === 'temps' ? ' checked' : ''}><span>Un autre temps</span></label>
        </div>
      </fieldset>
      <div class="seulement-temps">
        <label class="champ">Temps dispo par jour (en minutes)<input type="number" name="minutes" min="0" max="720" step="15" inputmode="numeric" value="${v.minutes || 180}"></label>
      </div>
      <label class="champ">Motif <span class="facultatif">(facultatif)</span>
        <input type="text" name="motif" maxlength="40" value="${echapper(v.motif)}" placeholder="ex : anniversaire, vacances, malade" autocomplete="off">
      </label>
      <div class="estimation" id="apercu-special"></div>
      <p class="erreur" id="erreur-form" hidden></p>
      <div class="pile">
        <button type="submit" class="btn btn-principal btn-geant">Enregistrer</button>
        <button type="button" class="btn btn-plein" data-action="fermer">Annuler</button>
        ${x ? `<button type="button" class="btn btn-plein btn-danger" data-action="supprimer-special" data-id="${x.id}">Supprimer ce jour spécial</button>` : ''}
      </div>
    </form>`);
  majApercuSpecial();
}

// Lit le formulaire. Renvoie { debut, fin, minutes, motif, erreur }.
function lireFormSpecial(form) {
  const f = new FormData(form);
  const debut = f.get('debut');
  const fin = f.get('fin') || debut;
  const minutes = f.get('genre') === 'off' ? 0 : Number(f.get('minutes'));
  let erreur = null;
  if (!estCleDate(debut)) erreur = 'Choisis la date du jour spécial.';
  else if (!estCleDate(fin)) erreur = 'Choisis la date de fin (ou la même que le début).';
  else if (fin < debut) erreur = 'La date de fin est avant la date de début.';
  else if (ecartJours(debut, fin) > 120) erreur = 'Maximum 4 mois d\'affilée.';
  else if (!(Number.isInteger(minutes) && minutes >= 0 && minutes <= 720)) erreur = 'Le temps dispo doit être un nombre de minutes entre 0 et 720 (12 h).';
  return { debut, fin, minutes, motif: String(f.get('motif') || '').trim().slice(0, 40), erreur };
}

function majApercuSpecial() {
  const form = document.getElementById('form-special');
  if (!form) return;
  form.dataset.genre = new FormData(form).get('genre') === 'temps' ? 'temps' : 'off';
  const v = lireFormSpecial(form);
  const zone = document.getElementById('apercu-special');
  if (v.erreur) {
    zone.innerHTML = `<div class="aide">${echapper(v.erreur)}</div>`;
    return;
  }
  const nb = ecartJours(v.debut, v.fin) + 1;
  zone.innerHTML = `<strong>${pluriel(nb, 'jour')}</strong> · ${v.minutes === 0 ? 'aucun bloc prévu' : `${formaterDuree(v.minutes)} = ${pluriel(blocsDansDuree(v.minutes, donnees.reglages), 'bloc')} par jour`}
    <div class="aide">Le plan répartit le travail sur les autres jours.</div>`;
}

// Les blocs prévus ces jours-là sont oubliés dans le "rythme" : pas de faux retard.
function oublierRythmeEntre(debut, fin) {
  for (const e of donnees.echeances) {
    if (!e.rythme || !e.rythme.prevu) continue;
    for (const j of Object.keys(e.rythme.prevu)) if (j >= debut && j <= fin) delete e.rythme.prevu[j];
  }
}

function enregistrerSpecial(form) {
  const v = lireFormSpecial(form);
  if (v.erreur) return erreurForm(v.erreur);
  const id = form.dataset.id;
  const x = id ? donnees.joursSpeciaux.find(j => j.id === id) : null;
  if (x) Object.assign(x, { debut: v.debut, fin: v.fin, minutes: v.minutes, motif: v.motif });
  else donnees.joursSpeciaux.push({ id: nouvelId(), debut: v.debut, fin: v.fin, minutes: v.minutes, motif: v.motif });
  oublierRythmeEntre(v.debut, v.fin);
  sauvegarder();
  fermerFeuille();
  rafraichir();
  afficherToast(x ? 'Jour spécial modifié ✓ · plan recalculé' : 'Jour spécial ajouté ✓ · plan recalculé');
}

function supprimerSpecial(id) {
  const x = donnees.joursSpeciaux.find(j => j.id === id);
  if (!x) return;
  const position = donnees.joursSpeciaux.indexOf(x);
  donnees.joursSpeciaux = donnees.joursSpeciaux.filter(j => j.id !== id);
  sauvegarder();
  fermerFeuille();
  rafraichir();
  proposerAnnulation('Jour spécial supprimé', () => {
    if (!donnees.joursSpeciaux.some(j => j.id === x.id)) donnees.joursSpeciaux.splice(Math.min(position, donnees.joursSpeciaux.length), 0, x);
  });
}

/* ---------- "Pas aujourd'hui" : reporter un bloc sans compter de retard ---------- */

async function pasAujourdhui(id) {
  const e = trouverEcheance(id);
  if (!e) return;
  const jour = aujourdhui();
  const dernier = e.date === ajouterJours(jour, 1);
  const choix = await choisir(`Pas le temps aujourd'hui pour ${nomEcheanceLong(e)} ? Ses blocs seront répartis sur les jours qui restent, sans compter de retard.${dernier ? " ⚠️ C'est demain : il ne reste aucun autre jour." : ''}`, [
    { valeur: 'un', texte: `Reporter seulement ${titreEcheance(e)}`, style: 'principal' },
    { valeur: 'tout', texte: "Pas dispo aujourd'hui (tout reporter)" },
    { valeur: null, texte: 'Annuler' },
  ]);
  if (!choix) return;
  fermerFeuille();
  if (choix === 'un') {
    const liste = (donnees.reportes[jour] || []).filter(x => x !== id).concat(id);
    donnees.reportes = { [jour]: liste };   // on ne garde que les reports d'aujourd'hui
    if (e.rythme && e.rythme.prevu) delete e.rythme.prevu[jour];
    sauvegarder();
    rafraichir();
    proposerAnnulation(`${titreEcheance(e)} : reporté à plus tard`, () => {
      donnees.reportes[jour] = (donnees.reportes[jour] || []).filter(x => x !== id);
    });
  } else {
    const special = { id: nouvelId(), debut: jour, fin: jour, minutes: 0, motif: 'pas dispo' };
    donnees.joursSpeciaux.push(special);
    oublierRythmeEntre(jour, jour);
    sauvegarder();
    rafraichir();
    proposerAnnulation("Pas dispo aujourd'hui : tout est reporté", () => {
      donnees.joursSpeciaux = donnees.joursSpeciaux.filter(x => x.id !== special.id);
    });
  }
}

function annulerReport(id) {
  const jour = aujourdhui();
  donnees.reportes[jour] = (donnees.reportes[jour] || []).filter(x => x !== id);
  sauvegarder();
  rafraichir();
  afficherToast('Remis au programme ✓');
}

// Le bouton "Pas aujourd'hui" n'a de sens que s'il reste des blocs prévus aujourd'hui.
function reportPossible(e, plan) {
  const i = plan.parId[e.id];
  return Boolean(i) && i.prevuAujourdhui > i.faitsAujourdhui;
}

/* ---------- Rappel de sauvegarde ---------- */

// On le montre si rien n'a été exporté depuis 7 jours (ou jamais) et qu'il y a du nouveau à sauvegarder.
function rappelSauvegardeDu(jour) {
  const s = donnees.sauvegarde;
  if (s.rappelMasque && s.rappelMasque > jour) return false;
  if (s.derniere && ecartJours(s.derniere, jour) < 7) return false;
  const nouveaux = donnees.blocs.filter(b => !s.derniere || b.date > s.derniere);
  return s.derniere ? nouveaux.length > 0 : new Set(nouveaux.map(b => b.date)).size >= 3;
}
function texteDerniereSauvegarde(jour = aujourdhui()) {
  const d = donnees.sauvegarde.derniere;
  if (!d) return 'jamais';
  const n = ecartJours(d, jour);
  return n <= 0 ? "aujourd'hui" : n === 1 ? 'hier' : `il y a ${n} jours`;
}
