<style>
/* =====================================================================
   STYLE (CSS) : les couleurs, les tailles et la mise en page
   ===================================================================== */

/* Les couleurs de l'appli, rangées dans des "variables" réutilisables */
:root {
  --fond: #0d0f13;
  --carte: #171a21;
  --carte-2: #222631;
  --carte-3: #2f3442;
  --bord: #262b36;
  --texte: #eef0f5;
  --texte-2: #a9afbc;
  --texte-3: #757c8c;
  --accent: #8b93ff;
  --sur-accent: #0d0f13;
  --travail: #ff6b5b;
  --pause: #34d399;
  --pause-longue: #60a5fa;
  --alerte: #fbbf24;
  --danger: #f87171;
  --ok: #34d399;
  --rayon: 18px;
  --haut: env(safe-area-inset-top, 0px);    /* encoche de l'iPhone */
  --bas: env(safe-area-inset-bottom, 0px);  /* barre du bas de l'iPhone */
}

* { box-sizing: border-box; }
html { color-scheme: dark; -webkit-text-size-adjust: 100%; text-size-adjust: 100%; }
body {
  margin: 0;
  min-height: 100vh;
  background: var(--fond);
  color: var(--texte);
  font: 16px/1.45 system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
  -webkit-font-smoothing: antialiased;
  -webkit-tap-highlight-color: transparent;
}
body.bloque { overflow: hidden; }
button, input, select { font: inherit; color: inherit; }
button { cursor: pointer; touch-action: manipulation; -webkit-user-select: none; user-select: none; }
[hidden] { display: none !important; }
:focus { outline: none; }
:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }

/* ---------- Mise en page générale ---------- */
main {
  max-width: 560px;
  margin: 0 auto;
  padding: calc(12px + var(--haut)) 16px calc(104px + var(--bas));
}
.entete { display: flex; align-items: flex-end; justify-content: space-between; gap: 12px; margin: 10px 0 18px; }
.entete h1 { margin: 0; font-size: 30px; line-height: 1.1; letter-spacing: -0.02em; }
.surtitre { margin: 0 0 4px; color: var(--texte-2); font-size: 13px; font-weight: 700; text-transform: uppercase; letter-spacing: 0.06em; }
h2 { margin: 0; font-size: 18px; letter-spacing: -0.01em; }
h3 { margin: 18px 0 2px; font-size: 13px; color: var(--texte-2); text-transform: uppercase; letter-spacing: 0.06em; }

.carte { background: var(--carte); border: 1px solid var(--bord); border-radius: var(--rayon); padding: 16px; margin-bottom: 14px; }
.carte > h2 { margin-bottom: 6px; }
.carte-titre { display: flex; align-items: center; justify-content: space-between; gap: 10px; margin-bottom: 12px; }
.aide { margin: 8px 0 0; color: var(--texte-2); font-size: 14px; }
.aide-mini { color: var(--texte-3); font-size: 12px; text-align: right; }
.centre { text-align: center; }
.etiquette { flex: none; padding: 5px 10px; border-radius: 999px; background: var(--carte-2); color: var(--texte-2); font-size: 13px; font-weight: 700; white-space: nowrap; }
.vide { margin: 8px 0 4px; text-align: center; font-size: 17px; color: var(--texte-2); }
.pile { display: grid; gap: 10px; margin-top: 8px; }
.rond { display: inline-block; flex: none; width: 12px; height: 12px; border-radius: 50%; background: var(--couleur, var(--accent)); }
.icone { width: 1.15em; height: 1.15em; flex: none; fill: currentColor; }
.insecable { white-space: nowrap; }

/* ---------- Boutons (grands et faciles à toucher) ---------- */
.btn {
  display: inline-flex; align-items: center; justify-content: center; gap: 8px;
  min-height: 50px; padding: 12px 18px;
  border: 0; border-radius: 14px;
  background: var(--carte-2); color: var(--texte);
  font-size: 16px; font-weight: 650; text-align: center;
  transition: transform 0.08s, filter 0.15s;
}
.btn:active { transform: scale(0.97); filter: brightness(1.15); }
.btn-principal { background: var(--accent); color: var(--sur-accent); }
.btn-danger { background: rgba(248, 113, 113, 0.14); color: var(--danger); }
.btn-danger-plein { background: var(--danger); color: #1b0a0a; }
.btn-plein { width: 100%; }
.btn-geant { width: 100%; min-height: 64px; font-size: 19px; border-radius: 18px; }
.btn-petit { min-height: 42px; padding: 8px 14px; font-size: 15px; border-radius: 12px; }
.btn-lancer { flex: none; min-width: 108px; background: var(--couleur, var(--accent)); color: var(--couleur-texte, var(--sur-accent)); }
.lien { display: block; margin: 10px auto 0; padding: 8px 14px; border: 0; background: none; color: var(--texte-2); font-weight: 600; text-decoration: underline; }

/* ---------- Barre d'onglets en bas ---------- */
.onglets {
  position: fixed; left: 0; right: 0; bottom: 0; z-index: 20;
  display: grid; grid-template-columns: repeat(4, 1fr);
  padding: 0 max(8px, env(safe-area-inset-left)) var(--bas);
  background: rgba(13, 15, 19, 0.94);
  -webkit-backdrop-filter: blur(14px); backdrop-filter: blur(14px);
  border-top: 1px solid var(--bord);
}
.onglet {
  display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 3px;
  min-height: 64px; padding: 6px 2px;
  background: none; border: 0; color: var(--texte-3);
  font-size: 12px; font-weight: 650;
}
.onglet svg { width: 26px; height: 26px; fill: none; stroke: currentColor; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }
.onglet[aria-current="page"] { color: var(--accent); }
.onglet.chrono-actif { color: var(--phase, var(--travail)); }
.onglet.chrono-actif span { font-variant-numeric: tabular-nums; font-size: 13px; }

/* ---------- Écran "Aujourd'hui" ---------- */
.liste-plan, .semaine, .liste-matieres, .liste-faits, .liste-notes { list-style: none; margin: 0; padding: 0; }
.ligne-plan { display: flex; align-items: center; gap: 12px; padding: 14px 0 14px 14px; border-top: 1px solid var(--bord); position: relative; }
.ligne-plan:first-child { border-top: 0; padding-top: 4px; }
.ligne-plan::before { content: ""; position: absolute; left: 0; top: 14px; bottom: 14px; width: 5px; border-radius: 5px; background: var(--couleur); }
.ligne-plan:first-child::before { top: 4px; }
.ligne-texte { flex: 1; min-width: 0; }
.ligne-titre { font-weight: 700; font-size: 16px; }
.ligne-sous { color: var(--texte-2); font-size: 14px; margin-top: 4px; }
.points { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 8px; }
.point { width: 14px; height: 14px; border-radius: 50%; border: 2px solid var(--couleur); }
.point.fait { background: var(--couleur); }

.alerte { margin-bottom: 12px; padding: 12px 14px; border-radius: 14px; background: rgba(251, 191, 36, 0.1); border: 1px solid rgba(251, 191, 36, 0.35); color: #fde68a; }
.alerte .aide { color: #e5d3a1; margin-top: 2px; }
.alerte-ligne { display: flex; gap: 8px; margin: 0 0 8px; }
.info-jour { display: flex; align-items: center; gap: 10px; margin-bottom: 12px; padding: 12px 14px; border-radius: 14px; background: var(--couleur-fond); border: 1px solid var(--couleur); }
.info-jour .texte { flex: 1; min-width: 0; }
.bandeau-chrono {
  display: flex; width: 100%; align-items: center; justify-content: space-between; gap: 10px;
  margin-bottom: 12px; padding: 14px 16px; border-radius: 14px;
  border: 1px solid var(--phase); background: var(--carte); text-align: left; font-weight: 600;
}
.bandeau-chrono strong { color: var(--phase); font-size: 20px; font-variant-numeric: tabular-nums; }

.jour { display: grid; grid-template-columns: 58px 1fr auto; gap: 10px; align-items: center; padding: 10px 0; border-top: 1px solid var(--bord); }
.jour:first-child { border-top: 0; padding-top: 0; }
.jour-nom { font-weight: 700; font-size: 15px; text-transform: capitalize; }
.jour-nom small { display: block; color: var(--texte-3); font-size: 12px; font-weight: 600; text-transform: none; }
.jour-contenu { min-width: 0; display: grid; gap: 6px; }
.jour-echeance { font-size: 14px; font-weight: 700; color: var(--couleur); }
.jour-charge { font-size: 13px; font-weight: 700; color: var(--texte-3); font-variant-numeric: tabular-nums; }
.jour-charge.plein { color: var(--alerte); }
.puces { display: flex; flex-wrap: wrap; gap: 6px; }
.puce { display: inline-flex; align-items: center; gap: 6px; padding: 4px 10px; border-radius: 999px; background: var(--couleur-fond); font-size: 14px; font-weight: 600; }
.puce::before { content: ""; width: 8px; height: 8px; border-radius: 50%; background: var(--couleur); }
.repos { color: var(--texte-3); font-size: 14px; }

.bienvenue ol { margin: 12px 0 16px; padding-left: 22px; color: var(--texte-2); }
.bienvenue li { margin-bottom: 6px; }

/* ---------- Ressenti après un bloc ---------- */
.ressenti { border-color: var(--accent); }
.ressentis { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
.ressentis .btn { flex-direction: column; gap: 4px; min-height: 70px; padding: 8px 4px; }
.ressentis .emoji { font-size: 24px; line-height: 1; }

/* ---------- Écran "Échéances" ---------- */
.echeance { position: relative; overflow: hidden; padding-left: 22px; cursor: pointer; }
.echeance::before { content: ""; position: absolute; left: 0; top: 0; bottom: 0; width: 7px; background: var(--couleur); }
.echeance:active { filter: brightness(1.12); }
.echeance.passee { opacity: 0.6; }
.ech-haut { display: flex; align-items: center; justify-content: space-between; gap: 10px; }
.ech-matiere { font-size: 18px; font-weight: 750; overflow-wrap: anywhere; }
.badges { display: flex; flex-wrap: wrap; justify-content: flex-end; gap: 6px; }
.badge { flex: none; padding: 3px 9px; border-radius: 8px; font-size: 12px; font-weight: 800; text-transform: uppercase; letter-spacing: 0.05em; }
.badge-test { background: rgba(96, 165, 250, 0.16); color: #93c5fd; }
.badge-examen { background: rgba(248, 113, 113, 0.16); color: #fca5a5; }
.badge-travail { background: var(--carte-3); color: var(--texte-2); }
.badge-passe { background: rgba(52, 211, 153, 0.15); color: #6ee7b7; }
.ech-date { margin-top: 2px; font-weight: 600; }
.ech-details, .ech-progres { color: var(--texte-2); font-size: 14px; margin-top: 4px; }
.ech-note { margin-top: 8px; font-size: 14px; font-style: italic; color: var(--texte-2); overflow-wrap: anywhere; }
.ech-statut { margin-top: 10px; padding-top: 10px; border-top: 1px solid var(--bord); font-size: 14px; font-weight: 650; }
.ech-alerte { color: var(--alerte); }
.ech-ok { color: var(--ok); }
.barre { height: 8px; margin-top: 10px; border-radius: 99px; background: var(--carte-2); overflow: hidden; }
.barre > div { height: 100%; border-radius: inherit; background: var(--couleur); }
details.passees { margin: 18px 0; }
details.passees summary { padding: 12px 4px; color: var(--texte-2); font-weight: 650; cursor: pointer; }

.ligne-matiere { display: flex; align-items: center; gap: 12px; width: 100%; min-height: 54px; padding: 8px 4px; border: 0; border-top: 1px solid var(--bord); background: none; text-align: left; }
.liste-matieres li:first-child .ligne-matiere { border-top: 0; }
.ligne-matiere .nom { flex: 1; font-weight: 650; overflow-wrap: anywhere; }
.ligne-matiere .rond { width: 16px; height: 16px; }
.chevron { color: var(--texte-3); font-size: 22px; line-height: 1; }

/* Détail d'une échéance (dans la feuille) */
.detail .ech-haut { align-items: flex-start; }
.feuille .detail-titre { margin: 2px 0 4px; overflow-wrap: anywhere; }
.liste-notes li { padding: 10px 0; border-top: 1px solid var(--bord); }
.liste-notes li:first-child { border-top: 0; }
.liste-notes .quand { display: block; color: var(--texte-2); font-size: 14px; font-weight: 600; }
.liste-notes .texte-note { display: block; margin-top: 3px; font-style: italic; overflow-wrap: anywhere; }

/* ---------- Écran "Chrono" ---------- */
.chrono { text-align: center; }
.chrono-phase { display: inline-block; padding: 7px 16px; border-radius: 999px; background: var(--carte-2); color: var(--phase); font-weight: 800; letter-spacing: 0.02em; }
.chrono-sujet { display: flex; align-items: center; justify-content: center; gap: 8px; margin-top: 12px; font-size: 17px; font-weight: 650; }
.derniere-note { margin: 8px 0 0; color: var(--texte-2); font-size: 15px; overflow-wrap: anywhere; }
.anneau { position: relative; width: min(76vw, 300px); aspect-ratio: 1; margin: 16px auto 10px; }
.anneau svg { width: 100%; height: 100%; transform: rotate(-90deg); }
.anneau circle { fill: none; stroke-width: 8; }
.anneau-fond { stroke: var(--carte-2); }
.anneau-progres { stroke: var(--phase); stroke-linecap: round; stroke-dasharray: 339.292; transition: stroke-dashoffset 0.5s linear; }
.chrono-temps { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; font-size: min(19vw, 78px); font-weight: 750; letter-spacing: -0.02em; font-variant-numeric: tabular-nums; }
.chrono-temps.petit { font-size: min(10vw, 40px); }
.chrono-info { color: var(--texte-2); font-size: 15px; margin-bottom: 18px; }
.chrono-boutons { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-bottom: 10px; }
.liste-faits li { display: flex; align-items: center; gap: 10px; padding: 8px 0; border-top: 1px solid var(--bord); }
.liste-faits li:first-child { border-top: 0; }
.liste-faits .texte { flex: 1; min-width: 0; font-weight: 600; font-size: 15px; overflow-wrap: anywhere; }
.liste-faits .texte small { display: block; color: var(--texte-3); font-weight: 500; }
.supprimer-bloc { flex: none; width: 40px; height: 40px; border: 0; border-radius: 50%; background: var(--carte-2); color: var(--texte-3); font-size: 18px; }

/* Choix "Je travaille sur…" : une carte par échéance, le texte va à la ligne si besoin */
.choix-sujet { display: grid; gap: 8px; }
.option-sujet { position: relative; display: block; }
.option-sujet input { position: absolute; opacity: 0; pointer-events: none; }
.option-corps { position: relative; display: block; padding: 12px 14px 12px 42px; border: 2px solid var(--bord); border-radius: 14px; background: var(--carte-2); cursor: pointer; }
.option-corps::before { content: ""; position: absolute; left: 15px; top: 50%; width: 14px; height: 14px; margin-top: -7px; border-radius: 50%; background: var(--couleur, var(--accent)); }
.option-corps strong { display: block; font-size: 16px; overflow-wrap: anywhere; }
.option-corps small { display: block; margin-top: 2px; color: var(--texte-2); font-size: 14px; }
.option-sujet input:checked + .option-corps { border-color: var(--couleur, var(--accent)); background: var(--couleur-fond, rgba(139, 147, 255, 0.12)); }
.option-sujet input:focus-visible + .option-corps { outline: 3px solid var(--accent); outline-offset: 2px; }

/* ---------- Écran "Réglages" ---------- */
.ligne-reglage { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 10px 0; border-top: 1px solid var(--bord); }
.carte > h2 + .ligne-reglage, h3 + .ligne-reglage { border-top: 0; }
.libelle { font-weight: 600; }
.libelle small { display: block; color: var(--texte-3); font-size: 13px; font-weight: 500; }
.stepper { display: flex; align-items: center; gap: 6px; flex: none; }
.stepper button { width: 44px; height: 44px; border: 0; border-radius: 50%; background: var(--carte-2); font-size: 24px; font-weight: 700; line-height: 1; }
.stepper button:active { background: var(--carte-3); }
.stepper output { min-width: 78px; text-align: center; font-weight: 750; font-variant-numeric: tabular-nums; }
.stepper input { width: 70px; min-height: 48px; border: 1px solid var(--bord); border-radius: 12px; background: var(--carte-2); text-align: center; font-size: 18px; font-weight: 750; -moz-appearance: textfield; appearance: textfield; }
.stepper input::-webkit-outer-spin-button, .stepper input::-webkit-inner-spin-button { -webkit-appearance: none; margin: 0; }
.formule { margin: 6px 0 4px; padding: 10px 12px; border-radius: 12px; background: var(--carte-2); font-weight: 650; text-align: center; }
.interrupteur { position: relative; flex: none; width: 54px; height: 32px; }
.interrupteur input { position: absolute; inset: 0; width: 100%; height: 100%; margin: 0; opacity: 0; cursor: pointer; }
.interrupteur span { position: absolute; inset: 0; border-radius: 999px; background: var(--carte-3); transition: background 0.2s; pointer-events: none; }
.interrupteur span::after { content: ""; position: absolute; top: 3px; left: 3px; width: 26px; height: 26px; border-radius: 50%; background: #fff; transition: transform 0.2s; }
.interrupteur input:checked + span { background: var(--ok); }
.interrupteur input:checked + span::after { transform: translateX(22px); }
.interrupteur input:focus-visible + span { outline: 3px solid var(--accent); outline-offset: 2px; }
label.ligne-reglage { cursor: pointer; }

.installer ol { margin: 8px 0 0; padding-left: 22px; color: var(--texte-2); }
.installer li { margin-bottom: 6px; }
.installer .attention { margin-top: 10px; color: var(--alerte); font-size: 14px; }

/* ---------- Formulaires (dans la feuille qui monte du bas) ---------- */
.champ { display: block; margin: 0 0 18px; font-weight: 650; font-size: 15px; }
.champ input, .champ select {
  display: block; width: 100%; margin-top: 8px; min-height: 52px; padding: 12px 14px;
  border: 1px solid var(--bord); border-radius: 14px; background: var(--carte-2);
  font-size: 17px; font-weight: 500; -webkit-appearance: none; appearance: none;
}
.champ input:focus, .champ select:focus { border-color: var(--accent); }
input[type="date"]::-webkit-date-and-time-value { text-align: left; }
input[type="date"]::-webkit-calendar-picker-indicator { filter: invert(0.8); }
.champ .facultatif { color: var(--texte-3); font-weight: 500; }
.champ-ligne { display: flex; align-items: center; justify-content: space-between; gap: 12px; margin: 0 0 18px; font-weight: 650; font-size: 15px; }
fieldset { margin: 0 0 18px; padding: 0; border: 0; min-width: 0; }
legend { margin-bottom: 8px; padding: 0; font-weight: 650; font-size: 15px; }

.segments { display: grid; grid-auto-flow: column; grid-auto-columns: 1fr; gap: 4px; padding: 4px; border-radius: 14px; background: var(--carte-2); }
.segments label { position: relative; }
.segments input { position: absolute; opacity: 0; pointer-events: none; }
.segments span { display: flex; flex-direction: column; align-items: center; justify-content: center; min-height: 50px; height: 100%; padding: 6px 2px; border-radius: 11px; color: var(--texte-2); font-weight: 750; text-align: center; cursor: pointer; }
.segments span small { font-size: 12px; font-weight: 600; }
.segments input:checked + span { background: var(--accent); color: var(--sur-accent); }
.segments input:focus-visible + span { outline: 3px solid var(--accent); outline-offset: 2px; }

.choix-puces { display: flex; flex-wrap: wrap; gap: 8px; }
.puce-choix { position: relative; }
.puce-choix input { position: absolute; opacity: 0; pointer-events: none; }
.puce-choix span { display: inline-flex; align-items: center; gap: 8px; min-height: 46px; padding: 8px 16px; border: 2px solid transparent; border-radius: 999px; background: var(--carte-2); font-weight: 650; cursor: pointer; }
.puce-choix span::before { content: ""; width: 12px; height: 12px; border-radius: 50%; background: var(--couleur); }
.puce-choix input:checked + span { border-color: var(--couleur); background: var(--couleur-fond); }
.puce-choix input:focus-visible + span { outline: 3px solid var(--accent); outline-offset: 2px; }

.palette { display: grid; grid-template-columns: repeat(5, 1fr); gap: 12px; }
.pastille-choix { position: relative; }
.pastille-choix input { position: absolute; opacity: 0; pointer-events: none; }
.pastille-choix span { display: block; aspect-ratio: 1; border: 3px solid transparent; border-radius: 50%; background: var(--couleur); box-shadow: inset 0 0 0 3px var(--carte); cursor: pointer; }
.pastille-choix input:checked + span { border-color: var(--texte); }
.pastille-choix input:focus-visible + span { outline: 3px solid var(--accent); outline-offset: 2px; }

.estimation { margin: 4px 0 16px; padding: 12px 14px; border-radius: 14px; background: var(--carte-2); }
.erreur { margin: 0 0 12px; color: var(--danger); font-weight: 650; }

.fond-feuille { position: fixed; inset: 0; z-index: 50; display: flex; align-items: flex-end; justify-content: center; background: rgba(0, 0, 0, 0.55); opacity: 0; transition: opacity 0.22s; }
.fond-feuille.ouvert { opacity: 1; }
.feuille {

<body>

<script>
'use strict';
/* =====================================================================
   COMPORTEMENT (JavaScript) — V2

   Organisation :
     1. Réglages par défaut et données
     2. Sauvegarde dans le navigateur (localStorage) + migration V1 → V2
     3. Petits outils (dates, durées, textes, couleurs)
     4. Calculs : temps d'étude, difficulté perso, temps dispo et LE PLAN
     5. Affichage des 4 écrans
     6. Formulaires, détail d'une échéance, export / import
     7. Chrono Pomodoro (+ ressenti après chaque bloc)
     8. Clics, événements et démarrage
   ===================================================================== */


/* =====================================================================
   1. RÉGLAGES PAR DÉFAUT ET DONNÉES
   ===================================================================== */

// Nom du "tiroir" du localStorage où toutes les données sont rangées.
// (on garde le nom de la V1 pour retrouver tes données)
const CLE_STOCKAGE = 'plan-etude-v1';
// Copie de secours des données d'avant la mise à jour V2 (faite une seule fois).
const CLE_SECOURS = 'plan-etude-copie-avant-v2';
// Version du format des données. La V1 = 1 ; la V2 ajoute le type de travail,
// le ressenti des blocs, l'historique et le suivi du rythme.
const VERSION_DONNEES = 2;

// Couleurs proposées pour les matières.
const PALETTE = [
  { nom: 'Rouge', code: '#ff6b6b' },
  { nom: 'Orange', code: '#ffa94d' },
  { nom: 'Jaune', code: '#ffd43b' },
  { nom: 'Vert clair', code: '#a9e34b' },
  { nom: 'Vert', code: '#51cf66' },
  { nom: 'Turquoise', code: '#38d9a9' },
  { nom: 'Bleu', code: '#4dabf7' },
  { nom: 'Indigo', code: '#748ffc' },
  { nom: 'Violet', code: '#b197fc' },
  { nom: 'Rose', code: '#f783ac' },
];

// Nom des niveaux d'étude (la case 0 n'est pas utilisée).
const NIVEAUX = ['', 'léger', 'moyen', 'costaud', 'très dur'];

// Types de travail d'une échéance.
const TRAVAUX = {
  parcoeur: { nom: 'Par cœur', exemple: 'dates, vocabulaire…' },
  exercices: { nom: 'Exercices', exemple: 'maths, chimie…' },
  mixte: { nom: 'Mixte', exemple: 'un peu des deux' },
};

// Ressentis après un bloc. Le "score" sert au coefficient de difficulté de la matière.
const RESSENTIS = {
  facile: { nom: 'Facile', emoji: '😊', score: -0.6 },
  ok: { nom: 'Ok', emoji: '🙂', score: 0 },
  dur: { nom: 'Dur', emoji: '😓', score: 1 },
};
const NB_RESSENTIS = 8;  // le coefficient regarde tes 8 derniers ressentis dans la matière

// Les réglages de départ. Toutes les durées sont en minutes.
const REGLAGES_DEFAUT = {
  dispoSemaine: 60,          // temps dispo du lundi au vendredi
  dispoWeekend: 180,         // temps dispo le samedi et le dimanche
  travail: 25,               // un bloc de travail Pomodoro
  pauseCourte: 5,            // petite pause après chaque bloc
  pauseLongue: 15,           // grande pause…
  blocsAvantPauseLongue: 4,  // … tous les 4 blocs
  tempsBase: {               // temps de base selon le niveau 1, 2, 3, 4
    test:   [30, 90, 180, 300],    // 30 min, 1 h 30, 3 h, 5 h
    examen: [120, 300, 540, 840],  // 2 h, 5 h, 9 h, 14 h
  },
  coefBase: 0.5,             // temps = base × (0,5 + 0,25 × chapitres)
  coefChapitre: 0.25,
  joursAvant: { test: 7, examen: 21 },  // on commence à réviser au plus tôt N jours avant
  progression: 3,            // la veille, on étudie 3 fois plus que le premier jour
  joursEnPlusParCoeur: 7,    // "par cœur" : on peut commencer 7 jours plus tôt
  blocsParSession: 2,        // "exercices" : au moins 2 blocs d'affilée
  son: true,
  vibration: true,
  ecranAllume: true,
};

// TOUTES les données de l'appli sont dans cet objet.
let donnees = donneesVides();

function donneesVides() {
  return {
    version: VERSION_DONNEES,
    matieres: [],   // { id, nom, couleur }
    echeances: [],  // { id, matiereId, type: 'test' | 'examen', date: 'AAAA-MM-JJ', niveau: 1 à 4, chapitres, note,
                    //   travail: 'parcoeur' | 'exercices' | 'mixte', terminee, termineeLe, rythme }
    blocs: [],      // blocs de travail faits : { id, echeanceId, matiereId, date, debut, minutes, ressenti, note }
    reglages: copie(REGLAGES_DEFAUT),
    chrono: null,   // le chrono en cours (ou null s'il n'y en a pas)
    aEvaluer: null, // le bloc dont on attend le ressenti (Facile / Ok / Dur)
  };
}

function copie(objet) {
  return JSON.parse(JSON.stringify(objet));
}


/* =====================================================================
   2. SAUVEGARDE DANS LE NAVIGATEUR (localStorage)
   Le localStorage garde du texte même quand on ferme l'appli.
   On y range nos données transformées en texte (format JSON).
   ===================================================================== */

function sauvegarder() {
  try {
    localStorage.setItem(CLE_STOCKAGE, JSON.stringify(donnees));
  } catch (erreur) {
    afficherToast('⚠️ Impossible de sauvegarder sur cet appareil');
  }
}

function charger() {
  let texte = null;
  let lu = null;
  try {
    texte = localStorage.getItem(CLE_STOCKAGE);
    lu = JSON.parse(texte);
  } catch (erreur) {
    lu = null;
  }
  donnees = normaliser(lu);

  // MIGRATION : si les données viennent d'une version plus ancienne (V1),
  // on garde d'abord une copie de secours, puis on les réenregistre au format V2.
  if (lu && typeof lu === 'object' && !(lu.version >= VERSION_DONNEES)) {
    try {
      if (!localStorage.getItem(CLE_SECOURS)) localStorage.setItem(CLE_SECOURS, texte);
    } catch (erreur) { /* pas grave */ }
    sauvegarder();
  }
}

// Vérifie et complète des données lues (localStorage ou fichier importé).
// Les champs qui manquent (données de la V1) reçoivent une valeur par défaut :
// c'est ça, la migration automatique.
function normaliser(lu) {
  const d = donneesVides();
  if (!lu || typeof lu !== 'object') return d;
  const idPropre = v => (v ? String(v).replace(/[^a-zA-Z0-9_-]/g, '') : null);

  if (Array.isArray(lu.matieres)) {
    d.matieres = lu.matieres
      .filter(m => m && m.id && m.nom)
      .map(m => ({
        id: idPropre(m.id),
        nom: String(m.nom),
        couleur: /^#[0-9a-f]{6}$/i.test(m.couleur) ? m.couleur : PALETTE[0].code,
      }));
  }
  if (Array.isArray(lu.echeances)) {
    d.echeances = lu.echeances
      .filter(e => e && e.id && estCleDate(e.date))
      .map(e => ({
        id: idPropre(e.id),
        matiereId: idPropre(e.matiereId),
        type: e.type === 'examen' ? 'examen' : 'test',
        date: e.date,
        niveau: borner(Math.round(Number(e.niveau)) || 1, 1, 4),
        chapitres: borner(Math.round(Number(e.chapitres)) || 1, 1, 99),
        note: String(e.note || ''),
        travail: Object.keys(TRAVAUX).includes(e.travail) ? e.travail : 'mixte',  // nouveau en V2
        terminee: e.terminee === true,                                           // nouveau en V2
        termineeLe: estCleDate(e.termineeLe) ? e.termineeLe : null,              // nouveau en V2
        rythme: normaliserRythme(e.rythme),                                      // nouveau en V2
      }));
  }
  if (Array.isArray(lu.blocs)) {
    d.blocs = lu.blocs
      .filter(b => b && estCleDate(b.date) && Number(b.minutes) > 0)
      .map(b => ({
        id: idPropre(b.id) || nouvelId(),
        echeanceId: idPropre(b.echeanceId),
        matiereId: idPropre(b.matiereId),
        date: b.date,
        debut: Number(b.debut) || 0,
        minutes: Number(b.minutes),
        ressenti: Object.keys(RESSENTIS).includes(b.ressenti) ? b.ressenti : null,  // nouveau en V2
        note: String(b.note || ''),                                                // nouveau en V2
      }));
  }
  d.reglages = completerReglages(lu.reglages);
  const c = lu.chrono;
  if (c && typeof c === 'object' && ['travail', 'pause', 'pauseLongue', 'attente'].includes(c.phase)) {
    d.chrono = { ...c, echeanceId: idPropre(c.echeanceId), matiereId: idPropre(c.matiereId) };
  }
  const aEvaluer = idPropre(lu.aEvaluer);
  if (aEvaluer && d.blocs.some(b => b.id === aEvaluer)) d.aEvaluer = aEvaluer;
  return d;
}

// Le "rythme prévu" d'une échéance : { depuis: "AAAA-MM-JJ", prevu: { "AAAA-MM-JJ": minutes } }
function normaliserRythme(r) {
  if (!r || typeof r !== 'object' || !estCleDate(r.depuis) || !r.prevu || typeof r.prevu !== 'object') return null;
  const prevu = {};
  for (const [jour, minutes] of Object.entries(r.prevu)) {
    if (estCleDate(jour) && Number.isFinite(minutes) && minutes > 0) prevu[jour] = minutes;
  }
  return { depuis: r.depuis, prevu };
}

// Part des réglages par défaut et remplace par ceux enregistrés (s'ils sont valides).
// Les réglages ajoutés en V2 prennent donc leur valeur par défaut.
function completerReglages(lus) {
  const r = copie(REGLAGES_DEFAUT);
  if (!lus || typeof lus !== 'object') return r;
  for (const cle of Object.keys(r)) {
    const valeur = lus[cle];
    if (cle === 'tempsBase' || cle === 'joursAvant') {
      for (const type of ['test', 'examen']) {
        const v = valeur && valeur[type];
        if (cle === 'tempsBase' && Array.isArray(v) && v.length === 4 && v.every(Number.isFinite)) r.tempsBase[type] = v;
        if (cle === 'joursAvant' && Number.isFinite(v)) r.joursAvant[type] = v;
      }
    } else if (typeof valeur === typeof r[cle] && (typeof valeur !== 'number' || Number.isFinite(valeur))) {
      r[cle] = valeur;
    }
  }
  return r;
}


/* =====================================================================
   3. PETITS OUTILS
   Les dates sont écrites comme du texte "AAAA-MM-JJ" (ex : "2026-11-26").
   Avantage : on peut les comparer directement ("2026-11-25" < "2026-11-26").
   ===================================================================== */

const JOURS = ['dimanche', 'lundi', 'mardi', 'mercredi', 'jeudi', 'vendredi', 'samedi'];
const JOURS_COURTS = ['dim.', 'lun.', 'mar.', 'mer.', 'jeu.', 'ven.', 'sam.'];
const MOIS = ['janvier', 'février', 'mars', 'avril', 'mai', 'juin', 'juillet', 'août', 'septembre', 'octobre', 'novembre', 'décembre'];
const MOIS_COURTS = ['janv.', 'févr.', 'mars', 'avr.', 'mai', 'juin', 'juil.', 'août', 'sept.', 'oct.', 'nov.', 'déc.'];

function borner(valeur, min, max) {
  return Math.min(max, Math.max(min, valeur));
}

function estCleDate(texte) {
  return typeof texte === 'string' && /^\d{4}-\d{2}-\d{2}$/.test(texte);
}

// Transforme une date JavaScript en texte "AAAA-MM-JJ" (heure locale).
function cleDate(date) {
  const a = date.getFullYear();
  const m = String(date.getMonth() + 1).padStart(2, '0');
  const j = String(date.getDate()).padStart(2, '0');
  return `${a}-${m}-${j}`;
}

function aujourdhui() {
  return cleDate(new Date());
}

// L'inverse : texte "AAAA-MM-JJ" → date JavaScript (à midi, pour éviter les soucis d'heure d'été).
function dateDepuisCle(cle) {
  const [a, m, j] = cle.split('-').map(Number);
  return new Date(a, m - 1, j, 12);
}

function ajouterJours(cle, n) {
  const d = dateDepuisCle(cle);
  d.setDate(d.getDate() + n);
  return cleDate(d);
}

// Nombre de jours entre deux dates (positif si "fin" est après "debut").
function ecartJours(debut, fin) {
  return Math.round((dateDepuisCle(fin) - dateDepuisCle(debut)) / 86400000);
}

function estWeekend(cle) {
  const jour = dateDepuisCle(cle).getDay();
  return jour === 0 || jour === 6;
}

// "jeudi 26 novembre"
function dateLongue(cle) {
  const d = dateDepuisCle(cle);
  return `${JOURS[d.getDay()]} ${d.getDate() === 1 ? '1er' : d.getDate()} ${MOIS[d.getMonth()]}`;
}

// "jeu. 26 nov."
function dateCourte(cle) {
  const d = dateDepuisCle(cle);
  return `${JOURS_COURTS[d.getDay()]} ${d.getDate()} ${MOIS_COURTS[d.getMonth()]}`;
}

// "aujourd'hui", "demain", "jeudi" (dans la semaine), sinon "le 3 déc."
function quandCourt(cle, jour = aujourdhui()) {
  const n = ecartJours(jour, cle);
  const d = dateDepuisCle(cle);
  if (n === 0) return "aujourd'hui";
  if (n === 1) return 'demain';
  if (n > 1 && n < 7) return JOURS[d.getDay()];
  return `le ${d.getDate() === 1 ? '1er' : d.getDate()} ${MOIS_COURTS[d.getMonth()]}`;
}

// "jusqu'à demain", "jusqu'à lundi", sinon "jusqu'au 3 déc."
function jusqua(cle, jour = aujourdhui()) {
  const n = ecartJours(jour, cle);
  const d = dateDepuisCle(cle);
  if (n <= 0) return "aujourd'hui";
  if (n === 1) return "jusqu'à demain";
  if (n < 7) return `jusqu'à ${JOURS[d.getDay()]}`;
  return `jusqu'au ${d.getDate() === 1 ? '1er' : d.getDate()} ${MOIS_COURTS[d.getMonth()]}`;
}

// "dans 4 jours", "demain", "aujourd'hui", "hier", "il y a 3 jours"
function delai(cle, jour = aujourdhui()) {
  const n = ecartJours(jour, cle);
  if (n === 0) return "aujourd'hui";
  if (n === 1) return 'demain';
  if (n === -1) return 'hier';
  return n > 1 ? `dans ${n} jours` : `il y a ${-n} jours`;
}

// Heure "14:05" d'un moment (Date.now())
function heure(moment) {
  const d = new Date(moment || Date.now());
  return String(d.getHours()).padStart(2, '0') + ':' + String(d.getMinutes()).padStart(2, '0');
}

function capitaliser(texte) {
  return texte.charAt(0).toUpperCase() + texte.slice(1);
}

// 45 → "45 min" ; 90 → "1 h 30" ; 120 → "2 h"
function formaterDuree(minutes) {
  minutes = Math.round(minutes);
  if (minutes < 60) return `${minutes} min`;
  const h = Math.floor(minutes / 60);
  const m = minutes % 60;
  return m === 0 ? `${h} h` : `${h} h ${String(m).padStart(2, '0')}`;
}

// 1499000 millisecondes → "24:59"
function formaterChrono(ms) {
  const secondes = Math.max(0, Math.ceil(ms / 1000));
  const m = Math.floor(secondes / 60);
  const s = secondes % 60;
  return `${String(m).padStart(2, '0')}:${String(s).padStart(2, '0')}`;
}

// 0.25 → "0,25"
function formaterDecimal(x) {
  return String(Math.round(x * 100) / 100).replace('.', ',');
}

// pluriel(1, 'bloc') → "1 bloc" ; pluriel(3, 'bloc') → "3 blocs"
function pluriel(n, mot) {
  return `${n} ${mot}${n > 1 ? 's' : ''}`;
}

// Protège un texte tapé par l'utilisateur avant de l'afficher (évite de casser la page).
function echapper(texte) {
  return String(texte == null ? '' : texte).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
}

// Fabrique un identifiant unique, ex : "lx3k9a7f2qz".
function nouvelId() {
  return Date.now().toString(36) + Math.random().toString(36).slice(2, 8);
}

// "de Maths" mais "d'Anglais"
function de(nom) {
  return /^[aeiouhàâäéèêëîïôöùûüœæ]/i.test(nom) ? `d'${nom}` : `de ${nom}`;
}

function estIphone() {
  return /iphone|ipad|ipod/i.test(navigator.userAgent) || (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1);
}

// Couleur "#ff6b6b" → version transparente, et couleur de texte lisible dessus.
function rgba(hex, alpha) {
  const n = parseInt(hex.slice(1), 16);
  return `rgba(${(n >> 16) & 255}, ${(n >> 8) & 255}, ${n & 255}, ${alpha})`;
}
function texteSur(hex) {
  const n = parseInt(hex.slice(1), 16);
  const luminosite = (0.299 * ((n >> 16) & 255) + 0.587 * ((n >> 8) & 255) + 0.114 * (n & 255)) / 255;
  return luminosite > 0.55 ? '#10131a' : '#ffffff';
}
function styleCouleur(hex) {
  return `--couleur:${hex};--couleur-fond:${rgba(hex, 0.16)};--couleur-texte:${texteSur(hex)}`;
}

function trouverMatiere(id) {
  return donnees.matieres.find(m => m.id === id);
}
function trouverEcheance(id) {
  return donnees.echeances.find(e => e.id === id);
}
function nomMatiere(id) {
  const m = trouverMatiere(id);
  return m ? m.nom : 'Matière supprimée';
}
function couleurMatiere(id) {
  const m = trouverMatiere(id);
  return m ? m.couleur : '#8b93ff';
}
function styleMatiere(id) {
  return styleCouleur(couleurMatiere(id));
}
function nomTravail(e) {
  return (TRAVAUX[e.travail] || TRAVAUX.mixte).nom;
}
// "le test de Chimie" / "l'examen d'Anglais"
function nomEcheanceLong(e) {
  const nom = nomMatiere(e.matiereId);
  return e.type === 'examen' ? `l'examen ${de(nom)}` : `le test ${de(nom)}`;
}
// "Chimie – test jeudi"
function nomEcheanceCourt(e, jour = aujourdhui()) {
  return `${nomMatiere(e.matiereId)} – ${e.type} ${quandCourt(e.date, jour)}`;
}
// Total des minutes déjà travaillées pour une échéance.
function minutesFaites(echeanceId) {
  return donnees.blocs.filter(b => b.echeanceId === echeanceId).reduce((total, b) => total + b.minutes, 0);
}
// Les blocs faits pour une échéance, du plus récent au plus ancien.
function blocsDe(echeanceId) {
  return donnees.blocs.filter(b => b.echeanceId === echeanceId).sort((x, y) => (y.debut || 0) - (x.debut || 0));
}
// Le dernier bloc où tu as écrit une note ("exercices p. 42"), pour savoir où tu en étais.
function derniereNote(echeanceId) {
  return blocsDe(echeanceId).find(b => b.note) || null;
}

// Lire / écrire un réglage à partir de son "chemin", ex : "tempsBase.test.2".
function lireChemin(objet, chemin) {
  return chemin.split('.').reduce((o, cle) => o[cle], objet);
}
function ecrireChemin(objet, chemin, valeur) {
  const cles = chemin.split('.');
  const derniere = cles.pop();
  cles.reduce((o, cle) => o[cle], objet)[derniere] = valeur;
}


/* =====================================================================
   4. CALCULS
   ===================================================================== */

// Temps d'étude total estimé pour une échéance (en minutes) :
// temps = temps de base (selon le type et le niveau) × (0,5 + 0,25 × chapitres) × difficulté perso
function tempsEstime(e, r = donnees.reglages, coef = 1) {
  const bases = r.tempsBase[e.type] || r.tempsBase.test;
  const base = bases[(e.niveau || 1) - 1] || 0;
  const facteur = r.coefBase + r.coefChapitre * (e.chapitres || 0);
  return Math.max(0, Math.round(base * facteur * coef));
}

// Même calcul pour une échéance des vraies données (avec le coefficient de sa matière).
function tempsEcheance(e) {
  return tempsEstime(e, donnees.reglages, coefMatiere(e.matiereId));
}

// Nombre de blocs pour un temps donné : TOUJOURS arrondi vers le haut.
// Ex. avec des blocs de 25 min : 25 min → 1 bloc, 30 min → 2 blocs, 50 min → 2 blocs.
function blocsPour(minutes, dureeBloc) {
  return minutes > 0 ? Math.ceil(minutes / dureeBloc) : 0;
}

/* ---------- Coefficient de difficulté perso ----------
   Chaque matière part de 1,0. On regarde tes 8 derniers ressentis dans la matière :
   "Dur" compte +1, "Ok" 0, "Facile" −0,6. Coefficient = 1 + 0,5 × moyenne.
   → 8 fois "Dur" = 1,5 (le maximum) ; 8 fois "Facile" = 0,7 (le minimum) ;
     un seul "Dur" ne fait monter que d'un peu (1,05).                       */
function coefsDifficulte(blocs) {
  const listes = {};
  const notes = blocs.filter(b => b.matiereId && b.ressenti).sort((x, y) => (x.debut || 0) - (y.debut || 0));
  for (const b of notes) (listes[b.matiereId] = listes[b.matiereId] || []).push(b.ressenti);
  const coefs = {};
  for (const id of Object.keys(listes)) {
    const derniers = listes[id].slice(-NB_RESSENTIS);
    const somme = derniers.reduce((total, r) => total + RESSENTIS[r].score, 0);
    const coef = 1 + 0.5 * somme / NB_RESSENTIS;
    coefs[id] = borner(Math.round(coef * 20) / 20, 0.7, 1.5);  // arrondi à 0,05 près
  }
  return coefs;
}

function coefMatiere(matiereId) {
  return coefsDifficulte(donnees.blocs)[matiereId] || 1;
}

// Les derniers ressentis d'une matière (pour l'expliquer à l'écran).
function derniersRessentis(matiereId) {
  return donnees.blocs
    .filter(b => b.matiereId === matiereId && b.ressenti)
    .sort((x, y) => (x.debut || 0) - (y.debut || 0))
    .slice(-NB_RESSENTIS)
    .map(b => b.ressenti);
}

// Durée (en minutes) de "nb" blocs enchaînés, avec les pauses entre les blocs.
// Ex. avec 25/5/15 : 2 blocs = 25 + 5 + 25 = 55 min.
function dureeSerie(nb, r) {
  if (nb <= 0) return 0;
  const pauses = nb - 1;
  const longues = Math.floor(pauses / r.blocsAvantPauseLongue);
  const courtes = pauses - longues;
  return nb * r.travail + courtes * r.pauseCourte + longues * r.pauseLongue;
}

// Combien de blocs tiennent dans un temps donné (pauses comprises) ?
// Ex : 1 h → 2 blocs ; 3 h → 5 blocs.
function blocsDansDuree(minutes, r) {
  let nb = 0;
  while (nb < 60 && dureeSerie(nb + 1, r) <= minutes) nb++;
  return nb;
}

// Nombre de blocs possibles un jour donné (semaine ou week-end).
function capaciteDuJour(cle, r = donnees.reglages) {
  return blocsDansDuree(estWeekend(cle) ? r.dispoWeekend : r.dispoSemaine, r);
}

// Combien de jours avant la date on peut commencer à réviser.
// "Par cœur" commence plus tôt (7 jours de plus par défaut).
function dureeFenetre(e, r) {
  return (r.joursAvant[e.type] || 7) + (e.travail === 'parcoeur' ? (r.joursEnPlusParCoeur || 0) : 0);
}

// "Poids" d'un jour pour une échéance : 1 le premier jour possible,
// puis ça augmente jusqu'à 3 la veille (avec le réglage "progression" = 3).
function poidsDuJour(cle, e, r) {
  const L = dureeFenetre(e, r);           // 7 jours (test) ou 21 jours (examen), plus pour "par cœur"
  const k = ecartJours(cle, e.date);      // 1 = la veille, L = le premier jour possible
  if (L <= 1) return 1;
  return 1 + (r.progression - 1) * (L - k) / (L - 1);
}

// Ordre de priorité : la date la plus proche d'abord.
function comparerPriorite(a, b) {
  if (a.date !== b.date) return a.date < b.date ? -1 : 1;
  if (a.type !== b.type) return a.type === 'examen' ? -1 : 1;
  if (a.niveau !== b.niveau) return b.niveau - a.niveau;
  return a.id < b.id ? -1 : a.id > b.id ? 1 : 0;
}

/* ---------------------------------------------------------------------
   LE PLAN : comment l'appli répartit le travail
   ---------------------------------------------------------------------
   Chaque jour, pour chaque échéance à venir :
     • temps restant = temps estimé − temps déjà étudié pour cette
       échéance, converti en blocs (arrondi vers le haut) ;
     • jours possibles : de 7 jours avant (test) ou 21 jours avant
       (examen) jusqu'à la veille — jamais le jour même ;
     • chaque jour a un "poids" qui grandit à l'approche de la date ;
     • on pose les blocs sur les jours qui en "méritent" le plus, sans
       dépasser le temps dispo du jour, selon le type de travail :
         - mixte     : bloc par bloc, selon le poids ;
         - par cœur  : 1 bloc par jour sur le plus de jours possible ;
         - exercices : des séances d'au moins 2 blocs d'affilée.
   Les échéances passent de la plus proche à la plus lointaine : la plus
   proche se sert en premier (elle est prioritaire). Quand il n'y a plus
   de place, on essaie de décaler un bloc d'une autre échéance vers un
   jour libre ; sinon, ce qui ne rentre pas devient une alerte.
   Comme le plan repart chaque jour du temps qui reste vraiment, un jour
   sauté est automatiquement réparti sur les jours suivants, et un jour
   où tu en fais plus allège les jours suivants.
   --------------------------------------------------------------------- */
function calculerPlan(jour = aujourdhui(), d = donnees) {
  const r = d.reglages;
  const W = r.travail;                  // durée d'un bloc (25 min)
  const demain = ajouterJours(jour, 1);
  const coefs = coefsDifficulte(d.blocs);

  // a) Minutes déjà travaillées pour chaque échéance : avant aujourd'hui, et aujourd'hui.
  const faitAvant = {};
  const faitAujourdhui = {};
  for (const b of d.blocs) {
    if (!b.echeanceId) continue;
    if (b.date < jour) faitAvant[b.echeanceId] = (faitAvant[b.echeanceId] || 0) + b.minutes;
    else if (b.date === jour) faitAujourdhui[b.echeanceId] = (faitAujourdhui[b.echeanceId] || 0) + b.minutes;
  }

  // b) Les échéances à préparer (pas terminées, date après aujourd'hui), la plus proche d'abord.
  const infos = d.echeances
    .filter(e => !e.terminee && e.date > jour)
    .sort(comparerPriorite)
    .map(e => {
      const coef = coefs[e.matiereId] || 1;
      const total = tempsEstime(e, r, coef);
      const avant = faitAvant[e.id] || 0;
      return {
        echeance: e,
        coef,                                      // difficulté perso de la matière
        total,                                     // minutes nécessaires au total
        faitAvant: avant,                          // minutes faites les jours d'avant
        faitAujourdhui: faitAujourdhui[e.id] || 0, // minutes faites aujourd'hui
        restant: Math.max(0, total - avant),       // minutes à faire à partir d'aujourd'hui
        premierJour: ajouterJours(e.date, -dureeFenetre(e, r)),
        veille: ajouterJours(e.date, -1),
      };
    });

  // c) Nombre de blocs possibles chaque jour, d'aujourd'hui jusqu'à la dernière veille.
  const capacites = {};
  const dernierJour = infos.reduce((max, i) => (i.veille > max ? i.veille : max), jour);
  for (let j = jour; j <= dernierJour; j = ajouterJours(j, 1)) capacites[j] = capaciteDuJour(j, r);

  // La "demande" d'une échéance : combien de blocs, sur quels jours, avec quels poids, et comment.
  function demande(info, aPartirDe, blocs) {
    const jours = [];
    const poids = [];
    const debut = info.premierJour > aPartirDe ? info.premierJour : aPartirDe;
    for (let j = debut; j <= info.veille; j = ajouterJours(j, 1)) {
      jours.push(j);
      poids.push(poidsDuJour(j, info.echeance, r));
    }
    const mode = info.echeance.travail || 'mixte';
    const session = Math.max(1, r.blocsParSession || 1);
    // "groupe" = taille d'une séance (2 blocs d'affilée pour les exercices, sinon 1)
    const groupe = mode === 'exercices' && blocs >= session ? session : 1;
    return { id: info.echeance.id, blocs, jours, poids, mode, groupe };
  }

  // d) 1er passage : on répartit tout ce qui reste à partir d'aujourd'hui.
  //    On en garde le plan d'aujourd'hui (il reste fixe toute la journée).
  const passage1 = repartir(infos.map(i => demande(i, jour, blocsPour(i.restant, W))), capacites);
  for (const i of infos) i.prevuAujourdhui = passage1.alloc[i.echeance.id][jour] || 0;

  // e) 2e passage : ce qui restera après aujourd'hui est réparti sur les jours suivants.
  //    (si tu fais plus que prévu aujourd'hui, les jours suivants s'allègent tout de suite)
  const capacitesFutures = Object.assign({}, capacites);
  delete capacitesFutures[jour];
  for (const i of infos) {
    const compteAujourdhui = Math.max(i.prevuAujourdhui * W, i.faitAujourdhui);
    i.restantApres = Math.max(0, i.restant - compteAujourdhui);
  }
  const passage2 = repartir(infos.map(i => demande(i, demain, blocsPour(i.restantApres, W))), capacitesFutures);
  for (const i of infos) {
    i.futur = passage2.alloc[i.echeance.id];    // ex : { "2026-11-24": 2, "2026-11-25": 1 }
    i.manque = passage2.manque[i.echeance.id];  // blocs qu'on n'a pas pu placer
    i.faitsAujourdhui = Math.floor(i.faitAujourdhui / W + 0.01);  // blocs entiers faits aujourd'hui
    i.resteAFaire = Math.max(0, i.prevuAujourdhui - i.faitsAujourdhui) + Object.values(i.futur).reduce((s, n) => s + n, 0);
  }

  // f) Marge et retard de chaque échéance (de la plus urgente à la moins urgente).
  //    Une échéance passe avant les moins urgentes : les places qu'elles occupent comptent
  //    donc comme de la marge pour elle. "utilises" = places prises par elle et les plus urgentes.
  const utilises = {};
  for (const i of infos) {
    utilises[jour] = (utilises[jour] || 0) + i.prevuAujourdhui;
    for (const [j, n] of Object.entries(i.futur)) utilises[j] = (utilises[j] || 0) + n;

    // Marge = places encore disponibles pour elle sur ses jours possibles.
    let marge = 0;
    let joursUtiles = 0;
    for (let j = i.premierJour > jour ? i.premierJour : jour; j <= i.veille; j = ajouterJours(j, 1)) {
      marge += Math.max(0, capacites[j] - (utilises[j] || 0));
      if (capacites[j] > 0) joursUtiles++;
    }
    i.marge = marge;
    // Zéro marge : tous les jours possibles sont déjà au maximum → sauter un jour = être en retard.
    i.zeroMarge = i.manque === 0 && i.resteAFaire > 0 && marge === 0;

    // Retard : on compare ce qui était prévu les jours passés (le "rythme" retenu)
    // avec ce que tu as vraiment fait ces jours-là.
    i.retard = null;
    const ref = i.echeance.rythme;
    if (ref && ref.depuis < jour) {
      let attendu = 0;
      for (const [j, minutes] of Object.entries(ref.prevu)) if (j >= ref.depuis && j < jour) attendu += minutes;
      const fait = d.blocs
        .filter(b => b.echeanceId === i.echeance.id && b.date >= ref.depuis && b.date < jour)
        .reduce((s, b) => s + b.minutes, 0);
      const retard = Math.min(attendu - fait, i.restant);
      if (retard >= W && joursUtiles > 0) {
        const parJour = Math.ceil(retard / joursUtiles / 5) * 5;   // arrondi aux 5 min au-dessus
        // "Trop serré" = au moins 10 min de plus par jour : là, on te prévient.
        i.retard = { minutes: retard, parJour, jusqua: i.veille, visible: parJour >= 10 };
      }
    }
  }

  // g) Ce qu'on affiche : le plan du jour, les 7 prochains jours, les alertes.
  const lignesDuJour = infos
    .filter(i => i.prevuAujourdhui > 0 || i.faitsAujourdhui > 0)
    .map(i => ({ info: i, prevus: i.prevuAujourdhui, faits: i.faitsAujourdhui }));

  const semaine = [];
  for (let n = 1; n <= 7; n++) {
    const j = ajouterJours(jour, n);
    const items = infos.filter(i => i.futur[j] > 0).map(i => ({ info: i, blocs: i.futur[j] }));
    semaine.push({
      jour: j,
      capacite: capacites[j] !== undefined ? capacites[j] : capaciteDuJour(j, r),
      total: items.reduce((somme, x) => somme + x.blocs, 0),
      items,
      echeancesDuJour: d.echeances.filter(e => e.date === j && !e.terminee).sort(comparerPriorite),
    });
  }

  // Une seule alerte par échéance, la plus grave : manque de temps > retard > zéro marge.
  const alertes = [];
  for (const i of infos) {
    if (i.manque > 0) alertes.push({ info: i, type: 'manque', minutes: i.manque * W });
    else if (i.retard && i.retard.visible) alertes.push({ info: i, type: 'retard', minutes: i.retard.minutes });
    else if (i.zeroMarge) alertes.push({ info: i, type: 'marge', minutes: 0 });
  }
  const parId = {};
  for (const i of infos) parId[i.echeance.id] = i;

  return { jour, W, capaciteAujourdhui: capacites[jour], infos, lignesDuJour, semaine, alertes, parId };
}

// Retient le "rythme prévu" de chaque échéance tant que tu es à jour.
// Si tu prends du retard, on garde l'ancien rythme : c'est lui qui permet de mesurer le retard.
// Renvoie true si quelque chose a changé (il faut alors sauvegarder).
function memoriserRythme(plan) {
  let change = false;
  for (const i of plan.infos) {
    if (i.retard) continue;
    const prevu = {};
    if (i.prevuAujourdhui > 0) prevu[plan.jour] = i.prevuAujourdhui * plan.W;
    for (const [j, n] of Object.entries(i.futur)) if (n > 0) prevu[j] = n * plan.W;
    const nouveau = { depuis: plan.jour, prevu };
    if (JSON.stringify(i.echeance.rythme) !== JSON.stringify(nouveau)) {
      i.echeance.rythme = nouveau;
      change = true;
    }
  }
  return change;
}

// Le plan d'aujourd'hui pour tes vraies données (et on retient le rythme prévu).
function planActuel() {
  const plan = calculerPlan(aujourdhui(), donnees);
  if (memoriserRythme(plan)) sauvegarder();
  return plan;
}

// Répartit des blocs sur des jours.
//   demandes  : liste (de la plus prioritaire à la moins prioritaire) de
//               { id, blocs, jours, poids, mode, groupe }
//   capacites : { "2026-11-23": 2, "2026-11-24": 5, ... } = blocs possibles par jour
// Renvoie { alloc: { id: { jour: nombreDeBlocs } }, manque: { id: blocsNonPlaces } }
function repartir(demandes, capacites) {
  const libre = Object.assign({}, capacites);  // places encore libres chaque jour
  const alloc = {};
  const manque = {};
  const dejaTraitees = [];
  for (const dem of demandes) {
    const a = {};
    for (const j of dem.jours) a[j] = 0;
    alloc[dem.id] = a;
    let reste = dem.blocs;
    while (reste > 0) {
      let pose = placer(dem, a, libre, reste);
      // Plus de place : on décale un bloc d'une échéance plus proche (si ça permet de poser une séance)…
      if (!pose && faireDeLaPlace(dem, dejaTraitees, alloc, libre, j => placeUtile(dem, a, libre, j, reste))) continue;
      // … pour les exercices, un bloc seul vaut mieux que rien…
      if (!pose && dem.groupe > 1) pose = placerUnBloc(dem, a, libre);
      // … et en dernier recours, on décale n'importe quel bloc.
      if (!pose && faireDeLaPlace(dem, dejaTraitees, alloc, libre)) continue;
      if (!pose) break;
      reste -= pose;
    }
    manque[dem.id] = reste;
    dejaTraitees.push(dem);
  }
  return { alloc, manque };
}

// Pose 1 ou plusieurs blocs selon le type de travail. Renvoie le nombre de blocs posés (0 = pas de place).
function placer(dem, a, libre, reste) {
  if (dem.mode === 'parcoeur') {
    // Par cœur : d'abord les jours qui n'ont encore aucun bloc de cette échéance (1 bloc par jour),
    // et parmi eux, le jour au plus grand poids.
    return poserSur(dem, a, libre, choisirJour(dem, j => libre[j] > 0, (j, k) => dem.poids[k] - 1000 * a[j]), 1);
  }
  if (dem.groupe > 1) {
    // Exercices : une nouvelle séance de 2 blocs d'affilée, sur un jour qui a la place…
    if (reste >= dem.groupe) {
      const k = choisirJour(dem, j => libre[j] >= dem.groupe, (j, k2) => dem.poids[k2] / (a[j] / dem.groupe + 1));
      if (k !== -1) return poserSur(dem, a, libre, k, dem.groupe);
    }
    // … sinon on allonge une séance déjà prévue (jamais de bloc tout seul ici).
    return poserSur(dem, a, libre, choisirJour(dem, j => libre[j] > 0 && a[j] >= dem.groupe, (j, k) => dem.poids[k] / (a[j] + 1)), 1);
  }
  return placerUnBloc(dem, a, libre);
}

// Mixte : le jour qui "mérite" le plus le bloc = poids ÷ (blocs déjà posés ce jour-là + 1).
function placerUnBloc(dem, a, libre) {
  return poserSur(dem, a, libre, choisirJour(dem, j => libre[j] > 0, (j, k) => dem.poids[k] / (a[j] + 1)), 1);
}

function poserSur(dem, a, libre, k, n) {
  if (k === -1) return 0;
  const j = dem.jours[k];
  a[j] += n;
  libre[j] -= n;
  return n;
}

// Parmi les jours acceptés, celui qui a le meilleur score (en cas d'égalité : le plus proche de la date).
function choisirJour(dem, accepte, score) {
  let meilleur = -1;
  let meilleurScore = -Infinity;
  dem.jours.forEach((j, k) => {
    if (!accepte(j)) return;
    const s = score(j, k);
    if (s >= meilleurScore - 1e-9) {
      meilleur = k;
      meilleurScore = s;
    }
  });
  return meilleur;
}

// Libérer une place ce jour-là servirait-il ? (pour les exercices : il faut pouvoir y poser une séance)
function placeUtile(dem, a, libre, j, reste) {
  if (dem.groupe <= 1) return true;
  return (reste >= dem.groupe && libre[j] + 1 >= dem.groupe) || a[j] >= dem.groupe;
}

// Libère une place sur un des jours de "dem" en déplaçant un bloc d'une échéance
// déjà placée vers un autre de SES jours possibles qui a encore de la place.
// On déplace le bloc qui compte le moins pour l'autre échéance (souvent un de ses
// premiers jours) : elle garde ainsi ses révisions juste avant sa date.
function faireDeLaPlace(dem, dejaTraitees, alloc, libre, utile = () => true) {
  let choix = null;
  for (const autre of dejaTraitees) {
    const a = alloc[autre.id];
    autre.jours.forEach((jour, k) => {
      if (!(a[jour] > 0) || !dem.jours.includes(jour) || !utile(jour)) return;
      const cible = cibleDeplacement(autre, a, libre, jour);
      if (!cible) return;
      const cout = autre.poids[k] / a[jour];   // ce que vaut ce bloc pour l'autre échéance
      if (!choix || cout < choix.cout) choix = { a, jour, cible, cout };
    });
  }
  if (!choix) return false;
  choix.a[choix.jour] -= 1;      // l'autre échéance quitte ce jour…
  choix.a[choix.cible] += 1;     // … pour un jour qui a encore de la place
  libre[choix.cible] -= 1;
  libre[choix.jour] += 1;        // une place se libère pour "dem"
  return true;
}

// Le jour où un bloc de "autre" peut aller (le plus proche de sa date), en respectant son type de travail.
function cibleDeplacement(autre, a, libre, depuis) {
  for (let m = autre.jours.length - 1; m >= 0; m--) {
    const j = autre.jours[m];
    if (j === depuis || !(libre[j] > 0)) continue;
    if (autre.mode === 'parcoeur' && a[j] >= a[depuis]) continue;   // garder 1 bloc par jour
    if (autre.groupe > 1 && (a[depuis] - 1 < autre.groupe || a[j] < autre.groupe)) continue;  // ne pas casser une séance
    return j;
  }
  return null;
}


/* =====================================================================
   5. AFFICHAGE DES ÉCRANS
   Chaque écran est "dessiné" par une fonction qui fabrique du HTML.
   Quand les données changent, on appelle rafraichir() pour redessiner.
   ===================================================================== */

let vueActive = 'aujourdhui';
let choixChrono = null;          // échéance choisie dans l'écran Chrono
let passeesOuvertes = false;     // section "Historique" ouverte ?
let brouillonNote = '';          // note en cours d'écriture après un bloc (gardée si l'écran se redessine)

// Petites icônes dessinées en SVG (elles s'affichent pareil sur tous les téléphones).
const ICONES = {
  lecture: '<svg class="icone" viewBox="0 0 24 24" aria-hidden="true"><path d="M7 4.5v15l12.5-7.5z"/></svg>',
  pause: '<svg class="icone" viewBox="0 0 24 24" aria-hidden="true"><rect x="6" y="4.5" width="4.2" height="15" rx="1.2"/><rect x="13.8" y="4.5" width="4.2" height="15" rx="1.2"/></svg>',
  stop: '<svg class="icone" viewBox="0 0 24 24" aria-hidden="true"><rect x="5.5" y="5.5" width="13" height="13" rx="2.5"/></svg>',
  suivant: '<svg class="icone" viewBox="0 0 24 24" aria-hidden="true"><path d="M5 5v14l9.5-7zM15.5 5h3v14h-3z"/></svg>',
};

function afficherVue(nom) {
  vueActive = nom;
  for (const v of ['aujourdhui', 'echeances', 'chrono', 'reglages']) {
    document.getElementById('vue-' + v).hidden = v !== nom;
  }
  document.querySelectorAll('.onglet').forEach(b => {
    if (b.dataset.onglet === nom) b.setAttribute('aria-current', 'page');
    else b.removeAttribute('aria-current');
  });
  rafraichir();
  window.scrollTo(0, 0);
}

function rafraichir() {
  if (vueActive === 'aujourdhui') afficherAujourdhui();
  else if (vueActive === 'echeances') afficherEcheances();
  else if (vueActive === 'chrono') afficherChrono();
  else afficherReglages();
  majOngletChrono();
}

/* ---------- Ressenti après un bloc ("Facile / Ok / Dur" + note) ---------- */

function carteRessenti() {
  const b = donnees.aEvaluer ? donnees.blocs.find(x => x.id === donnees.aEvaluer) : null;
  if (!b) return '';
  const e = b.echeanceId ? trouverEcheance(b.echeanceId) : null;
  const sujet = e ? nomEcheanceCourt(e) : (b.matiereId ? nomMatiere(b.matiereId) : 'Étude libre');
  const boutons = Object.entries(RESSENTIS).map(([cle, r]) =>
    `<button class="btn" data-action="ressenti" data-valeur="${cle}" type="button"><span class="emoji" aria-hidden="true">${r.emoji}</span>${r.nom}</button>`).join('');
  return `<section class="carte ressenti" aria-label="Ressenti du bloc">
      <h2>Bloc terminé ! Comment c'était ?</h2>
      <p class="aide" style="margin:2px 0 14px">${echapper(sujet)} · ${b.minutes} min</p>
      <label class="champ">Note <span class="facultatif">(facultatif)</span>
        <input type="text" class="note-bloc" maxlength="120" value="${echapper(brouillonNote)}" placeholder="ex : exercices p. 42" autocomplete="off" enterkeyhint="done">
      </label>
      <div class="ressentis">${boutons}</div>
      <button class="lien" data-action="ressenti" data-valeur="" type="button">Passer</button>
    </section>`;
}

/* ---------- Écran "Aujourd'hui" ---------- */

function afficherAujourdhui() {
  const jour = aujourdhui();
  let h = `<header class="entete"><div><p class="surtitre">${dateLongue(jour)}</p><h1>Aujourd'hui</h1></div></header>`;
  h += carteRessenti();

  if (!donnees.echeances.length) {
    document.getElementById('vue-aujourdhui').innerHTML = h + carteBienvenue();
    return;
  }

  const plan = planActuel();
  h += bandeauChrono();

  for (const e of donnees.echeances.filter(x => x.date === jour && !x.terminee)) {
    h += `<div class="info-jour" style="${styleMatiere(e.matiereId)}">
        <span class="texte">📌 C'est aujourd'hui : <strong>${echapper(nomEcheanceLong(e))}</strong>. Bonne chance !</span>
        <button class="btn btn-petit" data-action="test-passe" data-id="${e.id}" type="button">✓ Passé</button>
      </div>`;
  }
  h += carteAlertes(plan);
  h += cartePlanDuJour(plan);
  h += carteSemaine(plan);
  document.getElementById('vue-aujourdhui').innerHTML = h;
}

// Les avertissements : pas assez de temps, retard, zéro marge.
function carteAlertes(plan) {
  if (!plan.alertes.length) return '';
  const icones = { manque: '⚠️', retard: '⏰', marge: '🟡' };
  const lignes = plan.alertes.map(a =>
    `<p class="alerte-ligne"><span aria-hidden="true">${icones[a.type]}</span><strong>${texteAlerte(a, plan.jour)}</strong></p>`).join('');
  let conseil = 'Garde un peu de marge : ajoute du temps dispo dans Réglages si tu peux.';
  if (plan.alertes.some(a => a.type === 'retard')) conseil = 'Le temps en retard est réparti sur les jours qui restent.';
  if (plan.alertes.some(a => a.type === 'manque')) conseil = 'Augmente ton temps dispo dans Réglages, ou fais des blocs en plus.';
  return `<div class="alerte" role="alert">${lignes}<div class="aide">${conseil}</div></div>`;
}

function texteAlerte(a, jour) {
  const e = a.info.echeance;
  const nom = echapper(nomEcheanceLong(e));
  if (a.type === 'manque') {
    return `Pas assez de temps pour ${nom} (<span class="insecable">${quandCourt(e.date, jour)}</span>), il manque <span class="insecable">${formaterDuree(a.minutes)}</span>.`;
  }
  if (a.type === 'retard') {
    const r = a.info.retard;
    const quand = r.jusqua <= jour ? "aujourd'hui" : `par jour ${jusqua(r.jusqua, jour)}`;
    return `Tu es en retard sur ${nom} : <span class="insecable">+${formaterDuree(r.parJour)}</span> ${quand}.`;
  }
  return `Zéro marge sur ${nom} : si tu sautes un jour, tu seras en retard.`;
}

function carteBienvenue() {
  return `<section class="carte bienvenue">
      <h2>Bienvenue ! 👋</h2>
      <p class="aide">Cette appli calcule chaque jour combien de temps étudier pour tes tests et examens.</p>
      <ol>
        <li>Ajoute tes <strong>matières</strong> (maths, chimie…)</li>
        <li>Ajoute tes <strong>tests et examens</strong></li>
        <li>Reviens ici : ton plan du jour s'affiche, lance un bloc ⏱</li>
      </ol>
      <div class="pile">
        <button class="btn btn-principal btn-plein" data-action="ajouter-echeance" type="button">+ Ajouter un test ou un examen</button>
        <button class="btn btn-plein" data-action="exemple" type="button">Essayer avec un exemple</button>
      </div>
    </section>`;
}

function bandeauChrono() {
  const c = donnees.chrono;
  if (!c) return '';
  const p = infosPhase(c);
  return `<button class="bandeau-chrono" data-action="aller-chrono" type="button" style="--phase:${p.couleur}">
      <span>⏱ ${p.libelle} – ${echapper(sujetChrono(c))}</span>
      <strong id="bandeau-temps">${c.phase === 'attente' ? 'Prêt ?' : formaterChrono(restantMs(c))}</strong>
    </button>`;
}

function cartePlanDuJour(plan) {
  const r = donnees.reglages;
  const totalPrevus = plan.lignesDuJour.reduce((somme, l) => somme + l.prevus, 0);
  const dispo = estWeekend(plan.jour) ? r.dispoWeekend : r.dispoSemaine;

  let h = `<section class="carte"><div class="carte-titre"><h2>Mon plan du jour</h2>`;
  if (totalPrevus) h += `<span class="etiquette">${pluriel(totalPrevus, 'bloc')} · ${formaterDuree(totalPrevus * plan.W)}</span>`;
  h += `</div>`;

  if (!plan.lignesDuJour.length) {
    h += `<p class="vide">Rien de prévu aujourd'hui 😌</p>`;
    const prochaine = texteProchaineSeance(plan);
    if (prochaine) h += `<p class="aide centre">${prochaine}</p>`;
    else if (!plan.infos.length) {
      h += `<p class="aide centre">Aucun test ni examen à venir.</p>
        <div class="pile"><button class="btn btn-plein" data-action="ajouter-echeance" type="button">+ Ajouter une échéance</button></div>`;
    }
  } else {
    h += `<ul class="liste-plan">${plan.lignesDuJour.map(l => lignePlan(l, plan)).join('')}</ul>`;
  }
  h += `<p class="aide">Temps dispo aujourd'hui : ${formaterDuree(dispo)}, soit ${pluriel(plan.capaciteAujourdhui, 'bloc')} max (pauses comprises).</p>`;
  return h + `</section>`;
}

// Une ligne du plan : "Chimie – test jeudi – 2 blocs" + bouton Lancer.
function lignePlan(l, plan) {
  const e = l.info.echeance;
  const restants = Math.max(0, l.prevus - l.faits);
  let points = '';
  for (let k = 0; k < Math.max(l.prevus, l.faits); k++) points += `<span class="point${k < l.faits ? ' fait' : ''}"></span>`;

  const titre = `${echapper(nomMatiere(e.matiereId))} – ${e.type} <span class="insecable">${quandCourt(e.date, plan.jour)}</span> <span class="insecable">– ${l.prevus ? pluriel(l.prevus, 'bloc') : 'en plus'}</span>`;
  let sous;
  if (restants > 0) {
    const affilee = e.travail === 'exercices' && l.prevus >= 2 ? ", d'affilée" : '';
    sous = l.faits ? `${pluriel(l.faits, 'bloc')} fait${l.faits > 1 ? 's' : ''}, encore ${restants}` : `${formaterDuree(l.prevus * plan.W)} de travail${affilee}`;
  } else {
    sous = l.prevus ? "✓ Fini pour aujourd'hui, bravo !" : `✓ ${pluriel(l.faits, 'bloc')} en plus, bien joué !`;
  }
  const bouton = restants > 0
    ? `<button class="btn btn-lancer" data-action="lancer" data-id="${e.id}" type="button">${ICONES.lecture} Lancer</button>`
    : `<button class="btn btn-petit" data-action="lancer" data-id="${e.id}" type="button" aria-label="Faire un bloc en plus">+1 bloc</button>`;

  return `<li class="ligne-plan" style="${styleMatiere(e.matiereId)}">
      <div class="ligne-texte">
        <div class="ligne-titre">${titre}</div>
        <div class="points" aria-hidden="true">${points}</div>
        <div class="ligne-sous">${sous}</div>
      </div>
      ${bouton}
    </li>`;
}

// "Prochaine séance : jeudi (Maths)" quand rien n'est prévu aujourd'hui.
function texteProchaineSeance(plan) {
  let meilleur = null;
  for (const i of plan.infos) {
    for (const j of Object.keys(i.futur)) {
      if (i.futur[j] > 0 && (!meilleur || j < meilleur.jour)) meilleur = { jour: j, info: i };
    }
  }
  if (!meilleur) return '';
  return `Prochaine séance : ${quandCourt(meilleur.jour, plan.jour)} (${echapper(nomMatiere(meilleur.info.echeance.matiereId))}).`;
}

function carteSemaine(plan) {
  let h = `<section class="carte"><div class="carte-titre"><h2>Les 7 prochains jours</h2><span class="aide-mini">blocs prévus /<br>possibles</span></div><ul class="semaine">`;
  for (const s of plan.semaine) {
    const d = dateDepuisCle(s.jour);
    let contenu = '';
    for (const e of s.echeancesDuJour) {
      contenu += `<div class="jour-echeance" style="${styleMatiere(e.matiereId)}">📌 ${e.type === 'examen' ? 'Examen' : 'Test'} ${echapper(de(nomMatiere(e.matiereId)))}</div>`;
    }
    if (s.items.length) {
      const puces = s.items.map(x => {
        const e = x.info.echeance;
        const doublon = s.items.filter(y => y.info.echeance.matiereId === e.matiereId).length > 1;
        return `<span class="puce" style="${styleMatiere(e.matiereId)}">${echapper(nomMatiere(e.matiereId))}${doublon ? ` (${e.type})` : ''} · ${x.blocs}</span>`;
      }).join('');
      contenu += `<div class="puces">${puces}</div>`;
    } else if (!s.echeancesDuJour.length) {
      contenu += `<span class="repos">Rien de prévu</span>`;
    }
    h += `<li class="jour">
        <div class="jour-nom">${JOURS_COURTS[d.getDay()]}<small>${d.getDate()} ${MOIS_COURTS[d.getMonth()]}</small></div>
        <div class="jour-contenu">${contenu}</div>
        <div class="jour-charge${s.total && s.total >= s.capacite ? ' plein' : ''}">${s.total}/${s.capacite}</div>
      </li>`;
  }
  return h + `</ul></section>`;
}

/* ---------- Écran "Échéances" ---------- */

function afficherEcheances() {
  const jour = aujourdhui();
  const plan = planActuel();
  const aVenir = donnees.echeances.filter(e => !e.terminee && e.date >= jour).sort(comparerPriorite);
  const historique = donnees.echeances.filter(e => e.terminee || e.date < jour).sort((a, b) => (a.date < b.date ? 1 : -1));

  let h = `<header class="entete"><h1>Échéances</h1><button class="btn btn-principal btn-petit" data-action="ajouter-echeance" type="button">+ Ajouter</button></header>`;

  if (!donnees.matieres.length) {
    h += `<section class="carte bienvenue">
        <h2>Commence par tes matières</h2>
        <p class="aide">Ajoute les matières que tu étudies (maths, chimie, philo, anglais…). Ensuite tu pourras ajouter tes tests et examens.</p>
        <div class="pile"><button class="btn btn-principal btn-plein" data-action="ajouter-matiere" type="button">+ Ajouter une matière</button></div>
      </section>`;
    document.getElementById('vue-echeances').innerHTML = h;
    return;
  }

  if (!aVenir.length) {
    h += `<div class="carte"><p class="vide">Aucun test ni examen à venir.</p><p class="aide centre">Appuie sur « + Ajouter » pour en créer un.</p></div>`;
  }
  h += aVenir.map(e => carteEcheance(e, plan)).join('');
  if (historique.length) {
    h += `<details class="passees"${passeesOuvertes ? ' open' : ''}><summary>Historique (${historique.length})</summary>
        ${historique.map(e => carteEcheance(e, plan)).join('')}
      </details>`;
  }
  h += sectionMatieres();
  document.getElementById('vue-echeances').innerHTML = h;
}

// Les petites étiquettes : TEST / EXAMEN, type de travail, passé.
function badgesEcheance(e) {
  let h = `<span class="badge badge-${e.type}">${e.type === 'examen' ? 'Examen' : 'Test'}</span>`;
  if (e.travail && e.travail !== 'mixte') h += `<span class="badge badge-travail">${nomTravail(e)}</span>`;
  if (e.terminee) h += `<span class="badge badge-passe">✓ Passé</span>`;
  return `<span class="badges">${h}</span>`;
}

function carteEcheance(e, plan) {
  const coef = coefMatiere(e.matiereId);
  const total = tempsEcheance(e);
  const fait = minutesFaites(e.id);
  const pourcent = total > 0 ? Math.min(100, Math.round((fait / total) * 100)) : 100;
  const derniere = derniereNote(e.id);
  return `<article class="carte echeance${e.terminee || e.date < plan.jour ? ' passee' : ''}" style="${styleMatiere(e.matiereId)}"
        data-action="detail-echeance" data-id="${e.id}" role="button" tabindex="0" aria-label="Voir ${echapper(nomEcheanceLong(e))}">
      <div class="ech-haut">
        <span class="ech-matiere">${echapper(nomMatiere(e.matiereId))}</span>
        ${badgesEcheance(e)}
      </div>
      <div class="ech-date">${capitaliser(dateLongue(e.date))} · ${delai(e.date, plan.jour)}</div>
      <div class="ech-details">Niveau ${e.niveau} (${NIVEAUX[e.niveau]}) · ${pluriel(e.chapitres, 'chapitre')} · ≈ ${formaterDuree(total)} d'étude${coef !== 1 ? ` (difficulté × ${formaterDecimal(coef)})` : ''}</div>
      <div class="barre"><div style="width:${pourcent}%"></div></div>
      <div class="ech-progres">${formaterDuree(fait)} faites sur ${formaterDuree(total)}${total > 0 && fait >= total ? ' ✓' : ''}</div>
      ${e.note ? `<div class="ech-note">📝 ${echapper(e.note)}</div>` : ''}
      ${derniere ? `<div class="ech-note">🔖 Dernière fois : « ${echapper(derniere.note)} »</div>` : ''}
      ${statutEcheance(e, plan)}
    </article>`;
}

function statutEcheance(e, plan) {
  if (e.terminee) return `<div class="ech-statut ech-ok">✓ Rangé dans l'historique${e.termineeLe ? ` (${dateCourte(e.termineeLe)})` : ''}</div>`;
  if (e.date === plan.jour) return `<div class="ech-statut">📌 C'est aujourd'hui, bonne chance !</div>`;
  const i = plan.parId[e.id];
  if (!i) return '';
  if (i.manque > 0) return `<div class="ech-statut ech-alerte">⚠️ Pas assez de temps : il manque ${formaterDuree(i.manque * plan.W)}</div>`;
  if (i.retard && i.retard.visible) {
    const quand = i.retard.jusqua <= plan.jour ? "aujourd'hui" : `par jour ${jusqua(i.retard.jusqua, plan.jour)}`;
    return `<div class="ech-statut ech-alerte">⏰ En retard : +${formaterDuree(i.retard.parJour)} ${quand}</div>`;
  }
  if (i.zeroMarge) return `<div class="ech-statut ech-alerte">🟡 Zéro marge : si tu sautes un jour, tu seras en retard</div>`;
  const resteAujourdhui = i.prevuAujourdhui - i.faitsAujourdhui;
  if (resteAujourdhui > 0) return `<div class="ech-statut">📅 Aujourd'hui : ${pluriel(resteAujourdhui, 'bloc')} à faire</div>`;
  const prochain = Object.keys(i.futur).filter(j => i.futur[j] > 0).sort()[0];
  if (prochain) return `<div class="ech-statut">📅 Prochaine séance : ${quandCourt(prochain, plan.jour)} (${pluriel(i.futur[prochain], 'bloc')})</div>`;
  if (i.total > 0) return `<div class="ech-statut ech-ok">✓ Révisions terminées, bravo !</div>`;
  return '';
}

function sectionMatieres() {
  const jour = aujourdhui();
  const coefs = coefsDifficulte(donnees.blocs);
  const triees = [...donnees.matieres].sort((a, b) => a.nom.localeCompare(b.nom, 'fr'));
  let h = `<section class="carte" id="matieres">
      <div class="carte-titre"><h2>Mes matières</h2><button class="btn btn-petit" data-action="ajouter-matiere" type="button">+ Ajouter</button></div>
      <ul class="liste-matieres">`;
  for (const m of triees) {
    const n = donnees.echeances.filter(e => e.matiereId === m.id && !e.terminee && e.date >= jour).length;
    const coef = coefs[m.id] || 1;
    const infos = [];
    if (n) infos.push(pluriel(n, 'échéance'));
    if (coef !== 1) infos.push(`difficulté × ${formaterDecimal(coef)}`);
    h += `<li><button class="ligne-matiere" data-action="modifier-matiere" data-id="${m.id}" type="button" style="${styleCouleur(m.couleur)}">
        <span class="rond"></span>
        <span class="nom">${echapper(m.nom)}</span>
        <span class="aide-mini">${infos.join('<br>')}</span>
        <span class="chevron" aria-hidden="true">›</span>
      </button></li>`;
  }
  return h + `</ul></section>`;
}

/* ---------- Écran "Chrono" ---------- */

function afficherChrono() {
  const c = donnees.chrono;
  let h = `<header class="entete"><h1>Chrono</h1></header>`;
  h += carteRessenti();
  h += c ? chronoActif(c) : chronoAuRepos();
  h += resumeBlocsDuJour();
  document.getElementById('vue-chrono').innerHTML = h;
  majAffichageChrono();
}

// Une carte à cocher "Je travaille sur…" (le texte va à la ligne : rien n'est coupé).
function optionSujet(valeur, titre, details, style, coche) {
  return `<label class="option-sujet" style="${style}">
      <input type="radio" name="sujet-chrono" value="${valeur}"${coche ? ' checked' : ''}>
      <span class="option-corps"><strong>${echapper(titre)}</strong><small>${details}</small></span>
    </label>`;
}

function chronoAuRepos() {
  const r = donnees.reglages;
  const jour = aujourdhui();
  const plan = planActuel();
  const possibles = donnees.echeances.filter(e => !e.terminee && e.date >= jour).sort(comparerPriorite);
  const reste = e => {
    const i = plan.parId[e.id];
    return i ? Math.max(0, i.prevuAujourdhui - i.faitsAujourdhui) : 0;
  };
  // D'abord les échéances qui ont des blocs prévus aujourd'hui.
  const ordre = [...possibles.filter(e => reste(e) > 0), ...possibles.filter(e => reste(e) === 0)];

  // Échéance proposée : celle choisie avant, sinon la première de la liste.
  let choix = choixChrono;
  if (choix !== '' && !ordre.some(e => e.id === choix)) choix = ordre.length ? ordre[0].id : '';

  const options = ordre.map(e => {
    const n = reste(e);
    let details = `${capitaliser(e.type)} ${quandCourt(e.date, jour)}`;
    if (n > 0) details += ` · ${pluriel(n, 'bloc')} prévu${n > 1 ? 's' : ''} aujourd'hui`;
    return optionSujet(e.id, nomMatiere(e.matiereId), details, styleMatiere(e.matiereId), e.id === choix);
  }).join('') + optionSujet('', 'Étude libre', 'sans échéance', 'color:inherit', choix === '');

  return `<section class="carte">
      <fieldset class="choix-sujet"><legend>Je travaille sur…</legend>${options}</fieldset>
      <button class="btn btn-principal btn-geant" data-action="demarrer" type="button">${ICONES.lecture} Démarrer un bloc de ${r.travail} min</button>
      <p class="aide">Travail ${r.travail} min → petite pause ${r.pauseCourte} min. Grande pause de ${r.pauseLongue} min tous les ${r.blocsAvantPauseLongue} blocs.</p>
      ${possibles.length ? '' : `<p class="aide">Astuce : ajoute une échéance pour que tes blocs comptent dans ton plan.</p>`}
    </section>`;
}

function chronoActif(c) {
  const r = donnees.reglages;
  const p = infosPhase(c);
  const enPause = !c.debut && c.phase !== 'attente';
  let info = '';
  if (c.phase === 'travail') {
    const longue = (c.blocsSerie + 1) % r.blocsAvantPauseLongue === 0;
    info = `Bloc n°${c.blocsSerie + 1} · ensuite ${longue ? `grande pause (${r.pauseLongue} min)` : `petite pause (${r.pauseCourte} min)`}`;
  } else if (c.phase === 'attente') {
    info = `Bravo, ${pluriel(c.blocsSerie, 'bloc')} dans cette série 💪`;
  } else {
    info = `Ensuite : bloc n°${c.blocsSerie + 1}`;
  }
  const e = c.echeanceId ? trouverEcheance(c.echeanceId) : null;
  const ligne = e ? planActuel().lignesDuJour.find(l => l.info.echeance.id === e.id) : null;
  if (ligne && ligne.prevus) info += `<br>Pour cette échéance aujourd'hui : ${ligne.faits} fait${ligne.faits > 1 ? 's' : ''} sur ${ligne.prevus}`;
  const derniere = e && c.phase === 'travail' ? derniereNote(e.id) : null;

  let boutons;
  if (c.phase === 'attente') {
    boutons = `<div class="pile">
        <button class="btn btn-principal btn-geant" data-action="bloc-suivant" type="button">${ICONES.lecture} Bloc suivant (${r.travail} min)</button>

      ${c.phase !== 'travail' ? `<button class="btn btn-plein" data-action="passer-pause" type="button">${ICONES.suivant} Passer la pause</button>` : ''}`;
  }

  return `<section class="chrono" style="--phase:${p.couleur}">
      <div class="chrono-phase">${p.libelle}</div>
      <div class="chrono-sujet"><span class="rond" style="--couleur:${c.matiereId ? couleurMatiere(c.matiereId) : 'var(--accent)'}"></span>${echapper(sujetChrono(c))}</div>
      ${derniere ? `<p class="derniere-note">🔖 La dernière fois : « ${echapper(derniere.note)} »</p>` : ''}
      <div class="anneau">
