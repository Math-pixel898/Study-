<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Plan d'étude</title>
<meta name="description" content="Planifie tes révisions : plan du jour, échéances et chrono Pomodoro.">
<meta name="theme-color" content="#121628">
<meta name="color-scheme" content="dark">
<!-- Pour que l'appli s'ouvre en plein écran quand elle est ajoutée à l'écran d'accueil -->
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">

<meta name="apple-mobile-web-app-title" content="Plan d'étude">

<style>
/* =====================================================================
   STYLE (CSS) : les couleurs, les tailles et la mise en page
   Mode sombre travaillé : fond dégradé, cartes en léger relief, coins
   bien arrondis, UNE couleur d'accent (violet) pour les boutons
   importants, et la couleur de chaque matière pour tout ce qui la concerne.
   ===================================================================== */

/* La lueur du fond peut changer de couleur en douceur (chrono, pause…) */
@property --ambiance { syntax: '<color>'; inherits: true; initial-value: rgba(108, 92, 255, 0.16); }

/* Les couleurs de l'appli, rangées dans des "variables" réutilisables */
:root {
  --fond: #0a0c13;
  --carte: #141927;
  --carte-haut: #1a2031;
  --carte-2: #222a3b;
  --carte-3: #2e3649;
  --bord: rgba(255, 255, 255, 0.07);
  --bord-fort: rgba(255, 255, 255, 0.13);
  --texte: #f3f5fb;
  --texte-2: #abb2c5;
  --texte-3: #7b8499;
  --accent: #6c5cff;                 /* LA couleur des boutons importants */
  --accent-clair: #b0abff;           /* la même en clair, pour un texte ou une icône */
  --accent-fond: rgba(108, 92, 255, 0.18);
  --degrade-accent: linear-gradient(135deg, #6c5cff 0%, #5468f0 100%);
  --sur-accent: #ffffff;
  --travail: #ff6b5b;
  --pause: #2dd4bf;
  --pause-longue: #60a5fa;
  --alerte: #fbbf24;
  --alerte-fond: rgba(251, 191, 36, 0.12);
  --danger: #f87171;
  --ok: #34d399;
  --rayon: 22px;
  --rayon-petit: 16px;
  --ombre: 0 1px 0 rgba(255, 255, 255, 0.05) inset, 0 16px 36px -22px rgba(0, 0, 0, 0.9);
  --anim: cubic-bezier(0.2, 0.8, 0.2, 1);
  --ambiance: rgba(108, 92, 255, 0.16);
  --haut: env(safe-area-inset-top, 0px);    /* encoche de l'iPhone */
  --bas: env(safe-area-inset-bottom, 0px);  /* barre du bas du téléphone */
}

* { box-sizing: border-box; }
html { color-scheme: dark; background: var(--fond); -webkit-text-size-adjust: 100%; text-size-adjust: 100%; }
body {
  margin: 0;
  min-height: 100vh;
  background: var(--fond);
  color: var(--texte);
  font: 16px/1.5 system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
  -webkit-font-smoothing: antialiased;
  -webkit-tap-highlight-color: transparent;
}
/* Le fond : un dégradé sombre avec une lueur en haut (elle prend la couleur du chrono) */
body::before {
  content: ""; position: fixed; inset: 0; z-index: -1; pointer-events: none;
  background:
    radial-gradient(120% 55% at 10% -8%, var(--ambiance), transparent 64%),
    radial-gradient(80% 42% at 105% 0%, rgba(56, 189, 248, 0.07), transparent 62%),
    linear-gradient(180deg, #121628 0%, #0b0d16 48%, #090a10 100%);
  transition: --ambiance 0.9s ease;
}
body.bloque { overflow: hidden; }
button, input, select { font: inherit; color: inherit; }
button { cursor: pointer; touch-action: manipulation; -webkit-user-select: none; user-select: none; }
[hidden] { display: none !important; }
:focus { outline: none; }
:focus-visible { outline: 3px solid var(--accent-clair); outline-offset: 2px; }

/* ---------- Mise en page générale ---------- */
main {
  max-width: 560px;
  margin: 0 auto;
  padding: calc(14px + var(--haut)) 16px calc(118px + var(--bas));
}
.vue.entree { animation: entree 0.3s var(--anim); }
@keyframes entree { from { opacity: 0; transform: translateY(10px); } }
.entete { display: flex; align-items: center; justify-content: space-between; gap: 12px; margin: 14px 2px 20px; }
.entete h1, .salut { margin: 0; font-size: 32px; line-height: 1.1; font-weight: 800; letter-spacing: -0.03em; }
.surtitre { margin: 0 0 6px; color: var(--texte-3); font-size: 13px; font-weight: 750; text-transform: uppercase; letter-spacing: 0.08em; }
h2 { margin: 0; font-size: 18px; font-weight: 750; letter-spacing: -0.01em; line-height: 1.25; }
h3 { margin: 22px 0 6px; font-size: 12.5px; font-weight: 750; color: var(--texte-3); text-transform: uppercase; letter-spacing: 0.08em; }
.titre-section {
  display: flex; align-items: center; justify-content: space-between; gap: 10px;
  margin: 28px 4px 10px; color: var(--texte-3);
  font-size: 13px; font-weight: 750; text-transform: uppercase; letter-spacing: 0.08em;
}
.titre-section .btn, .titre-section .etiquette { text-transform: none; letter-spacing: 0; }

.carte {
  position: relative; margin-bottom: 16px; padding: 18px;
  border: 1px solid var(--bord); border-radius: var(--rayon);
  background: linear-gradient(180deg, var(--carte-haut), var(--carte));
  box-shadow: var(--ombre);
}
.carte > h2 { margin-bottom: 8px; }
.carte-titre { display: flex; align-items: center; justify-content: space-between; gap: 10px; margin-bottom: 14px; }
.carte-titre h2 { display: flex; align-items: center; gap: 9px; min-width: 0; }
.carte-titre h2 .ic { color: var(--accent-clair); }
.carte-liste { padding-top: 10px; padding-bottom: 10px; }
.aide { margin: 8px 0 0; color: var(--texte-2); font-size: 14px; line-height: 1.45; }
.aide-mini { color: var(--texte-3); font-size: 12px; font-weight: 600; text-transform: none; letter-spacing: 0; }
.centre { text-align: center; }
.etiquette { flex: none; padding: 5px 11px; border-radius: 999px; background: var(--carte-2); color: var(--texte-2); font-size: 13px; font-weight: 700; white-space: nowrap; font-variant-numeric: tabular-nums; }
.vide { margin: 8px 0 4px; text-align: center; font-size: 17px; color: var(--texte-2); }
.pile { display: grid; gap: 10px; margin-top: 10px; }
.rond { display: inline-block; flex: none; width: 12px; height: 12px; border-radius: 50%; background: var(--couleur, var(--accent-clair)); box-shadow: 0 0 0 3px var(--couleur-fond, rgba(176, 171, 255, 0.18)); }
.insecable { white-space: nowrap; }

/* Les icônes : "icone" = pleines (lecture, pause…), "ic" = au trait (toutes les autres) */
.icone { width: 1.15em; height: 1.15em; flex: none; fill: currentColor; }
.ic { width: 1.2em; height: 1.2em; flex: none; fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }

/* ---------- Boutons (grands, faciles à toucher, qui réagissent au doigt) ---------- */
.btn {
  display: inline-flex; align-items: center; justify-content: center; gap: 8px;
  min-height: 50px; padding: 12px 18px;
  border: 1px solid transparent; border-radius: var(--rayon-petit);
  background: var(--carte-2); color: var(--texte);
  font-size: 16px; font-weight: 700; line-height: 1.2; text-align: center;
  transition: transform 0.14s var(--anim), filter 0.2s, background-color 0.2s, box-shadow 0.2s;
}
.btn:active { transform: scale(0.96); filter: brightness(1.12); }
.btn-principal {
  background: var(--degrade-accent); color: var(--sur-accent);
  box-shadow: 0 12px 26px -14px rgba(108, 92, 255, 0.95), inset 0 1px 0 rgba(255, 255, 255, 0.18);
}
.btn-danger { background: rgba(248, 113, 113, 0.12); color: #fca5a5; }
.btn-danger-plein { background: #ef4444; color: #fff; }
.btn-plein { width: 100%; }
.btn-geant { width: 100%; min-height: 62px; font-size: 18px; border-radius: 20px; }
.btn-petit { min-height: 44px; padding: 8px 14px; font-size: 15px; border-radius: 14px; }
.btn-discret { background: var(--accent-fond); color: var(--accent-clair); }
.btn-rond {
  display: inline-grid; place-items: center; flex: none;
  width: 48px; height: 48px; padding: 0; border: 1px solid var(--bord); border-radius: 50%;
  background: var(--carte-2); color: var(--texte);
  transition: transform 0.14s var(--anim), filter 0.2s;
}
.btn-rond:active { transform: scale(0.9); filter: brightness(1.15); }
.btn-rond.accent { border: 0; background: var(--degrade-accent); color: #fff; box-shadow: 0 10px 22px -12px rgba(108, 92, 255, 0.95); }
.btn-rond .icone, .btn-rond .ic { width: 22px; height: 22px; }
.lien { display: block; margin: 10px auto 0; padding: 10px 14px; border: 0; background: none; color: var(--texte-2); font-weight: 650; text-decoration: underline; text-underline-offset: 3px; }

/* ---------- Barre d'onglets en bas (flottante) ---------- */
.onglets {
  position: fixed; z-index: 20;
  left: max(8px, env(safe-area-inset-left)); right: max(8px, env(safe-area-inset-right)); bottom: calc(8px + var(--bas));
  max-width: 544px; margin: 0 auto;
  display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); gap: 2px;
  padding: 5px; border-radius: 26px;
  background: rgba(17, 20, 31, 0.88);
  -webkit-backdrop-filter: blur(18px) saturate(1.5); backdrop-filter: blur(18px) saturate(1.5);
  border: 1px solid var(--bord-fort);
  box-shadow: 0 18px 40px -14px rgba(0, 0, 0, 0.85);
}
.onglet {
  display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 3px;
  min-width: 0; min-height: 58px; padding: 6px 1px;
  border: 0; border-radius: 21px; background: none; color: var(--texte-3); font-weight: 700;
  transition: color 0.2s, background-color 0.25s var(--anim), transform 0.14s var(--anim);
}
.onglet:active { transform: scale(0.94); }
.onglet svg { width: 24px; height: 24px; fill: none; stroke: currentColor; stroke-width: 1.9; stroke-linecap: round; stroke-linejoin: round; transition: transform 0.25s var(--anim); }
.onglet span { max-width: 100%; font-size: clamp(10px, 2.85vw, 11.5px); white-space: nowrap; }
.onglet[aria-current="page"] { color: var(--texte); background: var(--accent-fond); }
.onglet[aria-current="page"] svg { color: var(--accent-clair); transform: translateY(-1px); }
.onglet.chrono-actif, .onglet.chrono-actif svg { color: var(--phase, var(--accent-clair)); }
.onglet.chrono-actif span { font-variant-numeric: tabular-nums; font-size: 12.5px; }

/* ---------- Écran "Aujourd'hui" ---------- */
.accueil { margin: 14px 2px 18px; }
.salut { display: flex; align-items: center; gap: 10px; }
.salut .ic { width: 30px; height: 30px; color: #ffd27a; }
.salut .ic.ic-lune { color: #c9c5ff; }

.tuiles-jour { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px; margin-bottom: 16px; }
.tuile-jour {
  display: flex; align-items: center; gap: 12px; min-width: 0; padding: 14px;
  border: 1px solid var(--bord); border-radius: 20px;
  background: linear-gradient(180deg, var(--carte-haut), var(--carte)); box-shadow: var(--ombre);
}
.tuile-jour .chiffre { display: block; font-size: 26px; font-weight: 800; line-height: 1; font-variant-numeric: tabular-nums; }
.tuile-jour .chiffre small { color: var(--texte-3); font-size: 16px; font-weight: 750; }
.tuile-jour .sous { display: block; margin-top: 5px; color: var(--texte-2); font-size: 12.5px; line-height: 1.25; }
.flamme {
  display: grid; place-items: center; flex: none; width: 44px; height: 44px; border-radius: 15px;
  background: rgba(255, 138, 61, 0.12); color: #a77a5c;
}
.flamme .ic { width: 24px; height: 24px; }
.flamme.allumee { background: linear-gradient(160deg, #ffb347, #ff5f45); color: #fff; box-shadow: 0 10px 22px -10px rgba(255, 95, 69, 0.95); }
.flamme.allumee .ic { fill: rgba(255, 255, 255, 0.28); }

/* Anneau de progression (petit) */
.anneau-mini { position: relative; display: inline-block; flex: none; }
.anneau-mini svg { display: block; width: 100%; height: 100%; }
.anneau-mini circle { fill: none; }
.anneau-mini-fond { stroke: rgba(255, 255, 255, 0.09); }
.anneau-mini-plein { stroke: var(--couleur, var(--accent-clair)); stroke-linecap: round; transition: stroke-dashoffset 0.7s var(--anim); }
.anneau-mini.complet .anneau-mini-plein { stroke: var(--ok); }
.anneau-mini-centre { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; gap: 1px; font-size: 13px; font-weight: 800; font-variant-numeric: tabular-nums; }
.anneau-mini-centre small { font-size: 0.75em; color: var(--texte-2); }
.anneau-mini-centre .ic { width: 22px; height: 22px; color: var(--ok); stroke-width: 2.6; }

/* La carte principale : la prochaine chose à faire */
.heros {
  overflow: hidden; padding: 20px 20px 18px;
  border-color: var(--couleur-bord, var(--bord-fort));
  background:
    radial-gradient(130% 95% at 100% 0%, var(--couleur-fond-fort, rgba(108, 92, 255, 0.24)), transparent 62%),
    linear-gradient(180deg, var(--carte-haut), var(--carte));
  animation: arrivee 0.45s var(--anim);
}
@keyframes arrivee { from { opacity: 0; transform: translateY(8px) scale(0.985); } }
.heros-etiquette {
  display: inline-flex; align-items: center; gap: 6px; margin: 0 0 12px; padding: 5px 11px;
  border-radius: 999px; background: var(--couleur-fond, var(--accent-fond)); color: var(--couleur, var(--accent-clair));
  font-size: 12px; font-weight: 800; text-transform: uppercase; letter-spacing: 0.07em;
}
.heros-etiquette .ic { width: 15px; height: 15px; }
.heros-tete { display: flex; align-items: center; gap: 12px; width: 100%; padding: 0; border: 0; background: none; text-align: left; }
.heros-tete > span:first-child { flex: 1; min-width: 0; }
.heros-tete .ic { color: var(--texte-3); }
.heros-titre { display: block; margin: 0; font-size: 30px; font-weight: 800; line-height: 1.1; letter-spacing: -0.025em; overflow-wrap: anywhere; }
.heros-sous { display: block; margin: 6px 0 0; color: var(--texte-2); font-size: 15px; }
.heros-infos { display: flex; flex-wrap: wrap; gap: 8px; margin: 16px 0 18px; }
.puce-info {
  display: inline-flex; align-items: center; gap: 7px; padding: 6px 12px;
  border-radius: 999px; background: rgba(255, 255, 255, 0.06); color: var(--texte-2);
  font-size: 13.5px; font-weight: 650;
}
.puce-info .ic { width: 16px; height: 16px; color: var(--couleur, var(--accent-clair)); }
.blocs-points { display: inline-flex; flex-wrap: wrap; gap: 5px; }
.blocs-points i { width: 10px; height: 10px; border-radius: 50%; border: 2px solid var(--couleur, var(--accent-clair)); }
.blocs-points i.fait { background: var(--couleur, var(--accent-clair)); }
.heros-chrono-ligne { display: flex; align-items: center; gap: 14px; margin-bottom: 18px; }
.heros-chrono-ligne > div { flex: 1; min-width: 0; }
.heros-chrono-ligne .heros-titre { font-size: 22px; }
.heros-temps { color: var(--couleur); font-size: 40px; font-weight: 800; letter-spacing: -0.03em; font-variant-numeric: tabular-nums; }

/* Journée terminée */
.heros-fini { text-align: center; --couleur: var(--ok); --couleur-fond: rgba(52, 211, 153, 0.16); --couleur-fond-fort: rgba(52, 211, 153, 0.22); --couleur-bord: rgba(52, 211, 153, 0.35); }
.medaille-fini {
  position: relative; display: grid; place-items: center; width: 92px; height: 92px; margin: 8px auto 16px;
  border-radius: 50%; color: #052e21;
  background: radial-gradient(circle at 32% 26%, #8ff5cf, #10b981 72%);
  box-shadow: 0 18px 40px -16px rgba(16, 185, 129, 0.95), inset 0 2px 0 rgba(255, 255, 255, 0.45);
  animation: rebond 0.8s var(--anim);
}
.medaille-fini .ic { width: 46px; height: 46px; stroke-width: 3; }
.medaille-fini i { position: absolute; width: 8px; height: 8px; border-radius: 50%; background: #ffd43b; }
.medaille-fini i:nth-of-type(1) { top: -4px; right: 2px; }
.medaille-fini i:nth-of-type(2) { bottom: 6px; left: -10px; width: 6px; height: 6px; background: #b0abff; }
.medaille-fini i:nth-of-type(3) { top: 18px; left: -14px; width: 5px; height: 5px; background: #f783ac; }
@keyframes rebond { 0% { transform: scale(0.6); opacity: 0; } 60% { transform: scale(1.08); opacity: 1; } 100% { transform: scale(1); } }
.heros-fini .heros-sous, .heros-repos .heros-sous { margin-bottom: 4px; }
.heros-fini .btn, .heros-repos .btn { margin-top: 16px; }

/* Écrans vides soignés */
.etat-vide { padding: 30px 22px 24px; text-align: center; }
.illu {
  display: grid; place-items: center; width: 92px; height: 92px; margin: 0 auto 18px; border-radius: 30px;
  background: linear-gradient(150deg, rgba(108, 92, 255, 0.38), rgba(84, 104, 240, 0.08));
  color: var(--accent-clair); box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.14), 0 18px 36px -20px rgba(108, 92, 255, 0.9);
}
.illu .ic { width: 44px; height: 44px; stroke-width: 1.8; }
.etat-vide h2 { font-size: 22px; }
.etat-vide p { margin: 8px auto 20px; max-width: 32ch; color: var(--texte-2); }
.etapes { display: flex; justify-content: center; flex-wrap: wrap; gap: 8px; margin: -4px 0 20px; }
.etapes span { display: inline-flex; align-items: center; gap: 7px; padding: 6px 12px 6px 6px; border-radius: 999px; background: rgba(255, 255, 255, 0.05); color: var(--texte-2); font-size: 13.5px; font-weight: 650; }
.etapes b { display: grid; place-items: center; width: 22px; height: 22px; border-radius: 50%; background: var(--accent-fond); color: var(--accent-clair); font-size: 12px; }
.illu-petite { display: grid; place-items: center; flex: none; width: 44px; height: 44px; border-radius: 15px; background: var(--degrade-accent); color: #fff; box-shadow: 0 10px 22px -12px rgba(108, 92, 255, 0.95); }
.illu-petite .ic { width: 22px; height: 22px; }

/* Bandeaux courts (aujourd'hui, demain, retard…) */
.bandeaux { display: grid; gap: 8px; margin: 0 0 16px; }
.bandeau {
  display: flex; align-items: center; gap: 10px; width: 100%; min-height: 54px; padding: 8px 10px 8px 14px;
  border: 1px solid var(--couleur-bord, var(--bord)); border-radius: 18px;
  background: linear-gradient(90deg, var(--couleur-fond, transparent), transparent 85%), var(--carte);
  color: var(--texte); font-size: 14.5px; line-height: 1.35; text-align: left;
  transition: transform 0.14s var(--anim);
}
button.bandeau:active, details.bandeau summary:active { transform: scale(0.985); }
.bandeau > .ic, .bandeau summary > .ic:first-child { color: var(--couleur, var(--alerte)); }
.bandeau .texte { flex: 1 1 140px; min-width: 0; overflow-wrap: anywhere; }
.bandeau, details.bandeau summary { flex-wrap: wrap; }
.bandeau .texte small { display: block; color: var(--texte-2); font-size: 13px; }
.bandeau .compte { flex: none; padding: 3px 10px; border-radius: 999px; background: var(--couleur-fond); color: var(--couleur); font-weight: 800; font-variant-numeric: tabular-nums; }
.bandeau .chevron, .bandeau .chevron-bas { color: var(--texte-3); }
details.bandeau { display: block; padding: 0; }
details.bandeau summary { display: flex; align-items: center; gap: 10px; min-height: 52px; padding: 8px 12px 8px 14px; list-style: none; cursor: pointer; transition: transform 0.14s var(--anim); }
details.bandeau summary::-webkit-details-marker { display: none; }
.alerte-bandeau { --couleur: var(--alerte); --couleur-fond: var(--alerte-fond); --couleur-bord: rgba(251, 191, 36, 0.3); }
.alerte-bandeau .texte strong { color: #fcd34d; }
.chevron-bas { transition: transform 0.25s var(--anim); }
details[open] > summary .chevron-bas { transform: rotate(180deg); }
.bandeau-detail { margin: 0; padding: 0 14px 14px 46px; color: var(--texte-2); font-size: 14px; animation: deplie 0.28s var(--anim); }
@keyframes deplie { from { opacity: 0; transform: translateY(-6px); } }

/* Liste "Ensuite aujourd'hui" */
.liste-plan, .liste-matieres, .liste-faits, .liste-notes { list-style: none; margin: 0; padding: 0; }
.ligne-plan { display: flex; align-items: center; gap: 10px; padding: 10px 0; border-top: 1px solid var(--bord); }
.ligne-plan:first-child { border-top: 0; }
.ligne-corps { display: flex; align-items: center; gap: 12px; flex: 1; min-width: 0; min-height: 52px; padding: 2px 0; border: 0; background: none; text-align: left; transition: transform 0.14s var(--anim); }
.ligne-corps:active { transform: scale(0.98); }
.barre-v { align-self: stretch; flex: none; width: 5px; border-radius: 5px; background: var(--couleur); }
.ligne-texte { flex: 1; min-width: 0; }
.ligne-titre { display: block; font-size: 16px; font-weight: 750; overflow-wrap: anywhere; }
.ligne-sous { display: block; margin-top: 3px; color: var(--texte-2); font-size: 13.5px; }
.ligne-plan.finie .ligne-titre { color: var(--texte-2); }
.ligne-plan.finie .barre-v { opacity: 0.45; }
.note-capacite { margin: 10px 4px 0; color: var(--texte-3); font-size: 13px; }

/* Les 7 prochains jours (une colonne par jour) */
.semaine-carte, .calendrier { padding-left: 12px; padding-right: 12px; }
.semaine-bande { display: grid; grid-template-columns: repeat(7, minmax(0, 1fr)); gap: 3px; }
.jour-col {
  display: flex; flex-direction: column; align-items: center; gap: 6px; min-width: 0; padding: 10px 1px 8px;
  border: 1px solid transparent; border-radius: 16px; background: rgba(255, 255, 255, 0.03);
  transition: background-color 0.2s, border-color 0.2s, transform 0.14s var(--anim);
}
.jour-col:active { transform: scale(0.94); }
.jour-col.choisi { border-color: var(--bord-fort); background: var(--carte-2); }
.jc-nom { color: var(--texte-3); font-size: 11px; font-weight: 750; text-transform: uppercase; }
.jc-num { font-size: 16px; font-weight: 800; line-height: 1; }
.jc-barre { display: flex; flex-direction: column-reverse; gap: 2px; width: 12px; height: 48px; border-radius: 6px; background: var(--carte-3); overflow: hidden; }
.jc-barre i { flex: none; width: 100%; border-radius: 3px; background: var(--couleur); }
.jc-ech { display: flex; justify-content: center; gap: 2px; min-height: 8px; }
.jc-ech i { width: 8px; height: 8px; border-radius: 50%; background: var(--couleur); }
.jc-charge { color: var(--texte-3); font-size: 11px; font-weight: 750; font-variant-numeric: tabular-nums; }
.jc-charge.plein { color: var(--texte-2); }
.jour-detail { margin-top: 12px; padding: 12px 14px; border-radius: 16px; background: var(--carte-2); animation: deplie 0.25s var(--anim); }
.jour-detail-titre { display: flex; justify-content: space-between; gap: 10px; margin-bottom: 8px; font-weight: 750; }
.jour-detail-titre span { color: var(--texte-3); font-size: 13px; font-variant-numeric: tabular-nums; white-space: nowrap; }
.puces { display: flex; flex-wrap: wrap; gap: 6px; }
.puce { display: inline-flex; align-items: center; gap: 6px; padding: 5px 11px; border-radius: 999px; background: var(--couleur-fond); font-size: 14px; font-weight: 650; }
.puce::before { content: ""; width: 8px; height: 8px; border-radius: 50%; background: var(--couleur); }
.puce.puce-ech::before { display: none; }
.puce.puce-ech .ic { width: 15px; height: 15px; color: var(--couleur); }
.repos { color: var(--texte-3); font-size: 14px; }

/* ---------- Ressenti après un bloc ---------- */
.ressenti {
  border-color: rgba(108, 92, 255, 0.45);
  background: radial-gradient(110% 80% at 0% 0%, rgba(108, 92, 255, 0.24), transparent 60%), linear-gradient(180deg, var(--carte-haut), var(--carte));
  animation: arrivee 0.45s var(--anim);
}
.ressenti-tete { display: flex; align-items: center; gap: 12px; margin-bottom: 16px; }
.ressenti-tete h2 { font-size: 18px; }
.ressenti-tete .aide { margin-top: 2px; }
.ressentis { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 10px; }
.ressentis .btn { flex-direction: column; gap: 6px; min-height: 84px; padding: 10px 4px; border-radius: 18px; font-size: 15px; }
.ressentis .emoji { font-size: 30px; line-height: 1; }
.ressentis [data-valeur="facile"] { background: rgba(52, 211, 153, 0.12); border-color: rgba(52, 211, 153, 0.26); }
.ressentis [data-valeur="ok"] { background: rgba(96, 165, 250, 0.12); border-color: rgba(96, 165, 250, 0.26); }
.ressentis [data-valeur="dur"] { background: rgba(251, 146, 60, 0.13); border-color: rgba(251, 146, 60, 0.3); }

/* ---------- Écran "Échéances" ---------- */
.echeance {
  display: flex; align-items: center; gap: 14px; padding: 16px 16px 16px 22px; overflow: hidden; cursor: pointer;
  transition: transform 0.14s var(--anim), border-color 0.2s;
}
.echeance::before { content: ""; position: absolute; left: 0; top: 16px; bottom: 16px; width: 5px; border-radius: 0 5px 5px 0; background: var(--couleur); }
.echeance:active { transform: scale(0.985); }
.echeance.passee { opacity: 0.6; }
.ech-corps { flex: 1; min-width: 0; }
.ech-haut { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
.ech-matiere { font-size: 18px; font-weight: 800; overflow-wrap: anywhere; }
.ech-date { margin-top: 3px; color: var(--texte-2); font-size: 14px; font-weight: 600; }
.ech-puces { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 10px; }
.ech-puces:empty { display: none; }
.puce-statut {
  display: inline-flex; align-items: center; gap: 5px; padding: 4px 10px;
  border-radius: 999px; background: var(--carte-2); color: var(--texte-2);
  font-size: 12.5px; font-weight: 750;
}
.puce-statut .ic { width: 14px; height: 14px; }
.puce-statut.alerte { background: var(--alerte-fond); color: #fcd34d; }
.puce-statut.ok { background: rgba(52, 211, 153, 0.14); color: #6ee7b7; }
.puce-statut.veille-puce { background: var(--accent-fond); color: var(--accent-clair); }
.puce-statut.auj { background: var(--couleur-fond); color: var(--couleur); }
.badges { display: flex; flex-wrap: wrap; justify-content: flex-end; gap: 6px; }
.badge { flex: none; padding: 3px 8px; border-radius: 8px; font-size: 11px; font-weight: 800; text-transform: uppercase; letter-spacing: 0.06em; }
.badge-test { background: rgba(96, 165, 250, 0.15); color: #93c5fd; }
.badge-examen { background: rgba(248, 113, 113, 0.15); color: #fca5a5; }
.badge-travail { background: var(--carte-3); color: var(--texte-2); }
.badge-passe { background: rgba(52, 211, 153, 0.15); color: #6ee7b7; }
.badge-lecture { background: rgba(192, 132, 252, 0.16); color: #d8b4fe; }
.badge-devoir { background: rgba(251, 191, 36, 0.15); color: #fcd34d; }
.ech-note { display: flex; align-items: flex-start; gap: 8px; margin: 12px 0 0; color: var(--texte-2); font-size: 14px; font-style: italic; overflow-wrap: anywhere; }
.ech-note .ic { margin-top: 1px; color: var(--couleur, var(--texte-3)); }
.ech-statut { margin-top: 12px; padding: 10px 12px; border-radius: 14px; background: var(--carte-2); font-size: 14px; font-weight: 650; }
.ech-alerte { background: var(--alerte-fond); color: #fcd34d; }
.ech-ok { color: #6ee7b7; }
details.passees { margin: 22px 0; }
details.passees > summary {
  display: flex; align-items: center; justify-content: space-between; gap: 10px;
  min-height: 48px; padding: 8px 6px; list-style: none; cursor: pointer;
  color: var(--texte-3); font-size: 13px; font-weight: 750; text-transform: uppercase; letter-spacing: 0.08em;
}
details.passees > summary::-webkit-details-marker { display: none; }
details.passees[open] > summary .chevron-bas { transform: rotate(180deg); }

.ligne-matiere {
  display: flex; align-items: center; gap: 12px; width: 100%; min-height: 54px; padding: 8px 2px;
  border: 0; border-top: 1px solid var(--bord); background: none; text-align: left; transition: transform 0.14s var(--anim);
}
.ligne-matiere:active { transform: scale(0.98); }
.liste-matieres li:first-child .ligne-matiere { border-top: 0; }
.ligne-matiere .nom { flex: 1; min-width: 0; font-weight: 700; overflow-wrap: anywhere; }
.ligne-matiere .rond { width: 14px; height: 14px; }
.compteur { flex: none; min-width: 26px; padding: 2px 8px; border-radius: 999px; background: var(--couleur-fond); color: var(--couleur); font-size: 13px; font-weight: 800; text-align: center; }
.chevron { flex: none; color: var(--texte-3); }

/* Détail d'une échéance (dans la feuille) */
.detail-tete { display: flex; align-items: flex-start; gap: 12px; }
.detail-tete-texte { flex: 1; min-width: 0; }
.pastille-matiere { flex: none; width: 14px; height: 14px; margin-top: 10px; border-radius: 50%; background: var(--couleur); box-shadow: 0 0 0 4px var(--couleur-fond); }
.feuille .detail-titre { margin: 0; font-size: 26px; font-weight: 800; letter-spacing: -0.02em; overflow-wrap: anywhere; }
.detail-date { margin: 2px 0 0; color: var(--texte-2); font-size: 14.5px; }
.detail-progres {
  display: flex; align-items: center; gap: 18px; margin: 18px 0 12px; padding: 16px;
  border-radius: 20px; background: radial-gradient(120% 120% at 0% 50%, var(--couleur-fond), transparent 70%), var(--carte-2);
}
.detail-chiffres { display: grid; gap: 10px; min-width: 0; }
.detail-chiffres strong { display: block; font-size: 20px; font-weight: 800; line-height: 1.15; font-variant-numeric: tabular-nums; }
.detail-chiffres span { color: var(--texte-2); font-size: 13px; }
.puces-infos { display: flex; flex-wrap: wrap; gap: 8px; }
.liste-notes li { padding: 10px 0; border-top: 1px solid var(--bord); }
.liste-notes li:first-child { border-top: 0; }
.liste-notes .quand { display: block; color: var(--texte-2); font-size: 14px; font-weight: 600; }
.liste-notes .texte-note { display: block; margin-top: 3px; font-style: italic; overflow-wrap: anywhere; }

/* ---------- Écran "Chrono" (le moment fort) ---------- */
.chrono { text-align: center; }
.chrono-sujet {
  display: inline-flex; align-items: center; justify-content: center; gap: 10px; max-width: 100%;
  padding: 9px 16px; border: 1px solid var(--bord); border-radius: 999px; background: rgba(20, 25, 39, 0.75);
  font-size: 16px; font-weight: 700; overflow-wrap: anywhere;
}
.anneau { position: relative; width: min(78vw, 310px); aspect-ratio: 1; margin: 22px auto 16px; }
.anneau svg { width: 100%; height: 100%; overflow: visible; transform: rotate(-90deg); }
.anneau circle { fill: none; stroke-width: 8; }
.anneau-fond { stroke: rgba(255, 255, 255, 0.07); }
.anneau-progres {
  stroke: var(--phase); stroke-linecap: round; stroke-dasharray: 339.292;
  filter: drop-shadow(0 0 5px var(--phase));
  transition: stroke-dashoffset 0.5s linear, stroke 0.6s;
}
.anneau-centre { position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 8px; }
.chrono-phase { color: var(--phase); font-size: 13px; font-weight: 800; letter-spacing: 0.12em; text-transform: uppercase; }
.chrono-temps { font-size: min(18vw, 74px); font-weight: 750; line-height: 1; letter-spacing: -0.03em; font-variant-numeric: tabular-nums; }
.chrono-temps.petit { font-size: min(10vw, 40px); }
.anneau-sous { max-width: 70%; color: var(--texte-2); font-size: 14px; font-weight: 700; overflow-wrap: anywhere; }
.serie-points { display: flex; gap: 6px; min-height: 8px; }
.serie-points i { width: 8px; height: 8px; border-radius: 50%; background: rgba(255, 255, 255, 0.15); }
.serie-points i.fait { background: var(--phase); }
.serie-points i.en-cours { background: var(--phase); animation: clignote 1.6s ease-in-out infinite; }
@keyframes clignote { 50% { opacity: 0.35; } }
.actions-lecture { margin: 0 0 14px; grid-template-columns: 2fr 1fr; }
.derniere-note { display: flex; align-items: flex-start; justify-content: center; gap: 8px; margin: 0 auto 10px; max-width: 34ch; color: var(--texte-2); font-size: 15px; font-style: italic; overflow-wrap: anywhere; }
.derniere-note .ic { margin-top: 2px; color: var(--phase); }
.chrono-info { margin: 0 0 18px; color: var(--texte-2); font-size: 14.5px; }
.commandes { display: flex; align-items: flex-start; justify-content: center; gap: 16px; margin: 4px 0 14px; }
.commande { display: flex; flex-direction: column; align-items: center; gap: 8px; min-width: 72px; padding: 0; border: 0; background: none; color: var(--texte-2); font-size: 13px; font-weight: 700; }
.rond-cmd {
  display: grid; place-items: center; width: 60px; height: 60px; margin: 10px 0; border: 1px solid var(--bord-fort); border-radius: 50%;
  background: var(--carte-2); color: var(--texte); transition: transform 0.14s var(--anim), filter 0.2s;
}
.commande:active .rond-cmd { transform: scale(0.9); filter: brightness(1.15); }
.commande .icone, .commande .ic { width: 24px; height: 24px; }
.commande.principale { color: var(--texte); }
.commande.principale .rond-cmd { width: 80px; height: 80px; margin: 0; border: 0; background: var(--degrade-accent); color: #fff; box-shadow: 0 16px 32px -14px rgba(108, 92, 255, 0.95); }
.commande.principale .icone { width: 32px; height: 32px; }
.commande.danger .rond-cmd { color: #fca5a5; }
.chrono-actif.en-pause .anneau { animation: respire 4.5s ease-in-out infinite; }
@keyframes respire { 50% { transform: scale(1.025); } }
.chrono-actif.arrete .anneau-progres { opacity: 0.55; }
.anneau.pulse { animation: pulse 0.9s var(--anim); }
@keyframes pulse { 0% { transform: scale(1); } 35% { transform: scale(1.06); filter: drop-shadow(0 0 18px var(--phase)); } 100% { transform: scale(1); } }
.anneau-repos .anneau-progres { opacity: 0.9; }
.liste-faits li { display: flex; align-items: center; gap: 12px; padding: 8px 0; border-top: 1px solid var(--bord); }
.liste-faits li:first-child { border-top: 0; }
.liste-faits .texte { flex: 1; min-width: 0; font-size: 15px; font-weight: 650; overflow-wrap: anywhere; }
.liste-faits .texte small { display: block; color: var(--texte-3); font-weight: 500; }
.supprimer-bloc { display: grid; place-items: center; flex: none; width: 40px; height: 40px; border: 0; border-radius: 50%; background: var(--carte-2); color: var(--texte-3); }
.supprimer-bloc .ic { width: 18px; height: 18px; }
.fait-vide { margin-top: 22px; }

/* Choix "Je travaille sur…" : une carte par échéance, le texte va à la ligne si besoin */
.choix-sujet { display: grid; gap: 8px; margin: 22px 0 8px; text-align: left; }
.choix-sujet legend { margin-bottom: 8px; color: var(--texte-3); font-size: 13px; font-weight: 750; text-transform: uppercase; letter-spacing: 0.08em; }
.option-sujet { position: relative; display: block; }
.option-sujet input { position: absolute; opacity: 0; pointer-events: none; }
.option-corps {
  position: relative; display: block; padding: 12px 44px 12px 42px;
  border: 2px solid var(--bord); border-radius: 18px; background: var(--carte);
  cursor: pointer; transition: border-color 0.2s, background-color 0.2s, transform 0.14s var(--anim);
}
.option-corps:active { transform: scale(0.985); }
.option-corps::before { content: ""; position: absolute; left: 15px; top: 50%; width: 14px; height: 14px; margin-top: -7px; border-radius: 50%; background: var(--couleur, var(--accent-clair)); }
.option-corps::after {
  content: ""; position: absolute; right: 14px; top: 50%; width: 20px; height: 20px; margin-top: -10px;
  border: 2px solid var(--carte-3); border-radius: 50%; transition: border-color 0.2s, background-color 0.2s, box-shadow 0.2s;
}
.option-corps strong { display: block; font-size: 16px; overflow-wrap: anywhere; }
.option-corps small { display: block; margin-top: 2px; color: var(--texte-2); font-size: 14px; }
.option-sujet input:checked + .option-corps { border-color: var(--couleur, var(--accent-clair)); background: var(--couleur-fond, var(--accent-fond)); }
.option-sujet input:checked + .option-corps::after { border-color: var(--couleur, var(--accent-clair)); background: var(--couleur, var(--accent-clair)); box-shadow: inset 0 0 0 4px var(--carte); }
.option-sujet input:focus-visible + .option-corps { outline: 3px solid var(--accent-clair); outline-offset: 2px; }

/* Célébration à la fin d'un bloc : des confettis légers */
.confettis { position: fixed; inset: 0; z-index: 85; overflow: hidden; pointer-events: none; }
.confettis i {
  position: absolute; left: 50%; top: 36%; width: 8px; height: 13px; border-radius: 2px; background: var(--c);
  opacity: 0; animation: confetti 1.5s cubic-bezier(0.15, 0.7, 0.3, 1) var(--delai, 0s) forwards;
}
.confettis i:nth-child(3n) { width: 7px; height: 7px; border-radius: 50%; }
@keyframes confetti {
  0% { opacity: 1; transform: translate(-50%, -50%) scale(0.5); }
  55% { opacity: 1; transform: translate(calc(-50% + var(--dx)), calc(-50% + var(--dy))) rotate(var(--r)) scale(1); }
  100% { opacity: 0; transform: translate(calc(-50% + var(--dx) * 1.15), calc(-50% + var(--dy) + 150px)) rotate(calc(var(--r) * 2)) scale(0.9); }
}

/* ---------- Écran "Réglages" ---------- */
.ligne-reglage { display: flex; align-items: center; justify-content: space-between; gap: 12px; min-height: 60px; padding: 8px 0; border-top: 1px solid var(--bord); }
.carte > .ligne-reglage:first-child, .carte > h2 + .ligne-reglage, h3 + .ligne-reglage, .aide + .ligne-reglage { border-top: 0; }
.libelle { min-width: 0; font-weight: 650; }
.libelle small { display: block; color: var(--texte-3); font-size: 13px; font-weight: 500; }
.stepper { display: flex; align-items: center; gap: 6px; flex: none; }
.stepper button { width: 44px; height: 44px; border: 1px solid var(--bord); border-radius: 50%; background: var(--carte-2); font-size: 24px; font-weight: 700; line-height: 1; transition: transform 0.14s var(--anim), background-color 0.2s; }
.stepper button:active { transform: scale(0.9); background: var(--carte-3); }
.stepper output { min-width: 76px; text-align: center; font-weight: 800; font-variant-numeric: tabular-nums; }
.stepper input { width: 70px; min-height: 48px; border: 1px solid var(--bord); border-radius: 14px; background: var(--carte-2); text-align: center; font-size: 18px; font-weight: 750; -moz-appearance: textfield; appearance: textfield; }
.stepper input::-webkit-outer-spin-button, .stepper input::-webkit-inner-spin-button { -webkit-appearance: none; margin: 0; }
.formule { margin: 6px 0 4px; padding: 10px 12px; border-radius: 14px; background: var(--carte-2); font-weight: 700; text-align: center; }
.interrupteur { position: relative; flex: none; width: 54px; height: 32px; }
.interrupteur input { position: absolute; inset: 0; width: 100%; height: 100%; margin: 0; opacity: 0; cursor: pointer; }
.interrupteur span { position: absolute; inset: 0; border-radius: 999px; background: var(--carte-3); transition: background-color 0.2s; pointer-events: none; }
.interrupteur span::after { content: ""; position: absolute; top: 3px; left: 3px; width: 26px; height: 26px; border-radius: 50%; background: #fff; box-shadow: 0 2px 6px rgba(0, 0, 0, 0.35); transition: transform 0.25s var(--anim); }
.interrupteur input:checked + span { background: var(--accent); }
.interrupteur input:checked + span::after { transform: translateX(22px); }
.interrupteur input:focus-visible + span { outline: 3px solid var(--accent-clair); outline-offset: 2px; }
label.ligne-reglage { cursor: pointer; }
details.avance { padding: 0; }
details.avance > summary { display: flex; align-items: center; gap: 14px; min-height: 76px; padding: 14px 18px; list-style: none; cursor: pointer; }
details.avance > summary::-webkit-details-marker { display: none; }
.avance-titre { flex: 1; min-width: 0; font-size: 17px; font-weight: 750; }
.avance-titre small { display: block; color: var(--texte-3); font-size: 13px; font-weight: 600; }
.avance-corps { padding: 0 18px 18px; border-top: 1px solid var(--bord); animation: deplie 0.3s var(--anim); }
.avance-corps > h3:first-child { margin-top: 18px; }
.version { margin: 24px 0 8px; color: var(--texte-3); }
.installer ol { margin: 8px 0 0; padding-left: 22px; color: var(--texte-2); }
.installer li { margin-bottom: 6px; }
.installer .attention { margin-top: 10px; color: var(--alerte); font-size: 14px; }

/* ---------- Résumé de la semaine (tuiles) ---------- */
.tuiles { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 8px; }
.tuile { min-width: 0; padding: 12px; border-radius: 16px; background: var(--carte-2); }
.tuile-valeur { display: block; font-size: 21px; font-weight: 800; line-height: 1.2; overflow-wrap: anywhere; font-variant-numeric: tabular-nums; }
.tuile-label { display: block; margin-top: 2px; color: var(--texte-2); font-size: 13px; }
.tuile-delta { display: block; margin-top: 4px; color: var(--texte-3); font-size: 12px; }
.fermer-x { display: grid; place-items: center; flex: none; width: 40px; height: 40px; padding: 0; border: 0; border-radius: 50%; background: var(--carte-2); color: var(--texte-2); }
.fermer-x .ic { width: 18px; height: 18px; }

/* ---------- Bascule (Liste / Calendrier, Semaine / Mois) ---------- */
.bascule { display: grid; grid-auto-flow: column; grid-auto-columns: 1fr; gap: 4px; margin-bottom: 16px; padding: 4px; border: 1px solid var(--bord); border-radius: 16px; background: var(--carte); }
.bascule button { min-height: 44px; border: 0; border-radius: 12px; background: none; color: var(--texte-2); font-weight: 750; transition: background-color 0.25s var(--anim), color 0.2s; }
.bascule button[aria-pressed="true"] { background: var(--degrade-accent); color: var(--sur-accent); box-shadow: 0 8px 18px -12px rgba(108, 92, 255, 0.95); }

/* ---------- Calendrier (onglet Échéances) ---------- */
.cal-entete { display: flex; align-items: center; justify-content: space-between; gap: 8px; margin-bottom: 12px; }
.cal-entete h2 { text-transform: capitalize; }
.cal-nav { display: grid; place-items: center; width: 44px; height: 44px; padding: 0; border: 1px solid var(--bord); border-radius: 50%; background: var(--carte-2); }
.cal-nav .ic { width: 20px; height: 20px; }
.cal-grille { display: grid; grid-template-columns: repeat(7, minmax(0, 1fr)); gap: 3px; }
.cal-jsem { padding-bottom: 2px; color: var(--texte-3); font-size: 12px; font-weight: 700; text-align: center; }
.cal-jour { display: flex; flex-direction: column; align-items: center; gap: 3px; min-width: 0; min-height: 54px; padding: 4px 2px 5px; border: 2px solid transparent; border-radius: 12px; background: var(--carte-2); transition: transform 0.14s var(--anim); }
.cal-jour:active { transform: scale(0.93); }
.cal-jour.hors { opacity: 0.35; }
.cal-jour.choisi { border-color: var(--accent-clair); }
.cal-num { min-width: 24px; padding: 1px 4px; border-radius: 999px; font-size: 14px; font-weight: 700; font-variant-numeric: tabular-nums; }
.cal-jour.auj .cal-num { background: var(--accent); color: var(--sur-accent); }
.cal-marques { display: flex; flex-wrap: wrap; justify-content: center; gap: 3px; min-height: 9px; }
.cal-ech { display: inline-block; width: 9px; height: 9px; border-radius: 50%; background: var(--couleur); }
.cal-ech.examen { width: 15px; border-radius: 3px; }
.cal-ech.lecture { width: 8px; height: 8px; margin: 0 1px; border-radius: 2px; transform: rotate(45deg); }
.cal-ech.devoir { width: 9px; height: 9px; border-radius: 1px; }
.cal-barre { display: flex; gap: 2px; width: 80%; height: 4px; margin-top: auto; }
.cal-barre i { min-width: 2px; height: 100%; border-radius: 2px; background: var(--couleur); }
.cal-legende { display: flex; flex-wrap: wrap; align-items: center; gap: 6px 14px; margin-top: 12px; color: var(--texte-2); font-size: 13px; }
.cal-legende span { display: inline-flex; align-items: center; gap: 6px; }
.cal-legende .cal-barre { width: 22px; margin: 0; }
.ligne-cal { display: flex; align-items: center; gap: 10px; width: 100%; min-height: 48px; padding: 8px 4px; border: 0; border-top: 1px solid var(--bord); background: none; text-align: left; font-weight: 650; }
.ligne-cal .texte { flex: 1; min-width: 0; }
.ligne-cal > .ic { color: var(--couleur); }

/* ---------- Veille d'examen et résultat ---------- */
.veille { margin-top: 14px; padding: 14px; border-radius: 18px; background: linear-gradient(180deg, rgba(108, 92, 255, 0.14), rgba(108, 92, 255, 0.06)); border: 1px solid rgba(108, 92, 255, 0.35); }
.veille-titre { display: flex; align-items: center; gap: 8px; }
.veille-titre .ic { color: var(--accent-clair); }
.checklist { list-style: none; margin: 8px 0 0; padding: 0; }
.checklist li { padding: 6px 0; }
.checklist label { display: flex; align-items: flex-start; gap: 10px; min-height: 32px; font-weight: 600; cursor: pointer; }
.checklist input { flex: none; width: 22px; height: 22px; margin: 1px 0 0; accent-color: var(--accent); }
.checklist input:checked + span { color: var(--texte-3); text-decoration: line-through; }
.checklist .sous { display: block; margin: 4px 0 0 32px; color: var(--texte-2); font-size: 14px; font-style: italic; overflow-wrap: anywhere; }
.resultat { margin-top: 14px; padding: 14px; border-radius: 18px; background: var(--carte-2); }
.resultat-titre { display: flex; align-items: center; gap: 8px; }
.resultat-titre .ic { color: var(--couleur, var(--accent-clair)); }
.deux-champs { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px; }

/* ---------- Écran "Stats" (graphiques dessinés en SVG) ---------- */
.graphique { display: block; width: 100%; height: auto; overflow: visible; }
.graphique text { font-family: inherit; }
.graphique .g-nom { fill: var(--texte); font-size: 14px; font-weight: 600; }
.graphique .g-valeur { fill: var(--texte-2); font-size: 13px; font-variant-numeric: tabular-nums; }
.graphique .g-axe { fill: var(--texte-3); font-size: 11px; font-variant-numeric: tabular-nums; }
.graphique .g-grille { stroke: var(--bord-fort); stroke-width: 1; }
.graphique .g-choisi { fill: var(--texte); opacity: 0.08; }
.graphique .g-point { stroke: var(--carte); stroke-width: 2; }
.graphique [data-action] { cursor: pointer; }
.legende { display: flex; flex-wrap: wrap; gap: 6px 14px; margin-top: 10px; color: var(--texte-2); font-size: 13px; }
.legende span { display: inline-flex; align-items: center; gap: 6px; }
.legende i { width: 10px; height: 10px; border-radius: 3px; background: var(--couleur); }
.legende i.point { border-radius: 50%; }
.detail-graphique { margin-top: 12px; padding: 10px 12px; border-radius: 14px; background: var(--carte-2); font-size: 14px; }
.chiffres summary { margin-top: 4px; padding: 12px 0; color: var(--texte-2); font-size: 14px; cursor: pointer; }
.chiffres table { width: 100%; margin-top: 8px; border-collapse: collapse; font-size: 13px; font-variant-numeric: tabular-nums; }
.chiffres th, .chiffres td { padding: 5px 4px; border-top: 1px solid var(--bord); text-align: left; vertical-align: top; }
.chiffres th:last-child, .chiffres td:last-child { text-align: right; white-space: nowrap; }
.chiffres th { color: var(--texte-2); font-weight: 650; }
.serie-carte {
  border-color: rgba(255, 138, 61, 0.28);
  background: radial-gradient(120% 90% at 0% 0%, rgba(255, 120, 60, 0.18), transparent 60%), linear-gradient(180deg, var(--carte-haut), var(--carte));
}
.serie { display: flex; align-items: center; gap: 16px; }
.flamme.flamme-grande { width: 64px; height: 64px; border-radius: 22px; }
.flamme.flamme-grande .ic { width: 34px; height: 34px; }
.serie-num { flex: 1; min-width: 0; }
.serie-valeur { display: block; font-size: 52px; font-weight: 800; line-height: 1; letter-spacing: -0.03em; font-variant-numeric: tabular-nums; }
.serie-record { flex: none; padding: 10px 14px; border-radius: 16px; background: rgba(255, 255, 255, 0.05); text-align: center; }
.jours-flammes { display: grid; grid-template-columns: repeat(7, minmax(0, 1fr)); gap: 6px; margin-top: 16px; }
.jours-flammes span { display: flex; flex-direction: column; align-items: center; gap: 4px; color: var(--texte-3); font-size: 11px; font-weight: 750; }
.jours-flammes i { display: grid; place-items: center; width: 30px; height: 30px; border-radius: 50%; background: rgba(255, 255, 255, 0.05); }
.jours-flammes .fait i { background: linear-gradient(160deg, #ffb347, #ff5f45); color: #fff; }
.jours-flammes .ic { width: 16px; height: 16px; }
.jours-flammes .auj small { color: var(--texte); }
.liens-etude { list-style: none; margin: 10px 0 0; padding: 0; }
.liens-etude li { display: flex; align-items: flex-start; gap: 8px; padding: 6px 0; font-size: 14px; }
.liens-etude .rond { margin-top: 5px; }
.badges-grille { display: grid; grid-template-columns: repeat(auto-fill, minmax(96px, 1fr)); gap: 10px; }
.badge-tuile { display: flex; flex-direction: column; align-items: center; gap: 4px; padding: 14px 6px 12px; border: 1px solid var(--bord); border-radius: 18px; background: rgba(255, 255, 255, 0.03); text-align: center; }
.medaille { position: relative; display: grid; place-items: center; width: 66px; height: 66px; margin-bottom: 6px; border-radius: 50%; }
.badge-tuile.gagne { border-color: var(--teinte-bord); background: radial-gradient(100% 70% at 50% 0%, var(--teinte-fond), transparent 75%); }
.badge-tuile.gagne .medaille {
  background: radial-gradient(circle at 32% 26%, rgba(255, 255, 255, 0.45), transparent 42%), radial-gradient(circle at 50% 55%, var(--teinte), var(--teinte-sombre));
  box-shadow: 0 0 0 3px var(--teinte-fond), 0 12px 26px -10px var(--teinte-lueur), inset 0 -3px 0 rgba(0, 0, 0, 0.18);
}
.badge-tuile.verrouille .medaille { background: var(--carte-2); }
.medaille .anneau-mini { position: absolute; inset: -4px; width: auto !important; height: auto !important; }
.medaille .anneau-mini-plein { stroke: var(--teinte); }
.badge-tuile .emoji { position: relative; font-size: 30px; line-height: 1; }
.badge-tuile strong { display: block; font-size: 13px; line-height: 1.25; }
.badge-tuile small { display: block; margin-top: 2px; color: var(--texte-3); font-size: 12px; line-height: 1.25; }
.badge-tuile.verrouille .emoji { filter: grayscale(1); opacity: 0.35; }
.badge-tuile.verrouille strong { color: var(--texte-2); }

/* ---------- Mode concentration (plein écran noir) ---------- */
.concentration { position: fixed; inset: 0; z-index: 60; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 16px; padding: calc(24px + var(--haut)) 24px calc(90px + var(--bas)); background: #000; color: #d4d6dc; text-align: center; touch-action: none; overscroll-behavior: contain; }
.conc-phase { color: var(--phase, var(--travail)); font-size: 14px; font-weight: 750; letter-spacing: 0.1em; text-transform: uppercase; opacity: 0.85; }
.conc-temps { font-size: min(26vw, 150px); font-weight: 700; line-height: 1; letter-spacing: -0.02em; font-variant-numeric: tabular-nums; }
.conc-sujet { color: #9a9fa9; font-size: 20px; font-weight: 650; }
.conc-note { max-width: 32ch; color: #6c717c; font-size: 16px; font-style: italic; overflow-wrap: anywhere; }
.conc-quitter { position: absolute; left: 50%; bottom: calc(24px + var(--bas)); transform: translateX(-50%); padding: 12px 20px; border: 1px solid #2a2d33; border-radius: 999px; background: none; color: #7d828c; font-weight: 600; white-space: nowrap; }

/* ---------- Jours spéciaux, reports, blocs courts (V4) ---------- */
#form-special[data-genre="off"] .seulement-temps { display: none; }
.liste-speciaux { list-style: none; margin: 4px 0 0; padding: 0; }
.liste-speciaux li { display: flex; align-items: center; gap: 8px; border-top: 1px solid var(--bord); }
.liste-speciaux li:first-child { border-top: 0; }
.ligne-special { display: flex; align-items: center; gap: 10px; flex: 1; min-width: 0; min-height: 50px; padding: 6px 0; border: 0; background: none; text-align: left; font-weight: 650; overflow-wrap: anywhere; }
.ligne-special .ic { color: var(--accent-clair); }
.cal-jour.indispo, .jour-col.indispo { background: repeating-linear-gradient(135deg, rgba(255, 255, 255, 0.07) 0 4px, transparent 4px 9px), var(--carte-2); }
.cal-jour.special { box-shadow: inset 0 -3px 0 var(--accent-clair); }
.jour-col.indispo .jc-charge { color: var(--texte-3); }
.special-puce { --couleur: var(--accent-clair); --couleur-fond: var(--accent-fond); }
.liens-heros { display: flex; flex-wrap: wrap; justify-content: center; gap: 0 18px; }
.liens-heros .lien { margin: 6px 0 0; }
.durees { margin: 0 0 12px; }

/* ---------- Lectures (livres) ---------- */
#form-echeance:not([data-genre="etude"]) .seulement-etude,
#form-echeance:not([data-genre="lecture"]) .seulement-lecture,
#form-echeance:not([data-genre="devoir"]) .seulement-devoir { display: none; }
.liste-livres { list-style: none; margin: 0; padding: 0; }
.liste-livres li { display: flex; align-items: center; gap: 12px; padding: 8px 0; border-top: 1px solid var(--bord); }
.liste-livres li:first-child { border-top: 0; padding-top: 0; }
.liste-livres .texte { flex: 1; min-width: 0; overflow-wrap: anywhere; }
.liste-livres .texte strong { display: block; font-size: 15px; }
.liste-livres .texte small { display: block; color: var(--texte-2); font-size: 13px; }
.liste-notes li.seance { display: flex; align-items: flex-start; gap: 10px; }

/* ---------- Lot 2 : chapitres, questions, conseils, examen blanc, fiche de lecture ---------- */
.titre-compte { margin-left: 6px; color: var(--texte-2); letter-spacing: 0; }
.liste-chapitres { list-style: none; margin: 4px 0 0; padding: 0; }
.liste-chapitres li { display: flex; align-items: center; gap: 8px; border-top: 1px solid var(--bord); }
.liste-chapitres li:first-child { border-top: 0; }
.liste-chapitres label { display: flex; flex: 1; align-items: center; gap: 12px; min-width: 0; min-height: 48px; padding: 4px 0; font-weight: 600; cursor: pointer; overflow-wrap: anywhere; }
.liste-chapitres input { flex: none; width: 22px; height: 22px; margin: 0; accent-color: var(--accent); }
.liste-chapitres input:checked + span { color: var(--texte-3); text-decoration: line-through; }
.form-ligne { display: flex; gap: 8px; margin-top: 10px; }
.form-ligne input { flex: 1; min-width: 0; min-height: 48px; padding: 10px 14px; border: 1px solid var(--bord-fort); border-radius: 14px; background: var(--carte-2); font-size: 16px; }
.form-ligne input:focus { outline: none; border-color: var(--accent-clair); box-shadow: 0 0 0 4px var(--accent-fond); }
.form-ligne .btn { flex: none; }
.aide-sync { margin-top: 10px; }
.aide-sync .lien { display: inline; margin: 0; padding: 4px 0; }
.chapitres-ressenti { margin: 0 0 14px; }
.chapitres-ressenti .aide { margin: 0 0 8px; }
.puce-bouton { display: inline-flex; align-items: center; gap: 6px; min-height: 40px; padding: 6px 12px; border: 1px solid var(--bord); border-radius: 999px; background: var(--carte-2); font-size: 14px; font-weight: 650; text-align: left; overflow-wrap: anywhere; }
.puce-bouton .ic { width: 16px; height: 16px; color: var(--accent-clair); }
.carte-questions { display: flex; align-items: center; gap: 12px; width: 100%; text-align: left; cursor: pointer; }
.carte-questions .texte { flex: 1; min-width: 0; }
.carte-questions .texte strong { display: block; font-size: 16px; }
.carte-questions .texte small { display: block; margin-top: 2px; color: var(--texte-2); font-size: 14px; font-style: italic; overflow-wrap: anywhere; }
.carte-questions > .ic:last-child { color: var(--texte-3); }
.groupe-questions h3 { display: flex; align-items: center; gap: 8px; }
.groupe-questions h3 .rond { width: 10px; height: 10px; border-radius: 50%; background: var(--couleur); }
.liste-questions { list-style: none; margin: 0; padding: 0; }
.liste-questions li { display: flex; align-items: center; gap: 10px; padding: 10px 0; border-top: 1px solid var(--bord); }
.liste-questions li:first-child { border-top: 0; }
.liste-questions .texte { flex: 1; min-width: 0; overflow-wrap: anywhere; }
.liste-questions .texte small { display: block; margin-top: 2px; color: var(--texte-3); font-size: 13px; }
.liste-questions .btn { flex: none; }
.conseil { display: flex; align-items: flex-start; gap: 8px; margin: 14px auto 0; max-width: 36ch; padding: 10px 14px; border-radius: 16px; background: var(--carte-2); color: var(--texte-2); font-size: 14px; text-align: left; overflow-wrap: anywhere; }
.conseil .ic { flex: none; margin-top: 1px; color: var(--phase); }
.conseil strong { color: var(--texte); }
.chrono-repos .liens-heros .lien { margin-top: 2px; }
.fiche-champ { margin: 10px 0 0; }
.fiche-champ strong { display: block; color: var(--texte-2); font-size: 13px; text-transform: uppercase; letter-spacing: 0.06em; }
.fiche-champ p { margin: 4px 0 0; white-space: pre-wrap; overflow-wrap: anywhere; }
.puce-choix.sans-rond { --couleur: var(--accent-clair); --couleur-fond: var(--accent-fond); }
.puce-choix.sans-rond span::before { display: none; }

/* ---------- Lot 3 : objectif de la semaine, bilan du mois, prévu / fait, moments ---------- */
.objectif-semaine { display: block; width: 100%; margin: -6px 0 14px; padding: 8px 14px 10px; border: 1px solid var(--bord); border-radius: 18px; background: linear-gradient(180deg, var(--carte-haut), var(--carte)); text-align: left; }
.objectif-texte { display: flex; align-items: center; gap: 8px; color: var(--texte-2); font-size: 14px; }
.objectif-texte .ic { flex: none; width: 18px; height: 18px; color: var(--accent-clair); }
.objectif-texte strong { color: var(--texte); }
.objectif-texte small { margin-left: auto; color: var(--texte-3); font-size: 13px; white-space: nowrap; }
.objectif-barre { display: block; height: 6px; margin-top: 6px; border-radius: 999px; background: var(--carte-3); overflow: hidden; }
.objectif-barre i { display: block; height: 100%; border-radius: inherit; background: var(--degrade-accent); transition: width 0.6s var(--anim); }
.objectif-semaine.atteint .objectif-barre i, .objectif-barre.atteint i { background: var(--ok); }
.objectif-barre.grande { height: 12px; margin: 10px 0 0; }
.objectif-semaine .objectif-texte { min-height: 24px; }
.objectif-grand { display: flex; align-items: baseline; gap: 8px; flex-wrap: wrap; }
.objectif-grand strong { font-size: 30px; font-weight: 800; line-height: 1.1; font-variant-numeric: tabular-nums; }
.objectif-grand span { color: var(--texte-2); }
.semaines-passees { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 6px; margin-top: 8px; }
.semaines-passees span { min-width: 0; padding: 8px 4px; border-radius: 12px; background: var(--carte-2); text-align: center; font-size: 13px; }
.semaines-passees small { display: block; color: var(--texte-3); font-size: 11.5px; }
.semaines-passees strong { display: block; font-variant-numeric: tabular-nums; }
.semaines-passees .ok strong { color: var(--ok); }
.bilan-nav { display: flex; align-items: center; gap: 8px; margin-bottom: 14px; }
.bilan-nav h2 { flex: 1; min-width: 0; text-align: center; font-size: 17px; overflow-wrap: anywhere; }
.bilan-nav .cal-nav[disabled] { opacity: 0.3; }
.liste-bilan { list-style: none; margin: 12px 0 0; padding: 0; }
.liste-bilan li { display: flex; align-items: flex-start; gap: 10px; padding: 9px 0; border-top: 1px solid var(--bord); font-size: 14px; }
.liste-bilan li:first-child { border-top: 0; }
.liste-bilan .ic { flex: none; width: 18px; height: 18px; margin-top: 1px; color: var(--accent-clair); }
.liste-bilan span { flex: 1; min-width: 0; overflow-wrap: anywhere; }
.monte { color: var(--ok); font-weight: 700; }
.baisse { color: var(--travail); font-weight: 700; }
.legende-prevu { display: flex; flex-wrap: wrap; gap: 4px 16px; margin: 0 0 8px; color: var(--texte-2); font-size: 13px; }
.legende-prevu i { display: inline-block; width: 14px; height: 10px; margin-right: 6px; border-radius: 3px; vertical-align: -1px; background: var(--texte-2); }
.legende-prevu i.piste { background: rgba(255, 255, 255, 0.2); }
.idee-pause { color: var(--texte); font-weight: 650; }
.seance-texte { flex: 1; min-width: 0; }

/* ---------- Formulaires (dans la feuille qui monte du bas) ---------- */
.champ { display: block; margin: 0 0 18px; font-size: 15px; font-weight: 650; }
.champ input, .champ select {
  display: block; width: 100%; margin-top: 8px; min-height: 52px; padding: 12px 14px;
  border: 1px solid var(--bord-fort); border-radius: 16px; background: var(--carte-2);
  font-size: 17px; font-weight: 500; -webkit-appearance: none; appearance: none;
  transition: border-color 0.2s, box-shadow 0.2s;
}
.champ input:focus, .champ select:focus { border-color: var(--accent-clair); box-shadow: 0 0 0 4px var(--accent-fond); }
.champ textarea {
  display: block; width: 100%; margin-top: 8px; min-height: 96px; padding: 12px 14px; resize: vertical;
  border: 1px solid var(--bord-fort); border-radius: 16px; background: var(--carte-2); color: inherit;
  font: inherit; font-size: 16px; font-weight: 500; line-height: 1.45; transition: border-color 0.2s, box-shadow 0.2s;
}
.champ textarea:focus { outline: none; border-color: var(--accent-clair); box-shadow: 0 0 0 4px var(--accent-fond); }
.champ-ligne small { display: block; color: var(--texte-3); font-size: 13px; font-weight: 500; }
.stepper .valeur-stepper { min-width: 76px; text-align: center; font-size: 18px; font-weight: 800; font-variant-numeric: tabular-nums; }
input[type="date"]::-webkit-date-and-time-value { text-align: left; }
input[type="date"]::-webkit-calendar-picker-indicator { filter: invert(0.8); }
.champ .facultatif { color: var(--texte-3); font-weight: 500; }
.champ-ligne { display: flex; align-items: center; justify-content: space-between; gap: 12px; margin: 0 0 18px; font-size: 15px; font-weight: 650; }
fieldset { margin: 0 0 18px; padding: 0; border: 0; min-width: 0; }
legend { margin-bottom: 8px; padding: 0; font-size: 15px; font-weight: 650; }

.segments { display: grid; grid-auto-flow: column; grid-auto-columns: 1fr; gap: 4px; padding: 4px; border: 1px solid var(--bord); border-radius: 16px; background: var(--carte-2); }
.segments label { position: relative; min-width: 0; }
.segments input { position: absolute; opacity: 0; pointer-events: none; }
.segments span { display: flex; flex-direction: column; align-items: center; justify-content: center; min-height: 50px; height: 100%; padding: 6px 2px; border-radius: 12px; color: var(--texte-2); font-weight: 750; text-align: center; cursor: pointer; transition: background-color 0.2s, color 0.2s; }
.segments span small { font-size: 12px; font-weight: 600; }
.segments input:checked + span { background: var(--degrade-accent); color: var(--sur-accent); }
.segments input:focus-visible + span { outline: 3px solid var(--accent-clair); outline-offset: 2px; }

.choix-puces { display: flex; flex-wrap: wrap; gap: 8px; }
.puce-choix { position: relative; }
.puce-choix input { position: absolute; opacity: 0; pointer-events: none; }
.puce-choix span { display: inline-flex; align-items: center; gap: 8px; min-height: 46px; padding: 8px 16px; border: 2px solid transparent; border-radius: 999px; background: var(--carte-2); font-weight: 650; cursor: pointer; transition: border-color 0.2s, background-color 0.2s; }
.puce-choix span::before { content: ""; width: 12px; height: 12px; border-radius: 50%; background: var(--couleur); }
.puce-choix input:checked + span { border-color: var(--couleur); background: var(--couleur-fond); }
