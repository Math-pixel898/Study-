/* =====================================================================
   7. CHRONO POMODORO
   Le chrono ne compte PAS les secondes une par une. Il retient l'heure
   de départ (Date.now()) et calcule : temps écoulé = maintenant − départ.
   Comme ça il reste juste même si l'écran se verrouille ou si l'appli
   est fermée : à ton retour, il se recale tout seul.
   ===================================================================== */

// Temps écoulé dans la phase en cours (en millisecondes).
function ecouleMs(c) {
  return c.dejaEcouleMs + (c.debut ? Date.now() - c.debut : 0);
}

function restantMs(c) {
  return Math.max(0, c.dureeMs - ecouleMs(c));
}

function infosPhase(c) {
  if (c.phase === 'attente') return { libelle: 'Pause terminée', couleur: 'var(--accent)' };
  if (!c.debut) return { libelle: 'En pause', couleur: 'var(--texte-2)' };
  if (c.phase === 'travail') return { libelle: c.examenBlanc ? 'Examen blanc' : 'Travail', couleur: 'var(--travail)' };
  if (c.phase === 'pauseLongue') return { libelle: 'Grande pause', couleur: 'var(--pause-longue)' };
  return { libelle: 'Petite pause', couleur: 'var(--pause)' };
}

function sujetChrono(c) {
  const e = c.echeanceId ? trouverEcheance(c.echeanceId) : null;
  if (e) return nomEcheanceCourt(e);
  return c.matiereId && trouverMatiere(c.matiereId) ? nomMatiere(c.matiereId) : 'Étude libre';
}

// Bouton "Lancer" du plan du jour (ou du détail d'une échéance).
function lancerDepuisPlan(echeanceId) {
  fermerFeuille();
  const c = donnees.chrono;
  if (c && c.phase !== 'attente') {
    afficherToast('Un bloc est déjà en cours ⏱');
    afficherVue('chrono');
    return;
  }
  demarrerBloc(echeanceId, c ? c.blocsSerie : 0);
}

function demarrerBloc(echeanceId, blocsSerie = 0, minutes = null) {
  preparerSon();
  const e = echeanceId ? trouverEcheance(echeanceId) : null;
  const maintenant = Date.now();
  const duree = minutes && minutes > 0 && minutes <= donnees.reglages.travail ? minutes : donnees.reglages.travail;
  donnees.chrono = {
    phase: 'travail',
    echeanceId: e ? e.id : null,
    matiereId: e ? e.matiereId : null,
    dureeMs: duree * 60000,
    dureeTravail: duree,   // V4 : un bloc peut être plus court (10, 15 min…)
    debut: maintenant,     // heure de départ (null quand le chrono est en pause)
    dejaEcouleMs: 0,       // temps déjà écoulé avant une pause
    debutBloc: maintenant, // pour enregistrer la date du bloc
    blocsSerie,            // blocs déjà terminés dans cette série
  };
  if (e) choixChrono = e.id;
  sauvegarder();
  vibrer(30);   // petite vibration : c'est parti !
  majVerrouEcran();
  afficherVue('chrono');
}

function mettreEnPause() {
  verifierChrono();
  const c = donnees.chrono;
  if (!c || !c.debut || c.phase === 'attente') return;
  c.dejaEcouleMs = ecouleMs(c);
  c.debut = null;
  sauvegarder();
  majVerrouEcran();
  rafraichir();
}

function reprendre() {
  preparerSon();
  const c = donnees.chrono;
  if (!c || c.debut || c.phase === 'attente') return;
  c.debut = Date.now();
  sauvegarder();
  majVerrouEcran();
  rafraichir();
}

async function arreter() {
  verifierChrono();
  const c = donnees.chrono;
  if (!c) return;
  if (c.phase === 'travail') {
    const minutes = Math.floor(ecouleMs(c) / 60000);
    if (minutes >= 1) {
      const lectureEnCours = estLecture(trouverEcheance(c.echeanceId));
      const choix = await choisir(lectureEnCours ? `Tu as lu ${minutes} min. On les garde ? (tu noteras ensuite ta page)` : c.examenBlanc ? `Tu as fait ${formaterDuree(minutes)} d'examen blanc. On les garde ?` : `Tu as travaillé ${minutes} min sur ce bloc. On les garde ?`, [
        { valeur: 'garder', texte: lectureEnCours ? 'Garder et noter ma page' : 'Garder ces minutes et arrêter', style: 'principal' },
        { valeur: 'jeter', texte: lectureEnCours ? 'Arrêter sans rien compter' : 'Arrêter sans les garder', style: 'danger' },
        { valeur: null, texte: 'Continuer le bloc' },
      ]);
      if (!choix) return;
      verifierChrono();  // le bloc a pu se terminer pendant qu'on répondait
      if (donnees.chrono !== c) return;
      if (choix === 'garder' && c.phase === 'travail') {
        enregistrerBloc(c, Math.floor(ecouleMs(c) / 60000));
      }
    }
  }
  donnees.chrono = null;
  quitterConcentration();
  sauvegarder();
  majVerrouEcran();
  rafraichir();
  verifierBadges();
}

// Lecture : "J'ai fini mes pages" → le bloc s'arrête tout de suite, avec le vrai temps passé,
// puis la pause commence et on te demande ta page (l'objectif est proposé).
function finirBlocLecture() {
  verifierChrono();
  const c = donnees.chrono;
  const e = c ? trouverEcheance(c.echeanceId) : null;
  if (!c || c.phase !== 'travail' || !estLecture(e)) return;
  const r = donnees.reglages;
  const minutes = Math.max(1, Math.round(ecouleMs(c) / 60000));
  const bloc = enregistrerBloc(c, minutes);
  blocFiniEnAvance = bloc ? bloc.id : null;
  c.blocsSerie += 1;
  const longue = c.blocsSerie % r.blocsAvantPauseLongue === 0;
  c.phase = longue ? 'pauseLongue' : 'pause';
  c.dureeMs = (longue ? r.pauseLongue : r.pauseCourte) * 60000;
  c.debut = Date.now();
  c.dejaEcouleMs = 0;
  sauvegarder();
  quitterConcentration();
  majVerrouEcran();
  rafraichir();
  celebrer(couleurMatiere(e.matiereId));
  vibrer(30);
  afficherToast(`✓ Lecture enregistrée (${minutes} min) · note ta page`);
  verifierBadges();
}

// Lecture : pas fini à temps ? 5 minutes de plus sur ce bloc.
function allongerBlocLecture() {
  verifierChrono();
  const c = donnees.chrono;
  if (!c || c.phase !== 'travail' || !estLecture(trouverEcheance(c.echeanceId))) return;
  c.dureeMs += 5 * 60000;
  sauvegarder();
  rafraichir();
  afficherToast('+5 min de lecture ⏱');
}

function passerPause() {
  verifierChrono();
  const c = donnees.chrono;
  if (!c || c.phase === 'travail') return;
  demarrerBloc(c.echeanceId, c.blocsSerie, c.dureeTravail);
}

function terminerSerie() {
  donnees.chrono = null;
  quitterConcentration();
  sauvegarder();
  majVerrouEcran();
  rafraichir();
}

// Enregistre un bloc de travail fait (il compte ensuite dans le plan),
// puis on te demandera ton ressenti (Facile / Ok / Dur).
function enregistrerBloc(c, minutes) {
  if (minutes <= 0) return null;
  const bloc = {
    id: nouvelId(),
    echeanceId: c.echeanceId,
    matiereId: c.matiereId,
    date: cleDate(new Date(c.debutBloc)),
    debut: c.debutBloc,
    minutes,
    ressenti: null,
    note: '',
  };
  if (c.examenBlanc) bloc.examenBlanc = true;   // V5
  donnees.blocs.push(bloc);
  donnees.aEvaluer = bloc.id;
  brouillonNote = '';
  return bloc;
}

// Ta réponse "Facile / Ok / Dur" (+ la note) sur le dernier bloc.
// (on lit la note dans la carte où tu as appuyé : la question peut être affichée sur 2 écrans)
function noterBloc(valeur, bouton) {
  const b = donnees.blocs.find(x => x.id === donnees.aEvaluer);
  const carte = bouton && bouton.closest('.ressenti');
  const champ = carte && carte.querySelector('.note-bloc');
  const note = (champ ? champ.value : brouillonNote).trim().slice(0, 120);
  donnees.aEvaluer = null;
  brouillonNote = '';
  if (!b) {
    sauvegarder();
    rafraichir();
    return;
  }
  const avant = b.matiereId ? coefMatiere(b.matiereId) : 1;
  b.ressenti = Object.keys(RESSENTIS).includes(valeur) ? valeur : null;
  b.note = note;
  sauvegarder();
  rafraichir();
  const apres = b.matiereId ? coefMatiere(b.matiereId) : 1;
  let message = b.ressenti ? `Noté : ${RESSENTIS[b.ressenti].nom} ${RESSENTIS[b.ressenti].emoji}` : (note ? 'Note enregistrée ✓' : 'OK, sans ressenti');
  if (apres !== avant) message += ` · ${nomMatiere(b.matiereId)} : difficulté × ${formaterDecimal(apres)}`;
  if (blocEstQuestion(b)) message += ' · ajouté à tes questions pour le prof';
  afficherToast(message);
}

// Vérifie si la phase en cours est finie (appelé 2 fois par seconde et au retour dans l'appli).
// La boucle "while" rattrape tout ce qui s'est passé si l'écran était verrouillé longtemps.
// "silencieux" = sans son ni vibration (à l'ouverture de l'appli).
function verifierChrono(silencieux = false) {
  const c = donnees.chrono;
  if (!c) return;
  const r = donnees.reglages;
  let fin = null;
  let blocsEnregistres = 0;
  let securite = 0;
  // Examen blanc : on prévient 15 minutes avant la fin (une seule fois).
  if (c.examenBlanc && c.debut && c.phase === 'travail' && !c.alerte15 && c.dureeMs >= 30 * 60000) {
    const reste = c.dureeMs - ecouleMs(c);
    if (reste > 0 && reste <= 15 * 60000) {
      c.alerte15 = true;
      sauvegarder();
      if (!silencieux) {
        vibrer([150, 100, 150]);
        afficherToast('⏰ Plus que 15 minutes ! Garde du temps pour relire.');
      }
    }
  }
  while (c.debut && c.phase !== 'attente' && ecouleMs(c) >= c.dureeMs && securite++ < 10) {
    const momentFin = c.debut + (c.dureeMs - c.dejaEcouleMs);  // l'heure exacte où la phase s'est finie
    if (c.phase === 'travail' && c.examenBlanc) {   // examen blanc : pas de pause, c'est fini
      enregistrerBloc(c, Math.round(c.dureeMs / 60000));
      blocsEnregistres++;
      donnees.chrono = null;
      fin = 'examen';
      break;
    }
    if (c.phase === 'travail') {
      enregistrerBloc(c, Math.round(c.dureeMs / 60000));
      blocsEnregistres++;
      c.blocsSerie += 1;
      const longue = c.blocsSerie % r.blocsAvantPauseLongue === 0;
      c.phase = longue ? 'pauseLongue' : 'pause';
      c.dureeMs = (longue ? r.pauseLongue : r.pauseCourte) * 60000;
      c.debut = momentFin;   // la pause a commencé à la fin du travail
      c.dejaEcouleMs = 0;
      fin = 'travail';
    } else {
      c.phase = 'attente';
      c.finPause = momentFin;
      c.debut = null;
      c.dejaEcouleMs = 0;
      c.dureeMs = 0;
      fin = 'pause';
    }
  }
  if (!fin) return;
  sauvegarder();
  if (fin === 'travail' || fin === 'examen') quitterConcentration();   // pour répondre "Facile / Ok / Dur"
  if (!silencieux) alerter(fin === 'examen' ? 'travail' : fin);
  if (fin === 'examen') {
    afficherToast('📝 Examen blanc terminé ! Pose ton stylo.');
  } else if (fin === 'travail') {
    afficherToast(`✓ Bloc enregistré ! ${c.phase === 'pauseLongue' ? 'Grande pause' : 'Petite pause'} de ${Math.round(c.dureeMs / 60000)} min`);
  } else if (blocsEnregistres) {
    afficherToast('✓ Bloc enregistré · la pause est finie aussi');
  } else if (!silencieux) {
    afficherToast('Pause terminée ! On reprend ?');  // (pas à l'ouverture de l'appli : la pause peut dater d'hier)
  }
  majVerrouEcran();
  rafraichir();
  if (blocsEnregistres && !silencieux) celebrer(c.matiereId && trouverMatiere(c.matiereId) ? couleurMatiere(c.matiereId) : '#b0abff');
  if (blocsEnregistres) verifierBadges(silencieux);
}

// Son + vibration + flash de l'écran.
function alerter(fin) {
  const r = donnees.reglages;
  if (r.son) jouerSon(fin);
  if (r.vibration && navigator.vibrate) {
    try { navigator.vibrate(fin === 'travail' ? [400, 150, 400, 150, 400] : [250, 120, 250]); } catch (erreur) { /* pas grave */ }
  }
  flasher(fin === 'travail' ? '#34d399' : '#8b93ff');
}

/* ---------- Le son (fabriqué par le navigateur, sans fichier audio) ---------- */

let contexteAudio = null;

// Sur iPhone, le son doit être "débloqué" pendant un appui sur un bouton.
function preparerSon() {
  try {
    const Contexte = window.AudioContext || window.webkitAudioContext;
    if (!Contexte) return;
    if (!contexteAudio) contexteAudio = new Contexte();
    if (contexteAudio.state !== 'running') contexteAudio.resume();
  } catch (erreur) { /* pas de son possible */ }
}

function jouerSon(fin) {
  preparerSon();
  const ctx = contexteAudio;
  if (!ctx) return;
  // Fin du travail : petite mélodie qui monte. Fin de pause : deux notes répétées.
  const notes = fin === 'travail' ? [784, 988, 1175, 784, 988, 1175] : [1175, 880, 1175, 880];
  const depart = ctx.currentTime + 0.05;
  notes.forEach((frequence, i) => {
    const t = depart + i * 0.22;
    const oscillateur = ctx.createOscillator();
    const volume = ctx.createGain();
    oscillateur.type = 'triangle';
    oscillateur.frequency.setValueAtTime(frequence, t);
    volume.gain.setValueAtTime(0.0001, t);
    volume.gain.exponentialRampToValueAtTime(0.35, t + 0.02);
    volume.gain.exponentialRampToValueAtTime(0.0001, t + 0.2);
    oscillateur.connect(volume);
    volume.connect(ctx.destination);
    oscillateur.start(t);
    oscillateur.stop(t + 0.22);
  });
}

/* ---------- Mode concentration : écran noir, juste le temps, la matière et ta dernière note ---------- */

function entrerConcentration() {
  const c = donnees.chrono;
  if (!c || c.phase === 'attente') return;
  concentration = true;
  document.getElementById('concentration').hidden = false;
  document.body.classList.add('bloque');
  majConcentration();
  // Vrai plein écran si le téléphone le permet (Android). Sur iPhone, l'écran noir suffit.
  try {
    const page = document.documentElement;
    if (page.requestFullscreen && !document.fullscreenElement) page.requestFullscreen().catch(() => {});
  } catch (erreur) { /* pas grave */ }
}

function quitterConcentration() {
  if (!concentration) return;
  concentration = false;
  document.getElementById('concentration').hidden = true;
  if (document.getElementById('fond-feuille').hidden) document.body.classList.remove('bloque');
  try {
    if (document.fullscreenElement && document.exitFullscreen) document.exitFullscreen().catch(() => {});
  } catch (erreur) { /* pas grave */ }
}

// Mis à jour 2 fois par seconde (par tic). Se ferme tout seul quand il n'y a plus de bloc ni de pause.
function majConcentration() {
  if (!concentration) return;
  const c = donnees.chrono;
  if (!c || c.phase === 'attente') {
    quitterConcentration();
    return;
  }
  const p = infosPhase(c);
  const phase = document.getElementById('conc-phase');
  phase.textContent = p.libelle;
  phase.style.setProperty('--phase', p.couleur);
  document.getElementById('conc-temps').textContent = formaterChrono(restantMs(c));
  document.getElementById('conc-sujet').textContent = sujetChrono(c);
  const derniere = c.echeanceId ? derniereNote(c.echeanceId) : null;
  document.getElementById('conc-note').textContent = derniere ? `🔖 « ${derniere.note} »` : '';
}

/* ---------- Garder l'écran allumé pendant un bloc (si le téléphone le permet) ---------- */

let verrouEcran = null;
let demandeEnCours = false;

async function majVerrouEcran() {
  if (!('wakeLock' in navigator)) return;
  const c = donnees.chrono;
  const voulu = Boolean(c && c.debut && c.phase !== 'attente' && donnees.reglages.ecranAllume && document.visibilityState === 'visible');
  try {
    if (voulu && !verrouEcran && !demandeEnCours) {
      demandeEnCours = true;
      verrouEcran = await navigator.wakeLock.request('screen');
      verrouEcran.addEventListener('release', () => { verrouEcran = null; });
    } else if (!voulu && verrouEcran) {
      const v = verrouEcran;
      verrouEcran = null;
      await v.release();
    }
  } catch (erreur) {
    verrouEcran = null;
  } finally {
    demandeEnCours = false;
  }
}


/* ---------- Lot 2 : chapitres à cocher (étapes d'un devoir) ---------- */
function trouverChapitre(e, chapitreId) {
  return e && e.chapitresListe ? e.chapitresListe.find(c => c.id === chapitreId) || null : null;
}
// La liste dans le détail d'un test, d'un examen ou d'un devoir.
function blocChapitres(e) {
  if (!e || e.terminee || estLecture(e)) return '';
  const devoir = e.type === 'devoir';
  const liste = e.chapitresListe || [];
  const n = liste.length;
  const faits = liste.filter(c => c.fait).length;
  let h = `<div class="bloc-chapitres" id="bloc-chapitres">
      <h3>${devoir ? 'Étapes du devoir' : 'Chapitres à réviser'}${n ? `<span class="titre-compte">${faits}/${n}</span>` : ''}</h3>`;
  if (n) {
    h += `<ul class="liste-chapitres">${liste.map(c => `<li>
          <label><input type="checkbox" data-chapitre="${c.id}" data-id="${e.id}"${c.fait ? ' checked' : ''}><span>${echapper(c.nom)}</span></label>
          <button class="supprimer-bloc" data-action="supprimer-chapitre" data-id="${e.id}" data-chapitre="${c.id}" type="button" aria-label="Retirer « ${echapper(c.nom)} »">${ic('fermer')}</button>
        </li>`).join('')}</ul>`;
  } else {
    h += `<p class="aide">${devoir ? 'Découpe ton devoir en petites étapes et coche-les au fur et à mesure.' : 'Écris tes chapitres et coche-les quand ils sont révisés : tu verras ce qui reste.'}</p>`;
  }
  if (n < 40) {
    h += `<form class="form-ligne" id="form-chapitre" data-id="${e.id}" novalidate>
        <input type="text" name="nom" maxlength="60" placeholder="${devoir ? 'ex : Faire le plan' : 'ex : Les fractions'}" autocomplete="off" enterkeyhint="done" aria-label="${devoir ? 'Nouvelle étape' : 'Nouveau chapitre'}">
        <button class="btn btn-petit" type="submit">${ic('plus')}Ajouter</button>
      </form>`;
  }
  if (devoir && !n) h += `<button class="lien" data-action="etapes-devoir" data-id="${e.id}" type="button">Proposer des étapes</button>`;
  if (!devoir && n && n !== e.chapitres) {
    h += `<p class="aide aide-sync">Ta liste a ${pluriel(n, 'chapitre')}, ton échéance en compte ${e.chapitres}.
        <button class="lien" data-action="sync-chapitres" data-id="${e.id}" type="button">Compter ${pluriel(n, 'chapitre')} pour le temps d'étude</button></p>`;
  }
  return h + '</div>';
}
// Redessine la liste dans la feuille ouverte (sans la refermer) et l'écran derrière.
function majBlocChapitres(e) {
  const zone = document.getElementById('bloc-chapitres');
  if (zone) zone.outerHTML = blocChapitres(e);
  rafraichir();
}
function cocherChapitre(id, chapitreId, coche) {
  const e = trouverEcheance(id);
  const c = trouverChapitre(e, chapitreId);
  if (!c) return;
  c.fait = coche;
  sauvegarder();
  majBlocChapitres(e);
  if (coche && e.chapitresListe.every(x => x.fait)) afficherToast(e.type === 'devoir' ? 'Toutes les étapes sont faites 🎉' : 'Tous les chapitres sont révisés 🎉');
}
function ajouterChapitre(form) {
  const e = trouverEcheance(form.dataset.id);
  if (!e) return;
  const champ = form.querySelector('input[name="nom"]');
  const nom = String(champ.value || '').trim().replace(/\s+/g, ' ').slice(0, 60);
  if (!nom) {
    champ.focus();
    return;
  }
  if (!e.chapitresListe) e.chapitresListe = [];
  if (e.chapitresListe.length >= 40) return;
  e.chapitresListe.push({ id: nouvelId(), nom, fait: false });
  sauvegarder();
  majBlocChapitres(e);
  const nouveau = document.querySelector('#form-chapitre input[name="nom"]');
  if (nouveau) nouveau.focus();   // pour en taper un autre tout de suite
}
function supprimerChapitre(id, chapitreId) {
  const e = trouverEcheance(id);
  const c = trouverChapitre(e, chapitreId);
  if (!c) return;
  const index = e.chapitresListe.indexOf(c);
  e.chapitresListe.splice(index, 1);
  if (!e.chapitresListe.length) delete e.chapitresListe;
  sauvegarder();
  majBlocChapitres(e);
  proposerAnnulation(`« ${c.nom} » retiré`, () => {
    if (!e.chapitresListe) e.chapitresListe = [];
    e.chapitresListe.splice(Math.min(index, e.chapitresListe.length), 0, c);
    const zone = document.getElementById('bloc-chapitres');
    if (zone) zone.outerHTML = blocChapitres(e);
  });
}
// La liste compte N chapitres mais l'échéance en dit un autre nombre : on aligne (le temps d'étude suit).
function synchroniserChapitres(id) {
  const e = trouverEcheance(id);
  if (!e || !e.chapitresListe || !e.chapitresListe.length) return;
  const avant = { chapitres: e.chapitres, rythme: e.rythme };
  e.chapitres = borner(e.chapitresListe.length, 1, 99);
  e.rythme = null;
  sauvegarder();
  rafraichir();
  ouvrirDetailEcheance(id);
  proposerAnnulation(`${pluriel(e.chapitres, 'chapitre')} comptés · temps d'étude recalculé`, () => {
    Object.assign(e, avant);
    if (!document.getElementById('fond-feuille').hidden && document.querySelector(`#feuille .detail[data-echeance="${e.id}"]`)) ouvrirDetailEcheance(e.id);
  });
}
function proposerEtapes(id) {
  const e = trouverEcheance(id);
  if (!e || (e.chapitresListe && e.chapitresListe.length)) return;
  e.chapitresListe = ['Relire la consigne', 'Chercher les infos', 'Faire le plan', 'Rédiger', 'Relire et mettre au propre']
    .map((nom, k) => ({ id: nouvelId() + k, nom, fait: false }));
  sauvegarder();
  majBlocChapitres(e);
  afficherToast('Étapes ajoutées : modifie-les comme tu veux');
}
// Sur la carte "Comment c'était ?" : cocher en un geste le chapitre qu'on vient de finir.
function chapitresRessenti(e) {
  if (!e || e.terminee || !e.chapitresListe) return '';
  const restants = e.chapitresListe.filter(c => !c.fait);
  if (!restants.length) return '';
  return `<div class="chapitres-ressenti"><p class="aide">${e.type === 'devoir' ? 'Une étape finie ?' : 'Un chapitre révisé ?'} Touche-le pour le cocher :</p>
      <div class="puces">${restants.slice(0, 6).map(c => `<button class="puce-bouton" data-action="chapitre-ressenti" data-id="${e.id}" data-chapitre="${c.id}" type="button">${ic('check')}${echapper(c.nom)}</button>`).join('')}</div>
    </div>`;
}
function cocherChapitreRessenti(id, chapitreId) {
  const e = trouverEcheance(id);
  const c = trouverChapitre(e, chapitreId);
  if (!c || c.fait) return;
  c.fait = true;
  sauvegarder();
  rafraichir();
  proposerAnnulation(`✓ « ${c.nom} » coché`, () => { c.fait = false; });
}

/* ---------- Lot 2 : questions pour le prof ----------
   Un bloc noté « Dur » avec une note = un point à demander au prof (tant que le test n'est pas passé).
   On peut aussi ajouter une question à la main. « Compris » la range. */
function blocEstQuestion(b, d = donnees, jour = aujourdhui()) {
  if (!b || b.ressenti !== 'dur' || !String(b.note || '').trim() || b.compris) return false;
  if (!b.echeanceId) return b.date >= ajouterJours(jour, -30);
  const e = d.echeances.find(x => x.id === b.echeanceId);
  return Boolean(e) && !e.terminee && e.date >= jour;
}
function questionsOuvertes(d = donnees) {
  const jour = aujourdhui();
  const liste = d.blocs.filter(b => blocEstQuestion(b, d, jour)).map(b => {
    const e = b.echeanceId ? d.echeances.find(x => x.id === b.echeanceId) : null;
    return { source: 'bloc', id: b.id, matiereId: e ? e.matiereId : b.matiereId, texte: b.note.trim(), date: b.date, origine: e ? `bloc « Dur » · ${nomEcheanceCourt(e, jour)}` : 'bloc « Dur »' };
  });
  for (const q of d.questions) {
    if (!q.resolue) liste.push({ source: 'question', id: q.id, matiereId: q.matiereId, texte: q.texte, date: q.date, origine: 'ta question' });
  }
  return liste.sort((a, b) => (a.date < b.date ? 1 : a.date > b.date ? -1 : 0));
}
function ligneQuestion(q) {
  return `<li>
      <span class="texte">${echapper(q.texte)}<small>${capitaliser(dateCourte(q.date))} · ${echapper(q.origine)}</small></span>
      <button class="btn btn-petit" data-action="question-comprise" data-id="${q.id}" data-source="${q.source}" type="button">${ic('check')}Compris</button>
    </li>`;
}
// Sur l'écran Échéances : une carte s'il y a des questions, sinon un petit lien pour en noter une.
function carteQuestions() {
  const liste = questionsOuvertes();
  if (!liste.length) return `<button class="lien" data-action="ajouter-question" type="button">Une question pour le prof ? Note-la ici</button>`;
  return `<button class="carte carte-questions" data-action="questions" type="button">
      <span class="illu-petite">${ic('cerveau')}</span>
      <span class="texte"><strong>Questions pour le prof (${liste.length})</strong><small>${liste.slice(0, 2).map(q => `« ${echapper(raccourcir(q.texte, 60))} »`).join(' · ')}</small></span>
      ${ic('chevron')}
    </button>`;
}
function ouvrirQuestions() {
  const liste = questionsOuvertes();
  const groupes = new Map();
  for (const q of liste) {
    const cle = q.matiereId && trouverMatiere(q.matiereId) ? q.matiereId : '';
    if (!groupes.has(cle)) groupes.set(cle, []);
    groupes.get(cle).push(q);
  }
  const ordre = [...groupes.keys()].sort((a, b) => (a === '' ? 1 : b === '' ? -1 : nomMatiere(a).localeCompare(nomMatiere(b), 'fr')));
  let h = `<div class="detail feuille-questions">
      <h2>Questions pour le prof</h2>
      <p class="aide" style="margin:-6px 0 8px">Ce qui t'a paru « Dur » (avec une note) et tes questions. Pose-les en classe, puis touche « Compris ».</p>`;
  if (!liste.length) h += `<p class="aide">Rien pour l'instant 👍 Quand un bloc est « Dur », écris ce qui bloque dans la note : ça arrive ici.</p>`;
  for (const cle of ordre) {
    h += `<section class="groupe-questions" style="${cle ? styleMatiere(cle) : styleCouleur('#b0abff')}">
        <h3><span class="rond"></span>${echapper(cle ? nomMatiere(cle) : 'Sans matière')}</h3>
        <ul class="liste-questions">${groupes.get(cle).map(ligneQuestion).join('')}</ul>
      </section>`;
  }
  h += `<div class="pile" style="margin-top:18px">
      <button class="btn btn-principal btn-plein" data-action="ajouter-question" type="button">${ic('plus')} Ajouter une question</button>
      <button class="btn btn-plein" data-action="fermer" type="button">Fermer</button>
    </div>
  </div>`;
  ouvrirFeuille(h);
}
// Dans le détail d'une échéance : les questions de cette matière.
function blocQuestionsMatiere(matiereId) {
  const liste = questionsOuvertes().filter(q => q.matiereId === matiereId);
  if (!liste.length) return '';
  return `<section class="groupe-questions">
      <h3>Questions pour le prof</h3>

}
function marquerQuestionComprise(id, source, bouton) {
  let defaire;

    const q = donnees.questions.find(x => x.id === id);

    q.resolue = aujourdhui();
    defaire = () => { q.resolue = null; };

  sauvegarder();

  const ligne = bouton && bouton.closest('li');

  if (ligne) ligne.remove();

  rafraichir();
  proposerAnnulation('✓ Compris ! Question rangée', () => {
    defaire();
    if (document.getElementById('fond-feuille').hidden) return;
    const detail = document.querySelector('#feuille .detail[data-echeance]');
    if (document.querySelector('#feuille .feuille-questions')) ouvrirQuestions();

}

function conseilMethode(c, e) {

let brouillonFiche = null;   // la fiche en cours d'écriture (gardée si la feuille se ferme par erreur)
function apercuFiche(e) {

    .map(([cle, nom]) => `<div class="fiche-champ"><strong>${nom}</strong><p>${echapper(e.fiche[cle].trim())}</p></div>`).join('');
}
function ouvrirFormFiche(id, retour = '') {
  const e = trouverEcheance(id);
  if (!estLecture(e)) return;

function majBrouillonFiche(form) {
  const f = new FormData(form);

/* ---------- Lot 3 : raccourcis de l'icône (appui long sur l'icône de l'appli, Android) ----------
   Le manifeste propose « Lancer un bloc », « J'ai lu » et « Ajouter une échéance » :
   l'appli s'ouvre alors avec ?action=… dans l'adresse. */
function actionRaccourci() {
  let action = null;
  try {
    action = new URLSearchParams(location.search).get('action');
    if (action) history.replaceState(null, '', location.pathname + location.hash);   // pas de 2e fois si on recharge
  } catch (erreur) { /* pas grave */ }
  if (action === 'lancer') raccourciLancer();
  else if (action === 'j-ai-lu') raccourciLecture();
  else if (action === 'ajouter') ouvrirFormEcheance(null);
}
function raccourciLancer() {
  const c = donnees.chrono;
  if (c && c.phase !== 'attente') {
    afficherVue('chrono');
    return;
  }
  const plan = planActuel();
  const suivante = plan.lignesDuJour.find(l => l.prevus > l.faits);
  if (suivante) {
    lancerDepuisPlan(suivante.info.echeance.id);
    return;
  }
  afficherVue('chrono');
  afficherToast("Rien de prévu maintenant : choisis ton sujet et démarre");
}
function raccourciLecture() {
  const plan = planActuel();
  const livres = donnees.echeances
    .filter(e => estLecture(e) && !e.terminee && pagesLues(e) < pagesTotal(e))
    .sort((a, b) => (a.date < b.date ? -1 : a.date > b.date ? 1 : 0));
  const duJour = plan.lignesDuJour.map(l => l.info.echeance).find(e => livres.includes(e));
  const livre = duJour || livres[0];
  if (!livre) {
    afficherVue('echeances');
    afficherToast('Pas de livre en cours : ajoute une lecture 📖');
    return;
  }
  ouvrirFormLecture(livre.id);
}

    choixChrono = t.value;
    const zone = document.getElementById('chrono-repos');
    const couleur = getComputedStyle(t.closest('.option-sujet')).getPropertyValue('--couleur').trim();
    if (zone && couleur) zone.style.setProperty('--phase', couleur);
    const nom = document.getElementById('repos-sujet');
    if (nom) nom.textContent = t.closest('.option-sujet').querySelector('strong').textContent;
  }
  if (t.id === 'fichier-import' && t.files && t.files[0]) {
    importerFichier(t.files[0]);
    t.value = '';
  }
  if (t.dataset.reglage) {
    donnees.reglages[t.dataset.reglage] = t.checked;
    sauvegarder();
    majVerrouEcran();
  }
});
document.addEventListener('toggle', ev => {
  if (ev.target.matches && ev.target.matches('details.passees')) passeesOuvertes = ev.target.open;
  if (ev.target.matches && ev.target.matches('details.avance')) avanceOuvert = ev.target.open;
  if (ev.target.matches && ev.target.matches('details.chiffres')) {
    if (ev.target.open) chiffresOuverts.add(ev.target.dataset.cle);
    else chiffresOuverts.delete(ev.target.dataset.cle);
  }
}, true);

// Les graphiques sont dessinés à la largeur de l'écran : on les redessine si elle change.
let minuteurTaille = null;
window.addEventListener('resize', () => {
  clearTimeout(minuteurTaille);
  minuteurTaille = setTimeout(() => { if (vueActive === 'stats') afficherStats(); }, 200);
});

// Toucher le fond sombre ferme la feuille.
document.getElementById('fond-feuille').addEventListener('click', ev => {
  if (ev.target.id === 'fond-feuille') fermerFeuille();
});

// Pendant un chrono, chaque appui "débloque" le son (nécessaire sur iPhone).
document.addEventListener('touchend', () => { if (donnees.chrono) preparerSon(); }, { passive: true });

// Le "battement" de l'appli : 2 fois par seconde.
let dernierJour = aujourdhui();
function tic() {
  verifierChrono();
  majAffichageChrono();
  majOngletChrono();
  majConcentration();
  const jour = aujourdhui();
  if (jour !== dernierJour) {  // on a passé minuit : on recalcule le plan
    dernierJour = jour;
    rafraichir();
  }
}

// Quand on revient dans l'appli (écran déverrouillé, changement d'appli…).
document.addEventListener('visibilitychange', () => {
  if (document.visibilityState === 'visible') tic();
  majVerrouEcran();
});
window.addEventListener('pageshow', tic);

// Si l'appli est ouverte dans un autre onglet et que les données changent là-bas.
window.addEventListener('storage', ev => {
  if (ev.key === CLE_STOCKAGE) {
    charger();
    rafraichir();
  }
});

// ---- Démarrage ----
charger();
verifierChrono(true);
// Une "pause terminée" d'un autre jour n'a plus d'intérêt : on l'oublie.
const ancien = donnees.chrono;
if (ancien && ancien.phase === 'attente' && cleDate(new Date(ancien.finPause || 0)) !== aujourdhui()) {
  donnees.chrono = null;
  sauvegarder();
}
// Badges : ceux que ton travail a déjà mérités (avec la V3, on les retrouve pour tes anciens blocs).
const nouveauxBadges = verifierBadges(migrationFaite);
if (migrationFaite) {
  const n = nouveauxBadges.length;
  setTimeout(() => afficherToast(`✨ Nouvelle version ! Tes données sont gardées${n ? ` · 🏅 ${pluriel(n, 'badge')} débloqué${n > 1 ? 's' : ''} grâce à ton travail` : ''}`), 400);
}
// On ouvre sur le chrono seulement si un bloc ou une pause est en cours.
afficherVue(donnees.chrono && donnees.chrono.phase !== 'attente' ? 'chrono' : 'aujourdhui');
actionRaccourci();   // V6 : ouverte depuis un raccourci de l'icône ?
majVerrouEcran();
setInterval(tic, 500);
</script>
</body>
