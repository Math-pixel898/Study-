}

function resumeBlocsDuJour() {
  const jour = aujourdhui();
  const blocs = donnees.blocs.filter(b => b.date === jour);
  if (!blocs.length) return `<p class="aide centre" style="margin-top:20px">Aucun bloc terminé aujourd'hui pour l'instant.</p>`;
  const total = blocs.reduce((somme, b) => somme + b.minutes, 0);
  const lignes = blocs.slice().reverse().map(b => {
    const e = b.echeanceId ? trouverEcheance(b.echeanceId) : null;
    const nom = e ? nomEcheanceCourt(e, jour) : (b.matiereId ? nomMatiere(b.matiereId) : 'Étude libre');
    const ressenti = b.ressenti ? ` · ${RESSENTIS[b.ressenti].emoji} ${RESSENTIS[b.ressenti].nom}` : '';
    const note = b.note ? ` · « ${echapper(b.note)} »` : '';
    return `<li style="--couleur:${b.matiereId ? couleurMatiere(b.matiereId) : 'var(--accent)'}">
        <span class="rond"></span>
        <span class="texte">${echapper(nom)}<small>${heure(b.debut)} · ${b.minutes} min${ressenti}${note}</small></span>
        <button class="supprimer-bloc" data-action="supprimer-bloc" data-id="${b.id}" type="button" aria-label="Supprimer ce bloc">×</button>
      </li>`;
  }).join('');
  return `<section class="carte" style="margin-top:18px">
      <div class="carte-titre"><h2>Fait aujourd'hui</h2><span class="etiquette">${pluriel(blocs.length, 'bloc')} · ${formaterDuree(total)}</span></div>
      <ul class="liste-faits">${lignes}</ul>
    </section>`;
}

// Mise à jour du gros chrono (appelée 2 fois par seconde, sans tout redessiner).
function majAffichageChrono() {
  const c = donnees.chrono;
  const temps = document.getElementById('chrono-temps');
  const anneau = document.getElementById('anneau');
  if (!c || !temps || !anneau) return;
  const circonference = 339.292;  // 2 × π × 54
  if (c.phase === 'attente') {
    temps.textContent = 'Prêt ?';
    temps.classList.add('petit');
    anneau.style.strokeDashoffset = 0;
    return;
  }
  const reste = restantMs(c);
  temps.textContent = formaterChrono(reste);
  temps.classList.remove('petit');
  anneau.style.strokeDashoffset = circonference * (1 - (c.dureeMs > 0 ? reste / c.dureeMs : 0));
}

// Onglet "Chrono" : affiche le temps restant quand un chrono tourne (+ titre de la page).
function majOngletChrono() {
  const c = donnees.chrono;
  const bouton = document.getElementById('onglet-chrono');
  const texte = document.getElementById('onglet-chrono-texte');
  const bandeau = document.getElementById('bandeau-temps');
  if (c && c.phase !== 'attente') {
    const temps = formaterChrono(restantMs(c));
    const p = infosPhase(c);
    texte.textContent = temps;
    bouton.classList.add('chrono-actif');
    bouton.style.setProperty('--phase', p.couleur);
    if (bandeau) bandeau.textContent = temps;
    document.title = `${temps} · ${p.libelle} – Plan d'étude`;
  } else {
    texte.textContent = 'Chrono';
    bouton.classList.remove('chrono-actif');
    document.title = "Plan d'étude";
  }
}

// Une ligne de réglage avec des boutons − et +.
function ligneReglage(chemin, libelle, precision, pas, min, max, format) {
  const valeur = lireChemin(donnees.reglages, chemin);
  return `<div class="ligne-reglage">
      <div class="libelle">${libelle}${precision ? `<small>${precision}</small>` : ''}</div>
      <div class="stepper" data-chemin="${chemin}" data-pas="${pas}" data-min="${min}" data-max="${max}">
        <button type="button" data-action="moins" aria-label="Diminuer ${libelle}">−</button>
        <output>${formaterValeur(valeur, format)}</output>
        <button type="button" data-action="plus" aria-label="Augmenter ${libelle}">+</button>
      </div>
    </div>`;
}

function ligneInterrupteur(chemin, libelle, precision) {
  return `<label class="ligne-reglage">
      <span class="libelle">${libelle}${precision ? `<small>${precision}</small>` : ''}</span>
      <span class="interrupteur"><input type="checkbox" data-reglage="${chemin}"${donnees.reglages[chemin] ? ' checked' : ''}><span></span></span>
    </label>`;
}

function formaterValeur(v, format) {
  if (format === 'duree') return formaterDuree(v);
  if (format === 'min') return `${v} min`;
  if (format === 'blocs') return pluriel(v, 'bloc');
  if (format === 'avant') return `${v} j avant`;
  if (format === 'plusjours') return `+${v} j`;
  if (format === 'fois') return `× ${formaterDecimal(v)}`;
  return formaterDecimal(v);
}

function changerReglage(bouton, sens) {
  const s = bouton.closest('.stepper');
  const pas = Number(s.dataset.pas);
  const valeur = lireChemin(donnees.reglages, s.dataset.chemin) + sens * pas;
  const arrondie = Math.round(valeur * 100) / 100;
  ecrireChemin(donnees.reglages, s.dataset.chemin, borner(arrondie, Number(s.dataset.min), Number(s.dataset.max)));
  sauvegarder();
  afficherReglages();
}

/* ---------- Installer l'appli sur le téléphone ---------- */

let invitationInstall = null;  // fournie par Chrome (Android / ordinateur) quand l'appli est installable

function appliInstallee() {
  return window.matchMedia('(display-mode: standalone)').matches || navigator.standalone === true;
}

function carteInstaller() {
  if (appliInstallee()) return '';
  let corps;
  if (location.protocol === 'file:') {
    corps = `<p class="aide">Tu as ouvert le <strong>fichier</strong> directement : impossible de l'installer comme ça. Ouvre l'<strong>adresse web</strong> de l'appli (qui commence par https://).</p>`;
  } else if (!window.isSecureContext) {
    corps = `<p class="aide">L'adresse doit commencer par <strong>https://</strong> pour pouvoir installer l'appli.</p>`;
  } else if (invitationInstall) {
    corps = `<div class="pile"><button class="btn btn-principal btn-plein" data-action="installer" type="button">Installer l'application</button></div>`;
  } else if (estIphone()) {
    corps = `<ol><li>Ouvre cette page dans <strong>Safari</strong> (pas dans une autre appli).</li>
        <li>Touche le bouton <strong>Partager</strong> (le carré avec une flèche vers le haut).</li>
        <li>Choisis <strong>« Sur l'écran d'accueil »</strong>, puis <strong>Ajouter</strong>.</li></ol>
        <p class="attention">Sur iPhone, l'appli installée a ses propres données : elles ne reprennent pas celles vues dans Safari.</p>`;
  } else {
    corps = `<ol><li>Ouvre cette page dans <strong>Chrome</strong>.</li>
        <li>Touche le menu <strong>⋮</strong> (en haut à droite).</li>
        <li>Choisis <strong>« Installer l'application »</strong> (ou « Ajouter à l'écran d'accueil »).</li></ol>
        <p class="aide">Pas d'option d'installation ? Recharge la page, attends quelques secondes et regarde à nouveau le menu.</p>`;
  }
  return `<section class="carte installer"><h2>📲 Installer l'appli</h2>${corps}</section>`;
}

async function installerAppli() {
  const invitation = invitationInstall;
  if (!invitation) return;
  invitationInstall = null;
  invitation.prompt();
  try {
    const choix = await invitation.userChoice;
    afficherToast(choix.outcome === 'accepted' ? 'Installation en cours…' : 'Installation annulée');
  } catch (erreur) { /* pas grave */ }
  if (vueActive === 'reglages') afficherReglages();
}

// Chrome prévient l'appli quand elle peut être installée.
window.addEventListener('beforeinstallprompt', ev => {
  ev.preventDefault();
  invitationInstall = ev;
  if (vueActive === 'reglages') afficherReglages();
});
window.addEventListener('appinstalled', () => {
  invitationInstall = null;
  afficherToast('Appli installée ✓');
  if (vueActive === 'reglages') afficherReglages();
});

// Le service worker (fichier sw.js) garde l'appli en mémoire : installation + mode hors ligne.
// Il ne fonctionne qu'avec une adresse https:// (pas quand on ouvre le fichier directement).
if ('serviceWorker' in navigator && location.protocol.startsWith('http')) {
  window.addEventListener('load', () => { navigator.serviceWorker.register('sw.js').catch(() => {}); });
}

/* ---------- La feuille qui monte du bas ---------- */

let minuteurFeuille = null;

function ouvrirFeuille(html) {

/* ---------- Boîte de confirmation ---------- */

// Affiche un message et des boutons ; renvoie (plus tard) la valeur du bouton choisi.
function choisir(message, options) {
  return new Promise(resolve => {
    const fond = document.getElementById('fond-dialogue');
    fond.innerHTML = `<div class="dialogue" role="alertdialog" aria-modal="true" aria-label="Confirmation">
        <p>${echapper(message)}</p>
        <div class="pile">${options.map((o, i) => `<button class="btn btn-plein${o.style ? ' btn-' + o.style : ''}" data-choix="${i}" type="button">${echapper(o.texte)}</button>`).join('')}</div>
      </div>`;
    fond.hidden = false;
    const echap = ev => { if (ev.key === 'Escape') fermer(null); };
    function fermer(valeur) {
      fond.hidden = true;
      fond.innerHTML = '';
      fond.onclick = null;
      document.removeEventListener('keydown', echap);
      resolve(valeur);
    }
    document.addEventListener('keydown', echap);
    fond.onclick = ev => {
      const bouton = ev.target.closest('[data-choix]');
      if (bouton) fermer(options[Number(bouton.dataset.choix)].valeur);
      else if (ev.target === fond) fermer(null);
    };
  });
}

async function confirmer(message, texteOui, danger = false) {
  const reponse = await choisir(message, [
    { valeur: true, texte: texteOui, style: danger ? 'danger-plein' : 'principal' },
    { valeur: false, texte: 'Annuler' },
  ]);
  return reponse === true;
}

function erreurForm(message) {
  const p = document.getElementById('erreur-form');
  if (!p) return;
  p.textContent = message;
  p.hidden = false;
  p.scrollIntoView({ block: 'nearest', behavior: 'smooth' });
}

      ${statutEcheance(e, plan)}
      ${active ? `<div class="pile" style="margin-top:14px"><button class="btn btn-lancer btn-plein" data-action="lancer" data-id="${e.id}" type="button">${ICONES.lecture} Lancer un bloc</button></div>` : ''}

function remettreDansPlan(id) {

// Affiche en direct le temps d'étude estimé pendant qu'on remplit le formulaire.
function majEstimation() {
  const form = document.getElementById('form-echeance');
  if (!form) return;
  const f = new FormData(form);
  const r = donnees.reglages;
  const e = {
    matiereId: f.get('matiere'),
    type: f.get('type') === 'examen' ? 'examen' : 'test',
    niveau: Number(f.get('niveau')) || 1,
    chapitres: Math.max(0, parseInt(f.get('chapitres'), 10) || 0),
    date: f.get('date'),
    travail: Object.keys(TRAVAUX).includes(f.get('travail')) ? f.get('travail') : 'mixte',
  };
  const coef = e.matiereId ? coefMatiere(e.matiereId) : 1;
  const minutes = tempsEstime(e, r, coef);
  let texte = `Temps d'étude estimé : <strong>${formaterDuree(minutes)}</strong> (${pluriel(blocsPour(minutes, r.travail), 'bloc')} de ${r.travail} min)`;
  if (coef !== 1) texte += `<div class="aide">Ta difficulté perso en ${echapper(nomMatiere(e.matiereId))} (× ${formaterDecimal(coef)}) est comptée.</div>`;
  if (e.travail === 'parcoeur') texte += `<div class="aide">Par cœur : petits morceaux, 1 bloc par jour, sur plus de jours.</div>`;
  if (e.travail === 'exercices') texte += `<div class="aide">Exercices : séances d'au moins ${pluriel(r.blocsParSession, 'bloc')} d'affilée.</div>`;
  if (estCleDate(e.date)) {
    const jour = aujourdhui();
    const debut = ajouterJours(e.date, -dureeFenetre(e, r));
    if (e.date <= jour) texte += `<div class="aide">⚠️ Cette date est aujourd'hui ou déjà passée : rien ne sera planifié.</div>`;
    else texte += `<div class="aide">Révisions ${debut > jour ? `à partir du ${dateLongue(debut)}` : "dès aujourd'hui"}, jusqu'à la veille.</div>`;
  }
  document.getElementById('estimation').innerHTML = texte;
}

function changerChapitres(sens) {
  const champ = document.querySelector('#form-echeance input[name="chapitres"]');

function enregistrerEcheance(form) {
  const f = new FormData(form);
  const matiereId = f.get('matiere');
  const date = f.get('date');
  const chapitres = parseInt(f.get('chapitres'), 10);
  if (!matiereId) return erreurForm('Choisis une matière.');
  if (!estCleDate(date)) return erreurForm('Choisis une date.');
  if (!(chapitres >= 1 && chapitres <= 99)) return erreurForm('Le nombre de chapitres doit être entre 1 et 99.');

  const valeurs = {
    matiereId,
    type: f.get('type') === 'examen' ? 'examen' : 'test',
    date,
    niveau: borner(Number(f.get('niveau')) || 2, 1, 4),
    chapitres,
    note: String(f.get('note') || '').trim(),
    travail: Object.keys(TRAVAUX).includes(f.get('travail')) ? f.get('travail') : 'mixte',
  };
  const id = form.dataset.id;
  if (id) {
    const e = trouverEcheance(id);
    // Si ce qui compte pour le plan change, on repart d'un rythme neuf (pas de faux retard).
    const change = ['matiereId', 'type', 'date', 'niveau', 'chapitres', 'travail'].some(cle => e[cle] !== valeurs[cle]);
    Object.assign(e, valeurs);
    if (change) e.rythme = null;
  } else {
    donnees.echeances.push({ id: nouvelId(), ...valeurs, terminee: false, termineeLe: null, rythme: null });
  }
  sauvegarder();
  fermerFeuille();
  rafraichir();
  afficherToast(date <= aujourdhui() ? 'Enregistré (attention : date passée)' : (id ? 'Échéance modifiée ✓' : 'Échéance ajoutée ✓'));
}

function enregistrerMatiere(form) {
  const f = new FormData(form);
  const nom = String(f.get('nom') || '').trim().replace(/\s+/g, ' ');
  const couleur = /^#[0-9a-f]{6}$/i.test(f.get('couleur')) ? f.get('couleur') : PALETTE[0].code;
  const id = form.dataset.id;
  if (!nom) return erreurForm('Donne un nom à la matière.');
  if (donnees.matieres.some(m => m.id !== id && m.nom.toLowerCase() === nom.toLowerCase())) return erreurForm('Cette matière existe déjà.');

  let idFinal = id;
  if (id) {
    Object.assign(trouverMatiere(id), { nom, couleur });
  } else {
    idFinal = nouvelId();
    donnees.matieres.push({ id: idFinal, nom, couleur });
  }
  sauvegarder();
  rafraichir();
  if (form.dataset.puisEcheance) {
    ouvrirFormEcheance(null, { matiereId: idFinal });
  } else {
    fermerFeuille();
    afficherToast(id ? 'Matière modifiée ✓' : 'Matière ajoutée ✓');
  }
}

async function supprimerMatiere(id) {
  const m = trouverMatiere(id);
  if (!m) return;
  const liees = donnees.echeances.filter(e => e.matiereId === id).length;
  const message = liees
    ? `Supprimer « ${m.nom} » ? ${liees > 1 ? `Ses ${liees} échéances seront aussi supprimées.` : 'Son échéance sera aussi supprimée.'}`
    : `Supprimer la matière « ${m.nom} » ?`;
  if (!(await confirmer(message, 'Supprimer', true))) return;
  donnees.matieres = donnees.matieres.filter(x => x.id !== id);
  donnees.echeances = donnees.echeances.filter(e => e.matiereId !== id);
  sauvegarder();
  fermerFeuille();
  rafraichir();
  afficherToast('Matière supprimée');
}

/* ---------- Sauvegarde dans un fichier : exporter / importer ---------- */

// Le contenu du fichier : tout ce qui compte (pas le chrono en cours).
function contenuExport() {
  return {
    application: "Plan d'étude",
    format: VERSION_DONNEES,
    exporteLe: new Date().toISOString(),
    matieres: donnees.matieres,
    echeances: donnees.echeances,
    blocs: donnees.blocs,
    reglages: donnees.reglages,
  };
}

async function exporterDonnees() {
  const texte = JSON.stringify(contenuExport(), null, 2);
  const nom = `plan-etude-sauvegarde-${aujourdhui()}.json`;
  const fichier = new File([texte], nom, { type: 'application/json' });
  // Sur iPhone, le menu "Partager" est le plus sûr (→ "Enregistrer dans Fichiers").
  if (estIphone() && navigator.canShare && navigator.canShare({ files: [fichier] })) {
    try {
      await navigator.share({ files: [fichier], title: nom });
      afficherToast('Sauvegarde prête ✓');
    } catch (erreur) { /* partage annulé */ }
    return;
  }
  const url = URL.createObjectURL(fichier);
  const lien = document.createElement('a');
  lien.href = url;
  lien.download = nom;
  document.body.appendChild(lien);
  lien.click();
  lien.remove();
  setTimeout(() => URL.revokeObjectURL(url), 30000);
  afficherToast('Sauvegarde téléchargée ✓');
}

async function importerFichier(fichier) {
  let lu = null;
  try {
    lu = JSON.parse(await fichier.text());
  } catch (erreur) {
    lu = null;
  }
  if (!lu || typeof lu !== 'object' || !Array.isArray(lu.matieres) || !Array.isArray(lu.echeances)) {
    afficherToast("⚠️ Ce fichier n'est pas une sauvegarde de Plan d'étude");
    return;
  }
  const date = new Date(lu.exporteLe);
  const quand = isNaN(date) ? '' : ` du ${dateLongue(cleDate(date))}`;
  const resume = `${pluriel(lu.matieres.length, 'matière')}, ${pluriel(lu.echeances.length, 'échéance')}, ${pluriel((lu.blocs || []).length, 'bloc')}`;
  const ok = await confirmer(`Remplacer toutes tes données actuelles par la sauvegarde${quand} (${resume}) ? Tes données actuelles seront écrasées.`, 'Remplacer mes données', true);
  if (!ok) return;
  const chrono = donnees.chrono;
  donnees = normaliser(lu);   // mêmes vérifications que pour le localStorage (+ migration si c'est un vieux fichier)
  if (chrono && (!chrono.echeanceId || trouverEcheance(chrono.echeanceId))) donnees.chrono = chrono;
  sauvegarder();
  majVerrouEcran();
  afficherVue('aujourdhui');
  afficherToast('Données importées ✓');
}


/* =====================================================================
   7. CHRONO POMODORO
   Le chrono ne compte PAS les secondes une par une. Il retient l'heure
   de départ (Date.now()) et calcule : temps écoulé = maintenant − départ.
   Comme ça il reste juste même si l'écran se verrouille ou si l'appli
   est fermée : à ton retour, il se recale tout seul.
   ===================================================================== */

// Temps écoulé dans la phase en cours (en millisecondes).
function ecouleMs(c) {
  return c.dejaEcouleMs + (c.debut ? Date.now() - c.debut : 0);
}

function restantMs(c) {
  return Math.max(0, c.dureeMs - ecouleMs(c));
}

function infosPhase(c) {
  if (c.phase === 'attente') return { libelle: 'Pause terminée', couleur: 'var(--accent)' };
  if (!c.debut) return { libelle: 'En pause', couleur: 'var(--texte-2)' };
  if (c.phase === 'travail') return { libelle: 'Travail', couleur: 'var(--travail)' };
  if (c.phase === 'pauseLongue') return { libelle: 'Grande pause', couleur: 'var(--pause-longue)' };
  return { libelle: 'Petite pause', couleur: 'var(--pause)' };
}

function sujetChrono(c) {
  const e = c.echeanceId ? trouverEcheance(c.echeanceId) : null;
  if (e) return nomEcheanceCourt(e);
  return c.matiereId && trouverMatiere(c.matiereId) ? nomMatiere(c.matiereId) : 'Étude libre';
}

// Bouton "Lancer" du plan du jour (ou du détail d'une échéance).
function lancerDepuisPlan(echeanceId) {
  fermerFeuille();
  const c = donnees.chrono;
  if (c && c.phase !== 'attente') {
    afficherToast('Un bloc est déjà en cours ⏱');
    afficherVue('chrono');
    return;
  }
  demarrerBloc(echeanceId, c ? c.blocsSerie : 0);
}

function demarrerBloc(echeanceId, blocsSerie = 0) {
  preparerSon();
  const e = echeanceId ? trouverEcheance(echeanceId) : null;
  const maintenant = Date.now();
  donnees.chrono = {
    phase: 'travail',
    echeanceId: e ? e.id : null,
    matiereId: e ? e.matiereId : null,
    dureeMs: donnees.reglages.travail * 60000,
    debut: maintenant,     // heure de départ (null quand le chrono est en pause)
    dejaEcouleMs: 0,       // temps déjà écoulé avant une pause
    debutBloc: maintenant, // pour enregistrer la date du bloc
    blocsSerie,            // blocs déjà terminés dans cette série
  };
  if (e) choixChrono = e.id;
  sauvegarder();
  majVerrouEcran();
  afficherVue('chrono');
}

function mettreEnPause() {
  verifierChrono();
  const c = donnees.chrono;
  if (!c || !c.debut || c.phase === 'attente') return;
  c.dejaEcouleMs = ecouleMs(c);
  c.debut = null;
  sauvegarder();
  majVerrouEcran();
  rafraichir();
}

function reprendre() {
  preparerSon();
  const c = donnees.chrono;
  if (!c || c.debut || c.phase === 'attente') return;
  c.debut = Date.now();
  sauvegarder();
  majVerrouEcran();
  rafraichir();
}

async function arreter() {
  verifierChrono();
  const c = donnees.chrono;
  if (!c) return;
  if (c.phase === 'travail') {
    const minutes = Math.floor(ecouleMs(c) / 60000);
    if (minutes >= 1) {
      const choix = await choisir(`Tu as travaillé ${minutes} min sur ce bloc. On les garde ?`, [
        { valeur: 'garder', texte: 'Garder ces minutes et arrêter', style: 'principal' },
        { valeur: 'jeter', texte: 'Arrêter sans les garder', style: 'danger' },
        { valeur: null, texte: 'Continuer le bloc' },
      ]);
      if (!choix) return;
      verifierChrono();  // le bloc a pu se terminer pendant qu'on répondait
      if (donnees.chrono !== c) return;
      if (choix === 'garder' && c.phase === 'travail') {
        enregistrerBloc(c, Math.floor(ecouleMs(c) / 60000));
      }
    }
  }
  donnees.chrono = null;
  sauvegarder();
  majVerrouEcran();
  rafraichir();
}

function passerPause() {
  verifierChrono();
  const c = donnees.chrono;
  if (!c || c.phase === 'travail') return;
  demarrerBloc(c.echeanceId, c.blocsSerie);
}

function terminerSerie() {
  donnees.chrono = null;
  sauvegarder();
  majVerrouEcran();
  rafraichir();
}

// Enregistre un bloc de travail fait (il compte ensuite dans le plan),
// puis on te demandera ton ressenti (Facile / Ok / Dur).
function enregistrerBloc(c, minutes) {
  if (minutes <= 0) return null;
  const bloc = {
    id: nouvelId(),
    echeanceId: c.echeanceId,
    matiereId: c.matiereId,
    date: cleDate(new Date(c.debutBloc)),
    debut: c.debutBloc,
    minutes,
    ressenti: null,
    note: '',
  };
  donnees.blocs.push(bloc);
  donnees.aEvaluer = bloc.id;
  brouillonNote = '';
  return bloc;
}

// Ta réponse "Facile / Ok / Dur" (+ la note) sur le dernier bloc.
// (on lit la note dans la carte où tu as appuyé : la question peut être affichée sur 2 écrans)
function noterBloc(valeur, bouton) {
  const b = donnees.blocs.find(x => x.id === donnees.aEvaluer);
  const carte = bouton && bouton.closest('.ressenti');
  const champ = carte && carte.querySelector('.note-bloc');
  const note = (champ ? champ.value : brouillonNote).trim().slice(0, 120);
  donnees.aEvaluer = null;
  brouillonNote = '';
  if (!b) {
    sauvegarder();
    rafraichir();
    return;
  }
  const avant = b.matiereId ? coefMatiere(b.matiereId) : 1;
  b.ressenti = Object.keys(RESSENTIS).includes(valeur) ? valeur : null;
  b.note = note;
  sauvegarder();
  rafraichir();
  const apres = b.matiereId ? coefMatiere(b.matiereId) : 1;
  let message = b.ressenti ? `Noté : ${RESSENTIS[b.ressenti].nom} ${RESSENTIS[b.ressenti].emoji}` : (note ? 'Note enregistrée ✓' : 'OK, sans ressenti');
  if (apres !== avant) message += ` · ${nomMatiere(b.matiereId)} : difficulté × ${formaterDecimal(apres)}`;
  afficherToast(message);
}

// Vérifie si la phase en cours est finie (appelé 2 fois par seconde et au retour dans l'appli).
// La boucle "while" rattrape tout ce qui s'est passé si l'écran était verrouillé longtemps.
// "silencieux" = sans son ni vibration (à l'ouverture de l'appli).
function verifierChrono(silencieux = false) {
  const c = donnees.chrono;
  if (!c) return;
  const r = donnees.reglages;
  let fin = null;
  let blocsEnregistres = 0;
  let securite = 0;
  while (c.debut && c.phase !== 'attente' && ecouleMs(c) >= c.dureeMs && securite++ < 10) {
    const momentFin = c.debut + (c.dureeMs - c.dejaEcouleMs);  // l'heure exacte où la phase s'est finie
    if (c.phase === 'travail') {
      enregistrerBloc(c, Math.round(c.dureeMs / 60000));
      blocsEnregistres++;
      c.blocsSerie += 1;
      const longue = c.blocsSerie % r.blocsAvantPauseLongue === 0;
      c.phase = longue ? 'pauseLongue' : 'pause';
      c.dureeMs = (longue ? r.pauseLongue : r.pauseCourte) * 60000;
      c.debut = momentFin;   // la pause a commencé à la fin du travail
      c.dejaEcouleMs = 0;
      fin = 'travail';
    } else {
      c.phase = 'attente';
      c.finPause = momentFin;
      c.debut = null;
      c.dejaEcouleMs = 0;
      c.dureeMs = 0;
      fin = 'pause';
    }
  }
  if (!fin) return;
  sauvegarder();
  if (!silencieux) alerter(fin);
  if (fin === 'travail') {
    afficherToast(`✓ Bloc enregistré ! ${c.phase === 'pauseLongue' ? 'Grande pause' : 'Petite pause'} de ${Math.round(c.dureeMs / 60000)} min`);
  } else if (blocsEnregistres) {
    afficherToast('✓ Bloc enregistré · la pause est finie aussi');
  } else if (!silencieux) {
    afficherToast('Pause terminée ! On reprend ?');  // (pas à l'ouverture de l'appli : la pause peut dater d'hier)
  }
  majVerrouEcran();
  rafraichir();
}

// Son + vibration + flash de l'écran.
function alerter(fin) {
  const r = donnees.reglages;
  if (r.son) jouerSon(fin);
  if (r.vibration && navigator.vibrate) {
    try { navigator.vibrate(fin === 'travail' ? [400, 150, 400, 150, 400] : [250, 120, 250]); } catch (erreur) { /* pas grave */ }
  }
  flasher(fin === 'travail' ? '#34d399' : '#8b93ff');
}

/* ---------- Le son (fabriqué par le navigateur, sans fichier audio) ---------- */

let contexteAudio = null;

// Sur iPhone, le son doit être "débloqué" pendant un appui sur un bouton.
function preparerSon() {
  try {
    const Contexte = window.AudioContext || window.webkitAudioContext;
    if (!Contexte) return;
    if (!contexteAudio) contexteAudio = new Contexte();
    if (contexteAudio.state !== 'running') contexteAudio.resume();
  } catch (erreur) { /* pas de son possible */ }
}

function jouerSon(fin) {
  preparerSon();
  const ctx = contexteAudio;
  if (!ctx) return;
  // Fin du travail : petite mélodie qui monte. Fin de pause : deux notes répétées.
  const notes = fin === 'travail' ? [784, 988, 1175, 784, 988, 1175] : [1175, 880, 1175, 880];
  const depart = ctx.currentTime + 0.05;
  notes.forEach((frequence, i) => {
    const t = depart + i * 0.22;
    const oscillateur = ctx.createOscillator();
    const volume = ctx.createGain();
    oscillateur.type = 'triangle';
    oscillateur.frequency.setValueAtTime(frequence, t);
    volume.gain.setValueAtTime(0.0001, t);
    volume.gain.exponentialRampToValueAtTime(0.35, t + 0.02);
    volume.gain.exponentialRampToValueAtTime(0.0001, t + 0.2);
    oscillateur.connect(volume);
    volume.connect(ctx.destination);
    oscillateur.start(t);
    oscillateur.stop(t + 0.22);
  });
}

/* ---------- Garder l'écran allumé pendant un bloc (si le téléphone le permet) ---------- */

let verrouEcran = null;
let demandeEnCours = false;

async function majVerrouEcran() {
  if (!('wakeLock' in navigator)) return;
  const c = donnees.chrono;
  const voulu = Boolean(c && c.debut && c.phase !== 'attente' && donnees.reglages.ecranAllume && document.visibilityState === 'visible');
  try {
    if (voulu && !verrouEcran && !demandeEnCours) {
      demandeEnCours = true;
      verrouEcran = await navigator.wakeLock.request('screen');
      verrouEcran.addEventListener('release', () => { verrouEcran = null; });
    } else if (!voulu && verrouEcran) {
      const v = verrouEcran;
      verrouEcran = null;
      await v.release();
    }
  } catch (erreur) {
    verrouEcran = null;
  } finally {
    demandeEnCours = false;
  }
}


/* =====================================================================
   8. CLICS, ÉVÉNEMENTS ET DÉMARRAGE
   Chaque bouton a un attribut data-action="..." qui dit ce qu'il fait.
   Un seul "écouteur" reçoit tous les clics et lance la bonne action.
   ===================================================================== */

const ACTIONS = {
  'lancer': id => lancerDepuisPlan(id),
  'aller-chrono': () => afficherVue('chrono'),
  'demarrer': () => {
    const coche = document.querySelector('input[name="sujet-chrono"]:checked');
    demarrerBloc(coche && coche.value ? coche.value : null);
  },
  'pause': () => mettreEnPause(),
  'reprendre': () => reprendre(),
  'arreter': () => arreter(),
  'passer-pause': () => passerPause(),
  'bloc-suivant': () => demarrerBloc(donnees.chrono ? donnees.chrono.echeanceId : null, donnees.chrono ? donnees.chrono.blocsSerie : 0),
  'terminer': () => terminerSerie(),
  'ressenti': (id, bouton) => noterBloc(bouton.dataset.valeur, bouton),
  'ajouter-echeance': () => ouvrirFormEcheance(null),
  'detail-echeance': id => ouvrirDetailEcheance(id),
  'modifier-echeance': id => ouvrirFormEcheance(id),
  'supprimer-echeance': id => supprimerEcheance(id),
  'test-passe': id => marquerPassee(id),
  'remettre': id => remettreDansPlan(id),
  'ajouter-matiere': () => ouvrirFormMatiere(null),
  'modifier-matiere': id => ouvrirFormMatiere(id),
  'supprimer-matiere': id => supprimerMatiere(id),
  'supprimer-bloc': id => supprimerBloc(id),
  'fermer': () => fermerFeuille(),
  'chapitres-moins': () => changerChapitres(-1),
  'chapitres-plus': () => changerChapitres(1),
  'installer': () => installerAppli(),
  'tester-alerte': () => { preparerSon(); alerter('travail'); },
  'exporter': () => exporterDonnees(),
  'importer': () => document.getElementById('fichier-import').click(),
  'exemple': () => chargerExemple(),
  'reglages-defaut': () => reglagesParDefaut(),
  'tout-effacer': () => toutEffacer(),
};

document.addEventListener('click', ev => {
  const cible = ev.target.closest('[data-onglet], [data-action]');
  if (!cible) return;
  if (cible.dataset.onglet) {
    afficherVue(cible.dataset.onglet);
    return;
  }
  const action = cible.dataset.action;
  if (action === 'plus' || action === 'moins') {
    changerReglage(cible, action === 'plus' ? 1 : -1);
    return;
  }
  if (ACTIONS[action]) ACTIONS[action](cible.dataset.id, cible);
});

// Les cartes d'échéance se comportent comme des boutons au clavier (Entrée / Espace).
document.addEventListener('keydown', ev => {
  if ((ev.key === 'Enter' || ev.key === ' ') && ev.target.matches('[role="button"][data-action]')) {
    ev.preventDefault();
    ev.target.click();
  }
  if (ev.key === 'Escape' && document.getElementById('fond-dialogue').hidden && !document.getElementById('fond-feuille').hidden) {
    fermerFeuille();
  }
});

// Envoi des formulaires (bouton "Enregistrer").
document.addEventListener('submit', ev => {
  ev.preventDefault();
  if (ev.target.id === 'form-echeance') enregistrerEcheance(ev.target);
  if (ev.target.id === 'form-matiere') enregistrerMatiere(ev.target);
});

// Changements dans les formulaires et les réglages.
document.addEventListener('input', ev => {
  if (ev.target.closest('#form-echeance')) majEstimation();
  if (ev.target.classList.contains('note-bloc')) brouillonNote = ev.target.value;
});
document.addEventListener('change', ev => {
  const t = ev.target;
  if (t.closest('#form-echeance')) majEstimation();
  if (t.name === 'sujet-chrono') choixChrono = t.value;
  if (t.id === 'fichier-import' && t.files && t.files[0]) {
    importerFichier(t.files[0]);
    t.value = '';
  }
  if (t.dataset.reglage) {
    donnees.reglages[t.dataset.reglage] = t.checked;
    sauvegarder();
    majVerrouEcran();
  }
});
document.addEventListener('toggle', ev => {
  if (ev.target.matches && ev.target.matches('details.passees')) passeesOuvertes = ev.target.open;
}, true);

// Toucher le fond sombre ferme la feuille.
document.getElementById('fond-feuille').addEventListener('click', ev => {
  if (ev.target.id === 'fond-feuille') fermerFeuille();
});

// Pendant un chrono, chaque appui "débloque" le son (nécessaire sur iPhone).
document.addEventListener('touchend', () => { if (donnees.chrono) preparerSon(); }, { passive: true });

// Le "battement" de l'appli : 2 fois par seconde.
let dernierJour = aujourdhui();
function tic() {
  verifierChrono();
  majAffichageChrono();
  majOngletChrono();
  const jour = aujourdhui();
  if (jour !== dernierJour) {  // on a passé minuit : on recalcule le plan
    dernierJour = jour;
    rafraichir();
  }
}

// Quand on revient dans l'appli (écran déverrouillé, changement d'appli…).
document.addEventListener('visibilitychange', () => {
  if (document.visibilityState === 'visible') tic();
  majVerrouEcran();
});
window.addEventListener('pageshow', tic);

// Si l'appli est ouverte dans un autre onglet et que les données changent là-bas.
window.addEventListener('storage', ev => {
  if (ev.key === CLE_STOCKAGE) {
    charger();
    rafraichir();
  }
});

// ---- Démarrage ----
charger();
verifierChrono(true);
// Une "pause terminée" d'un autre jour n'a plus d'intérêt : on l'oublie.
const ancien = donnees.chrono;
if (ancien && ancien.phase === 'attente' && cleDate(new Date(ancien.finPause || 0)) !== aujourdhui()) {
  donnees.chrono = null;
  sauvegarder();
}
// On ouvre sur le chrono seulement si un bloc ou une pause est en cours.
afficherVue(donnees.chrono && donnees.chrono.phase !== 'attente' ? 'chrono' : 'aujourdhui');
majVerrouEcran();
setInterval(tic, 500);
</script>
