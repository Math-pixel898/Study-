    ? `<ul class="liste-notes">${seances.map(b => `<li class="seance">
          <span class="seance-texte">
            <span class="quand">${capitaliser(dateCourte(b.date))} · ${b.pages !== undefined ? `+${pluriel(b.pages, 'page')}${b.page ? ` (jusqu'à la p. ${b.page})` : ''}` : 'pages pas notées'} · ${b.manuel ? `≈ ${b.minutes} min, sans chrono` : `${b.minutes} min`}</span>
            ${b.note ? `<span class="texte-note">« ${echapper(b.note)} »</span>` : ''}
          </span>
          <button class="supprimer-bloc" data-action="supprimer-seance" data-id="${b.id}" type="button" aria-label="Supprimer cette séance de lecture">${ic('fermer')}</button>
        </li>`).join('')}</ul>`
    : `<p class="aide">Aucune séance de lecture pour l'instant.</p>`;

  ouvrirFeuille(`<div class="detail" style="${styleMatiereRiche(e.matiereId)}">
      <div class="detail-tete">
        <span class="pastille-matiere" aria-hidden="true"></span>
        <div class="detail-tete-texte">
          <h2 class="detail-titre">${echapper(titreEcheance(e))}</h2>
          <p class="detail-date">${echapper(nomMatiere(e.matiereId))} · à finir pour le ${dateLongue(e.date)} · ${delai(e.date, plan.jour)}</p>
        </div>
        ${badgesEcheance(e)}
      </div>
      <div class="detail-progres">
        ${anneau(ratio, { taille: 84, epaisseur: 8, contenu: pourcent >= 100 ? ic('check') : `${pourcent}<small>%</small>`, classe: pourcent >= 100 ? 'complet' : '' })}
        <div class="detail-chiffres">
          <div><strong>${lues} / ${pluriel(total, 'page')}</strong><span>${lues ? `lues · tu es à la page ${pageActuelle(e)}` : 'pas encore commencé'}</span></div>
          <div><strong>${reste ? `≈ ${formaterDuree(reste * vitesse)}` : 'Fini ✓'}</strong><span>${reste ? `de lecture pour les ${pluriel(reste, 'page')} qui restent` : 'bravo, tout est lu !'}</span></div>
        </div>
      </div>
      <div class="puces-infos">
        <span class="puce-info">${ic('livre')}Pages ${e.pageDebut} à ${e.pageFin}</span>
        <span class="puce-info">${ic('horloge')}${formaterDecimal(vitesse)} min par page${vitesseMesuree() ? ' (ta vitesse)' : ''}</span>
      </div>
      ${e.note ? `<p class="ech-note">${ic('note')}<span>${echapper(e.note)}</span></p>` : ''}
      ${statutEcheance(e, plan)}
      ${estVeille(e, plan.jour) ? blocChecklist(e) : ''}
      ${active && reste > 0 ? `<div class="pile" style="margin-top:16px">
          <button class="btn btn-principal btn-geant" data-action="lancer" data-id="${e.id}" type="button">${ICONES.lecture} Lancer un bloc de lecture</button>
          <button class="btn btn-plein" data-action="j-ai-lu" data-id="${e.id}" type="button">${ic('livre')} J'ai lu sans chrono</button>
        </div>` : ''}
      <h3>Mes séances de lecture</h3>
      ${liste}
      <div class="pile" style="margin-top:18px">
        ${e.terminee
          ? `<button class="btn btn-plein" data-action="remettre" data-id="${e.id}" type="button">↩ Remettre dans le plan</button>`
          : `<button class="btn btn-plein${active && reste > 0 ? '' : ' btn-principal'}" data-action="test-passe" data-id="${e.id}" type="button">✓ Lecture finie</button>`}
        <button class="btn btn-plein" data-action="modifier-echeance" data-id="${e.id}" type="button">Modifier</button>
        <button class="btn btn-plein btn-danger" data-action="supprimer-echeance" data-id="${e.id}" type="button">Supprimer</button>
        <button class="btn btn-plein" data-action="fermer" type="button">Fermer</button>
      </div>
    </div>`);
}

// La checklist de la veille (dans le détail de l'échéance).
function blocChecklist(e) {
  const { liste, coches } = avancementChecklist(e);
  return `<div class="veille">
      <div class="veille-titre">${ic('lune')}<strong>C'est la veille : révision rapide</strong> <span class="aide" id="compte-checklist" style="margin:0">(${coches}/${liste.length})</span></div>
      <ul class="checklist">${liste.map(item => `<li>
          <label><input type="checkbox" data-checklist="${item.id}" data-id="${e.id}"${e.checklist[item.id] ? ' checked' : ''}><span>${echapper(item.texte)}</span></label>
          ${(item.details || []).map(t => `<span class="sous">${echapper(t)}</span>`).join('')}
        </li>`).join('')}</ul>
    </div>`;
}

function cocherChecklist(id, cle, coche) {
  const e = trouverEcheance(id);
  if (!e) return;
  if (coche) e.checklist[cle] = true;
  else delete e.checklist[cle];
  sauvegarder();
  const { liste, coches } = avancementChecklist(e);
  const compte = document.getElementById('compte-checklist');
  if (compte) compte.textContent = `(${coches}/${liste.length})`;
  rafraichir();   // met à jour "x/y" sur l'écran derrière la feuille
  if (coches === liste.length) afficherToast('Checklist terminée ✓ Bonne chance demain !');
}

// La note obtenue (dans le détail d'une échéance passée).
function blocResultat(e) {
  const r = e.resultat;
  if (!r) {
    return `<div class="resultat"><div class="resultat-titre">${ic('cible')}<strong>Ta note</strong></div>
        <p class="aide" style="margin:4px 0 10px">Entre ta note quand tu l'as : elle compte dans tes stats et, avec un objectif, elle ajuste ta difficulté perso.</p>
        <button class="btn btn-plein" data-action="note-resultat" data-id="${e.id}" type="button">Entrer ma note</button>
      </div>`;
  }
  const effet = effetResultat(r);
  const compte = partsDifficulte(e.matiereId, donnees.blocs, donnees.echeances).notes.includes(e);
  let texte = "Sans objectif, ta note est gardée dans tes stats mais ne change pas ta difficulté.";
  if (r.objectif !== null) {
    if (!compte) texte = `Cette note est plus ancienne que tes ${NB_RESULTATS} dernières en ${nomMatiere(e.matiereId)} : elle ne compte plus dans la difficulté.`;
    else if (effet > 0) texte = `Sous ton objectif : ta difficulté en ${nomMatiere(e.matiereId)} monte (${signe(effet)}), tu auras un peu plus de temps la prochaine fois.`;
    else if (effet < 0) texte = `Largement au-dessus de ton objectif : ta difficulté en ${nomMatiere(e.matiereId)} baisse un peu (${signe(effet)}).`;
    else texte = 'Objectif atteint : ta difficulté ne change pas.';
  }
  return `<div class="resultat"><div class="resultat-titre">${ic('cible')}<strong>${texteResultat(r)}</strong></div>
      <p class="aide" style="margin:4px 0 10px">${echapper(texte)}</p>
      <button class="btn btn-plein" data-action="note-resultat" data-id="${e.id}" type="button">Modifier ma note</button>
    </div>`;
}

// "Test passé" : l'échéance sort du plan et va dans l'historique, puis on demande la note.
function marquerPassee(id) {
  const e = trouverEcheance(id);
  if (!e) return;
  if (estLecture(e)) {
    e.terminee = true;
    e.termineeLe = aujourdhui();
    e.rythme = null;
    e.checklist = {};
    sauvegarder();
    fermerFeuille();
    rafraichir();
    afficherToast("📖 Lecture rangée dans l'historique ✓");
    verifierBadges();
    return;
  }
  e.terminee = true;
  e.termineeLe = aujourdhui();
  e.rythme = null;
  e.checklist = {};
  sauvegarder();
  rafraichir();
  ouvrirFormResultat(id, true);   // (la feuille dit déjà "✓ Rangé dans l'historique")
}

/* ---------- Lecture : noter où tu en es (après un bloc, ou "J'ai lu" sans chrono) ---------- */

// "J'ai lu sans chrono" : tu indiques la page où tu es arrivé(e).
function ouvrirFormLecture(id) {
  const e = trouverEcheance(id);
  if (!estLecture(e)) return;
  const avant = pageActuelle(e);
  ouvrirFeuille(`<form id="form-lecture" data-id="${e.id}" novalidate style="${styleMatiereRiche(e.matiereId)}">
      <h2>${echapper(titreEcheance(e))}</h2>
      <p class="aide" style="margin:-6px 0 16px">${avant >= e.pageDebut ? `Tu en étais à la page ${avant}` : `Tu commences à la page ${e.pageDebut}`} · le livre va jusqu'à la page ${e.pageFin}.</p>
      <label class="champ">J'en suis à la page
        <input type="number" name="page" inputmode="numeric" min="${Math.max(avant + 1, e.pageDebut)}" max="${e.pageFin}" placeholder="ex : ${Math.min(e.pageFin, Math.max(avant, e.pageDebut - 1) + 15)}" autocomplete="off">
      </label>
      <label class="champ">Note <span class="facultatif">(facultatif)</span>
        <input type="text" name="note" maxlength="120" placeholder="ex : chapitre 4, le renard" autocomplete="off">
      </label>
      <div class="estimation" id="apercu-lecture"><div class="aide">Ces pages comptent dans ton plan, ta série et tes stats (avec un temps estimé à ${formaterDecimal(vitesseLecture())} min par page).</div></div>
      <p class="erreur" id="erreur-form" hidden></p>
      <div class="pile">
        <button type="submit" class="btn btn-principal btn-geant">${ic('check')} Enregistrer</button>
        <button type="button" class="btn btn-plein" data-action="fermer">Annuler</button>
      </div>
    </form>`);
}

// Aperçu en direct : combien de pages, et le temps compté.
function majApercuLecture() {
  const form = document.getElementById('form-lecture');
  const e = form && trouverEcheance(form.dataset.id);
  if (!estLecture(e)) return;
  const page = lireNombre(new FormData(form).get('page'));
  const avant = pageActuelle(e);
  const zone = document.getElementById('apercu-lecture');
  if (!Number.isInteger(page) || page <= avant || page > e.pageFin) return;
  const pages = page - avant;
  zone.innerHTML = `<strong>+${pluriel(pages, 'page')}</strong> · ≈ ${formaterDuree(pages * vitesseLecture())} de lecture comptées
    <div class="aide">${page === e.pageFin ? 'Et le livre est fini ! 🎉' : `Encore ${pluriel(e.pageFin - page, 'page')} ensuite.`}</div>`;
}

function enregistrerLecture(form) {
  const e = trouverEcheance(form.dataset.id);
  if (!estLecture(e)) return fermerFeuille();
  const f = new FormData(form);
  const page = lireNombre(f.get('page'));
  const avant = pageActuelle(e);
  if (page === null) return erreurForm('Indique la page où tu es arrivé(e).');
  if (!Number.isInteger(page)) return erreurForm('Indique un numéro de page (un nombre entier).');
  if (page > e.pageFin) return erreurForm(`Le livre s'arrête à la page ${e.pageFin}.`);
  if (page < e.pageDebut) return erreurForm(`La lecture commence à la page ${e.pageDebut}.`);
  if (page <= avant) return erreurForm(`Tu en étais déjà à la page ${avant}. (Pour corriger une erreur, supprime une séance dans le détail du livre.)`);
  const pages = page - Math.max(avant, e.pageDebut - 1);
  const note = String(f.get('note') || '').trim().slice(0, 120);
  const jour = aujourdhui();
  // Un bloc de lecture d'aujourd'hui où la page n'a pas été notée ("Passer") ? On le complète.
  const sansPages = donnees.blocs.filter(b => b.echeanceId === e.id && b.date === jour && b.pages === undefined && !b.manuel).pop();
  if (sansPages) {
    Object.assign(sansPages, { pages, page, note: note || sansPages.note });
    if (donnees.aEvaluer === sansPages.id) donnees.aEvaluer = null;
  } else {
    donnees.blocs.push({
      id: nouvelId(), echeanceId: e.id, matiereId: e.matiereId, date: jour, debut: Date.now(),
      minutes: Math.max(1, Math.round(pages * vitesseLecture())), ressenti: null, note, pages, page, manuel: true,
    });
  }
  sauvegarder();
  fermerFeuille();
  rafraichir();
  apresLecture(e, pages);
}

// Après un bloc de lecture chronométré : la page atteinte.
function enregistrerPagesLues(bouton) {
  const b = donnees.blocs.find(x => x.id === donnees.aEvaluer);
  const e = b ? trouverEcheance(b.echeanceId) : null;
  const carte = bouton.closest('.ressenti');
  if (!b || !estLecture(e) || !carte) {
    donnees.aEvaluer = null;
    sauvegarder();
    rafraichir();
    return;
  }
  const page = Number(carte.querySelector('.page-lecture').value);
  const avant = pageActuelle(e);
  const minimum = Math.max(avant, e.pageDebut - 1);
  if (!Number.isInteger(page) || page < minimum || page > e.pageFin) {
    afficherToast(`⚠️ Indique une page entre ${minimum} et ${e.pageFin}`);
    return;
  }
  b.pages = page - minimum;
  b.page = page;
  b.note = (carte.querySelector('.note-bloc').value || '').trim().slice(0, 120);
  donnees.aEvaluer = null;
  brouillonNote = '';
  brouillonPage = '';
  sauvegarder();
  rafraichir();
  apresLecture(e, b.pages);
}

// "Passer" : la page n'est pas notée (tu pourras le faire avec "J'ai lu").
function passerLecture(bouton) {
  const b = donnees.blocs.find(x => x.id === donnees.aEvaluer);
  const champ = bouton.closest('.ressenti') && bouton.closest('.ressenti').querySelector('.note-bloc');
  if (b && champ) b.note = champ.value.trim().slice(0, 120);
  donnees.aEvaluer = null;
  brouillonNote = '';
  brouillonPage = '';
  sauvegarder();
  rafraichir();
  afficherToast("OK. Tu pourras noter ta page plus tard avec « J'ai lu ».");
}

// Le message après une lecture, et si le livre est fini : bravo, et on propose de le ranger.
async function apresLecture(e, pages) {
  const reste = e.pageFin - pageActuelle(e);
  if (reste > 0) {
    afficherToast(`📖 ${pluriel(pages, 'page')} lue${pages > 1 ? 's' : ''} · encore ${pluriel(reste, 'page')}`);
    verifierBadges();
    return;
  }
  celebrer(couleurMatiere(e.matiereId));
  vibrer([30, 60, 30]);
  verifierBadges(true);
  const ranger = await confirmer(`Bravo, tu as fini « ${titreEcheance(e)} » ! 🎉 Ranger cette lecture dans l'historique ?`, "Ranger dans l'historique");
  if (ranger) marquerPassee(e.id);
  else afficherToast('📖 Livre terminé ! Il reste dans tes échéances.');
}

// Supprimer une séance de lecture (depuis le détail du livre).
async function supprimerSeance(id) {
  const b = donnees.blocs.find(x => x.id === id);
  if (!b) return;
  const texte = b.pages !== undefined ? `+${pluriel(b.pages, 'page')}, ${b.minutes} min` : `${b.minutes} min`;
  if (!(await confirmer(`Supprimer cette séance de lecture (${texte}) ?`, 'Supprimer', true))) return;
  donnees.blocs = donnees.blocs.filter(x => x.id !== id);
  if (donnees.aEvaluer === id) donnees.aEvaluer = null;
  sauvegarder();
  rafraichir();
  if (b.echeanceId && trouverEcheance(b.echeanceId)) ouvrirDetailEcheance(b.echeanceId);
}

/* ---------- Ta note à un test ou un examen ---------- */

// L'objectif proposé : celui de ta dernière note dans la même matière (converti dans la bonne échelle).
function objectifPropose(matiereId, sur, saufId) {
  const precedent = donnees.echeances
    .filter(x => x.id !== saufId && x.matiereId === matiereId && x.terminee && x.resultat && x.resultat.objectif !== null)
    .sort((a, b) => (a.date < b.date ? 1 : a.date > b.date ? -1 : 0))[0];
  if (!precedent) return null;
  const pas = sur === 100 ? 1 : 0.5;
  return Math.round(precedent.resultat.objectif / precedent.resultat.sur * sur / pas) * pas;
}

function nombrePourChamp(x) {
  return x === null || x === undefined ? '' : formaterDecimal(x);
}

function ouvrirFormResultat(id, justePasse = false) {
  const e = trouverEcheance(id);
  if (!e || !e.terminee) return;
  const r = e.resultat;
  const sur = r ? r.sur : donnees.reglages.echelleNote;
  const propose = r ? null : objectifPropose(e.matiereId, sur, e.id);
  const objectif = r ? r.objectif : propose;
  ouvrirFeuille(`<form id="form-resultat" data-id="${e.id}" data-propose="${propose === null ? '' : propose}" novalidate style="${styleMatiere(e.matiereId)}">
      <h2>Ta note ${echapper(e.type === 'examen' ? "à l'examen" : 'au test')} ${echapper(de(nomMatiere(e.matiereId)))}</h2>
      <p class="aide" style="margin:-6px 0 16px">${justePasse ? `✓ Rangé dans l'historique. ` : ''}${capitaliser(dateLongue(e.date))}.
        Pas encore ta note ? Touche « Plus tard » : tu pourras l'entrer depuis l'historique.</p>
      <fieldset>
        <legend>Noté</legend>
        <div class="segments">
          ${ECHELLES.map(x => `<label><input type="radio" name="sur" value="${x.sur}"${x.sur === sur ? ' checked' : ''}><span>${x.nom}</span></label>`).join('')}
        </div>
      </fieldset>
      <div class="deux-champs">
        <label class="champ">Ma note<input type="text" name="note" inputmode="decimal" value="${nombrePourChamp(r ? r.note : null)}" placeholder="ex : 13,5" autocomplete="off"></label>
        <label class="champ">Mon objectif <span class="facultatif">(facultatif)</span><input type="text" name="objectif" inputmode="decimal" value="${nombrePourChamp(objectif)}" placeholder="ex : 14" autocomplete="off"></label>
      </div>
      <div class="estimation" id="apercu-resultat"></div>
      <p class="erreur" id="erreur-form" hidden></p>
      <div class="pile">
        <button type="submit" class="btn btn-principal btn-geant">Enregistrer ma note</button>
        <button type="button" class="btn btn-plein" data-action="fermer">${r ? 'Annuler' : 'Plus tard'}</button>
        ${r ? `<button type="button" class="btn btn-plein btn-danger" data-action="effacer-note" data-id="${e.id}">Effacer ma note</button>` : ''}
      </div>
    </form>`);
  majApercuResultat();
}

// Lit le formulaire de note. Renvoie { sur, note, objectif, erreur }.
function lireFormResultat(form) {
  const f = new FormData(form);
  const sur = [10, 20, 100].includes(Number(f.get('sur'))) ? Number(f.get('sur')) : 20;
  const note = lireNombre(f.get('note'));
  const objectif = lireNombre(f.get('objectif'));
  const valide = x => Number.isFinite(x) && x >= 0 && x <= sur;
  // "14/20" tapé alors que l'échelle choisie est "en %" : on te le signale plutôt que de se tromper.
  const echelleTapee = texte => {
    const m = String(texte || '').trim().match(/(%|\/\s*(10|20|100))$/);
    return m ? (m[1] === '%' ? 100 : Number(m[2])) : null;
  };
  const conflit = [f.get('note'), f.get('objectif')].find(t => echelleTapee(t) !== null && echelleTapee(t) !== sur);
  let erreur = null;
  if (conflit) erreur = `Tu as écrit « ${String(conflit).trim()} » mais l'échelle choisie est « ${ECHELLES.find(x => x.sur === sur).nom} » : choisis la bonne en haut.`;
  else if (note === null) erreur = 'Entre ta note.';
  else if (!valide(note)) erreur = `Ta note doit être un nombre entre 0 et ${sur}.`;
  else if (objectif !== null && !valide(objectif)) erreur = `Ton objectif doit être un nombre entre 0 et ${sur} (ou laisse la case vide).`;
  const arrondi = x => (Number.isFinite(x) ? Math.round(x * 100) / 100 : x);
  return { sur, note: arrondi(note), objectif: arrondi(objectif), erreur };
}

// Quand tu changes d'échelle (sur 10 / sur 20 / en %), l'objectif proposé suit, s'il n'a pas été touché.
function changerEchelleResultat(form) {
  const champ = form.elements.objectif;
  const propose = form.dataset.propose === '' ? null : Number(form.dataset.propose);
  if (propose === null || lireNombre(champ.value) !== propose) return;
  const sur = Number(new FormData(form).get('sur'));
  const nouveau = objectifPropose(trouverEcheance(form.dataset.id).matiereId, sur, form.dataset.id);
  champ.value = nombrePourChamp(nouveau);
  form.dataset.propose = nouveau === null ? '' : nouveau;
}

// Aperçu en direct : la note en %, l'objectif, et l'effet sur ta difficulté perso.
function majApercuResultat() {
  const form = document.getElementById('form-resultat');
  if (!form) return;
  const e = trouverEcheance(form.dataset.id);
  const zone = document.getElementById('apercu-resultat');
  const v = lireFormResultat(form);
  if (!e || v.erreur) {
    zone.innerHTML = v.erreur && v.note !== null
      ? `<div class="aide">⚠️ ${echapper(v.erreur)}</div>`
      : `<div class="aide">Avec un objectif, ta note ajuste ta difficulté perso en ${echapper(nomMatiere(e ? e.matiereId : null))} : en dessous, plus de temps de révision la prochaine fois ; largement au-dessus, un peu moins.</div>`;
    return;
  }
  let texte = `Ta note : <strong>${formaterNote(v.note, v.sur)}</strong>${v.sur !== 100 ? ` (${Math.round(v.note / v.sur * 100)} %)` : ''}`;
  if (v.objectif !== null) {
    const ecart = v.note - v.objectif;
    texte += ecart >= 0
      ? `<div>🎯 Objectif atteint${ecart > 0 ? ` (+${formaterDecimal(Math.round(ecart * 100) / 100)})` : ''}</div>`
      : `<div>Objectif ${formaterNote(v.objectif, v.sur)} : il manque ${formaterDecimal(Math.round(-ecart * 100) / 100)} point${-ecart > 1 ? 's' : ''}</div>`;
    const avant = coefMatiere(e.matiereId);
    const echeances = donnees.echeances.map(x => (x.id === e.id ? { ...x, resultat: { note: v.note, sur: v.sur, objectif: v.objectif } } : x));
    const apres = coefsDifficulte(donnees.blocs, echeances)[e.matiereId] || 1;
    texte += apres === avant
      ? `<div class="aide">Difficulté perso en ${echapper(nomMatiere(e.matiereId))} : × ${formaterDecimal(avant)} (pas de changement)</div>`
      : `<div class="aide">Difficulté perso en ${echapper(nomMatiere(e.matiereId))} : × ${formaterDecimal(avant)} → <strong>× ${formaterDecimal(apres)}</strong></div>`;
  } else {
    texte += `<div class="aide">Sans objectif, ta note compte dans tes stats mais ne change pas ta difficulté.</div>`;
  }
  zone.innerHTML = texte;
}

function enregistrerResultat(form) {
  const e = trouverEcheance(form.dataset.id);
  if (!e) return fermerFeuille();
  const v = lireFormResultat(form);
  if (v.erreur) return erreurForm(v.erreur);
  const avant = coefMatiere(e.matiereId);
  e.resultat = { note: v.note, sur: v.sur, objectif: v.objectif };
  donnees.reglages.echelleNote = v.sur;   // la prochaine fois, on te propose la même échelle
  sauvegarder();
  fermerFeuille();

// Affiche en direct le temps d'étude estimé pendant qu'on remplit le formulaire.
function majEstimation() {
  const form = document.getElementById('form-echeance');
  if (!form) return;
  const f = new FormData(form);
  const r = donnees.reglages;
  form.dataset.genre = f.get('type') === 'lecture' ? 'lecture' : 'etude';
  if (f.get('type') === 'lecture') {
    document.getElementById('estimation').innerHTML = estimationLecture(f);
    return;
  }
  const e = {
    matiereId: f.get('matiere'),
    type: f.get('type') === 'examen' ? 'examen' : 'test',
    niveau: Number(f.get('niveau')) || 1,
    chapitres: Math.max(0, parseInt(f.get('chapitres'), 10) || 0),
    date: f.get('date'),
    travail: Object.keys(TRAVAUX).includes(f.get('travail')) ? f.get('travail') : 'mixte',
  };
  const coef = e.matiereId ? coefMatiere(e.matiereId) : 1;
  const minutes = tempsEstime(e, r, coef);
  let texte = `Temps d'étude estimé : <strong>${formaterDuree(minutes)}</strong> (${pluriel(blocsPour(minutes, r.travail), 'bloc')} de ${r.travail} min)`;
  if (coef !== 1) texte += `<div class="aide">Ta difficulté perso en ${echapper(nomMatiere(e.matiereId))} (× ${formaterDecimal(coef)}) est comptée.</div>`;
  if (e.travail === 'parcoeur') texte += `<div class="aide">Par cœur : petits morceaux, 1 bloc par jour, sur plus de jours.</div>`;
  if (e.travail === 'exercices') texte += `<div class="aide">Exercices : séances d'au moins ${pluriel(r.blocsParSession, 'bloc')} d'affilée.</div>`;
  if (estCleDate(e.date)) {
    const jour = aujourdhui();
    const debut = ajouterJours(e.date, -dureeFenetre(e, r));
    if (e.date <= jour) texte += `<div class="aide">⚠️ Cette date est aujourd'hui ou déjà passée : rien ne sera planifié.</div>`;
    else texte += `<div class="aide">Révisions ${debut > jour ? `à partir du ${dateLongue(debut)}` : "dès aujourd'hui"}, jusqu'à la veille.</div>`;
  }
  document.getElementById('estimation').innerHTML = texte;
}

// Lecture : combien de temps, et combien de pages par jour d'ici la date.
function estimationLecture(f) {
  const debut = parseInt(f.get('pageDebut'), 10) || 1;
  const fin = parseInt(f.get('pageFin'), 10);
  if (!(fin >= debut)) return `<div class="aide">Indique les pages à lire (ex : de la page 1 à la page 180) : l'appli les répartit sur les jours qui restent.</div>`;
  const pages = fin - debut + 1;
  const vitesse = vitesseLecture();
  let texte = `<strong>${pluriel(pages, 'page')}</strong> · ≈ <strong>${formaterDuree(pages * vitesse)}</strong> de lecture
    <div class="aide">À ${formaterDecimal(vitesse)} min par page${vitesseMesuree() ? ' (ta vitesse mesurée)' : ' (environ ' + Math.round(60 / vitesse) + ' pages par heure)'}.</div>`;
  const date = f.get('date');
  if (estCleDate(date)) {
    const jours = ecartJours(aujourdhui(), date);
    if (jours <= 0) texte += `<div class="aide">⚠️ Cette date est aujourd'hui ou déjà passée : rien ne sera planifié.</div>`;
    else texte += `<div class="aide">Environ <strong>${pluriel(Math.ceil(pages / jours), 'page')} par jour</strong> dès aujourd'hui, jusqu'à la veille (si ton temps dispo le permet).</div>`;
  }
  return texte;
}

function changerChapitres(sens) {
  const champ = document.querySelector('#form-echeance input[name="chapitres"]');
  if (!champ) return;
  champ.value = borner((parseInt(champ.value, 10) || 0) + sens, 1, 99);
  majEstimation();
}

function enregistrerEcheance(form) {
  const f = new FormData(form);
  const matiereId = f.get('matiere');
  const date = f.get('date');
  const lecture = f.get('type') === 'lecture';
  const chapitres = lecture ? 1 : parseInt(f.get('chapitres'), 10);
  if (!matiereId) return erreurForm('Choisis une matière.');
  let livre = null;
  if (lecture) {
    const debut = Number(f.get('pageDebut') || 1);
    const fin = Number(f.get('pageFin'));
    if (!(Number.isInteger(debut) && debut >= 1 && debut <= 9999)) return erreurForm('La première page doit être un nombre entier (1 si tu commences au début).');
    if (!f.get('pageFin')) return erreurForm('Indique la dernière page à lire.');
    if (!(Number.isInteger(fin) && fin >= debut && fin <= 9999)) return erreurForm(`La dernière page doit être un nombre entier, au moins ${debut}.`);
    livre = { titre: String(f.get('titre') || '').trim().replace(/\s+/g, ' ').slice(0, 80), pageDebut: debut, pageFin: fin };
  }
  if (!estCleDate(date)) return erreurForm('Choisis une date.');
  if (!(chapitres >= 1 && chapitres <= 99)) return erreurForm('Le nombre de chapitres doit être entre 1 et 99.');

  const valeurs = {
    matiereId,
    type: lecture ? 'lecture' : (f.get('type') === 'examen' ? 'examen' : 'test'),
    date,
    niveau: lecture ? 1 : borner(Number(f.get('niveau')) || 2, 1, 4),
    chapitres,
    note: String(f.get('note') || '').trim(),
    travail: lecture ? 'mixte' : (Object.keys(TRAVAUX).includes(f.get('travail')) ? f.get('travail') : 'mixte'),
  };
  const id = form.dataset.id;
  if (id) {
    const e = trouverEcheance(id);
    // Si ce qui compte pour le plan change, on repart d'un rythme neuf (pas de faux retard).
    const change = ['matiereId', 'type', 'date', 'niveau', 'chapitres', 'travail'].some(cle => e[cle] !== valeurs[cle])
      || (livre !== null && (e.pageDebut !== livre.pageDebut || e.pageFin !== livre.pageFin));
    if (e.date !== valeurs.date) e.checklist = {};   // nouvelle date : nouvelle veille
    Object.assign(e, valeurs);
    if (livre) Object.assign(e, livre);
    else { delete e.titre; delete e.pageDebut; delete e.pageFin; }
    if (change) e.rythme = null;
  } else {
    donnees.echeances.push(Object.assign({ id: nouvelId(), ...valeurs, terminee: false, termineeLe: null, rythme: null, resultat: null, checklist: {} }, livre || {}));
  }
  sauvegarder();
  fermerFeuille();
  rafraichir();
  afficherToast(date <= aujourdhui() ? 'Enregistré (attention : date passée)' : (id ? 'Échéance modifiée ✓' : (lecture ? '📖 Lecture ajoutée ✓' : 'Échéance ajoutée ✓')));
}

  if (!ok) return;
  donnees.echeances = donnees.echeances.filter(x => x.id !== id);

/* ---------- Formulaire d'une matière ---------- */

function ouvrirFormMatiere(id, options = {}) {
  const m = id ? trouverMatiere(id) : null;
  const prises = donnees.matieres.map(x => x.couleur);
  const libre = PALETTE.find(c => !prises.includes(c.code));
  const couleur = m ? m.couleur : (libre ? libre.code : PALETTE[donnees.matieres.length % PALETTE.length].code);
  const couleurs = PALETTE.some(c => c.code === couleur) ? PALETTE : [...PALETTE, { nom: 'Actuelle', code: couleur }];

  // Difficulté perso de la matière (expliquée : part des ressentis + part des notes).
  let difficulte = '';
  if (m) {
    const p = partsDifficulte(m.id, donnees.blocs, donnees.echeances);
    const compte = Object.keys(RESSENTIS)
      .map(cle => [cle, p.ressentis.filter(x => x === cle).length])
      .filter(([, n]) => n > 0)
      .map(([cle, n]) => `${n} ${RESSENTIS[cle].emoji} ${RESSENTIS[cle].nom}`)
      .join(' · ');
    const ressentis = p.ressentis.length
      ? `tes ressentis (${p.ressentis.length > 1 ? `les ${p.ressentis.length} derniers` : 'le dernier'} : ${compte}) : ${signe(p.partRessentis)}`
      : "tes ressentis : aucun pour l'instant (Facile / Ok / Dur après chaque bloc)";
    const notes = p.notes.length
      ? `tes notes (${p.notes.map(e => `${formaterNote(e.resultat.note, e.resultat.sur)}, objectif ${formaterNote(e.resultat.objectif, e.resultat.sur)}`).join(' ; ')}) : ${signe(p.partNotes)}`
      : 'tes notes : entre ta note et ton objectif quand tu marques un test comme passé';
    difficulte = `<div class="estimation">Difficulté perso : <strong>× ${formaterDecimal(coefMatiere(m.id))}</strong>
        <div class="aide">On part de × 1, puis :<br>• ${ressentis}<br>• ${notes}<br>Le total est arrondi à 0,05 près, et reste toujours entre × 0,7 et × 1,5.</div></div>`;
  }

  ouvrirFeuille(`<form id="form-matiere" data-id="${m ? m.id : ''}" data-puis-echeance="${options.puisEcheance ? 'oui' : ''}" novalidate>
      <h2>${m ? 'Modifier la matière' : 'Nouvelle matière'}</h2>
      ${options.puisEcheance ? `<p class="aide" style="margin:-6px 0 16px">D'abord une matière, ensuite tu pourras créer ton test ou examen.</p>` : ''}
      <label class="champ">Nom<input type="text" name="nom" maxlength="30" value="${m ? echapper(m.nom) : ''}" placeholder="ex : Maths, Chimie, Philo…" autocomplete="off" enterkeyhint="done"></label>
      <fieldset>
        <legend>Couleur</legend>
        <div class="palette">
          ${couleurs.map(c => `<label class="pastille-choix" style="--couleur:${c.code}"><input type="radio" name="couleur" value="${c.code}" aria-label="${c.nom}"${c.code === couleur ? ' checked' : ''}><span></span></label>`).join('')}
        </div>
      </fieldset>
      ${difficulte}
      <p class="erreur" id="erreur-form" hidden></p>
      <div class="pile">
        <button type="submit" class="btn btn-principal btn-geant">${options.puisEcheance ? 'Continuer' : 'Enregistrer'}</button>
        <button type="button" class="btn btn-plein" data-action="fermer">Annuler</button>
        ${m ? `<button type="button" class="btn btn-plein btn-danger" data-action="supprimer-matiere" data-id="${m.id}">Supprimer cette matière</button>` : ''}
      </div>
    </form>`);
}

function enregistrerMatiere(form) {
  const f = new FormData(form);
  const nom = String(f.get('nom') || '').trim().replace(/\s+/g, ' ');
  const couleur = /^#[0-9a-f]{6}$/i.test(f.get('couleur')) ? f.get('couleur') : PALETTE[0].code;
  const id = form.dataset.id;
  if (!nom) return erreurForm('Donne un nom à la matière.');
  if (donnees.matieres.some(m => m.id !== id && m.nom.toLowerCase() === nom.toLowerCase())) return erreurForm('Cette matière existe déjà.');

  let idFinal = id;
  if (id) {
    Object.assign(trouverMatiere(id), { nom, couleur });
  } else {
    idFinal = nouvelId();
    donnees.matieres.push({ id: idFinal, nom, couleur });
  }
  sauvegarder();
  rafraichir();
  if (form.dataset.puisEcheance) {
    ouvrirFormEcheance(null, { matiereId: idFinal });
  } else {
    fermerFeuille();
    afficherToast(id ? 'Matière modifiée ✓' : 'Matière ajoutée ✓');
  }
}

async function supprimerMatiere(id) {
  const m = trouverMatiere(id);
  if (!m) return;
  const liees = donnees.echeances.filter(e => e.matiereId === id).length;
  const message = liees
    ? `Supprimer « ${m.nom} » ? ${liees > 1 ? `Ses ${liees} échéances seront aussi supprimées.` : 'Son échéance sera aussi supprimée.'}`
    : `Supprimer la matière « ${m.nom} » ?`;
  if (!(await confirmer(message, 'Supprimer', true))) return;
  donnees.matieres = donnees.matieres.filter(x => x.id !== id);
  donnees.echeances = donnees.echeances.filter(e => e.matiereId !== id);
  sauvegarder();
  fermerFeuille();
  rafraichir();
  afficherToast('Matière supprimée');
}

/* ---------- Sauvegarde dans un fichier : exporter / importer ---------- */

// Le contenu du fichier : tout ce qui compte (pas le chrono en cours).
function contenuExport() {
  return {
    application: "Plan d'étude",
    format: VERSION_DONNEES,
    exporteLe: new Date().toISOString(),
    matieres: donnees.matieres,
    echeances: donnees.echeances,
    blocs: donnees.blocs,
    reglages: donnees.reglages,
    badges: donnees.badges,         // V3
    planJours: donnees.planJours,   // V3 : blocs prévus chaque jour (pour "prévu / fait")
  };
}

async function exporterDonnees() {
  const texte = JSON.stringify(contenuExport(), null, 2);
  const nom = `plan-etude-sauvegarde-${aujourdhui()}.json`;
  const fichier = new File([texte], nom, { type: 'application/json' });
  // Sur iPhone, le menu "Partager" est le plus sûr (→ "Enregistrer dans Fichiers").
  if (estIphone() && navigator.canShare && navigator.canShare({ files: [fichier] })) {
    try {
      await navigator.share({ files: [fichier], title: nom });
      afficherToast('Sauvegarde prête ✓');
    } catch (erreur) { /* partage annulé */ }
    return;
  }
  const url = URL.createObjectURL(fichier);
  const lien = document.createElement('a');
  lien.href = url;
  lien.download = nom;
  document.body.appendChild(lien);
  lien.click();
  lien.remove();
  setTimeout(() => URL.revokeObjectURL(url), 30000);
  afficherToast('Sauvegarde téléchargée ✓');
}

async function importerFichier(fichier) {
  let lu = null;
  try {
    lu = JSON.parse(await fichier.text());
  } catch (erreur) {
    lu = null;
  }
  if (!lu || typeof lu !== 'object' || !Array.isArray(lu.matieres) || !Array.isArray(lu.echeances)) {
    afficherToast("⚠️ Ce fichier n'est pas une sauvegarde de Plan d'étude");
    return;
  }
  const date = new Date(lu.exporteLe);
  const quand = isNaN(date) ? '' : ` du ${dateLongue(cleDate(date))}`;
  const resume = `${pluriel(lu.matieres.length, 'matière')}, ${pluriel(lu.echeances.length, 'échéance')}, ${pluriel((lu.blocs || []).length, 'bloc')}`;
  const ok = await confirmer(`Remplacer toutes tes données actuelles par la sauvegarde${quand} (${resume}) ? Tes données actuelles seront écrasées.`, 'Remplacer mes données', true);
  if (!ok) return;
  const chrono = donnees.chrono;
  donnees = normaliser(lu);   // mêmes vérifications que pour le localStorage (+ migration si c'est un vieux fichier)
  if (chrono && (!chrono.echeanceId || trouverEcheance(chrono.echeanceId))) donnees.chrono = chrono;
  sauvegarder();
  verifierBadges(true);   // un vieux fichier (V1, V2) n'a pas de badges : on les retrouve sans bruit
  majVerrouEcran();
  afficherVue('aujourdhui');
  afficherToast('Données importées ✓');
}


/* =====================================================================
   7. CHRONO POMODORO
   Le chrono ne compte PAS les secondes une par une. Il retient l'heure
   de départ (Date.now()) et calcule : temps écoulé = maintenant − départ.
   Comme ça il reste juste même si l'écran se verrouille ou si l'appli
   est fermée : à ton retour, il se recale tout seul.
   ===================================================================== */

// Temps écoulé dans la phase en cours (en millisecondes).
function ecouleMs(c) {
  return c.dejaEcouleMs + (c.debut ? Date.now() - c.debut : 0);
}

function restantMs(c) {
  return Math.max(0, c.dureeMs - ecouleMs(c));
}

function infosPhase(c) {
  if (c.phase === 'attente') return { libelle: 'Pause terminée', couleur: 'var(--accent)' };
  if (!c.debut) return { libelle: 'En pause', couleur: 'var(--texte-2)' };
  if (c.phase === 'travail') return { libelle: 'Travail', couleur: 'var(--travail)' };
  if (c.phase === 'pauseLongue') return { libelle: 'Grande pause', couleur: 'var(--pause-longue)' };
  return { libelle: 'Petite pause', couleur: 'var(--pause)' };
}

function sujetChrono(c) {
  const e = c.echeanceId ? trouverEcheance(c.echeanceId) : null;
  if (e) return nomEcheanceCourt(e);
  return c.matiereId && trouverMatiere(c.matiereId) ? nomMatiere(c.matiereId) : 'Étude libre';
}

// Bouton "Lancer" du plan du jour (ou du détail d'une échéance).
function lancerDepuisPlan(echeanceId) {
  fermerFeuille();
  const c = donnees.chrono;
  if (c && c.phase !== 'attente') {
    afficherToast('Un bloc est déjà en cours ⏱');
    afficherVue('chrono');
    return;
  }
  demarrerBloc(echeanceId, c ? c.blocsSerie : 0);
}

function demarrerBloc(echeanceId, blocsSerie = 0) {
  preparerSon();
  const e = echeanceId ? trouverEcheance(echeanceId) : null;
  const maintenant = Date.now();
  donnees.chrono = {
    phase: 'travail',
    echeanceId: e ? e.id : null,
    matiereId: e ? e.matiereId : null,
    dureeMs: donnees.reglages.travail * 60000,
    debut: maintenant,     // heure de départ (null quand le chrono est en pause)
    dejaEcouleMs: 0,       // temps déjà écoulé avant une pause
    debutBloc: maintenant, // pour enregistrer la date du bloc
    blocsSerie,            // blocs déjà terminés dans cette série
  };
  if (e) choixChrono = e.id;
  sauvegarder();
  vibrer(30);   // petite vibration : c'est parti !
  majVerrouEcran();
  afficherVue('chrono');
}

function mettreEnPause() {
  verifierChrono();
  const c = donnees.chrono;
  if (!c || !c.debut || c.phase === 'attente') return;
  c.dejaEcouleMs = ecouleMs(c);
  c.debut = null;
  sauvegarder();
  majVerrouEcran();
  rafraichir();
}

function reprendre() {
  preparerSon();
  const c = donnees.chrono;
  if (!c || c.debut || c.phase === 'attente') return;
  c.debut = Date.now();
  sauvegarder();
  majVerrouEcran();
  rafraichir();
}

async function arreter() {
  verifierChrono();
  const c = donnees.chrono;
  if (!c) return;
  if (c.phase === 'travail') {
    const minutes = Math.floor(ecouleMs(c) / 60000);
    if (minutes >= 1) {
      const lectureEnCours = estLecture(trouverEcheance(c.echeanceId));
      const choix = await choisir(lectureEnCours ? `Tu as lu ${minutes} min. On les garde ? (tu noteras ensuite ta page)` : `Tu as travaillé ${minutes} min sur ce bloc. On les garde ?`, [
        { valeur: 'garder', texte: lectureEnCours ? 'Garder et noter ma page' : 'Garder ces minutes et arrêter', style: 'principal' },
        { valeur: 'jeter', texte: lectureEnCours ? 'Arrêter sans rien compter' : 'Arrêter sans les garder', style: 'danger' },
        { valeur: null, texte: 'Continuer le bloc' },
      ]);
      if (!choix) return;
      verifierChrono();  // le bloc a pu se terminer pendant qu'on répondait
      if (donnees.chrono !== c) return;
      if (choix === 'garder' && c.phase === 'travail') {
        enregistrerBloc(c, Math.floor(ecouleMs(c) / 60000));
      }
    }
  }
  donnees.chrono = null;
  quitterConcentration();
  sauvegarder();
  majVerrouEcran();
  rafraichir();
  verifierBadges();
}

// Lecture : "J'ai fini mes pages" → le bloc s'arrête tout de suite, avec le vrai temps passé,
// puis la pause commence et on te demande ta page (l'objectif est proposé).
function finirBlocLecture() {
  verifierChrono();
  const c = donnees.chrono;
  const e = c ? trouverEcheance(c.echeanceId) : null;
  if (!c || c.phase !== 'travail' || !estLecture(e)) return;
  const r = donnees.reglages;
  const minutes = Math.max(1, Math.round(ecouleMs(c) / 60000));
  const bloc = enregistrerBloc(c, minutes);
  blocFiniEnAvance = bloc ? bloc.id : null;
  c.blocsSerie += 1;
  const longue = c.blocsSerie % r.blocsAvantPauseLongue === 0;
  c.phase = longue ? 'pauseLongue' : 'pause';
  c.dureeMs = (longue ? r.pauseLongue : r.pauseCourte) * 60000;
  c.debut = Date.now();
  c.dejaEcouleMs = 0;
  sauvegarder();
  quitterConcentration();
  majVerrouEcran();
  rafraichir();
  celebrer(couleurMatiere(e.matiereId));
  vibrer(30);
  afficherToast(`✓ Lecture enregistrée (${minutes} min) · note ta page`);
  verifierBadges();
}

// Lecture : pas fini à temps ? 5 minutes de plus sur ce bloc.
function allongerBlocLecture() {
  verifierChrono();
  const c = donnees.chrono;
  if (!c || c.phase !== 'travail' || !estLecture(trouverEcheance(c.echeanceId))) return;
  c.dureeMs += 5 * 60000;
  sauvegarder();
  rafraichir();
  afficherToast('+5 min de lecture ⏱');
}

function passerPause() {
  verifierChrono();
  const c = donnees.chrono;
  if (!c || c.phase === 'travail') return;
  demarrerBloc(c.echeanceId, c.blocsSerie);
}

function terminerSerie() {
  donnees.chrono = null;
  quitterConcentration();
  sauvegarder();
  majVerrouEcran();
  rafraichir();
}

// Enregistre un bloc de travail fait (il compte ensuite dans le plan),
// puis on te demandera ton ressenti (Facile / Ok / Dur).
function enregistrerBloc(c, minutes) {
  if (minutes <= 0) return null;
  const bloc = {
    id: nouvelId(),
    echeanceId: c.echeanceId,
    matiereId: c.matiereId,
    date: cleDate(new Date(c.debutBloc)),
    debut: c.debutBloc,
    minutes,
    ressenti: null,
    note: '',
  };
  donnees.blocs.push(bloc);
  donnees.aEvaluer = bloc.id;
  brouillonNote = '';
  return bloc;
}

// Ta réponse "Facile / Ok / Dur" (+ la note) sur le dernier bloc.
// (on lit la note dans la carte où tu as appuyé : la question peut être affichée sur 2 écrans)
function noterBloc(valeur, bouton) {
  const b = donnees.blocs.find(x => x.id === donnees.aEvaluer);
  const carte = bouton && bouton.closest('.ressenti');
  const champ = carte && carte.querySelector('.note-bloc');
  const note = (champ ? champ.value : brouillonNote).trim().slice(0, 120);
  donnees.aEvaluer = null;
  brouillonNote = '';
  if (!b) {
    sauvegarder();
    rafraichir();
    return;
  }
  const avant = b.matiereId ? coefMatiere(b.matiereId) : 1;
  b.ressenti = Object.keys(RESSENTIS).includes(valeur) ? valeur : null;
  b.note = note;
  sauvegarder();
  rafraichir();
  const apres = b.matiereId ? coefMatiere(b.matiereId) : 1;
  let message = b.ressenti ? `Noté : ${RESSENTIS[b.ressenti].nom} ${RESSENTIS[b.ressenti].emoji}` : (note ? 'Note enregistrée ✓' : 'OK, sans ressenti');
  if (apres !== avant) message += ` · ${nomMatiere(b.matiereId)} : difficulté × ${formaterDecimal(apres)}`;
  afficherToast(message);
}

// Vérifie si la phase en cours est finie (appelé 2 fois par seconde et au retour dans l'appli).
// La boucle "while" rattrape tout ce qui s'est passé si l'écran était verrouillé longtemps.
// "silencieux" = sans son ni vibration (à l'ouverture de l'appli).
function verifierChrono(silencieux = false) {
  const c = donnees.chrono;
  if (!c) return;
  const r = donnees.reglages;
  let fin = null;
  let blocsEnregistres = 0;
  let securite = 0;
  while (c.debut && c.phase !== 'attente' && ecouleMs(c) >= c.dureeMs && securite++ < 10) {
    const momentFin = c.debut + (c.dureeMs - c.dejaEcouleMs);  // l'heure exacte où la phase s'est finie
    if (c.phase === 'travail') {
      enregistrerBloc(c, Math.round(c.dureeMs / 60000));
      blocsEnregistres++;
      c.blocsSerie += 1;
      const longue = c.blocsSerie % r.blocsAvantPauseLongue === 0;
      c.phase = longue ? 'pauseLongue' : 'pause';
      c.dureeMs = (longue ? r.pauseLongue : r.pauseCourte) * 60000;
      c.debut = momentFin;   // la pause a commencé à la fin du travail
      c.dejaEcouleMs = 0;
      fin = 'travail';
    } else {
      c.phase = 'attente';
      c.finPause = momentFin;
      c.debut = null;
      c.dejaEcouleMs = 0;
      c.dureeMs = 0;
      fin = 'pause';
    }
  }
  if (!fin) return;
  sauvegarder();
  if (fin === 'travail') quitterConcentration();   // pour répondre "Facile / Ok / Dur"
  if (!silencieux) alerter(fin);
  if (fin === 'travail') {
    afficherToast(`✓ Bloc enregistré ! ${c.phase === 'pauseLongue' ? 'Grande pause' : 'Petite pause'} de ${Math.round(c.dureeMs / 60000)} min`);
  } else if (blocsEnregistres) {
    afficherToast('✓ Bloc enregistré · la pause est finie aussi');
  } else if (!silencieux) {
    afficherToast('Pause terminée ! On reprend ?');  // (pas à l'ouverture de l'appli : la pause peut dater d'hier)
  }
  majVerrouEcran();
  rafraichir();
  if (blocsEnregistres && !silencieux) celebrer(c.matiereId && trouverMatiere(c.matiereId) ? couleurMatiere(c.matiereId) : '#b0abff');
  if (blocsEnregistres) verifierBadges(silencieux);
}

// Son + vibration + flash de l'écran.
function alerter(fin) {
  const r = donnees.reglages;
  if (r.son) jouerSon(fin);
  if (r.vibration && navigator.vibrate) {
    try { navigator.vibrate(fin === 'travail' ? [400, 150, 400, 150, 400] : [250, 120, 250]); } catch (erreur) { /* pas grave */ }
  }
  flasher(fin === 'travail' ? '#34d399' : '#8b93ff');
}

/* ---------- Le son (fabriqué par le navigateur, sans fichier audio) ---------- */

let contexteAudio = null;

// Sur iPhone, le son doit être "débloqué" pendant un appui sur un bouton.
function preparerSon() {
  try {
    const Contexte = window.AudioContext || window.webkitAudioContext;
    if (!Contexte) return;
    if (!contexteAudio) contexteAudio = new Contexte();
    if (contexteAudio.state !== 'running') contexteAudio.resume();
  } catch (erreur) { /* pas de son possible */ }
}

function jouerSon(fin) {
  preparerSon();
  const ctx = contexteAudio;
  if (!ctx) return;
  // Fin du travail : petite mélodie qui monte. Fin de pause : deux notes répétées.
  const notes = fin === 'travail' ? [784, 988, 1175, 784, 988, 1175] : [1175, 880, 1175, 880];
  const depart = ctx.currentTime + 0.05;
  notes.forEach((frequence, i) => {
    const t = depart + i * 0.22;
    const oscillateur = ctx.createOscillator();
    const volume = ctx.createGain();
    oscillateur.type = 'triangle';
    oscillateur.frequency.setValueAtTime(frequence, t);
    volume.gain.setValueAtTime(0.0001, t);
    volume.gain.exponentialRampToValueAtTime(0.35, t + 0.02);
    volume.gain.exponentialRampToValueAtTime(0.0001, t + 0.2);
    oscillateur.connect(volume);
    volume.connect(ctx.destination);
    oscillateur.start(t);
    oscillateur.stop(t + 0.22);
  });
}

/* ---------- Mode concentration : écran noir, juste le temps, la matière et ta dernière note ---------- */

function entrerConcentration() {
  const c = donnees.chrono;
  if (!c || c.phase === 'attente') return;
  concentration = true;
  document.getElementById('concentration').hidden = false;
  document.body.classList.add('bloque');
  majConcentration();
  // Vrai plein écran si le téléphone le permet (Android). Sur iPhone, l'écran noir suffit.
  try {
    const page = document.documentElement;
    if (page.requestFullscreen && !document.fullscreenElement) page.requestFullscreen().catch(() => {});
  } catch (erreur) { /* pas grave */ }
}

function quitterConcentration() {
  if (!concentration) return;
  concentration = false;
  document.getElementById('concentration').hidden = true;
  if (document.getElementById('fond-feuille').hidden) document.body.classList.remove('bloque');
  try {
    if (document.fullscreenElement && document.exitFullscreen) document.exitFullscreen().catch(() => {});
  } catch (erreur) { /* pas grave */ }
}

// Mis à jour 2 fois par seconde (par tic). Se ferme tout seul quand il n'y a plus de bloc ni de pause.
function majConcentration() {
  if (!concentration) return;
  const c = donnees.chrono;
  if (!c || c.phase === 'attente') {
    quitterConcentration();
    return;
  }
  const p = infosPhase(c);
  const phase = document.getElementById('conc-phase');
  phase.textContent = p.libelle;
  phase.style.setProperty('--phase', p.couleur);
  document.getElementById('conc-temps').textContent = formaterChrono(restantMs(c));
  document.getElementById('conc-sujet').textContent = sujetChrono(c);
  const derniere = c.echeanceId ? derniereNote(c.echeanceId) : null;
  document.getElementById('conc-note').textContent = derniere ? `🔖 « ${derniere.note} »` : '';
}

/* ---------- Garder l'écran allumé pendant un bloc (si le téléphone le permet) ---------- */

let verrouEcran = null;
let demandeEnCours = false;

async function majVerrouEcran() {
  if (!('wakeLock' in navigator)) return;
  const c = donnees.chrono;
  const voulu = Boolean(c && c.debut && c.phase !== 'attente' && donnees.reglages.ecranAllume && document.visibilityState === 'visible');
  try {
    if (voulu && !verrouEcran && !demandeEnCours) {
      demandeEnCours = true;
      verrouEcran = await navigator.wakeLock.request('screen');
      verrouEcran.addEventListener('release', () => { verrouEcran = null; });
    } else if (!voulu && verrouEcran) {
      const v = verrouEcran;
      verrouEcran = null;
      await v.release();
    }
  } catch (erreur) {
    verrouEcran = null;
  } finally {
    demandeEnCours = false;
  }
}


/* =====================================================================
   8. CLICS, ÉVÉNEMENTS ET DÉMARRAGE
   Chaque bouton a un attribut data-action="..." qui dit ce qu'il fait.
   Un seul "écouteur" reçoit tous les clics et lance la bonne action.
   ===================================================================== */

    demarrerBloc(coche && coche.value ? coche.value : null);
  },
  'pause': () => mettreEnPause(),
  'reprendre': () => reprendre(),
  'arreter': () => arreter(),
  'passer-pause': () => passerPause(),
  'bloc-suivant': () => demarrerBloc(donnees.chrono ? donnees.chrono.echeanceId : null, donnees.chrono ? donnees.chrono.blocsSerie : 0),
  'terminer': () => terminerSerie(),
  'ressenti': (id, bouton) => noterBloc(bouton.dataset.valeur, bouton),
  'ajouter-echeance': () => ouvrirFormEcheance(null),
  'detail-echeance': id => ouvrirDetailEcheance(id),
  'modifier-echeance': id => ouvrirFormEcheance(id),
  'supprimer-echeance': id => supprimerEcheance(id),
  'test-passe': id => marquerPassee(id),
  'remettre': id => remettreDansPlan(id),
  'ajouter-matiere': () => ouvrirFormMatiere(null),
  'modifier-matiere': id => ouvrirFormMatiere(id),
  'supprimer-matiere': id => supprimerMatiere(id),
  'supprimer-bloc': id => supprimerBloc(id),
  'fermer': () => fermerFeuille(),
  'chapitres-moins': () => changerChapitres(-1),
  'chapitres-plus': () => changerChapitres(1),
  'installer': () => installerAppli(),
  'tester-alerte': () => { preparerSon(); alerter('travail'); },
  'exporter': () => exporterDonnees(),
  'importer': () => document.getElementById('fichier-import').click(),
  'exemple': () => chargerExemple(),
  'reglages-defaut': () => reglagesParDefaut(),
  'tout-effacer': () => toutEffacer(),
  // V3
  'aller-stats': () => afficherVue('stats'),
  'fermer-resume': () => {
    donnees.resumeFerme = lundiDe(aujourdhui());
    sauvegarder();
    rafraichir();
  },

    jourSemaine = bouton.dataset.jour;
    rafraichir();
  },
  'cal-jour': (id, bouton) => {
    jourCalendrier = bouton.dataset.jour;
    rafraichir();
  },
  'periode-stats': (id, bouton) => {
    periodeStats = bouton.dataset.periode === 'mois' ? 'mois' : 'semaine';
    afficherStats();
  },
  'stat-jour': (id, zone, ev) => choisirJourStats(zone, ev),
  'stat-point': id => {
    pointStats = pointStats === id ? null : id;
    afficherStats();
  },
  'concentration': () => entrerConcentration(),
  'quitter-concentration': () => quitterConcentration(),
  'note-resultat': id => ouvrirFormResultat(id),
  'j-ai-lu': id => ouvrirFormLecture(id),
  'fini-lecture': () => finirBlocLecture(),
  'allonger-lecture': () => allongerBlocLecture(),
  'pages-lues': (id, bouton) => enregistrerPagesLues(bouton),
  'passer-lecture': (id, bouton) => passerLecture(bouton),
  'supprimer-seance': id => supprimerSeance(id),
  'effacer-note': id => effacerNote(id),
};

document.addEventListener('click', ev => {
  const cible = ev.target.closest('[data-onglet], [data-action]');
  if (!cible) return;
  if (cible.dataset.onglet) {
    afficherVue(cible.dataset.onglet);
    return;
  }
  const action = cible.dataset.action;
  if (action === 'plus' || action === 'moins') {
    changerReglage(cible, action === 'plus' ? 1 : -1);
    return;
  }
  if (ACTIONS[action]) ACTIONS[action](cible.dataset.id, cible, ev);
});

// Les cartes d'échéance se comportent comme des boutons au clavier (Entrée / Espace).
document.addEventListener('keydown', ev => {
  if ((ev.key === 'Enter' || ev.key === ' ') && ev.target.matches('[role="button"][data-action]')) {
    ev.preventDefault();
    ev.target.click();
  }
  if (ev.key === 'Escape' && concentration) {
    quitterConcentration();
    return;
  }
  if (ev.key === 'Escape' && document.getElementById('fond-dialogue').hidden && !document.getElementById('fond-feuille').hidden) {
    fermerFeuille();
  }
});

document.addEventListener('submit', ev => {

document.addEventListener('input', ev => {

document.addEventListener('change', ev => {
  const t = ev.target;

  if (t.closest('#form-resultat')) {
    if (t.name === 'sur') changerEchelleResultat(t.form);

  }
  if (t.id === 'fichier-import' && t.files && t.files[0]) {
    importerFichier(t.files[0]);
    t.value = '';
  }
  if (t.dataset.reglage) {
    donnees.reglages[t.dataset.reglage] = t.checked;
    sauvegarder();
    majVerrouEcran();
  }
});
document.addEventListener('toggle', ev => {
  if (ev.target.matches && ev.target.matches('details.passees')) passeesOuvertes = ev.target.open;
  if (ev.target.matches && ev.target.matches('details.avance')) avanceOuvert = ev.target.open;
  if (ev.target.matches && ev.target.matches('details.chiffres')) {
    if (ev.target.open) chiffresOuverts.add(ev.target.dataset.cle);
    else chiffresOuverts.delete(ev.target.dataset.cle);
  }
}, true);

// Les graphiques sont dessinés à la largeur de l'écran : on les redessine si elle change.
let minuteurTaille = null;
window.addEventListener('resize', () => {
  clearTimeout(minuteurTaille);
  minuteurTaille = setTimeout(() => { if (vueActive === 'stats') afficherStats(); }, 200);
});

// Toucher le fond sombre ferme la feuille.
document.getElementById('fond-feuille').addEventListener('click', ev => {
  if (ev.target.id === 'fond-feuille') fermerFeuille();
});

// Pendant un chrono, chaque appui "débloque" le son (nécessaire sur iPhone).
document.addEventListener('touchend', () => { if (donnees.chrono) preparerSon(); }, { passive: true });

// Le "battement" de l'appli : 2 fois par seconde.
let dernierJour = aujourdhui();
function tic() {
  verifierChrono();
  majAffichageChrono();
  majOngletChrono();
  majConcentration();
  const jour = aujourdhui();
  if (jour !== dernierJour) {  // on a passé minuit : on recalcule le plan
    dernierJour = jour;
    rafraichir();
  }
}

// Quand on revient dans l'appli (écran déverrouillé, changement d'appli…).
document.addEventListener('visibilitychange', () => {
  if (document.visibilityState === 'visible') tic();
  majVerrouEcran();
});
window.addEventListener('pageshow', tic);

// Si l'appli est ouverte dans un autre onglet et que les données changent là-bas.
window.addEventListener('storage', ev => {
  if (ev.key === CLE_STOCKAGE) {
    charger();
    rafraichir();
  }
});

// ---- Démarrage ----
charger();
verifierChrono(true);
// Une "pause terminée" d'un autre jour n'a plus d'intérêt : on l'oublie.
const ancien = donnees.chrono;
if (ancien && ancien.phase === 'attente' && cleDate(new Date(ancien.finPause || 0)) !== aujourdhui()) {
  donnees.chrono = null;
  sauvegarder();
}
// Badges : ceux que ton travail a déjà mérités (avec la V3, on les retrouve pour tes anciens blocs).
const nouveauxBadges = verifierBadges(migrationFaite);
if (migrationFaite) {
  const n = nouveauxBadges.length;
  setTimeout(() => afficherToast(`✨ Nouvelle version ! Tes données sont gardées${n ? ` · 🏅 ${pluriel(n, 'badge')} débloqué${n > 1 ? 's' : ''} grâce à ton travail` : ''}`), 400);
}
// On ouvre sur le chrono seulement si un bloc ou une pause est en cours.
afficherVue(donnees.chrono && donnees.chrono.phase !== 'attente' ? 'chrono' : 'aujourdhui');
majVerrouEcran();
setInterval(tic, 500);
</script>
</body>
