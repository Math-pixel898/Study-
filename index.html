<div id="concentration" class="concentration" hidden role="dialog" aria-label="Mode concentration">
  <div class="conc-phase" id="conc-phase"></div>
  <div class="conc-temps" id="conc-temps" role="timer"></div>
  <div class="conc-sujet" id="conc-sujet"></div>
  <div class="conc-note" id="conc-note"></div>
  <button class="conc-quitter" data-action="quitter-concentration" type="button">Quitter le mode concentration</button>
</div>
<!-- Sélecteur de fichier (invisible) pour importer une sauvegarde -->
<input type="file" id="fichier-import" hidden>

<script>
'use strict';
/* =====================================================================
   COMPORTEMENT (JavaScript) — V3

   Organisation :
     1. Réglages par défaut et données
     2. Sauvegarde dans le navigateur (localStorage) + migration vers la V3
     3. Petits outils (dates, durées, textes, couleurs)
     4. Calculs : temps d'étude, difficulté perso, LE PLAN, stats et badges
     5. Affichage des 5 écrans (dont Stats et le calendrier)
     6. Formulaires, détail d'une échéance, résultats, export / import
     7. Chrono Pomodoro (+ ressenti après chaque bloc, mode concentration)
     8. Clics, événements et démarrage
   ===================================================================== */


/* =====================================================================
   1. RÉGLAGES PAR DÉFAUT ET DONNÉES
   ===================================================================== */

// Nom du "tiroir" du localStorage où toutes les données sont rangées.
// (on garde le nom de la V1 pour retrouver tes données)
const CLE_STOCKAGE = 'plan-etude-v1';
// Version du format des données. V1 = 1 ; V2 = 2 (type de travail, ressentis, historique, rythme) ;
// V3 = 3 (notes et objectifs, checklist de la veille, badges, blocs prévus jour par jour).
const VERSION_DONNEES = 3;
// Copie de secours des données d'avant la mise à jour (faite une seule fois).
// La copie d'avant la V2 ("plan-etude-copie-avant-v2") reste aussi en place.
const CLE_SECOURS = 'plan-etude-copie-avant-v' + VERSION_DONNEES;

// Couleurs proposées pour les matières.
const PALETTE = [
  { nom: 'Rouge', code: '#ff6b6b' },
  { nom: 'Orange', code: '#ffa94d' },
  { nom: 'Jaune', code: '#ffd43b' },
  { nom: 'Vert clair', code: '#a9e34b' },
  { nom: 'Vert', code: '#51cf66' },
  { nom: 'Turquoise', code: '#38d9a9' },
  { nom: 'Bleu', code: '#4dabf7' },
  { nom: 'Indigo', code: '#748ffc' },
  { nom: 'Violet', code: '#b197fc' },
  { nom: 'Rose', code: '#f783ac' },
];

// Nom des niveaux d'étude (la case 0 n'est pas utilisée).
const NIVEAUX = ['', 'léger', 'moyen', 'costaud', 'très dur'];

// Types de travail d'une échéance.
const TRAVAUX = {
  parcoeur: { nom: 'Par cœur', exemple: 'dates, vocabulaire…' },
  exercices: { nom: 'Exercices', exemple: 'maths, chimie…' },
  mixte: { nom: 'Mixte', exemple: 'un peu des deux' },
};

// Ressentis après un bloc. Le "score" sert au coefficient de difficulté de la matière.
const RESSENTIS = {
  facile: { nom: 'Facile', emoji: '😊', score: -0.6 },
  ok: { nom: 'Ok', emoji: '🙂', score: 0 },
  dur: { nom: 'Dur', emoji: '😓', score: 1 },
};
const NB_RESSENTIS = 8;  // le coefficient regarde tes 8 derniers ressentis dans la matière
const NB_RESULTATS = 3;  // … et tes 3 dernières notes (avec un objectif) dans la matière

// Les échelles possibles pour une note.
const ECHELLES = [
  { sur: 10, nom: 'sur 10' },
  { sur: 20, nom: 'sur 20' },
  { sur: 100, nom: 'en %' },
];

// Les badges (pour la motivation). "heures-10" se gagne une fois par matière.
const BADGES = [
  { id: 'premier-bloc', emoji: '🌱', nom: 'Premier bloc' },
  { id: 'serie-3', emoji: '🔥', nom: "3 jours d'affilée" },
  { id: 'serie-7', emoji: '🔥', nom: "7 jours d'affilée" },
  { id: 'serie-30', emoji: '🏆', nom: "30 jours d'affilée" },
  { id: 'blocs-50', emoji: '💪', nom: '50 blocs' },
  { id: 'heures-10', emoji: '📚', nom: '10 h sur une matière' },
  { id: 'objectif', emoji: '🎯', nom: 'Objectif de note atteint' },
  { id: 'semaine-parfaite', emoji: '⭐', nom: 'Semaine parfaite' },
  { id: 'livre-fini', emoji: '📖', nom: 'Livre terminé' },
];

// Les réglages de départ. Toutes les durées sont en minutes.
const REGLAGES_DEFAUT = {
  dispoSemaine: 60,          // temps dispo du lundi au vendredi
  dispoWeekend: 180,         // temps dispo le samedi et le dimanche
  travail: 25,               // un bloc de travail Pomodoro
  pauseCourte: 5,            // petite pause après chaque bloc
  pauseLongue: 15,           // grande pause…
  blocsAvantPauseLongue: 4,  // … tous les 4 blocs
  tempsBase: {               // temps de base selon le niveau 1, 2, 3, 4
    test:   [30, 90, 180, 300],    // 30 min, 1 h 30, 3 h, 5 h
    examen: [120, 300, 540, 840],  // 2 h, 5 h, 9 h, 14 h
  },
  coefBase: 0.5,             // temps = base × (0,5 + 0,25 × chapitres)
  coefChapitre: 0.25,
  joursAvant: { test: 7, examen: 21 },  // on commence à réviser au plus tôt N jours avant
  progression: 3,            // la veille, on étudie 3 fois plus que le premier jour
  joursEnPlusParCoeur: 7,    // "par cœur" : on peut commencer 7 jours plus tôt
  blocsParSession: 2,        // "exercices" : au moins 2 blocs d'affilée
  minutesParPage: 2,         // lecture : 2 min pour lire une page (30 pages par heure) au départ
  echelleNote: 20,           // échelle proposée pour tes notes : 10, 20 ou 100 (pour les %)
  son: true,
  vibration: true,
  ecranAllume: true,
};

// TOUTES les données de l'appli sont dans cet objet.
let donnees = donneesVides();

function donneesVides() {
  return {
    version: VERSION_DONNEES,
    matieres: [],   // { id, nom, couleur }
    echeances: [],  // { id, matiereId, type: 'test' | 'examen' | 'lecture', date: 'AAAA-MM-JJ', niveau: 1 à 4, chapitres, note,
                    //   travail: 'parcoeur' | 'exercices' | 'mixte', terminee, termineeLe, rythme,
                    //   resultat: { note, sur, objectif } ou null, checklist: { idCase: true } }
                    //   + pour une lecture : titre, pageDebut, pageFin (les pages à lire)
    blocs: [],      // blocs de travail faits : { id, echeanceId, matiereId, date, debut, minutes, ressenti, note }
                    //   + pour une lecture : pages (pages lues), page (page atteinte), manuel (noté sans chrono)
    reglages: copie(REGLAGES_DEFAUT),
    chrono: null,   // le chrono en cours (ou null s'il n'y en a pas)
    aEvaluer: null, // le bloc dont on attend le ressenti (Facile / Ok / Dur)
    badges: {},     // badges gagnés et leur date : { "serie-7": "2026-11-30" }
    planJours: {},  // blocs prévus chaque jour (pour comparer prévu / fait) : { "2026-11-23": 3 }
    resumeFerme: null,  // lundi de la semaine dont tu as fermé le résumé
  };
}

function copie(objet) {
  return JSON.parse(JSON.stringify(objet));
}


/* =====================================================================
   2. SAUVEGARDE DANS LE NAVIGATEUR (localStorage)
   Le localStorage garde du texte même quand on ferme l'appli.
   On y range nos données transformées en texte (format JSON).
   ===================================================================== */

function sauvegarder() {
  try {
    localStorage.setItem(CLE_STOCKAGE, JSON.stringify(donnees));
  } catch (erreur) {
    afficherToast('⚠️ Impossible de sauvegarder sur cet appareil');
  }
}

let migrationFaite = false;  // true si on vient de convertir des données d'une version plus ancienne

function charger() {
  let texte = null;
  let lu = null;
  try {
    texte = localStorage.getItem(CLE_STOCKAGE);
    lu = JSON.parse(texte);
  } catch (erreur) {
    lu = null;
  }
  donnees = normaliser(lu);

  // MIGRATION : si les données viennent d'une version plus ancienne (V1 ou V2),
  // on garde d'abord une copie de secours, puis on les réenregistre au format V3.
  if (lu && typeof lu === 'object' && !(lu.version >= VERSION_DONNEES)) {
    try {
      if (!localStorage.getItem(CLE_SECOURS)) localStorage.setItem(CLE_SECOURS, texte);
    } catch (erreur) { /* pas grave */ }
    migrationFaite = true;
    sauvegarder();
  }
}

// Vérifie et complète des données lues (localStorage ou fichier importé).
// Les champs qui manquent (données de la V1) reçoivent une valeur par défaut :
// c'est ça, la migration automatique.
function normaliser(lu) {
  const d = donneesVides();
  if (!lu || typeof lu !== 'object') return d;
  const idPropre = v => (v ? String(v).replace(/[^a-zA-Z0-9_-]/g, '') : null);

  if (Array.isArray(lu.matieres)) {
    d.matieres = lu.matieres
      .filter(m => m && m.id && m.nom)
      .map(m => ({
        id: idPropre(m.id),
        nom: String(m.nom),
        couleur: /^#[0-9a-f]{6}$/i.test(m.couleur) ? m.couleur : PALETTE[0].code,
      }));
  }
  if (Array.isArray(lu.echeances)) {
    d.echeances = lu.echeances
      .filter(e => e && e.id && estCleDate(e.date))
      .map(e => Object.assign({
        id: idPropre(e.id),
        matiereId: idPropre(e.matiereId),
        type: e.type === 'examen' || e.type === 'lecture' ? e.type : 'test',
        date: e.date,
        niveau: borner(Math.round(Number(e.niveau)) || 1, 1, 4),
        chapitres: borner(Math.round(Number(e.chapitres)) || 1, 1, 99),
        note: String(e.note || ''),
        travail: Object.keys(TRAVAUX).includes(e.travail) ? e.travail : 'mixte',  // nouveau en V2
        terminee: e.terminee === true,                                           // nouveau en V2
        termineeLe: estCleDate(e.termineeLe) ? e.termineeLe : null,              // nouveau en V2
        rythme: normaliserRythme(e.rythme),                                      // nouveau en V2
        resultat: normaliserResultat(e.resultat),                                // nouveau en V3
        checklist: normaliserChecklist(e.checklist),                             // nouveau en V3
      }, e.type === 'lecture' ? normaliserLecture(e) : {}));                     // nouveau : les lectures
  }
  if (Array.isArray(lu.blocs)) {
    d.blocs = lu.blocs
      .filter(b => b && estCleDate(b.date) && Number(b.minutes) > 0)
      .map(b => Object.assign({
        id: idPropre(b.id) || nouvelId(),
        echeanceId: idPropre(b.echeanceId),
        matiereId: idPropre(b.matiereId),
        date: b.date,
        debut: Number(b.debut) || 0,
        minutes: Number(b.minutes),
        ressenti: Object.keys(RESSENTIS).includes(b.ressenti) ? b.ressenti : null,  // nouveau en V2
        note: String(b.note || ''),                                                // nouveau en V2
      }, normaliserPagesBloc(b)));                                                // nouveau : pages lues
  }
  d.reglages = completerReglages(lu.reglages);
  const c = lu.chrono;
  if (c && typeof c === 'object' && ['travail', 'pause', 'pauseLongue', 'attente'].includes(c.phase)) {
    d.chrono = { ...c, echeanceId: idPropre(c.echeanceId), matiereId: idPropre(c.matiereId) };
  }
  const aEvaluer = idPropre(lu.aEvaluer);
  if (aEvaluer && d.blocs.some(b => b.id === aEvaluer)) d.aEvaluer = aEvaluer;
  // Nouveau en V3 : badges gagnés, blocs prévus jour par jour, résumé de la semaine déjà fermé.
  if (lu.badges && typeof lu.badges === 'object') {
    for (const [id, date] of Object.entries(lu.badges)) {
      if (/^[a-z0-9-]+(:[a-zA-Z0-9_-]+)?$/.test(id) && estCleDate(date)) d.badges[id] = date;
    }
  }
  if (lu.planJours && typeof lu.planJours === 'object') {
    for (const [jour, n] of Object.entries(lu.planJours)) {
      if (estCleDate(jour) && Number.isInteger(n) && n >= 0) d.planJours[jour] = n;
    }
  }
  if (estCleDate(lu.resumeFerme)) d.resumeFerme = lu.resumeFerme;
  return d;
}

// Une lecture : le titre du livre et les pages à lire (de pageDebut à pageFin).
function normaliserLecture(e) {
  const debut = borner(Math.round(Number(e.pageDebut)) || 1, 1, 9999);
  return {
    titre: String(e.titre || '').trim().slice(0, 80),
    pageDebut: debut,
    pageFin: borner(Math.round(Number(e.pageFin)) || debut, debut, 9999),
  };
}

// Les pages d'un bloc de lecture (seulement si elles existent : les autres blocs ne changent pas).
function normaliserPagesBloc(b) {
  const x = {};
  if (Number.isInteger(b.pages) && b.pages >= 0 && b.pages <= 9999) x.pages = b.pages;
  if (Number.isInteger(b.page) && b.page >= 0 && b.page <= 9999) x.page = b.page;
  if (b.manuel === true) x.manuel = true;
  return x;
}

// Le "rythme prévu" d'une échéance : { depuis: "AAAA-MM-JJ", prevu: { "AAAA-MM-JJ": minutes } }
function normaliserRythme(r) {
  if (!r || typeof r !== 'object' || !estCleDate(r.depuis) || !r.prevu || typeof r.prevu !== 'object') return null;
  const prevu = {};
  for (const [jour, minutes] of Object.entries(r.prevu)) {
    if (estCleDate(jour) && Number.isFinite(minutes) && minutes > 0) prevu[jour] = minutes;
  }
  return { depuis: r.depuis, prevu };
}

// Le résultat d'une échéance passée : { note, sur: 10 | 20 | 100, objectif (ou null) }
function normaliserResultat(r) {
  if (!r || typeof r !== 'object' || ![10, 20, 100].includes(r.sur)) return null;
  const note = Number(r.note);
  if (r.note === null || !Number.isFinite(note) || note < 0 || note > r.sur) return null;
  const objectif = r.objectif === null || r.objectif === undefined ? null : Number(r.objectif);
  const objectifValide = objectif !== null && Number.isFinite(objectif) && objectif >= 0 && objectif <= r.sur;
  return { note, sur: r.sur, objectif: objectifValide ? objectif : null };
}

// Les cases cochées de la checklist de la veille : { "notes": true, "dormir": true }
function normaliserChecklist(c) {
  const cases = {};
  if (c && typeof c === 'object') {
    for (const [cle, coche] of Object.entries(c)) if (coche === true && /^[a-z0-9-]{1,30}$/.test(cle)) cases[cle] = true;
  }
  return cases;
}

// Part des réglages par défaut et remplace par ceux enregistrés (s'ils sont valides).
// Les réglages ajoutés en V2 prennent donc leur valeur par défaut.
function completerReglages(lus) {
  const r = copie(REGLAGES_DEFAUT);
  if (!lus || typeof lus !== 'object') return r;
  for (const cle of Object.keys(r)) {
    const valeur = lus[cle];
    if (cle === 'tempsBase' || cle === 'joursAvant') {
      for (const type of ['test', 'examen']) {
        const v = valeur && valeur[type];
        if (cle === 'tempsBase' && Array.isArray(v) && v.length === 4 && v.every(Number.isFinite)) r.tempsBase[type] = v;
        if (cle === 'joursAvant' && Number.isFinite(v)) r.joursAvant[type] = v;
      }
    } else if (typeof valeur === typeof r[cle] && (typeof valeur !== 'number' || Number.isFinite(valeur))) {
      r[cle] = valeur;
    }
  }
  if (![10, 20, 100].includes(r.echelleNote)) r.echelleNote = 20;
  return r;
}


/* =====================================================================
   3. PETITS OUTILS
   Les dates sont écrites comme du texte "AAAA-MM-JJ" (ex : "2026-11-26").
   Avantage : on peut les comparer directement ("2026-11-25" < "2026-11-26").
   ===================================================================== */

const JOURS = ['dimanche', 'lundi', 'mardi', 'mercredi', 'jeudi', 'vendredi', 'samedi'];
const JOURS_COURTS = ['dim.', 'lun.', 'mar.', 'mer.', 'jeu.', 'ven.', 'sam.'];
const MOIS = ['janvier', 'février', 'mars', 'avril', 'mai', 'juin', 'juillet', 'août', 'septembre', 'octobre', 'novembre', 'décembre'];
const MOIS_COURTS = ['janv.', 'févr.', 'mars', 'avr.', 'mai', 'juin', 'juil.', 'août', 'sept.', 'oct.', 'nov.', 'déc.'];

function borner(valeur, min, max) {
  return Math.min(max, Math.max(min, valeur));
}

function estCleDate(texte) {
  return typeof texte === 'string' && /^\d{4}-\d{2}-\d{2}$/.test(texte);
}

// Transforme une date JavaScript en texte "AAAA-MM-JJ" (heure locale).
function cleDate(date) {
  const a = date.getFullYear();
  const m = String(date.getMonth() + 1).padStart(2, '0');
  const j = String(date.getDate()).padStart(2, '0');
  return `${a}-${m}-${j}`;
}

function aujourdhui() {
  return cleDate(new Date());
}

// L'inverse : texte "AAAA-MM-JJ" → date JavaScript (à midi, pour éviter les soucis d'heure d'été).
function dateDepuisCle(cle) {
  const [a, m, j] = cle.split('-').map(Number);
  return new Date(a, m - 1, j, 12);
}

function ajouterJours(cle, n) {
  const d = dateDepuisCle(cle);
  d.setDate(d.getDate() + n);
  return cleDate(d);
}

// Nombre de jours entre deux dates (positif si "fin" est après "debut").
function ecartJours(debut, fin) {
  return Math.round((dateDepuisCle(fin) - dateDepuisCle(debut)) / 86400000);
}

function estWeekend(cle) {
  const jour = dateDepuisCle(cle).getDay();
  return jour === 0 || jour === 6;
}

// "jeudi 26 novembre"
function dateLongue(cle) {
  const d = dateDepuisCle(cle);
  return `${JOURS[d.getDay()]} ${d.getDate() === 1 ? '1er' : d.getDate()} ${MOIS[d.getMonth()]}`;
}

// "jeu. 26 nov."
function dateCourte(cle) {
  const d = dateDepuisCle(cle);
  return `${JOURS_COURTS[d.getDay()]} ${d.getDate()} ${MOIS_COURTS[d.getMonth()]}`;
}

// "aujourd'hui", "demain", "jeudi" (dans la semaine), sinon "le 3 déc."
function quandCourt(cle, jour = aujourdhui()) {
  const n = ecartJours(jour, cle);
  const d = dateDepuisCle(cle);
  if (n === 0) return "aujourd'hui";
  if (n === 1) return 'demain';
  if (n > 1 && n < 7) return JOURS[d.getDay()];
  return `le ${d.getDate() === 1 ? '1er' : d.getDate()} ${MOIS_COURTS[d.getMonth()]}`;
}

// "jusqu'à demain", "jusqu'à lundi", sinon "jusqu'au 3 déc."
function jusqua(cle, jour = aujourdhui()) {
  const n = ecartJours(jour, cle);
  const d = dateDepuisCle(cle);
  if (n <= 0) return "aujourd'hui";
  if (n === 1) return "jusqu'à demain";
  if (n < 7) return `jusqu'à ${JOURS[d.getDay()]}`;
  return `jusqu'au ${d.getDate() === 1 ? '1er' : d.getDate()} ${MOIS_COURTS[d.getMonth()]}`;
}

// "dans 4 jours", "demain", "aujourd'hui", "hier", "il y a 3 jours"
function delai(cle, jour = aujourdhui()) {
  const n = ecartJours(jour, cle);
  if (n === 0) return "aujourd'hui";
  if (n === 1) return 'demain';
  if (n === -1) return 'hier';
  return n > 1 ? `dans ${n} jours` : `il y a ${-n} jours`;
}

// Heure "14:05" d'un moment (Date.now())
function heure(moment) {
  const d = new Date(moment || Date.now());
  return String(d.getHours()).padStart(2, '0') + ':' + String(d.getMinutes()).padStart(2, '0');
}

function capitaliser(texte) {
  return texte.charAt(0).toUpperCase() + texte.slice(1);
}

// Le lundi de la semaine d'une date (une semaine va du lundi au dimanche).
function lundiDe(cle) {
  return ajouterJours(cle, -((dateDepuisCle(cle).getDay() + 6) % 7));
}

// "du 16 au 22 nov." ou "du 30 nov. au 6 déc."
function texteSemaine(lundi) {
  const a = dateDepuisCle(lundi);
  const b = dateDepuisCle(ajouterJours(lundi, 6));
  const num = d => (d.getDate() === 1 ? '1er' : d.getDate());
  return a.getMonth() === b.getMonth()
    ? `du ${num(a)} au ${num(b)} ${MOIS_COURTS[b.getMonth()]}`
    : `du ${num(a)} ${MOIS_COURTS[a.getMonth()]} au ${num(b)} ${MOIS_COURTS[b.getMonth()]}`;
}

// "23 nov." (et l'année si ce n'est pas l'année en cours)
function dateCourteSansJour(cle) {
  const d = dateDepuisCle(cle);
  const annee = d.getFullYear() !== new Date().getFullYear() ? ` ${d.getFullYear()}` : '';
  return `${d.getDate() === 1 ? '1er' : d.getDate()} ${MOIS_COURTS[d.getMonth()]}${annee}`;
}

// "13,5/20" ou "65 %"
function formaterNote(note, sur) {
  return sur === 100 ? `${formaterDecimal(note)} %` : `${formaterDecimal(note)}/${sur}`;
}

// Lit un nombre tapé à la française ("13,5", "14/20" ou "65 %" marchent aussi). Case vide → null ; pas un nombre → NaN.
function lireNombre(texte) {
  const t = String(texte == null ? '' : texte).trim().replace(',', '.').replace(/\s*(%|\/\s*(10|20|100))$/, '');
  if (!t) return null;
  return /^\d+(\.\d+)?$/.test(t) ? Number(t) : NaN;
}

// 0.15 → "+0,15" ; -0.1 → "−0,1" ; 0 → "0"
function signe(x) {
  const v = Math.round(x * 100) / 100;
  if (v > 0) return '+' + formaterDecimal(v);
  if (v < 0) return '−' + formaterDecimal(-v);
  return '0';
}

// Coupe un texte trop long : "Histoire-Géographie" → "Histoire-Géo…"
function raccourcir(texte, max) {
  return texte.length > max ? texte.slice(0, max - 1) + '…' : texte;
}

// 45 → "45 min" ; 90 → "1 h 30" ; 120 → "2 h"
function formaterDuree(minutes) {
  minutes = Math.round(minutes);
  if (minutes < 60) return `${minutes} min`;
  const h = Math.floor(minutes / 60);
  const m = minutes % 60;
  return m === 0 ? `${h} h` : `${h} h ${String(m).padStart(2, '0')}`;
}

// 1499000 millisecondes → "24:59"
function formaterChrono(ms) {
  const secondes = Math.max(0, Math.ceil(ms / 1000));
  const m = Math.floor(secondes / 60);
  const s = secondes % 60;
  return `${String(m).padStart(2, '0')}:${String(s).padStart(2, '0')}`;
}

// 0.25 → "0,25"
function formaterDecimal(x) {
  return String(Math.round(x * 100) / 100).replace('.', ',');
}

// pluriel(1, 'bloc') → "1 bloc" ; pluriel(3, 'bloc') → "3 blocs"
function pluriel(n, mot) {
  return `${n} ${mot}${n > 1 ? 's' : ''}`;
}

// Protège un texte tapé par l'utilisateur avant de l'afficher (évite de casser la page).
function echapper(texte) {
  return String(texte == null ? '' : texte).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
}

// Fabrique un identifiant unique, ex : "lx3k9a7f2qz".
function nouvelId() {
  return Date.now().toString(36) + Math.random().toString(36).slice(2, 8);
}

// "de Maths" mais "d'Anglais"
function de(nom) {
  return /^[aeiouhàâäéèêëîïôöùûüœæ]/i.test(nom) ? `d'${nom}` : `de ${nom}`;
}

function estIphone() {
  return /iphone|ipad|ipod/i.test(navigator.userAgent) || (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1);
}

// Couleur "#ff6b6b" → version transparente, et couleur de texte lisible dessus.
function rgba(hex, alpha) {
  const n = parseInt(hex.slice(1), 16);
  return `rgba(${(n >> 16) & 255}, ${(n >> 8) & 255}, ${n & 255}, ${alpha})`;
}
function texteSur(hex) {
  const n = parseInt(hex.slice(1), 16);
  const luminosite = (0.299 * ((n >> 16) & 255) + 0.587 * ((n >> 8) & 255) + 0.114 * (n & 255)) / 255;
  return luminosite > 0.55 ? '#10131a' : '#ffffff';
}
function styleCouleur(hex) {
  return `--couleur:${hex};--couleur-fond:${rgba(hex, 0.16)};--couleur-texte:${texteSur(hex)}`;
}

function trouverMatiere(id) {
  return donnees.matieres.find(m => m.id === id);
}
function trouverEcheance(id) {
  return donnees.echeances.find(e => e.id === id);
}
function nomMatiere(id) {
  const m = trouverMatiere(id);
  return m ? m.nom : 'Matière supprimée';
}
function couleurMatiere(id) {
  const m = trouverMatiere(id);
  return m ? m.couleur : '#8b93ff';
}
function styleMatiere(id) {
  return styleCouleur(couleurMatiere(id));
}
function nomTravail(e) {
  return (TRAVAUX[e.travail] || TRAVAUX.mixte).nom;
}
// "le test de Chimie" / "l'examen d'Anglais"
function nomEcheanceLong(e) {
  const nom = nomMatiere(e.matiereId);
  if (e.type === 'lecture') return e.titre ? `la lecture « ${e.titre} »` : `la lecture ${de(nom)}`;
  return e.type === 'examen' ? `l'examen ${de(nom)}` : `le test ${de(nom)}`;
}
// "Chimie – test jeudi"
function nomEcheanceCourt(e, jour = aujourdhui()) {
  return `${titreEcheance(e)} – ${e.type} ${quandCourt(e.date, jour)}`;
}

/* ---------- Les lectures (livres à lire pour l'école) ----------
   Une lecture se compte en PAGES. Pour la caser dans ton temps dispo, l'appli
   convertit les pages en minutes avec ta vitesse de lecture (2 min par page au
   départ, puis ta vraie vitesse, mesurée quand tu lis avec le chrono). */
function estLecture(e) {
  return Boolean(e) && e.type === 'lecture';
}
// Le nom principal : le titre du livre pour une lecture, sinon la matière.
function titreEcheance(e) {
  if (estLecture(e)) return e.titre || `Lecture ${de(nomMatiere(e.matiereId))}`;
  return nomMatiere(e.matiereId);
}
// "Test", "Examen" ou "Lecture"
function nomType(e) {
  return { test: 'Test', examen: 'Examen', lecture: 'Lecture' }[e.type] || 'Test';
}
function pagesTotal(e) {
  return Math.max(0, e.pageFin - e.pageDebut + 1);
}
// Pages lues (en tout, ou seulement avant / pendant un jour donné).
function pagesLues(e, d = donnees, filtre = () => true) {
  return d.blocs.filter(b => b.echeanceId === e.id && b.pages > 0 && filtre(b)).reduce((s, b) => s + b.pages, 0);
}
// La page où tu en es (0 si pas commencé à la page 1).
function pageActuelle(e, d = donnees) {
  return Math.min(e.pageFin, e.pageDebut - 1 + pagesLues(e, d));
}
// Ta vitesse de lecture (minutes par page) : la moyenne de tes 5 dernières lectures
// chronométrées (au moins 2, avec au moins 3 pages chacune), sinon le réglage.
function vitesseLecture(d = donnees) {
  const lectures = new Set(d.echeances.filter(estLecture).map(e => e.id));
  const sessions = d.blocs
    .filter(b => lectures.has(b.echeanceId) && !b.manuel && b.pages >= 3)
    .sort((x, y) => (x.debut || 0) - (y.debut || 0))
    .slice(-5);
  const parDefaut = d.reglages.minutesParPage || 2;
  if (sessions.length < 2) return parDefaut;
  const minutes = sessions.reduce((s, b) => s + b.minutes, 0);
  const pages = sessions.reduce((s, b) => s + b.pages, 0);
  return borner(Math.round(minutes / pages * 10) / 10, 0.5, 6);
}
// La vitesse vient-elle de tes vraies lectures (true) ou du réglage (false) ?
function vitesseMesuree(d = donnees) {
  const lectures = new Set(d.echeances.filter(estLecture).map(e => e.id));
  return d.blocs.filter(b => lectures.has(b.echeanceId) && !b.manuel && b.pages >= 3).length >= 2;
}
// Total des minutes déjà travaillées pour une échéance.
function minutesFaites(echeanceId) {
  return donnees.blocs.filter(b => b.echeanceId === echeanceId).reduce((total, b) => total + b.minutes, 0);
}
// Les blocs faits pour une échéance, du plus récent au plus ancien.
function blocsDe(echeanceId) {
  return donnees.blocs.filter(b => b.echeanceId === echeanceId).sort((x, y) => (y.debut || 0) - (x.debut || 0));
}
// Le dernier bloc où tu as écrit une note ("exercices p. 42"), pour savoir où tu en étais.
function derniereNote(echeanceId) {
  return blocsDe(echeanceId).find(b => b.note) || null;
}

// Lire / écrire un réglage à partir de son "chemin", ex : "tempsBase.test.2".
function lireChemin(objet, chemin) {
  return chemin.split('.').reduce((o, cle) => o[cle], objet);
}
function ecrireChemin(objet, chemin, valeur) {
  const cles = chemin.split('.');
  const derniere = cles.pop();
  cles.reduce((o, cle) => o[cle], objet)[derniere] = valeur;
}


/* =====================================================================
   4. CALCULS
   ===================================================================== */

// Temps d'étude total estimé pour une échéance (en minutes) :
// temps = temps de base (selon le type et le niveau) × (0,5 + 0,25 × chapitres) × difficulté perso
function tempsEstime(e, r = donnees.reglages, coef = 1, vitesse = null) {
  // Une lecture : nombre de pages × minutes par page (pas de difficulté perso).
  if (e.type === 'lecture') return Math.max(0, Math.round(pagesTotal(e) * (vitesse || r.minutesParPage || 2)));
  const bases = r.tempsBase[e.type] || r.tempsBase.test;
  const base = bases[(e.niveau || 1) - 1] || 0;
  const facteur = r.coefBase + r.coefChapitre * (e.chapitres || 0);
  return Math.max(0, Math.round(base * facteur * coef));
}

// Même calcul pour une échéance des vraies données (avec le coefficient de sa matière).
function tempsEcheance(e) {
  if (estLecture(e)) return tempsEstime(e, donnees.reglages, 1, vitesseLecture());
  return tempsEstime(e, donnees.reglages, coefMatiere(e.matiereId));
}

// Nombre de blocs pour un temps donné : TOUJOURS arrondi vers le haut.
// Ex. avec des blocs de 25 min : 25 min → 1 bloc, 30 min → 2 blocs, 50 min → 2 blocs.
function blocsPour(minutes, dureeBloc) {
  return minutes > 0 ? Math.ceil(minutes / dureeBloc) : 0;
}

/* ---------- Coefficient de difficulté perso ----------
   Chaque matière part de 1,0. Deux choses le font bouger :
   1) tes 8 derniers ressentis dans la matière (V2) : "Dur" compte +1, "Ok" 0,
      "Facile" −0,6 → part "ressentis" = 0,5 × moyenne (de −0,3 à +0,5) ;
   2) tes 3 dernières notes avec un objectif (V3) : sous l'objectif, ça monte
      (au moins +0,05, jusqu'à +0,3 par note) ; largement au-dessus (10 points
      de plus), ça baisse un peu (−0,05, ou −0,1 à 20 points de plus)
      → part "notes" (de −0,2 à +0,4).
   Coefficient = 1 + part ressentis + part notes, arrondi à 0,05 près,
   et toujours entre × 0,7 et × 1,5.                                          */

// Effet d'une note sur la difficulté (en "points" de coefficient). Sans objectif : aucun effet.
function effetResultat(res) {
  if (!res || res.objectif === null || res.objectif === undefined) return 0;
  const ecart = (res.note - res.objectif) / res.sur * 100;   // écart en points de pourcentage
  if (ecart < 0) return Math.min(0.3, Math.max(0.05, -ecart / 100));  // ex : 11/20 pour 14/20 visé → +0,15
  if (ecart >= 20) return -0.1;
  if (ecart >= 10) return -0.05;
  return 0;   // objectif atteint, sans plus : on ne touche à rien
}

// Les deux parts de la difficulté d'une matière (pour la calculer et pour l'expliquer à l'écran).
function partsDifficulte(matiereId, blocs, echeances) {
  const ressentis = blocs
    .filter(b => b.matiereId === matiereId && b.ressenti)
    .sort((x, y) => (x.debut || 0) - (y.debut || 0))
    .slice(-NB_RESSENTIS)
    .map(b => b.ressenti);
  const notes = echeances
    .filter(e => e.matiereId === matiereId && e.terminee && e.resultat && e.resultat.objectif !== null)
    .sort((x, y) => (x.date < y.date ? -1 : x.date > y.date ? 1 : 0))
    .slice(-NB_RESULTATS);
  return {
    ressentis,
    notes,
    partRessentis: 0.5 * ressentis.reduce((total, r) => total + RESSENTIS[r].score, 0) / NB_RESSENTIS,
    partNotes: borner(notes.reduce((total, e) => total + effetResultat(e.resultat), 0), -0.2, 0.4),
  };
}

function coefsDifficulte(blocs, echeances = []) {
  const ids = new Set();
  for (const b of blocs) if (b.matiereId && b.ressenti) ids.add(b.matiereId);
  for (const e of echeances) if (e.terminee && e.resultat && e.resultat.objectif !== null) ids.add(e.matiereId);
  const coefs = {};
  for (const id of ids) {
    const p = partsDifficulte(id, blocs, echeances);
    coefs[id] = borner(Math.round((1 + p.partRessentis + p.partNotes) * 20) / 20, 0.7, 1.5);  // arrondi à 0,05 près
  }
  return coefs;
}

function coefMatiere(matiereId) {
  return coefsDifficulte(donnees.blocs, donnees.echeances)[matiereId] || 1;
}

// Durée (en minutes) de "nb" blocs enchaînés, avec les pauses entre les blocs.
// Ex. avec 25/5/15 : 2 blocs = 25 + 5 + 25 = 55 min.
function dureeSerie(nb, r) {
  if (nb <= 0) return 0;
  const pauses = nb - 1;
  const longues = Math.floor(pauses / r.blocsAvantPauseLongue);
  const courtes = pauses - longues;
  return nb * r.travail + courtes * r.pauseCourte + longues * r.pauseLongue;
}

// Combien de blocs tiennent dans un temps donné (pauses comprises) ?
// Ex : 1 h → 2 blocs ; 3 h → 5 blocs.
function blocsDansDuree(minutes, r) {
  let nb = 0;
  while (nb < 60 && dureeSerie(nb + 1, r) <= minutes) nb++;
  return nb;
}

// Nombre de blocs possibles un jour donné (semaine ou week-end).
function capaciteDuJour(cle, r = donnees.reglages) {
  return blocsDansDuree(estWeekend(cle) ? r.dispoWeekend : r.dispoSemaine, r);
}

// Combien de jours avant la date on peut commencer à réviser.
// "Par cœur" commence plus tôt (7 jours de plus par défaut).
function dureeFenetre(e, r) {
  if (e.type === 'lecture') return 3650;   // une lecture se commence tout de suite
  return (r.joursAvant[e.type] || 7) + (e.travail === 'parcoeur' ? (r.joursEnPlusParCoeur || 0) : 0);
}

// "Poids" d'un jour pour une échéance : 1 le premier jour possible,
// puis ça augmente jusqu'à 3 la veille (avec le réglage "progression" = 3).
function poidsDuJour(cle, e, r) {
  if (e.type === 'lecture') return 1;     // une lecture : un peu chaque jour, régulièrement
  const L = dureeFenetre(e, r);           // 7 jours (test) ou 21 jours (examen), plus pour "par cœur"
  const k = ecartJours(cle, e.date);      // 1 = la veille, L = le premier jour possible
  if (L <= 1) return 1;
  return 1 + (r.progression - 1) * (L - k) / (L - 1);
}

// Ordre de priorité : la date la plus proche d'abord.
function comparerPriorite(a, b) {
  if (a.date !== b.date) return a.date < b.date ? -1 : 1;
  if (a.type !== b.type) return ({ examen: 0, test: 1, lecture: 2 })[a.type] - ({ examen: 0, test: 1, lecture: 2 })[b.type];
  if (a.niveau !== b.niveau) return b.niveau - a.niveau;
  return a.id < b.id ? -1 : a.id > b.id ? 1 : 0;
}

/* ---------------------------------------------------------------------
   LE PLAN : comment l'appli répartit le travail
   ---------------------------------------------------------------------
   Chaque jour, pour chaque échéance à venir :
     • temps restant = temps estimé − temps déjà étudié pour cette
       échéance, converti en blocs (arrondi vers le haut) ;
     • jours possibles : de 7 jours avant (test) ou 21 jours avant
       (examen) jusqu'à la veille — jamais le jour même ;
     • chaque jour a un "poids" qui grandit à l'approche de la date ;
     • on pose les blocs sur les jours qui en "méritent" le plus, sans
       dépasser le temps dispo du jour, selon le type de travail :
         - mixte     : bloc par bloc, selon le poids ;
         - par cœur  : 1 bloc par jour sur le plus de jours possible ;
         - exercices : des séances d'au moins 2 blocs d'affilée.
   Les échéances passent de la plus proche à la plus lointaine : la plus
   proche se sert en premier (elle est prioritaire). Quand il n'y a plus
   de place, on essaie de décaler un bloc d'une autre échéance vers un
   jour libre ; sinon, ce qui ne rentre pas devient une alerte.
   Comme le plan repart chaque jour du temps qui reste vraiment, un jour
   sauté est automatiquement réparti sur les jours suivants, et un jour
   où tu en fais plus allège les jours suivants.
   --------------------------------------------------------------------- */
function calculerPlan(jour = aujourdhui(), d = donnees) {
  const r = d.reglages;
  const W = r.travail;                  // durée d'un bloc (25 min)
  const demain = ajouterJours(jour, 1);
  const coefs = coefsDifficulte(d.blocs, d.echeances);

  // a) Minutes déjà travaillées pour chaque échéance : avant aujourd'hui, et aujourd'hui.
  //    (une lecture compte ses PAGES lues, converties en minutes avec ta vitesse de lecture)
  const vitesse = vitesseLecture(d);
  const lectures = new Set(d.echeances.filter(estLecture).map(e => e.id));
  const valeurBloc = b => (lectures.has(b.echeanceId) ? (b.pages || 0) * vitesse : b.minutes);
  const faitAvant = {};
  const faitAujourdhui = {};
  for (const b of d.blocs) {
    if (!b.echeanceId) continue;
    if (b.date < jour) faitAvant[b.echeanceId] = (faitAvant[b.echeanceId] || 0) + valeurBloc(b);
    else if (b.date === jour) faitAujourdhui[b.echeanceId] = (faitAujourdhui[b.echeanceId] || 0) + valeurBloc(b);
  }

  // b) Les échéances à préparer (pas terminées, date après aujourd'hui), la plus proche d'abord.
  const infos = d.echeances
    .filter(e => !e.terminee && e.date > jour)
    .sort(comparerPriorite)
    .map(e => {
      const coef = estLecture(e) ? 1 : (coefs[e.matiereId] || 1);
      const total = tempsEstime(e, r, coef, vitesse);
      const avant = faitAvant[e.id] || 0;
      return {
        echeance: e,
        coef,                                      // difficulté perso de la matière
        total,                                     // minutes nécessaires au total
        faitAvant: avant,                          // minutes faites les jours d'avant
        faitAujourdhui: faitAujourdhui[e.id] || 0, // minutes faites aujourd'hui
        restant: Math.max(0, total - avant),       // minutes à faire à partir d'aujourd'hui
        premierJour: ajouterJours(e.date, -dureeFenetre(e, r)),
        veille: ajouterJours(e.date, -1),
      };
    });

  // c) Nombre de blocs possibles chaque jour, d'aujourd'hui jusqu'à la dernière veille.
  const capacites = {};
  const dernierJour = infos.reduce((max, i) => (i.veille > max ? i.veille : max), jour);
  for (let j = jour; j <= dernierJour; j = ajouterJours(j, 1)) capacites[j] = capaciteDuJour(j, r);

  // La "demande" d'une échéance : combien de blocs, sur quels jours, avec quels poids, et comment.
  function demande(info, aPartirDe, blocs) {
    const jours = [];
    const poids = [];
    const debut = info.premierJour > aPartirDe ? info.premierJour : aPartirDe;
    for (let j = debut; j <= info.veille; j = ajouterJours(j, 1)) {
      jours.push(j);
      poids.push(poidsDuJour(j, info.echeance, r));
    }
    const mode = info.echeance.travail || 'mixte';
    const session = Math.max(1, r.blocsParSession || 1);
    // "groupe" = taille d'une séance (2 blocs d'affilée pour les exercices, sinon 1)
    const groupe = mode === 'exercices' && blocs >= session ? session : 1;
    return { id: info.echeance.id, blocs, jours, poids, mode, groupe };
  }

  // d) 1er passage : on répartit tout ce qui reste à partir d'aujourd'hui.
  //    On en garde le plan d'aujourd'hui (il reste fixe toute la journée).
  const passage1 = repartir(infos.map(i => demande(i, jour, blocsPour(i.restant, W))), capacites);
  for (const i of infos) i.prevuAujourdhui = passage1.alloc[i.echeance.id][jour] || 0;

  // e) 2e passage : ce qui restera après aujourd'hui est réparti sur les jours suivants.
  //    (si tu fais plus que prévu aujourd'hui, les jours suivants s'allègent tout de suite)
  const capacitesFutures = Object.assign({}, capacites);
  delete capacitesFutures[jour];
  for (const i of infos) {
    const compteAujourdhui = Math.max(i.prevuAujourdhui * W, i.faitAujourdhui);
    i.restantApres = Math.max(0, i.restant - compteAujourdhui);
  }
  const passage2 = repartir(infos.map(i => demande(i, demain, blocsPour(i.restantApres, W))), capacitesFutures);
  for (const i of infos) {
    i.futur = passage2.alloc[i.echeance.id];    // ex : { "2026-11-24": 2, "2026-11-25": 1 }
    i.manque = passage2.manque[i.echeance.id];  // blocs qu'on n'a pas pu placer
    i.faitsAujourdhui = Math.floor(i.faitAujourdhui / W + 0.01);  // blocs entiers faits aujourd'hui
    i.resteAFaire = Math.max(0, i.prevuAujourdhui - i.faitsAujourdhui) + Object.values(i.futur).reduce((s, n) => s + n, 0);
  }

  // f) Marge et retard de chaque échéance (de la plus urgente à la moins urgente).
  //    Une échéance passe avant les moins urgentes : les places qu'elles occupent comptent
  //    donc comme de la marge pour elle. "utilises" = places prises par elle et les plus urgentes.
  const utilises = {};
  for (const i of infos) {
    utilises[jour] = (utilises[jour] || 0) + i.prevuAujourdhui;
    for (const [j, n] of Object.entries(i.futur)) utilises[j] = (utilises[j] || 0) + n;

    // Marge = places encore disponibles pour elle sur ses jours possibles.
    let marge = 0;
    let joursUtiles = 0;
    for (let j = i.premierJour > jour ? i.premierJour : jour; j <= i.veille; j = ajouterJours(j, 1)) {
      marge += Math.max(0, capacites[j] - (utilises[j] || 0));
      if (capacites[j] > 0) joursUtiles++;
    }
    i.marge = marge;
    // Zéro marge : tous les jours possibles sont déjà au maximum → sauter un jour = être en retard.
    i.zeroMarge = i.manque === 0 && i.resteAFaire > 0 && marge === 0;

    // Retard : on compare ce qui était prévu les jours passés (le "rythme" retenu)
    // avec ce que tu as vraiment fait ces jours-là.
    i.retard = null;
    const ref = i.echeance.rythme;
    if (ref && ref.depuis < jour) {
      let attendu = 0;
      for (const [j, minutes] of Object.entries(ref.prevu)) if (j >= ref.depuis && j < jour) attendu += minutes;
      const fait = d.blocs
        .filter(b => b.echeanceId === i.echeance.id && b.date >= ref.depuis && b.date < jour)
        .reduce((s, b) => s + valeurBloc(b), 0);
      const retard = Math.min(attendu - fait, i.restant);
      if (retard >= W && joursUtiles > 0) {
        const parJour = Math.ceil(retard / joursUtiles / 5) * 5;   // arrondi aux 5 min au-dessus
        // "Trop serré" = au moins 10 min de plus par jour : là, on te prévient.
        i.retard = { minutes: retard, parJour, jusqua: i.veille, visible: parJour >= 10 };
      }
    }
  }

  // g) Ce qu'on affiche : le plan du jour, les 7 prochains jours, les alertes.
  const lignesDuJour = infos
    .filter(i => i.prevuAujourdhui > 0 || i.faitsAujourdhui > 0)
    .map(i => ({ info: i, prevus: i.prevuAujourdhui, faits: i.faitsAujourdhui }));

  const semaine = [];
  for (let n = 1; n <= 7; n++) {
    const j = ajouterJours(jour, n);
    const items = infos.filter(i => i.futur[j] > 0).map(i => ({ info: i, blocs: i.futur[j] }));
    semaine.push({
      jour: j,
      capacite: capacites[j] !== undefined ? capacites[j] : capaciteDuJour(j, r),
      total: items.reduce((somme, x) => somme + x.blocs, 0),
      items,
      echeancesDuJour: d.echeances.filter(e => e.date === j && !e.terminee).sort(comparerPriorite),
    });
  }

  // Une seule alerte par échéance, la plus grave : manque de temps > retard > zéro marge.
  const alertes = [];
  for (const i of infos) {
    if (i.manque > 0) alertes.push({ info: i, type: 'manque', minutes: i.manque * W });
    else if (i.retard && i.retard.visible) alertes.push({ info: i, type: 'retard', minutes: i.retard.minutes });
    else if (i.zeroMarge) alertes.push({ info: i, type: 'marge', minutes: 0 });
  }
  const parId = {};
  for (const i of infos) parId[i.echeance.id] = i;

  return { jour, W, vitesse, capaciteAujourdhui: capacites[jour], infos, lignesDuJour, semaine, alertes, parId };
}

// Retient le "rythme prévu" de chaque échéance tant que tu es à jour.
// Si tu prends du retard, on garde l'ancien rythme : c'est lui qui permet de mesurer le retard.
// Renvoie true si quelque chose a changé (il faut alors sauvegarder).
function memoriserRythme(plan) {
  let change = false;
  for (const i of plan.infos) {
    if (i.retard) continue;
    const prevu = {};
    if (i.prevuAujourdhui > 0) prevu[plan.jour] = i.prevuAujourdhui * plan.W;
    for (const [j, n] of Object.entries(i.futur)) if (n > 0) prevu[j] = n * plan.W;
    const nouveau = { depuis: plan.jour, prevu };
    if (JSON.stringify(i.echeance.rythme) !== JSON.stringify(nouveau)) {
      i.echeance.rythme = nouveau;
      change = true;
    }
  }
  return change;
}

// Le plan d'aujourd'hui pour tes vraies données (et on retient le rythme prévu,
// ainsi que le nombre de blocs prévus chaque jour).
function planActuel() {
  const plan = calculerPlan(aujourdhui(), donnees);
  const rythmeChange = memoriserRythme(plan);
  const joursChange = memoriserPlanJours(plan);
  if (rythmeChange || joursChange) sauvegarder();
  return plan;
}

// Retient combien de blocs sont prévus chaque jour (aujourd'hui et les jours à venir).
// Les jours passés gardent le dernier plan connu : ça sert à comparer "prévu / fait".
function memoriserPlanJours(plan, d = donnees) {
  const parJour = {};
  const limite = ajouterJours(plan.jour, -400);   // on garde un peu plus d'un an
  for (const [j, n] of Object.entries(d.planJours)) if (j < plan.jour && j >= limite) parJour[j] = n;
  parJour[plan.jour] = plan.infos.reduce((somme, i) => somme + i.prevuAujourdhui, 0);
  for (const i of plan.infos) {
    for (const [j, n] of Object.entries(i.futur)) if (n > 0) parJour[j] = (parJour[j] || 0) + n;
  }
  const trie = {};
  for (const j of Object.keys(parJour).sort()) trie[j] = parJour[j];
  if (JSON.stringify(trie) === JSON.stringify(d.planJours)) return false;
  d.planJours = trie;
  return true;
}

// Répartit des blocs sur des jours.
//   demandes  : liste (de la plus prioritaire à la moins prioritaire) de
//               { id, blocs, jours, poids, mode, groupe }
//   capacites : { "2026-11-23": 2, "2026-11-24": 5, ... } = blocs possibles par jour
// Renvoie { alloc: { id: { jour: nombreDeBlocs } }, manque: { id: blocsNonPlaces } }
function repartir(demandes, capacites) {
  const libre = Object.assign({}, capacites);  // places encore libres chaque jour
  const alloc = {};
  const manque = {};
  const dejaTraitees = [];
  for (const dem of demandes) {
    const a = {};
    for (const j of dem.jours) a[j] = 0;
    alloc[dem.id] = a;
    let reste = dem.blocs;
    while (reste > 0) {
      let pose = placer(dem, a, libre, reste);
      // Plus de place : on décale un bloc d'une échéance plus proche (si ça permet de poser une séance)…
      if (!pose && faireDeLaPlace(dem, dejaTraitees, alloc, libre, j => placeUtile(dem, a, libre, j, reste))) continue;
      // … pour les exercices, un bloc seul vaut mieux que rien…
      if (!pose && dem.groupe > 1) pose = placerUnBloc(dem, a, libre);
      // … et en dernier recours, on décale n'importe quel bloc.
      if (!pose && faireDeLaPlace(dem, dejaTraitees, alloc, libre)) continue;
      if (!pose) break;
      reste -= pose;
    }
    manque[dem.id] = reste;
    dejaTraitees.push(dem);
  }
  return { alloc, manque };
}

// Pose 1 ou plusieurs blocs selon le type de travail. Renvoie le nombre de blocs posés (0 = pas de place).
function placer(dem, a, libre, reste) {
  if (dem.mode === 'parcoeur') {
    // Par cœur : d'abord les jours qui n'ont encore aucun bloc de cette échéance (1 bloc par jour),
    // et parmi eux, le jour au plus grand poids.
    return poserSur(dem, a, libre, choisirJour(dem, j => libre[j] > 0, (j, k) => dem.poids[k] - 1000 * a[j]), 1);
  }
  if (dem.groupe > 1) {
    // Exercices : une nouvelle séance de 2 blocs d'affilée, sur un jour qui a la place…
    if (reste >= dem.groupe) {
      const k = choisirJour(dem, j => libre[j] >= dem.groupe, (j, k2) => dem.poids[k2] / (a[j] / dem.groupe + 1));
      if (k !== -1) return poserSur(dem, a, libre, k, dem.groupe);
    }
    // … sinon on allonge une séance déjà prévue (jamais de bloc tout seul ici).
    return poserSur(dem, a, libre, choisirJour(dem, j => libre[j] > 0 && a[j] >= dem.groupe, (j, k) => dem.poids[k] / (a[j] + 1)), 1);
  }
  return placerUnBloc(dem, a, libre);
}

// Mixte : le jour qui "mérite" le plus le bloc = poids ÷ (blocs déjà posés ce jour-là + 1).
function placerUnBloc(dem, a, libre) {
  return poserSur(dem, a, libre, choisirJour(dem, j => libre[j] > 0, (j, k) => dem.poids[k] / (a[j] + 1)), 1);
}

function poserSur(dem, a, libre, k, n) {
  if (k === -1) return 0;
  const j = dem.jours[k];
  a[j] += n;
  libre[j] -= n;
  return n;
}

// Parmi les jours acceptés, celui qui a le meilleur score (en cas d'égalité : le plus proche de la date).
function choisirJour(dem, accepte, score) {
  let meilleur = -1;
  let meilleurScore = -Infinity;
  dem.jours.forEach((j, k) => {
    if (!accepte(j)) return;
    const s = score(j, k);
    if (s >= meilleurScore - 1e-9) {
      meilleur = k;
      meilleurScore = s;
    }
  });
  return meilleur;
}

// Libérer une place ce jour-là servirait-il ? (pour les exercices : il faut pouvoir y poser une séance)
function placeUtile(dem, a, libre, j, reste) {
  if (dem.groupe <= 1) return true;
  return (reste >= dem.groupe && libre[j] + 1 >= dem.groupe) || a[j] >= dem.groupe;
}

// Libère une place sur un des jours de "dem" en déplaçant un bloc d'une échéance
// déjà placée vers un autre de SES jours possibles qui a encore de la place.
// On déplace le bloc qui compte le moins pour l'autre échéance (souvent un de ses
// premiers jours) : elle garde ainsi ses révisions juste avant sa date.
function faireDeLaPlace(dem, dejaTraitees, alloc, libre, utile = () => true) {
  let choix = null;
  for (const autre of dejaTraitees) {
    const a = alloc[autre.id];
    autre.jours.forEach((jour, k) => {
      if (!(a[jour] > 0) || !dem.jours.includes(jour) || !utile(jour)) return;
      const cible = cibleDeplacement(autre, a, libre, jour);
      if (!cible) return;
      const cout = autre.poids[k] / a[jour];   // ce que vaut ce bloc pour l'autre échéance
      if (!choix || cout < choix.cout) choix = { a, jour, cible, cout };
    });
  }
  if (!choix) return false;
  choix.a[choix.jour] -= 1;      // l'autre échéance quitte ce jour…
  choix.a[choix.cible] += 1;     // … pour un jour qui a encore de la place
  libre[choix.cible] -= 1;
  libre[choix.jour] += 1;        // une place se libère pour "dem"
  return true;
}

// Le jour où un bloc de "autre" peut aller (le plus proche de sa date), en respectant son type de travail.
function cibleDeplacement(autre, a, libre, depuis) {
  for (let m = autre.jours.length - 1; m >= 0; m--) {
    const j = autre.jours[m];
    if (j === depuis || !(libre[j] > 0)) continue;
    if (autre.mode === 'parcoeur' && a[j] >= a[depuis]) continue;   // garder 1 bloc par jour
    if (autre.groupe > 1 && (a[depuis] - 1 < autre.groupe || a[j] < autre.groupe)) continue;  // ne pas casser une séance
    return j;
  }
  return null;
}

   STATS, BADGES ET VEILLE D'EXAMEN (calculés à partir de tes blocs et notes)
   --------------------------------------------------------------------- */

// Minutes étudiées par jour, au total et par matière ("libre" = étude libre).
function etudeParJour(blocs) {
  const jours = {};
  for (const b of blocs) {
    const j = jours[b.date] || (jours[b.date] = { total: 0, parMatiere: {} });
    const cle = b.matiereId || 'libre';
    j.total += b.minutes;
    j.parMatiere[cle] = (j.parMatiere[cle] || 0) + b.minutes;
  }
  return jours;
}

// Minutes par matière entre deux dates (incluses), de la plus travaillée à la moins travaillée.
function etudeParMatiere(blocs, debut, fin) {
  const total = {};
  for (const b of blocs) {
    if (b.date < debut || b.date > fin) continue;
    const cle = b.matiereId || 'libre';
    total[cle] = (total[cle] || 0) + b.minutes;
  }
  return Object.entries(total).map(([id, minutes]) => ({ id, minutes })).sort((a, b) => b.minutes - a.minutes);
}

// Série de jours d'affilée avec de l'étude ("streak") et record.
// Un jour où ton temps dispo est réglé à 0 ne casse pas la série (et ne la fait pas monter).
// Aujourd'hui ne casse pas la série tant que la journée n'est pas finie.
// "atteint" donne la date où la série a atteint 3, 7 et 30 jours pour la première fois.
function series(d, jour = aujourdhui()) {
  const etudie = new Set(d.blocs.filter(b => b.minutes > 0 && b.date <= jour).map(b => b.date));
  const res = { actuelle: 0, record: 0, aujourdhuiFait: etudie.has(jour), atteint: {} };
  if (!etudie.size) return res;
  let courant = 0;
  for (let j = [...etudie].sort()[0]; j <= jour; j = ajouterJours(j, 1)) {
    if (etudie.has(j)) {
      courant++;
      res.record = Math.max(res.record, courant);
      for (const n of [3, 7, 30]) if (courant >= n && !res.atteint[n]) res.atteint[n] = j;
    } else if (j !== jour && capaciteDuJour(j, d.reglages) > 0) {
      courant = 0;
    }
  }
  res.actuelle = courant;
  return res;
}

// Résumé d'une semaine (du lundi au dimanche) : temps, matière la plus travaillée, blocs prévus / faits.
function resumeSemaine(d, lundi) {
  const dimanche = ajouterJours(lundi, 6);
  const minutes = (debut, fin) => d.blocs.filter(b => b.date >= debut && b.date <= fin).reduce((s, b) => s + b.minutes, 0);
  const total = minutes(lundi, dimanche);
  const joursSuivis = Object.keys(d.planJours).filter(j => j >= lundi && j <= dimanche);
  return {
    lundi,
    dimanche,
    total,
    totalAvant: minutes(ajouterJours(lundi, -7), ajouterJours(lundi, -1)),
    top: etudeParMatiere(d.blocs, lundi, dimanche).find(x => x.id !== 'libre') || null,
    faits: Math.round(total / d.reglages.travail),   // en blocs (blocs partiels compris)
    prevus: joursSuivis.length ? joursSuivis.reduce((s, j) => s + d.planJours[j], 0) : null,
  };
}

// Tes notes, avec le temps étudié pour chaque échéance (de la plus ancienne à la plus récente).
function resultatsAvecEtude(d) {
  return d.echeances
    .filter(e => e.terminee && e.resultat)
    .map(e => ({
      echeance: e,
      pourcent: e.resultat.note / e.resultat.sur * 100,
      minutes: d.blocs.filter(b => b.echeanceId === e.id).reduce((s, b) => s + b.minutes, 0),
      atteint: e.resultat.objectif !== null ? e.resultat.note >= e.resultat.objectif : null,
    }))
    .sort((a, b) => (a.echeance.date < b.echeance.date ? -1 : a.echeance.date > b.echeance.date ? 1 : 0));
}

// Est-ce que deux choses vont ensemble ? De −1 (quand l'une monte, l'autre baisse)
// à +1 (elles montent ensemble). null si on ne peut pas le dire.
function correlation(points) {
  const n = points.length;
  if (n < 2) return null;
  const mx = points.reduce((s, p) => s + p.x, 0) / n;
  const my = points.reduce((s, p) => s + p.y, 0) / n;
  let sxy = 0;
  let sxx = 0;
  let syy = 0;
  for (const p of points) {
    sxy += (p.x - mx) * (p.y - my);
    sxx += (p.x - mx) ** 2;
    syy += (p.y - my) ** 2;
  }
  return sxx && syy ? sxy / Math.sqrt(sxx * syy) : null;
}

// Les badges que tes données méritent, avec la date où ils ont été gagnés.
function badgesMerites(d, jour = aujourdhui()) {
  const gagnes = {};
  const blocs = d.blocs
    .filter(b => b.date <= jour)
    .sort((x, y) => (x.date < y.date ? -1 : x.date > y.date ? 1 : (x.debut || 0) - (y.debut || 0)));
  if (blocs.length) gagnes['premier-bloc'] = blocs[0].date;
  if (blocs.length >= 50) gagnes['blocs-50'] = blocs[49].date;
  const s = series(d, jour);
  for (const n of [3, 7, 30]) if (s.atteint[n]) gagnes['serie-' + n] = s.atteint[n];
  const cumul = {};
  for (const b of blocs) {
    if (!b.matiereId) continue;
    cumul[b.matiereId] = (cumul[b.matiereId] || 0) + b.minutes;
    if (cumul[b.matiereId] >= 600 && !gagnes['heures-10:' + b.matiereId]) gagnes['heures-10:' + b.matiereId] = b.date;
  }
  const reussis = resultatsAvecEtude(d).filter(x => x.atteint).map(x => x.echeance.termineeLe || x.echeance.date).sort();
  if (reussis.length) gagnes.objectif = reussis[0];
  const livres = [];
  for (const e of d.echeances.filter(estLecture)) {
    let cumul = 0;
    for (const b of blocs.filter(x => x.echeanceId === e.id && x.pages > 0)) {
      cumul += b.pages;
      if (cumul >= pagesTotal(e)) { livres.push(b.date); break; }
    }
    if (e.terminee && e.termineeLe && e.termineeLe <= jour) livres.push(e.termineeLe);
  }
  if (livres.length) gagnes['livre-fini'] = livres.sort()[0];
  // Semaine parfaite : une semaine finie, avec au moins 3 blocs prévus, et tous faits.
  for (const lundi of [...new Set(Object.keys(d.planJours).map(lundiDe))].sort()) {
    if (ajouterJours(lundi, 6) >= jour) continue;   // semaine pas encore finie
    const r = resumeSemaine(d, lundi);
    if (r.prevus >= 3 && r.faits >= r.prevus) {
      gagnes['semaine-parfaite'] = r.dimanche;
      break;
    }
  }
  return gagnes;
}

// Nom et emoji d'un badge (ex : "heures-10:abc" → "10 h en Maths").
function infoBadge(id) {
  const [base, matiereId] = id.split(':');
  const modele = BADGES.find(b => b.id === base) || { emoji: '🏅', nom: base };
  return matiereId ? { emoji: modele.emoji, nom: `10 h en ${nomMatiere(matiereId)}` } : modele;
}

// Ajoute les badges nouvellement gagnés (on n'en retire jamais) et te prévient discrètement.
// Renvoie la liste des nouveaux badges.
function verifierBadges(silencieux = false) {
  const nouveaux = [];
  for (const [id, date] of Object.entries(badgesMerites(donnees))) {
    if (!donnees.badges[id]) {
      donnees.badges[id] = date;
      nouveaux.push(id);
    }
  }
  if (!nouveaux.length) return nouveaux;
  sauvegarder();
  if (!silencieux) {
    const noms = nouveaux.map(id => { const b = infoBadge(id); return `${b.emoji} ${b.nom}`; }).join(', ');
    setTimeout(() => afficherToast(`🏅 Nouveau badge : ${noms}`), 3000);   // après le message "Bloc enregistré"
  }
  return nouveaux;
}

// La veille d'un test ou d'un examen (pas encore passé) ?
function estVeille(e, jour = aujourdhui()) {
  return !e.terminee && ecartJours(jour, e.date) === 1;
}

// La checklist de révision rapide de la veille, faite à partir de tes blocs et de tes notes.
function checklistVeille(e) {
  const blocs = blocsDe(e.id);
  if (estLecture(e)) {
    const reste = e.pageFin - pageActuelle(e);
    const notesLecture = blocs.filter(b => b.note);
    const liste = [];
    if (reste > 0) liste.push({ id: 'reste', texte: `Finir les ${pluriel(reste, 'page')} qui restent (jusqu'à la page ${e.pageFin})` });
    if (notesLecture.length) liste.push({ id: 'notes', texte: `Relire mes notes de lecture (${notesLecture.length})`, details: notesLecture.slice(0, 5).map(b => `« ${b.note} »`) });
    liste.push({ id: 'resume', texte: 'Résumer le livre en 5 lignes (personnages, idées principales)' });
    liste.push({ id: 'affaires', texte: 'Mettre le livre dans mon sac 🎒' });
    liste.push({ id: 'dormir', texte: 'Me coucher tôt 😴' });
    return liste;
  }
  const notes = blocs.filter(b => b.note);
  const durs = blocs.filter(b => b.ressenti === 'dur');
  const methodes = {
    parcoeur: 'Me faire interroger, ou réciter à voix haute sans regarder',
    exercices: 'Refaire 1 ou 2 exercices types sans regarder la correction',
    mixte: "Faire une fiche résumé d'une page avec l'essentiel",
  };
  const liste = [];
  if (notes.length) liste.push({ id: 'notes', texte: `Relire mes notes de blocs (${notes.length})`, details: notes.slice(0, 5).map(b => `« ${b.note} »`) });
  if (durs.length) liste.push({ id: 'durs', texte: `Revoir les points marqués « Dur » (${durs.length})`, details: durs.slice(0, 5).map(b => (b.note ? `« ${b.note} »` : `bloc du ${dateCourte(b.date)}`)) });
  if (e.note) liste.push({ id: 'programme', texte: `Vérifier le programme : « ${e.note} »` });
  liste.push({ id: 'methode', texte: methodes[e.travail] || methodes.mixte });
  liste.push({ id: 'affaires', texte: 'Préparer mes affaires (stylos, calculatrice, carte…)' });
  liste.push({ id: 'dormir', texte: 'Me coucher tôt 😴' });
  return liste;
}

function avancementChecklist(e) {
  const liste = checklistVeille(e);
  return { liste, coches: liste.filter(item => e.checklist[item.id]).length };
}

  eclair: '<path d="M13 2.5L5 13.5h6l-1 8 8-11h-6z"/>',
  tasse: '<path d="M5 9h11v5a5 5 0 0 1-5 5h-1a5 5 0 0 1-5-5z"/><path d="M16 10.5h1.5a2.5 2.5 0 0 1 0 5H16M8.5 3.5c-.6 1 .6 1.8 0 3M12 3.5c-.6 1 .6 1.8 0 3"/>',
  etincelles: '<path d="M11 3.5l1.7 4.6 4.6 1.7-4.6 1.7L11 16.1l-1.7-4.6-4.6-1.7 4.6-1.7z"/><path d="M18.5 14.5l.8 2 2 .8-2 .8-.8 2-.8-2-2-.8 2-.8z"/>',
  note: '<path d="M5 19.5l1-4L15.5 6a2.1 2.1 0 0 1 3 3L9 18.5z"/><path d="M13.5 8l2.5 2.5"/>',
  graphique: '<path d="M5.5 20v-6M12 20V5.5M18.5 20v-9.5M3 20h18"/>',
  curseurs: '<path d="M4 7h9M18 7h2M4 17h3M12 17h8"/><circle cx="15.5" cy="7" r="2.4"/><circle cx="9.5" cy="17" r="2.4"/>',
  telephone: '<rect x="6.5" y="2.5" width="11" height="19" rx="2.5"/><path d="M10.5 18.5h3"/>',
  poubelle: '<path d="M4.5 7h15M9.5 7V4.5h5V7M6.5 7l1 13h9l1-13"/>',
  medaille: '<circle cx="12" cy="14.5" r="5.5"/><path d="M8.5 9.8L6 3h4l2 4.5L14 3h4l-2.5 6.8"/>',
  cerveau: '<path d="M9 4.5a3 3 0 0 0-3 3 3 3 0 0 0-1.5 5.5A3 3 0 0 0 7 18a2.5 2.5 0 0 0 5 .5V5.5A2 2 0 0 0 9 4.5zM15 4.5a3 3 0 0 1 3 3 3 3 0 0 1 1.5 5.5A3 3 0 0 1 17 18a2.5 2.5 0 0 1-5 .5"/>',
};
function ic(nom, classe = '') {
  return `<svg class="ic${classe ? ' ' + classe : ''}" viewBox="0 0 24 24" aria-hidden="true">${TRACES[nom]}</svg>`;
}

// La couleur d'une matière, avec ses versions transparentes (fond, bord, lueur).
function styleRiche(hex) {
  return `${styleCouleur(hex)};--couleur-fond-fort:${rgba(hex, 0.28)};--couleur-bord:${rgba(hex, 0.4)}`;
}
function styleMatiereRiche(id) {
  return styleRiche(couleurMatiere(id));
}

// Un anneau de progression (ratio de 0 à 1) dessiné en SVG, avec un texte au centre.
function anneau(ratio, { taille = 44, epaisseur = 5, contenu = '', classe = '' } = {}) {
  const centre = taille / 2;
  const r = (taille - epaisseur) / 2;
  const tour = 2 * Math.PI * r;
  const plein = borner(Number.isFinite(ratio) ? ratio : 0, 0, 1);
  return `<span class="anneau-mini${classe ? ' ' + classe : ''}" style="width:${taille}px;height:${taille}px">
      <svg viewBox="0 0 ${taille} ${taille}" aria-hidden="true">
        <circle class="anneau-mini-fond" cx="${centre}" cy="${centre}" r="${n1(r)}" stroke-width="${epaisseur}"/>
        <circle class="anneau-mini-plein" cx="${centre}" cy="${centre}" r="${n1(r)}" stroke-width="${epaisseur}" stroke-dasharray="${n1(tour)}" stroke-dashoffset="${n1(tour * (1 - plein))}" transform="rotate(-90 ${centre} ${centre})"${plein === 0 ? ' opacity="0"' : ''}/>
      </svg>${contenu ? `<span class="anneau-mini-centre">${contenu}</span>` : ''}
    </span>`;
}

// La couleur affichée pour le chrono : celle de la matière pendant le travail, une couleur calme en pause.
function couleurAffichee(c) {
  if (!c) return '#b0abff';
  if (c.phase === 'pause') return '#2dd4bf';
  if (c.phase === 'pauseLongue') return '#60a5fa';
  if (c.phase === 'attente') return '#b0abff';
  return c.matiereId && trouverMatiere(c.matiereId) ? couleurMatiere(c.matiereId) : '#b0abff';
}

// Est-ce que le téléphone demande de réduire les animations ?
function animationsReduites() {
  return Boolean(window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches);
}

// Petite vibration (Android), seulement si la vibration est activée dans Réglages.
function vibrer(motif) {
  if (!donnees.reglages.vibration || !navigator.vibrate) return;
  try { navigator.vibrate(motif); } catch (erreur) { /* pas grave */ }
}

// Célébration à la fin d'un bloc : l'anneau pulse et des confettis légers s'envolent.
function celebrer(couleur) {
  if (animationsReduites()) return;
  const cercle = document.querySelector('#vue-chrono:not([hidden]) .anneau');
  if (cercle) {
    cercle.classList.remove('pulse');
    void cercle.offsetWidth;
    cercle.classList.add('pulse');
  }
  const couleurs = [couleur, '#ffd43b', '#b0abff', '#38d9a9', '#f783ac', '#ffffff'];
  let h = '';
  for (let k = 0; k < 34; k++) {
    const angle = Math.random() * Math.PI * 2;
    const distance = 90 + Math.random() * 140;
    h += `<i style="--c:${couleurs[k % couleurs.length]};--dx:${Math.round(Math.cos(angle) * distance)}px;--dy:${Math.round(Math.sin(angle) * distance * 0.8 - 40)}px;--r:${Math.round(Math.random() * 540 - 270)}deg;--delai:${(Math.random() * 0.12).toFixed(2)}s"></i>`;
  }
  const boite = document.createElement('div');
  boite.className = 'confettis';
  boite.setAttribute('aria-hidden', 'true');
  boite.innerHTML = h;
  document.body.appendChild(boite);
  setTimeout(() => boite.remove(), 2000);
}

// La lueur du fond prend la couleur du chrono (matière, ou couleur calme pendant la pause).
function majAmbiance() {
  const c = donnees.chrono;
  const teinte = vueActive === 'chrono' && c ? rgba(couleurAffichee(c), c.phase === 'travail' && c.debut ? 0.26 : 0.2) : 'rgba(108, 92, 255, 0.16)';
  document.documentElement.style.setProperty('--ambiance', teinte);
}

function afficherVue(nom) {
  const change = vueActive !== nom;
  vueActive = nom;
  for (const v of ['aujourdhui', 'echeances', 'chrono', 'stats', 'reglages']) {
    document.getElementById('vue-' + v).hidden = v !== nom;
  }
  document.querySelectorAll('.onglet').forEach(b => {
    if (b.dataset.onglet === nom) b.setAttribute('aria-current', 'page');
    else b.removeAttribute('aria-current');
  });
  rafraichir();
  window.scrollTo(0, 0);
  if (change) {   // petite transition douce entre les onglets
    const vue = document.getElementById('vue-' + nom);
    vue.classList.remove('entree');
    void vue.offsetWidth;
    vue.classList.add('entree');
  }
}

function rafraichir() {
  if (vueActive === 'aujourdhui') afficherAujourdhui();
  else if (vueActive === 'echeances') afficherEcheances();
  else if (vueActive === 'chrono') afficherChrono();
  else if (vueActive === 'stats') afficherStats();
  else afficherReglages();
  majOngletChrono();
  majAmbiance();
}

/* ---------- Ressenti après un bloc ("Facile / Ok / Dur" + note) ---------- */

function carteRessenti() {
  const b = donnees.aEvaluer ? donnees.blocs.find(x => x.id === donnees.aEvaluer) : null;
  if (!b) return '';
  const e = b.echeanceId ? trouverEcheance(b.echeanceId) : null;
  if (estLecture(e)) return carteLecture(b, e);
  const sujet = e ? nomEcheanceCourt(e) : (b.matiereId ? nomMatiere(b.matiereId) : 'Étude libre');
  const boutons = Object.entries(RESSENTIS).map(([cle, r]) =>
    `<button class="btn" data-action="ressenti" data-valeur="${cle}" type="button"><span class="emoji" aria-hidden="true">${r.emoji}</span>${r.nom}</button>`).join('');
  return `<section class="carte ressenti" aria-label="Ressenti du bloc">
      <div class="ressenti-tete">
        <span class="illu-petite">${ic('etincelles')}</span>
        <div><h2>Bloc terminé ! Comment c'était ?</h2><p class="aide">${echapper(sujet)} · ${b.minutes} min</p></div>
      </div>
      <label class="champ">Une note pour la prochaine fois <span class="facultatif">(facultatif)</span>
        <input type="text" class="note-bloc" maxlength="120" value="${echapper(brouillonNote)}" placeholder="ex : exercices p. 42" autocomplete="off" enterkeyhint="done">
      </label>
      <div class="ressentis">${boutons}</div>
      <button class="lien" data-action="ressenti" data-valeur="" type="button">Passer</button>
    </section>`;
}

// Après un bloc de lecture : "Tu es arrivé(e) à quelle page ?"
let brouillonPage = '';   // la page tapée (gardée si l'écran se redessine)
let blocFiniEnAvance = null;   // bloc de lecture arrêté avec "J'ai fini mes pages" (on propose la page visée)
function carteLecture(b, e) {
  const avant = pageActuelle(e);
  let proposee = Math.min(e.pageFin, Math.max(avant, e.pageDebut - 1) + Math.round(b.minutes / vitesseLecture()));
  if (blocFiniEnAvance === b.id) {
    const plan = planActuel();
    const ligne = plan.lignesDuJour.find(l => l.info.echeance.id === e.id);
    const cible = ligne ? objectifLecture(ligne, plan).a : 0;
    if (cible > avant) proposee = cible;
  }
  return `<section class="carte ressenti" aria-label="Pages lues">
      <div class="ressenti-tete">
        <span class="illu-petite">${ic('livre')}</span>
        <div><h2>Bloc de lecture terminé !</h2><p class="aide">${echapper(titreEcheance(e))} · ${b.minutes} min</p></div>
      </div>
      <label class="champ">Tu es arrivé(e) à quelle page ?
        <input type="number" class="page-lecture" inputmode="numeric" min="${avant}" max="${e.pageFin}" value="${echapper(brouillonPage || String(proposee))}">
      </label>
      <p class="aide" style="margin:-8px 0 16px">${avant >= e.pageDebut ? `Tu en étais à la page ${avant}` : `Tu as commencé à la page ${e.pageDebut}`} · le livre va jusqu'à la page ${e.pageFin}.</p>
      <label class="champ">Une note pour la prochaine fois <span class="facultatif">(facultatif)</span>
        <input type="text" class="note-bloc" maxlength="120" value="${echapper(brouillonNote)}" placeholder="ex : chapitre 4, le renard" autocomplete="off" enterkeyhint="done">
      </label>
      <button class="btn btn-principal btn-plein" data-action="pages-lues" type="button">${ic('check')} Enregistrer ma page</button>
      <button class="lien" data-action="passer-lecture" type="button">Passer</button>
    </section>`;
}

/* ---------- Écran "Aujourd'hui" ----------
   En haut : bonjour, ta série et ta progression du jour.
   Puis UN élément principal : la prochaine chose à faire, avec un gros bouton "Lancer". */

function salutation(date = new Date()) {
  const h = date.getHours();
  if (h >= 5 && h < 12) return { texte: 'Bon matin', icone: 'soleil' };
  if (h >= 12 && h < 18) return { texte: 'Bon après-midi', icone: 'soleil' };
  if (h >= 18 && h < 22) return { texte: 'Bonne soirée', icone: 'coucher' };
  return { texte: 'Bonsoir', icone: 'lune' };
}

// Blocs prévus aujourd'hui et blocs faits (sur ce qui était prévu).
function progressionDuJour(plan) {
  return {
    prevus: plan.lignesDuJour.reduce((s, l) => s + l.prevus, 0),
    faits: plan.lignesDuJour.reduce((s, l) => s + Math.min(l.faits, l.prevus), 0),
  };
}

function afficherAujourdhui() {
  const jour = aujourdhui();
  const vue = document.getElementById('vue-aujourdhui');
  const bonjour = salutation();
  const entete = `<header class="accueil">
      <p class="surtitre">${dateLongue(jour)}</p>
      <h1 class="salut">${ic(bonjour.icone, bonjour.icone === 'lune' ? 'ic-lune' : '')}${bonjour.texte}</h1>
    </header>`;

  if (!donnees.echeances.length) {
    vue.innerHTML = entete + carteRessenti() + carteResumeSemaine(jour) + carteBienvenue();
    return;
  }
  const plan = planActuel();
  vue.innerHTML = entete
    + tuilesDuJour(plan)
    + carteRessenti()
    + carteHeros(plan)
    + bandeauxDuJour(plan)
    + carteResumeSemaine(jour)
    + carteAussiAujourdhui(plan)
    + carteSemaine(plan);
}

// Les deux tuiles du haut : la série (avec la flamme) et la progression du jour.
function tuilesDuJour(plan) {
  const s = series(donnees, plan.jour);
  const { prevus, faits } = progressionDuJour(plan);
  const blocsAujourdhui = donnees.blocs.filter(b => b.date === plan.jour).length;
  const ratio = prevus ? faits / prevus : (blocsAujourdhui ? 1 : 0);
  const chiffre = prevus ? `${faits}<small>/${prevus}</small>` : `${blocsAujourdhui}`;
  const sous = prevus ? 'blocs du jour' : `bloc${blocsAujourdhui > 1 ? 's' : ''} fait${blocsAujourdhui > 1 ? 's' : ''}`;
  return `<div class="tuiles-jour">
      <div class="tuile-jour" role="group" aria-label="Série : ${pluriel(s.actuelle, 'jour')} d'affilée">
        <span class="flamme${s.aujourdhuiFait ? ' allumee' : ''}">${ic('flamme')}</span>
        <span><span class="chiffre">${s.actuelle}</span><span class="sous">${s.actuelle > 1 ? "jours d'affilée" : "jour d'affilée"}</span></span>
      </div>
      <div class="tuile-jour" role="group" aria-label="${prevus ? `${faits} blocs faits sur ${prevus} prévus aujourd'hui` : `${pluriel(blocsAujourdhui, 'bloc')} aujourd'hui`}">
        ${anneau(ratio, { classe: ratio >= 1 ? 'complet' : '' })}
        <span><span class="chiffre">${chiffre}</span><span class="sous">${sous}</span></span>
      </div>
    </div>`;
}

// La carte principale : selon le moment, le chrono en cours, le prochain bloc, ou "Journée terminée".
function carteHeros(plan) {
  const c = donnees.chrono;
  if (c && c.phase !== 'attente') return herosChrono(c);
  const aFaire = plan.lignesDuJour.filter(l => l.prevus > l.faits);
  if (c && aFaire.length) return herosAttente(c);
  if (aFaire.length) return herosBloc(aFaire[0], plan);
  if (progressionDuJour(plan).prevus > 0) return herosFini(plan);
  if (c) return herosAttente(c);
  return herosRepos(plan);
}

// L'objectif de lecture d'aujourd'hui : de quelle page à quelle page.
function objectifLecture(l, plan) {
  const e = l.info.echeance;
  const avant = e.pageDebut - 1 + pagesLues(e, donnees, b => b.date < plan.jour);
  const luAujourdhui = pagesLues(e, donnees, b => b.date === plan.jour);
  const cible = Math.min(e.pageFin, avant + Math.ceil(l.prevus * plan.W / plan.vitesse - 1e-9));
  const actuelle = Math.min(e.pageFin, avant + luAujourdhui);
  return { de: actuelle + 1, a: cible, reste: Math.max(0, cible - actuelle), luAujourdhui };
}

function herosLecture(l, plan) {
  const e = l.info.echeance;
  const o = objectifLecture(l, plan);
  return `<section class="carte heros" style="${styleMatiereRiche(e.matiereId)}" aria-label="À lire maintenant">
      <p class="heros-etiquette">${ic('livre')}À lire maintenant</p>
      <button class="heros-tete" data-action="detail-echeance" data-id="${e.id}" type="button" aria-label="Détails : ${echapper(nomEcheanceLong(e))}">
        <span><span class="heros-titre">${echapper(titreEcheance(e))}</span><span class="heros-sous">${echapper(nomMatiere(e.matiereId))} · à finir ${quandCourt(e.date, plan.jour)}</span></span>
        ${ic('chevron')}
      </button>
      <div class="heros-infos">
        <span class="puce-info">${ic('livre')}p. ${o.de} → ${o.a}</span>
        <span class="puce-info">${ic('horloge')}${pluriel(o.reste, 'page')} · ≈ ${formaterDuree(o.reste * plan.vitesse)}</span>
      </div>
      <button class="btn btn-principal btn-geant" data-action="lancer" data-id="${e.id}" type="button">${ICONES.lecture} Lancer · ${plan.W} min</button>
      <button class="lien" data-action="j-ai-lu" data-id="${e.id}" type="button">J'ai lu sans chrono</button>
    </section>`;
}

function herosBloc(l, plan) {
  const e = l.info.echeance;
  if (estLecture(e)) return herosLecture(l, plan);
  const restants = l.prevus - l.faits;
  let points = '';
  for (let k = 0; k < l.prevus; k++) points += `<i class="${k < l.faits ? 'fait' : ''}"></i>`;
  const affilee = e.travail === 'exercices' && restants >= 2 ? " d'affilée" : '';
  return `<section class="carte heros" style="${styleMatiereRiche(e.matiereId)}" aria-label="À faire maintenant">
      <p class="heros-etiquette">${ic('eclair')}À faire maintenant</p>
      <button class="heros-tete" data-action="detail-echeance" data-id="${e.id}" type="button" aria-label="Détails : ${echapper(nomEcheanceLong(e))}">
        <span><span class="heros-titre">${echapper(nomMatiere(e.matiereId))}</span><span class="heros-sous">${capitaliser(e.type)} ${quandCourt(e.date, plan.jour)}</span></span>
        ${ic('chevron')}
      </button>
      <div class="heros-infos">
        <span class="puce-info"><span class="blocs-points" aria-hidden="true">${points}</span>${l.faits ? `${l.faits}/${l.prevus} blocs` : pluriel(l.prevus, 'bloc')}</span>
        <span class="puce-info">${ic('horloge')}${formaterDuree(restants * plan.W)}${affilee}</span>
      </div>
      <button class="btn btn-principal btn-geant" data-action="lancer" data-id="${e.id}" type="button">${ICONES.lecture} Lancer · ${plan.W} min</button>
    </section>`;
}

function herosChrono(c) {
  const p = infosPhase(c);
  const enTravail = c.phase === 'travail';
  const etiquette = enTravail ? (c.debut ? 'Bloc en cours' : 'Bloc en pause') : p.libelle;
  return `<section class="carte heros" style="${styleRiche(couleurAffichee(c))}" aria-label="Chrono en cours">
      <p class="heros-etiquette">${ic(enTravail ? 'horloge' : 'tasse')}${etiquette}</p>
      <div class="heros-chrono-ligne">
        <div><h2 class="heros-titre">${echapper(sujetChrono(c))}</h2></div>
        <span class="heros-temps" id="bandeau-temps">${formaterChrono(restantMs(c))}</span>
      </div>
      <button class="btn btn-principal btn-geant" data-action="aller-chrono" type="button">Ouvrir le chrono</button>
    </section>`;
}

// La pause est finie : on enchaîne ?
function herosAttente(c) {
  return `<section class="carte heros" style="${styleRiche(c.matiereId ? couleurMatiere(c.matiereId) : '#b0abff')}" aria-label="Pause terminée">
      <p class="heros-etiquette">${ic('etincelles')}Pause terminée</p>
      <h2 class="heros-titre">Prêt pour le bloc suivant ?</h2>
      <span class="heros-sous">${echapper(sujetChrono(c))} · ${pluriel(c.blocsSerie, 'bloc')} dans cette série</span>
      <div class="pile" style="margin-top:18px">
        <button class="btn btn-principal btn-geant" data-action="bloc-suivant" type="button">${ICONES.lecture} Bloc suivant · ${donnees.reglages.travail} min</button>
        <button class="btn btn-plein" data-action="terminer" type="button">Terminer pour l'instant</button>
      </div>
    </section>`;
}

// Raccourcis "J'ai lu" pour les livres en cours (pour noter une lecture faite en dehors du plan).
function liensJaiLu(plan) {
  const livres = donnees.echeances.filter(e => estLecture(e) && !e.terminee && e.date >= plan.jour && pageActuelle(e) < e.pageFin).sort(comparerPriorite).slice(0, 2);
  return livres.map(e => `<button class="lien" data-action="j-ai-lu" data-id="${e.id}" type="button">📖 J'ai lu : ${echapper(titreEcheance(e))}</button>`).join('');
}

// Tout le plan du jour est fait : un bel écran de fin de journée.
function herosFini(plan) {
  const blocs = donnees.blocs.filter(b => b.date === plan.jour);
  const minutes = blocs.reduce((s, b) => s + b.minutes, 0);
  const prochaine = texteProchaineSeance(plan);
  const c = donnees.chrono;
  const premiere = plan.infos[0];
  let boutons = '';
  if (c) {
    boutons = `<div class="pile"><button class="btn btn-plein" data-action="bloc-suivant" type="button">${ic('plus')} Un bloc en plus</button>
      <button class="btn btn-principal btn-plein" data-action="terminer" type="button">Terminer la journée</button></div>`;
  } else if (premiere) {
    boutons = `<button class="btn btn-plein" data-action="lancer" data-id="${premiere.echeance.id}" type="button">${ic('plus')} Un bloc en plus</button>`;
  }
  return `<section class="carte heros heros-fini" aria-label="Journée terminée">
      <div class="medaille-fini">${ic('check')}<i></i><i></i><i></i></div>
      <h2 class="heros-titre">Journée terminée !</h2>
      <span class="heros-sous">Tout ton plan d'aujourd'hui est fait : ${pluriel(blocs.length, 'bloc')} · ${formaterDuree(minutes)}. Bravo 👏</span>
      ${prochaine ? `<p class="aide">${prochaine}</p>` : ''}
      ${boutons}
      ${liensJaiLu(plan)}
    </section>`;
}

// Rien de prévu aujourd'hui (ou plus rien à venir).
function herosRepos(plan) {
  if (!plan.infos.length) {
    return `<section class="carte heros etat-vide" aria-label="Aucun test à venir">
        <div class="illu">${ic('calendrier')}</div>
        <h2>Aucun test à venir</h2>
        <p>Ajoute ton prochain test ou examen : l'appli prépare ton plan tout de suite.</p>
        <button class="btn btn-principal btn-plein" data-action="ajouter-echeance" type="button">+ Ajouter un test ou un examen</button>
      </section>`;
  }
  const prochaine = texteProchaineSeance(plan);
  return `<section class="carte heros heros-repos etat-vide" aria-label="Repos">
      <div class="illu">${ic('lune')}</div>
      <h2>Repos aujourd'hui 😌</h2>
      <p>Rien de prévu aujourd'hui.${prochaine ? ' ' + prochaine : ''}</p>
      <button class="btn btn-plein" data-action="aller-chrono" type="button">${ICONES.lecture} Faire un bloc quand même</button>
      ${liensJaiLu(plan)}
    </section>`;
}

// Les bandeaux courts : test aujourd'hui, veille d'un test, retard / zéro marge (touche pour le détail).
function bandeauxDuJour(plan) {
  const jour = plan.jour;
  let h = '';
  for (const e of donnees.echeances.filter(x => x.date === jour && !x.terminee)) {
    h += `<div class="bandeau info-jour" style="${styleMatiereRiche(e.matiereId)}">
        ${ic('cible')}
        <span class="texte"><strong>C'est aujourd'hui</strong> · ${echapper(nomEcheanceLong(e))}. ${estLecture(e) ? 'Dernier jour !' : 'Bonne chance !'}</span>
        <button class="btn btn-petit" data-action="test-passe" data-id="${e.id}" type="button">${ic('check')}${estLecture(e) ? 'Finie' : 'Passé'}</button>
      </div>`;
  }
  for (const e of donnees.echeances.filter(x => estVeille(x, jour))) {
    const { liste, coches } = avancementChecklist(e);
    h += `<button class="bandeau info-jour veille-bandeau" style="${styleMatiereRiche(e.matiereId)}" data-action="detail-echeance" data-id="${e.id}" type="button">
        ${ic('lune')}
        <span class="texte"><strong>Demain</strong> · ${echapper(nomEcheanceLong(e))}<small>Ta checklist de la veille</small></span>
        <span class="compte">${coches}/${liste.length}</span>
        ${ic('chevron', 'chevron')}
      </button>`;
  }
  for (const a of plan.alertes) {
    h += `<details class="bandeau alerte-bandeau">
        <summary>${ic(a.type === 'retard' ? 'sablier' : 'alerte')}<span class="texte">${texteAlerteCourt(a, jour)}</span>${ic('chevronBas', 'chevron-bas')}</summary>
        <p class="bandeau-detail">${texteAlerte(a, jour)} ${conseilAlerte(a)}</p>
      </details>`;
  }
  return h ? `<div class="bandeaux">${h}</div>` : '';
}

function texteAlerteCourt(a, jour) {
  const nom = `<span class="insecable">${echapper(nomMatiere(a.info.echeance.matiereId))}</span>`;
  if (a.type === 'manque') return `<strong>Pas assez de temps</strong> · ${nom} <span class="insecable">(il manque ${formaterDuree(a.minutes)})</span>`;
  if (a.type === 'retard') {
    const r = a.info.retard;
