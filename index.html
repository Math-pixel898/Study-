    h += `<i style="--c:${couleurs[k % couleurs.length]};--dx:${Math.round(Math.cos(angle) * distance)}px;--dy:${Math.round(Math.sin(angle) * distance * 0.8 - 40)}px;--r:${Math.round(Math.random() * 540 - 270)}deg;--delai:${(Math.random() * 0.12).toFixed(2)}s"></i>`;
  }
  const boite = document.createElement('div');
  boite.className = 'confettis';
  boite.setAttribute('aria-hidden', 'true');
  boite.innerHTML = h;
  document.body.appendChild(boite);
  setTimeout(() => boite.remove(), 2000);
}

// La lueur du fond prend la couleur du chrono (matière, ou couleur calme pendant la pause).
function majAmbiance() {
  const c = donnees.chrono;
  const teinte = vueActive === 'chrono' && c ? rgba(couleurAffichee(c), c.phase === 'travail' && c.debut ? 0.26 : 0.2) : 'rgba(108, 92, 255, 0.16)';
  document.documentElement.style.setProperty('--ambiance', teinte);
}

function afficherVue(nom) {
  const change = vueActive !== nom;
  vueActive = nom;
  for (const v of ['aujourdhui', 'echeances', 'chrono', 'stats', 'reglages']) {
    document.getElementById('vue-' + v).hidden = v !== nom;
  }
  document.querySelectorAll('.onglet').forEach(b => {
    if (b.dataset.onglet === nom) b.setAttribute('aria-current', 'page');
    else b.removeAttribute('aria-current');
  });
  rafraichir();
  window.scrollTo(0, 0);
  if (change) {   // petite transition douce entre les onglets
    const vue = document.getElementById('vue-' + nom);
    vue.classList.remove('entree');
    void vue.offsetWidth;
    vue.classList.add('entree');
  }
}

function rafraichir() {
  if (vueActive === 'aujourdhui') afficherAujourdhui();
  else if (vueActive === 'echeances') afficherEcheances();
  else if (vueActive === 'chrono') afficherChrono();
  else if (vueActive === 'stats') afficherStats();
  else afficherReglages();
  majOngletChrono();
  majAmbiance();
}

/* ---------- Ressenti après un bloc ("Facile / Ok / Dur" + note) ---------- */

function carteRessenti() {
  const b = donnees.aEvaluer ? donnees.blocs.find(x => x.id === donnees.aEvaluer) : null;
  if (!b) return '';
  const e = b.echeanceId ? trouverEcheance(b.echeanceId) : null;
  if (estLecture(e)) return carteLecture(b, e);
  const sujet = e ? nomEcheanceCourt(e) : (b.matiereId ? nomMatiere(b.matiereId) : 'Étude libre');
  const boutons = Object.entries(RESSENTIS).map(([cle, r]) =>
    `<button class="btn" data-action="ressenti" data-valeur="${cle}" type="button"><span class="emoji" aria-hidden="true">${r.emoji}</span>${r.nom}</button>`).join('');
  return `<section class="carte ressenti" aria-label="Ressenti du bloc">
      <div class="ressenti-tete">
        <span class="illu-petite">${ic('etincelles')}</span>
        <div><h2>${b.examenBlanc ? 'Examen blanc terminé !' : 'Bloc terminé !'} Comment c'était ?</h2><p class="aide">${echapper(sujet)} · ${b.examenBlanc ? formaterDuree(b.minutes) : `${b.minutes} min`}</p></div>
      </div>
      ${chapitresRessenti(e)}
      <label class="champ">Une note pour la prochaine fois <span class="facultatif">(facultatif)</span>
        <input type="text" class="note-bloc" maxlength="120" value="${echapper(brouillonNote)}" placeholder="ex : exercices p. 42" autocomplete="off" enterkeyhint="done">
      </label>
      <div class="ressentis">${boutons}</div>
      <button class="lien" data-action="ressenti" data-valeur="" type="button">Passer</button>
    </section>`;
}

// Après un bloc de lecture : "Tu es arrivé(e) à quelle page ?"
let brouillonPage = '';   // la page tapée (gardée si l'écran se redessine)
let blocFiniEnAvance = null;   // bloc de lecture arrêté avec "J'ai fini mes pages" (on propose la page visée)
function carteLecture(b, e) {
  const avant = pageActuelle(e);
  let proposee = Math.min(e.pageFin, Math.max(avant, e.pageDebut - 1) + Math.round(b.minutes / vitesseLivre(e)));
  if (blocFiniEnAvance === b.id) {
    const plan = planActuel();
    const ligne = plan.lignesDuJour.find(l => l.info.echeance.id === e.id);
    const cible = ligne ? objectifLecture(ligne, plan).a : 0;
    if (cible > avant) proposee = cible;
  }
  return `<section class="carte ressenti" aria-label="Pages lues">
      <div class="ressenti-tete">
        <span class="illu-petite">${ic('livre')}</span>
        <div><h2>Bloc de lecture terminé !</h2><p class="aide">${echapper(titreEcheance(e))} · ${b.minutes} min</p></div>
      </div>
      <label class="champ">Tu es arrivé(e) à quelle page ?
        <input type="number" class="page-lecture" inputmode="numeric" min="${avant}" max="${e.pageFin}" value="${echapper(brouillonPage || String(proposee))}">
      </label>
      <p class="aide" style="margin:-8px 0 16px">${avant >= e.pageDebut ? `Tu en étais à la page ${avant}` : `Tu as commencé à la page ${e.pageDebut}`} · le livre va jusqu'à la page ${e.pageFin}.</p>
      <label class="champ">Une note pour la prochaine fois <span class="facultatif">(facultatif)</span>
        <input type="text" class="note-bloc" maxlength="120" value="${echapper(brouillonNote)}" placeholder="ex : chapitre 4, le renard" autocomplete="off" enterkeyhint="done">
      </label>
      <button class="btn btn-principal btn-plein" data-action="pages-lues" type="button">${ic('check')} Enregistrer ma page</button>
      <button class="lien" data-action="passer-lecture" type="button">Passer</button>
    </section>`;
}

/* ---------- Écran "Aujourd'hui" ----------
   En haut : bonjour, ta série et ta progression du jour.
   Puis UN élément principal : la prochaine chose à faire, avec un gros bouton "Lancer". */

function salutation(date = new Date()) {
  const h = date.getHours();
  if (h >= 5 && h < 12) return { texte: 'Bon matin', icone: 'soleil' };
  if (h >= 12 && h < 18) return { texte: 'Bon après-midi', icone: 'soleil' };
  if (h >= 18 && h < 22) return { texte: 'Bonne soirée', icone: 'coucher' };
  return { texte: 'Bonsoir', icone: 'lune' };
}

// Blocs prévus aujourd'hui et blocs faits (sur ce qui était prévu).
function progressionDuJour(plan) {
  return {
    prevus: plan.lignesDuJour.reduce((s, l) => s + l.prevus, 0),
    faits: plan.lignesDuJour.reduce((s, l) => s + Math.min(l.faits, l.prevus), 0),
  };
}

function afficherAujourdhui() {
  const jour = aujourdhui();
  const vue = document.getElementById('vue-aujourdhui');
  const bonjour = salutation();
  const entete = `<header class="accueil">
      <p class="surtitre">${dateLongue(jour)}</p>
      <h1 class="salut">${ic(bonjour.icone, bonjour.icone === 'lune' ? 'ic-lune' : '')}${bonjour.texte}</h1>
    </header>`;

  // Un seul résumé à la fois : le bilan du mois (début de mois), sinon celui de la semaine.
  const resume = carteBilanAujourdhui(jour) || carteResumeSemaine(jour);
  if (!donnees.echeances.length) {
    vue.innerHTML = entete + carteRessenti() + resume + carteBienvenue();
    return;
  }
  const plan = planActuel();
  vue.innerHTML = entete
    + tuilesDuJour(plan)
    + barreObjectifSemaine(jour)
    + carteRessenti()
    + carteHeros(plan)
    + bandeauxDuJour(plan)
    + resume
    + carteAussiAujourdhui(plan)
    + carteSemaine(plan);
}

// Les deux tuiles du haut : la série (avec la flamme) et la progression du jour.
function tuilesDuJour(plan) {
  const s = series(donnees, plan.jour);
  const { prevus, faits } = progressionDuJour(plan);
  const blocsAujourdhui = donnees.blocs.filter(b => b.date === plan.jour).length;
  const ratio = prevus ? faits / prevus : (blocsAujourdhui ? 1 : 0);
  const chiffre = prevus ? `${faits}<small>/${prevus}</small>` : `${blocsAujourdhui}`;
  const sous = prevus ? 'blocs du jour' : `bloc${blocsAujourdhui > 1 ? 's' : ''} fait${blocsAujourdhui > 1 ? 's' : ''}`;
  return `<div class="tuiles-jour">
      <div class="tuile-jour" role="group" aria-label="Série : ${pluriel(s.actuelle, 'jour')} d'affilée">
        <span class="flamme${s.aujourdhuiFait ? ' allumee' : ''}">${ic('flamme')}</span>
        <span><span class="chiffre">${s.actuelle}</span><span class="sous">${s.actuelle > 1 ? "jours d'affilée" : "jour d'affilée"}</span></span>
      </div>
      <div class="tuile-jour" role="group" aria-label="${prevus ? `${faits} blocs faits sur ${prevus} prévus aujourd'hui` : `${pluriel(blocsAujourdhui, 'bloc')} aujourd'hui`}">
        ${anneau(ratio, { classe: ratio >= 1 ? 'complet' : '' })}
        <span><span class="chiffre">${chiffre}</span><span class="sous">${sous}</span></span>
      </div>
    </div>`;
}

// La carte principale : selon le moment, le chrono en cours, le prochain bloc, ou "Journée terminée".
function carteHeros(plan) {
  const c = donnees.chrono;
  if (c && c.phase !== 'attente') return herosChrono(c);
  const aFaire = plan.lignesDuJour.filter(l => l.prevus > l.faits);
  if (c && aFaire.length) return herosAttente(c);
  if (aFaire.length) return herosBloc(aFaire[0], plan);
  if (progressionDuJour(plan).prevus > 0) return herosFini(plan);
  if (c) return herosAttente(c);
  return herosRepos(plan);
}

// "(vitesse de ce livre)", "(ta vitesse, livre difficile)", "(livre facile)"…
function precisionVitesse(e) {
  if (vitesseLivreMesuree(e)) return ' (vitesse de ce livre)';
  const morceaux = [];
  if (vitesseMesuree()) morceaux.push('ta vitesse');
  if (e.difficulteLecture === 'facile') morceaux.push('livre facile');
  if (e.difficulteLecture === 'difficile') morceaux.push('livre difficile');
  return morceaux.length ? ` (${morceaux.join(', ')})` : '';
}
// La vitesse (min par page) utilisée par le plan pour ce livre.
function vitessePlan(e, plan) {
  return (plan.vitesses && plan.vitesses[e.id]) || plan.vitesse;
}

// L'objectif de lecture d'aujourd'hui : de quelle page à quelle page.
function objectifLecture(l, plan) {
  const e = l.info.echeance;
  const avant = e.pageDebut - 1 + pagesLues(e, donnees, b => b.date < plan.jour);
  const luAujourdhui = pagesLues(e, donnees, b => b.date === plan.jour);
  const cible = Math.min(e.pageFin, avant + Math.ceil(l.prevus * plan.W / vitessePlan(e, plan) - 1e-9));
  const actuelle = Math.min(e.pageFin, avant + luAujourdhui);
  return { de: actuelle + 1, a: cible, reste: Math.max(0, cible - actuelle), luAujourdhui };
}

function herosLecture(l, plan) {
  const e = l.info.echeance;
  const o = objectifLecture(l, plan);
  return `<section class="carte heros" style="${styleMatiereRiche(e.matiereId)}" aria-label="À lire maintenant">
      <p class="heros-etiquette">${ic('livre')}À lire maintenant</p>
      <button class="heros-tete" data-action="detail-echeance" data-id="${e.id}" type="button" aria-label="Détails : ${echapper(nomEcheanceLong(e))}">
        <span><span class="heros-titre">${echapper(titreEcheance(e))}</span><span class="heros-sous">${echapper(nomMatiere(e.matiereId))} · à finir ${quandCourt(e.date, plan.jour)}</span></span>
        ${ic('chevron')}
      </button>
      <div class="heros-infos">
        <span class="puce-info">${ic('livre')}p. ${o.de} → ${o.a}</span>
        <span class="puce-info">${ic('horloge')}${pluriel(o.reste, 'page')} · ≈ ${formaterDuree(o.reste * vitessePlan(e, plan))}</span>
      </div>
      <button class="btn btn-principal btn-geant" data-action="lancer" data-id="${e.id}" type="button">${ICONES.lecture} Lancer · ${plan.W} min</button>
      <div class="liens-heros">
        <button class="lien" data-action="j-ai-lu" data-id="${e.id}" type="button">J'ai lu sans chrono</button>
        ${reportPossible(e, plan) ? `<button class="lien" data-action="pas-aujourdhui" data-id="${e.id}" type="button">Pas aujourd'hui</button>` : ''}
      </div>
    </section>`;
}

function herosBloc(l, plan) {
  const e = l.info.echeance;
  if (estLecture(e)) return herosLecture(l, plan);
  const restants = l.prevus - l.faits;
  let points = '';
  for (let k = 0; k < l.prevus; k++) points += `<i class="${k < l.faits ? 'fait' : ''}"></i>`;
  const affilee = e.travail === 'exercices' && restants >= 2 ? " d'affilée" : '';
  return `<section class="carte heros" style="${styleMatiereRiche(e.matiereId)}" aria-label="À faire maintenant">
      <p class="heros-etiquette">${ic('eclair')}À faire maintenant</p>
      <button class="heros-tete" data-action="detail-echeance" data-id="${e.id}" type="button" aria-label="Détails : ${echapper(nomEcheanceLong(e))}">
        <span><span class="heros-titre">${echapper(titreEcheance(e))}</span><span class="heros-sous">${e.type === 'devoir' ? `${echapper(nomMatiere(e.matiereId))} · à rendre ${quandCourt(e.date, plan.jour)}` : `${capitaliser(e.type)} ${quandCourt(e.date, plan.jour)}`}</span></span>
        ${ic('chevron')}
      </button>
      <div class="heros-infos">
        <span class="puce-info"><span class="blocs-points" aria-hidden="true">${points}</span>${l.faits ? `${l.faits}/${l.prevus} blocs` : pluriel(l.prevus, 'bloc')}</span>
        <span class="puce-info">${ic('horloge')}${formaterDuree(restants * plan.W)}${affilee}</span>
      </div>
      <button class="btn btn-principal btn-geant" data-action="lancer" data-id="${e.id}" type="button">${ICONES.lecture} Lancer · ${plan.W} min</button>
      ${reportPossible(e, plan) ? `<div class="liens-heros"><button class="lien" data-action="pas-aujourdhui" data-id="${e.id}" type="button">Pas aujourd'hui</button></div>` : ''}
    </section>`;
}

function herosChrono(c) {
  const p = infosPhase(c);
  const enTravail = c.phase === 'travail';
  const etiquette = enTravail ? (c.debut ? 'Bloc en cours' : 'Bloc en pause') : p.libelle;
  return `<section class="carte heros" style="${styleRiche(couleurAffichee(c))}" aria-label="Chrono en cours">
      <p class="heros-etiquette">${ic(enTravail ? 'horloge' : 'tasse')}${etiquette}</p>
      <div class="heros-chrono-ligne">
        <div><h2 class="heros-titre">${echapper(sujetChrono(c))}</h2></div>
        <span class="heros-temps" id="bandeau-temps">${formaterChrono(restantMs(c))}</span>
      </div>
      <button class="btn btn-principal btn-geant" data-action="aller-chrono" type="button">Ouvrir le chrono</button>
    </section>`;
}

// La pause est finie : on enchaîne ?
function herosAttente(c) {
  return `<section class="carte heros" style="${styleRiche(c.matiereId ? couleurMatiere(c.matiereId) : '#b0abff')}" aria-label="Pause terminée">
      <p class="heros-etiquette">${ic('etincelles')}Pause terminée</p>
      <h2 class="heros-titre">Prêt pour le bloc suivant ?</h2>
      <span class="heros-sous">${echapper(sujetChrono(c))} · ${pluriel(c.blocsSerie, 'bloc')} dans cette série</span>
      <div class="pile" style="margin-top:18px">
        <button class="btn btn-principal btn-geant" data-action="bloc-suivant" type="button">${ICONES.lecture} Bloc suivant · ${c.dureeTravail || donnees.reglages.travail} min</button>
        <button class="btn btn-plein" data-action="terminer" type="button">Terminer pour l'instant</button>
      </div>
    </section>`;
}

// Raccourcis "J'ai lu" pour les livres en cours (pour noter une lecture faite en dehors du plan).
function liensJaiLu(plan) {
  const livres = donnees.echeances.filter(e => estLecture(e) && !e.terminee && e.date >= plan.jour && pageActuelle(e) < e.pageFin).sort(comparerPriorite).slice(0, 2);
  return livres.map(e => `<button class="lien" data-action="j-ai-lu" data-id="${e.id}" type="button">📖 J'ai lu : ${echapper(titreEcheance(e))}</button>`).join('');
}

// Tout le plan du jour est fait : un bel écran de fin de journée.
function herosFini(plan) {
  const blocs = donnees.blocs.filter(b => b.date === plan.jour);
  const minutes = blocs.reduce((s, b) => s + b.minutes, 0);
  const prochaine = texteProchaineSeance(plan);
  const c = donnees.chrono;
  const premiere = plan.infos[0];
  let boutons = '';
  if (c) {
    boutons = `<div class="pile"><button class="btn btn-plein" data-action="bloc-suivant" type="button">${ic('plus')} Un bloc en plus</button>
      <button class="btn btn-principal btn-plein" data-action="terminer" type="button">Terminer la journée</button></div>`;
  } else if (premiere) {
    boutons = `<button class="btn btn-plein" data-action="lancer" data-id="${premiere.echeance.id}" type="button">${ic('plus')} Un bloc en plus</button>`;
  }
  return `<section class="carte heros heros-fini" aria-label="Journée terminée">
      <div class="medaille-fini">${ic('check')}<i></i><i></i><i></i></div>
      <h2 class="heros-titre">Journée terminée !</h2>
      <span class="heros-sous">Tout ton plan d'aujourd'hui est fait : ${pluriel(blocs.length, 'bloc')} · ${formaterDuree(minutes)}. Bravo 👏</span>
      ${prochaine ? `<p class="aide">${prochaine}</p>` : ''}
      ${boutons}
      ${liensJaiLu(plan)}
    </section>`;
}

// Rien de prévu aujourd'hui (ou plus rien à venir).
function herosRepos(plan) {
  if (!plan.infos.length) {
    return `<section class="carte heros etat-vide" aria-label="Aucun test à venir">
        <div class="illu">${ic('calendrier')}</div>
        <h2>Aucun test à venir</h2>
        <p>Ajoute ton prochain test ou examen : l'appli prépare ton plan tout de suite.</p>
        <button class="btn btn-principal btn-plein" data-action="ajouter-echeance" type="button">+ Ajouter un test ou un examen</button>
      </section>`;
  }
  const prochaine = texteProchaineSeance(plan);
  const special = jourSpecial(plan.jour);
  if (special && special.minutes === 0) {
    const seulAujourdhui = special.debut === plan.jour && special.fin === plan.jour;
    return `<section class="carte heros heros-repos etat-vide" aria-label="Pas dispo aujourd'hui">
        <div class="illu">${ic('lune')}</div>
        <h2>Pas dispo aujourd'hui</h2>
        <p>${special.motif ? `${echapper(capitaliser(special.motif))}. ` : ''}Ton plan s'est organisé autour, sans retard.${prochaine ? ' ' + prochaine : ''}</p>
        ${seulAujourdhui
          ? `<button class="btn btn-plein" data-action="supprimer-special" data-id="${special.id}" type="button">Finalement, je suis dispo</button>`
          : `<button class="btn btn-plein" data-onglet="reglages" type="button">Voir mes jours spéciaux</button>`}
        ${liensJaiLu(plan)}
      </section>`;
  }
  return `<section class="carte heros heros-repos etat-vide" aria-label="Repos">
      <div class="illu">${ic('lune')}</div>
      <h2>Repos aujourd'hui 😌</h2>
      <p>Rien de prévu aujourd'hui.${prochaine ? ' ' + prochaine : ''}</p>
      <button class="btn btn-plein" data-action="aller-chrono" type="button">${ICONES.lecture} Faire un bloc quand même</button>
      ${liensJaiLu(plan)}
    </section>`;
}

// Les bandeaux courts : test aujourd'hui, veille d'un test, retard / zéro marge (touche pour le détail).
function bandeauxDuJour(plan) {
  const jour = plan.jour;
  let h = '';
  for (const e of donnees.echeances.filter(x => x.date === jour && !x.terminee)) {
    h += `<div class="bandeau info-jour" style="${styleMatiereRiche(e.matiereId)}">
        ${ic('cible')}
        <span class="texte"><strong>C'est aujourd'hui</strong> · ${echapper(nomEcheanceLong(e))}. ${estLecture(e) ? 'Dernier jour !' : e.type === 'devoir' ? 'Pense à le rendre !' : 'Bonne chance !'}</span>
        <button class="btn btn-petit" data-action="test-passe" data-id="${e.id}" type="button">${ic('check')}${estLecture(e) ? 'Finie' : e.type === 'devoir' ? 'Rendu' : 'Passé'}</button>
      </div>`;
  }
  for (const e of donnees.echeances.filter(x => estVeille(x, jour))) {
    const { liste, coches } = avancementChecklist(e);
    h += `<button class="bandeau info-jour veille-bandeau" style="${styleMatiereRiche(e.matiereId)}" data-action="detail-echeance" data-id="${e.id}" type="button">
        ${ic('lune')}
        <span class="texte"><strong>Demain</strong> · ${echapper(nomEcheanceLong(e))}<small>Ta checklist de la veille</small></span>
        <span class="compte">${coches}/${liste.length}</span>
        ${ic('chevron', 'chevron')}
      </button>`;
  }
  for (const a of plan.alertes) {
    h += `<details class="bandeau alerte-bandeau">
        <summary>${ic(a.type === 'retard' ? 'sablier' : 'alerte')}<span class="texte">${texteAlerteCourt(a, jour)}</span>${ic('chevronBas', 'chevron-bas')}</summary>
        <p class="bandeau-detail">${texteAlerte(a, jour)} ${conseilAlerte(a)}</p>
      </details>`;
  }
  // Reporté aujourd'hui ("Pas aujourd'hui") : on peut le remettre au programme.
  for (const id of donnees.reportes[jour] || []) {
    const e = trouverEcheance(id);
    if (!e || e.terminee) continue;
    h += `<div class="bandeau info-jour" style="${styleMatiereRiche(e.matiereId)}">
        ${ic('calendrier')}
        <span class="texte"><strong>Reporté</strong> · ${echapper(titreEcheance(e))}<small>Ses blocs sont répartis sur les jours suivants.</small></span>
        <button class="btn btn-petit" data-action="annuler-report" data-id="${e.id}" type="button">Remettre</button>
      </div>`;
  }
  // Rappel de sauvegarde (discret, une fois par semaine au plus).
  if (rappelSauvegardeDu(jour)) {
    h += `<div class="bandeau info-jour rappel-sauvegarde" style="${styleRiche('#60a5fa')}">
        ${ic('telecharger')}
        <span class="texte"><strong>Pense à sauvegarder</strong><small>Dernière sauvegarde : ${texteDerniereSauvegarde(jour)}</small></span>
        <button class="btn btn-petit" data-action="sauvegarder-rappel" type="button">Sauvegarder</button>
        <button class="fermer-x" data-action="plus-tard-sauvegarde" type="button" aria-label="Me le rappeler dans 3 jours">${ic('fermer')}</button>
      </div>`;
  }
  return h ? `<div class="bandeaux">${h}</div>` : '';
}

function texteAlerteCourt(a, jour) {
  const nom = `<span class="insecable">${echapper(nomMatiere(a.info.echeance.matiereId))}</span>`;
  if (a.type === 'manque') return `<strong>Pas assez de temps</strong> · ${nom} <span class="insecable">(il manque ${formaterDuree(a.minutes)})</span>`;
  if (a.type === 'retard') {
    const r = a.info.retard;
    return `<strong>En retard</strong> · ${nom} <span class="insecable">+${formaterDuree(r.parJour)}${r.jusqua <= jour ? '' : ' par jour'}</span>`;
  }
  return `<strong>Zéro marge</strong> · ${nom}`;
}

function texteAlerte(a, jour) {
  const e = a.info.echeance;
  const nom = echapper(nomEcheanceLong(e));
  if (a.type === 'manque') {
    return `Pas assez de temps pour ${nom} (<span class="insecable">${quandCourt(e.date, jour)}</span>), il manque <span class="insecable">${formaterDuree(a.minutes)}</span>.`;
  }
  if (a.type === 'retard') {
    const r = a.info.retard;
    const quand = r.jusqua <= jour ? "aujourd'hui" : `par jour ${jusqua(r.jusqua, jour)}`;
    return `Tu es en retard sur ${nom} : <span class="insecable">+${formaterDuree(r.parJour)}</span> ${quand}.`;
  }
  return `Zéro marge sur ${nom} : si tu sautes un jour, tu seras en retard.`;
}

function conseilAlerte(a) {
  if (a.type === 'manque') return 'Augmente ton temps dispo dans Réglages, ou fais des blocs en plus.';
  if (a.type === 'retard') return 'Le temps en retard est réparti sur les jours qui restent.';
  return 'Garde un peu de marge : ajoute du temps dispo dans Réglages si tu peux.';
}

function carteBienvenue() {
  return `<section class="carte etat-vide bienvenue">
      <div class="illu">${ic('calendrier')}</div>
      <h2>Bienvenue !</h2>
      <p>Ajoute tes tests, tes examens et tes livres à lire : chaque jour, l'appli te dit quoi faire et combien de temps.</p>
      <div class="etapes"><span><b>1</b>Tes matières</span><span><b>2</b>Tes tests</span><span><b>3</b>Lance un bloc</span></div>
      <div class="pile">
        <button class="btn btn-principal btn-geant" data-action="ajouter-echeance" type="button">+ Ajouter un test ou un examen</button>
        <button class="btn btn-plein" data-action="exemple" type="button">Essayer avec un exemple</button>
      </div>
    </section>`;
}

// La suite du plan du jour (ce qui n'est pas déjà dans la grande carte).
function carteAussiAujourdhui(plan) {
  const aFaire = plan.lignesDuJour.filter(l => l.prevus > l.faits);
  const enAvant = donnees.chrono ? null : aFaire[0];
  const autres = plan.lignesDuJour.filter(l => l !== enAvant);
  const r = donnees.reglages;
  const dispo = minutesDispo(plan.jour);
  const capacite = `<p class="note-capacite">Temps dispo aujourd'hui : ${formaterDuree(dispo)}, soit ${pluriel(plan.capaciteAujourdhui, 'bloc')} max (pauses comprises).</p>`;
  if (!autres.length) return '';
  const tries = [...autres.filter(l => l.prevus > l.faits), ...autres.filter(l => l.prevus <= l.faits)];
  return `<h2 class="titre-section">${enAvant ? 'Ensuite aujourd\'hui' : 'Mon plan du jour'}</h2>
    <section class="carte carte-liste"><ul class="liste-plan">${tries.map(l => lignePlan(l, plan)).join('')}</ul></section>
    ${capacite}`;
}

// Une ligne du plan : matière, quand, blocs (points), et un bouton rond pour lancer.
function lignePlan(l, plan) {
  const e = l.info.echeance;
  const restants = Math.max(0, l.prevus - l.faits);
  const fini = restants === 0;
  let points = '';
  for (let k = 0; k < Math.max(l.prevus, l.faits); k++) points += `<i class="${k < l.faits ? 'fait' : ''}"></i>`;
  let sous = fini
    ? (l.prevus ? "✓ Fini pour aujourd'hui" : `✓ ${pluriel(l.faits, 'bloc')} en plus`)
    : `${libelleQuand(e, plan.jour)} · ${formaterDuree(restants * plan.W)}`;
  if (estLecture(e)) {
    const o = objectifLecture(l, plan);
    sous = fini ? `✓ ${pluriel(o.luAujourdhui, 'page')} lue${o.luAujourdhui > 1 ? 's' : ''} aujourd'hui` : `Lecture · p. ${o.de} → ${o.a}`;
  }
  const nom = echapper(titreEcheance(e));
  return `<li class="ligne-plan${fini ? ' finie' : ''}" style="${styleMatiereRiche(e.matiereId)}">
      <button class="ligne-corps" data-action="detail-echeance" data-id="${e.id}" type="button">
        <span class="barre-v" aria-hidden="true"></span>
        <span class="ligne-texte"><span class="ligne-titre">${nom}</span><span class="ligne-sous">${sous}</span></span>
        <span class="blocs-points" aria-hidden="true">${points}</span>
      </button>
      ${fini
        ? `<button class="btn-rond" data-action="lancer" data-id="${e.id}" type="button" aria-label="Faire un bloc en plus : ${nom}">${ic('plus')}</button>`
        : `<button class="btn-rond accent" data-action="lancer" data-id="${e.id}" type="button" aria-label="Lancer un bloc : ${nom}">${ICONES.lecture}</button>`}
    </li>`;
}

// "Prochaine séance : jeudi (Maths)." quand rien n'est prévu aujourd'hui.
function texteProchaineSeance(plan) {
  let meilleur = null;
  for (const i of plan.infos) {
    for (const j of Object.keys(i.futur)) {
      if (i.futur[j] > 0 && (!meilleur || j < meilleur.jour)) meilleur = { jour: j, info: i };
    }
  }
  if (!meilleur) return '';
  return `Prochaine séance : ${quandCourt(meilleur.jour, plan.jour)} (${echapper(nomMatiere(meilleur.info.echeance.matiereId))}).`;
}

// Les 7 prochains jours : une petite colonne par jour (touche un jour pour le détail).
function carteSemaine(plan) {
  const choisi = plan.semaine.find(s => s.jour === jourSemaine) || plan.semaine[0];
  const colonnes = plan.semaine.map(s => {
    const d = dateDepuisCle(s.jour);
    const echelle = Math.max(s.capacite, s.total, 1);
    const morceaux = s.items.map(x => `<i style="--couleur:${couleurMatiere(x.info.echeance.matiereId)};height:${n1(x.blocs / echelle * 100)}%"></i>`).join('');
    const marques = s.echeancesDuJour.map(e => `<i style="--couleur:${couleurMatiere(e.matiereId)}"></i>`).join('');
    const etiquette = `${capitaliser(dateLongue(s.jour))} : ${pluriel(s.total, 'bloc')} prévu${s.total > 1 ? 's' : ''} sur ${s.capacite}${s.echeancesDuJour.length ? ', ' + s.echeancesDuJour.map(e => nomEcheanceLong(e)).join(', ') : ''}`;
    const special = jourSpecial(s.jour);
    return `<button class="jour-col${s === choisi ? ' choisi' : ''}${special && special.minutes === 0 ? ' indispo' : ''}" data-action="jour-semaine" data-jour="${s.jour}" type="button" aria-pressed="${s === choisi}" aria-label="${echapper(etiquette)}">
        <span class="jc-nom">${JOURS_COURTS[d.getDay()].replace('.', '')}</span>
        <span class="jc-num">${d.getDate()}</span>
        <span class="jc-barre" aria-hidden="true">${morceaux}</span>
        <span class="jc-ech" aria-hidden="true">${marques}</span>
        <span class="jc-charge${s.total && s.total >= s.capacite ? ' plein' : ''}" aria-hidden="true">${s.total}/${s.capacite}</span>
      </button>`;
  }).join('');
  return `<h2 class="titre-section">Les 7 prochains jours<span class="aide-mini">blocs prévus / possibles</span></h2>
    <section class="carte semaine-carte">
      <div class="semaine-bande">${colonnes}</div>
      ${detailJourSemaine(choisi)}
    </section>`;
}

function detailJourSemaine(s) {
  let contenu = s.echeancesDuJour.map(e =>
    `<span class="puce puce-ech" style="${styleMatiere(e.matiereId)}">${estLecture(e) ? `${ic('livre')}Fin de lecture : ${echapper(titreEcheance(e))}` : e.type === 'devoir' ? `${ic('note')}À rendre : ${echapper(titreEcheance(e))}` : `${ic('cible')}${nomType(e)} ${echapper(de(nomMatiere(e.matiereId)))}`}</span>`).join('');
  contenu += s.items.map(x => {
    const e = x.info.echeance;
    const doublon = s.items.filter(y => y.info.echeance.matiereId === e.matiereId).length > 1;
    if (estLecture(e)) return `<span class="puce" style="${styleMatiere(e.matiereId)}">${echapper(titreEcheance(e))} · ≈ ${pluriel(Math.round(x.blocs * donnees.reglages.travail / vitesseLivre(e)), 'page')}</span>`;
    return `<span class="puce" style="${styleMatiere(e.matiereId)}">${echapper(nomMatiere(e.matiereId))}${doublon ? ` (${e.type})` : ''} · ${pluriel(x.blocs, 'bloc')}</span>`;
  }).join('');
  const special = jourSpecial(s.jour);
  if (special) contenu = `<span class="puce puce-ech special-puce">${ic('lune')}${special.minutes === 0 ? 'Pas dispo' : `Jour spécial : ${formaterDuree(special.minutes)}`}${special.motif ? ` · ${echapper(special.motif)}` : ''}</span>` + contenu;
  if (!contenu) contenu = `<span class="repos">Rien de prévu : repos 😌</span>`;
  return `<div class="jour-detail">
      <div class="jour-detail-titre">${capitaliser(dateLongue(s.jour))}<span>${s.total}/${s.capacite} blocs</span></div>
      <div class="puces">${contenu}</div>
    </div>`;
}

/* ---------- Écran "Échéances" ----------
   Des cartes compactes : matière, date, un anneau de progression et un statut court.
   Les détails (chapitres, temps estimé, notes, difficulté) s'ouvrent en touchant la carte. */

function afficherEcheances() {
  const jour = aujourdhui();
  const plan = planActuel();
  const aVenir = donnees.echeances.filter(e => !e.terminee && e.date >= jour).sort(comparerPriorite);
  const historique = donnees.echeances.filter(e => e.terminee || e.date < jour).sort((a, b) => (a.date < b.date ? 1 : -1));
  const vue = document.getElementById('vue-echeances');

  let h = `<header class="entete"><h1>Échéances</h1><button class="btn btn-principal btn-petit" data-action="ajouter-echeance" type="button">${ic('plus')}Ajouter</button></header>`;

  if (!donnees.matieres.length) {
    vue.innerHTML = h + `<section class="carte etat-vide">
        <div class="illu">${ic('livre')}</div>
        <h2>Commence par tes matières</h2>
        <p>Ajoute les matières que tu étudies (maths, chimie, philo…). Ensuite, tes tests et tes examens.</p>
        <button class="btn btn-principal btn-plein" data-action="ajouter-matiere" type="button">+ Ajouter une matière</button>
      </section>`;
    return;
  }

  h += `<div class="bascule" role="group" aria-label="Affichage des échéances">
      <button type="button" data-action="vue-echeances" data-vue="liste" aria-pressed="${vueEcheances === 'liste'}">Liste</button>
      <button type="button" data-action="vue-echeances" data-vue="calendrier" aria-pressed="${vueEcheances === 'calendrier'}">Calendrier</button>
    </div>`;
  if (vueEcheances === 'calendrier') {
    vue.innerHTML = h + carteCalendrier(plan);
    return;
  }

  if (!aVenir.length) {
    h += `<section class="carte etat-vide">
        <div class="illu">${ic('calendrier')}</div>
        <h2>Aucun test à venir</h2>
        <p>Profites-en ! Dès que tu ajoutes un test, un examen ou un livre à lire, l'appli prépare ton plan.</p>
        <button class="btn btn-principal btn-plein" data-action="ajouter-echeance" type="button">+ Ajouter un test ou un examen</button>
      </section>`;
  }
  h += aVenir.map(e => carteEcheance(e, plan)).join('');
  h += carteQuestions();
  if (historique.length) {
    h += `<details class="passees"${passeesOuvertes ? ' open' : ''}><summary>Historique (${historique.length})${ic('chevronBas', 'chevron-bas')}</summary>
        ${historique.map(e => carteEcheance(e, plan)).join('')}
      </details>`;
  }
  h += sectionMatieres();
  vue.innerHTML = h;
}

// Les petites étiquettes : TEST / EXAMEN, type de travail, passé.
function badgesEcheance(e) {
  let h = `<span class="badge badge-${e.type}">${nomType(e)}</span>`;
  if (e.travail && e.travail !== 'mixte') h += `<span class="badge badge-travail">${nomTravail(e)}</span>`;
  if (e.terminee) h += `<span class="badge badge-passe">${estLecture(e) ? '✓ Finie' : e.type === 'devoir' ? '✓ Rendu' : '✓ Passé'}</span>`;
  return `<span class="badges">${h}</span>`;
}

function carteEcheance(e, plan) {
  const lecture = estLecture(e);
  const total = lecture ? pagesTotal(e) : tempsEcheance(e);
  const fait = lecture ? pagesLues(e) : minutesFaites(e.id);
  const ratio = total > 0 ? Math.min(1, fait / total) : 1;
  const pourcent = Math.round(ratio * 100);
  const centre = pourcent >= 100 ? ic('check') : `${pourcent}<small>%</small>`;
  return `<article class="carte echeance${e.terminee || e.date < plan.jour ? ' passee' : ''}" style="${styleMatiereRiche(e.matiereId)}"
        data-action="detail-echeance" data-id="${e.id}" role="button" tabindex="0" aria-label="Voir ${echapper(nomEcheanceLong(e))}, ${pourcent} % fait">
      <div class="ech-corps">
        <div class="ech-haut"><span class="ech-matiere">${echapper(titreEcheance(e))}</span><span class="badge badge-${e.type}">${nomType(e)}</span></div>
        <div class="ech-date">${lecture ? `${echapper(nomMatiere(e.matiereId))} · à finir ${quandCourt(e.date, plan.jour)}` : e.type === 'devoir' ? `${echapper(nomMatiere(e.matiereId))} · à rendre ${quandCourt(e.date, plan.jour)}` : `${capitaliser(dateCourte(e.date))} · ${delai(e.date, plan.jour)}`}</div>
        <div class="ech-puces">${pucesStatut(e, plan)}</div>
      </div>
      ${anneau(ratio, { taille: 58, epaisseur: 6, contenu: centre, classe: pourcent >= 100 ? 'complet' : '' })}
    </article>`;
}

// Le statut en une ou deux pastilles courtes (la phrase complète est dans le détail).
function pucesStatut(e, plan) {
  const puce = (classe, icone, texte) => `<span class="puce-statut${classe ? ' ' + classe : ''}">${icone ? ic(icone) : ''}${texte}</span>`;
  const lecture = estLecture(e);
  if (lecture && !e.terminee && e.date >= plan.jour) {
    const lues = Math.min(pagesTotal(e), pagesLues(e));
    if (lues >= pagesTotal(e)) return puce('ok', 'check', 'Livre fini !');
  }
  if (e.terminee) {
    let h = puce('ok', 'check', lecture ? 'Finie' : e.type === 'devoir' ? 'Rendu' : 'Passé');
    if (lecture) return h + puce('', 'livre', `${Math.min(pagesTotal(e), pagesLues(e))}/${pluriel(pagesTotal(e), 'page')}`);
    if (e.resultat) h += puce('', 'cible', formaterNote(e.resultat.note, e.resultat.sur) + (e.resultat.objectif !== null && e.resultat.note >= e.resultat.objectif ? ' 🎯' : ''));
    return h;
  }
  if (e.date === plan.jour) return puce('auj', 'cible', "C'est aujourd'hui");
  if (e.date < plan.jour) return puce('', '', 'Date passée');
  let h = '';
  if (estVeille(e, plan.jour)) {
    const { liste, coches } = avancementChecklist(e);
    h += puce('veille-puce', 'lune', `Veille · ${coches}/${liste.length}`);
  }
  if (e.chapitresListe && e.chapitresListe.length) {   // V5 : chapitres (ou étapes) cochés
    const n = e.chapitresListe.length;
    const faits = e.chapitresListe.filter(c => c.fait).length;
    h += puce(faits === n ? 'ok' : '', 'check', `${faits}/${n} ${e.type === 'devoir' ? 'étape' : 'chapitre'}${n > 1 ? 's' : ''}`);
  }
  const i = plan.parId[e.id];
  if (!i) return h;
  if (i.manque > 0) h += puce('alerte', 'alerte', `Il manque ${formaterDuree(i.manque * plan.W)}`);
  else if (i.retard && i.retard.visible) h += puce('alerte', 'sablier', `Retard · +${formaterDuree(i.retard.parJour)}/jour`);
  else if (i.zeroMarge) h += puce('alerte', 'alerte', 'Zéro marge');
  const resteAujourdhui = i.prevuAujourdhui - i.faitsAujourdhui;
  if (lecture) h += puce('', 'livre', `${pagesLues(e)}/${pluriel(pagesTotal(e), 'page')}`);
  if (resteAujourdhui > 0 && lecture) {
    const ligne = plan.lignesDuJour.find(l => l.info === i);
    return h + puce('auj', 'eclair', `Aujourd'hui · ${pluriel(ligne ? objectifLecture(ligne, plan).reste : 0, 'page')}`);
  }
  if (resteAujourdhui > 0) return h + puce('auj', 'eclair', `Aujourd'hui · ${pluriel(resteAujourdhui, 'bloc')}`);
  const prochain = Object.keys(i.futur).filter(j => i.futur[j] > 0).sort()[0];
  if (prochain) return h + puce('', 'calendrier', `Prochaine séance : ${quandCourt(prochain, plan.jour)}`);
  if (i.total > 0) return h + puce('ok', 'check', 'Révisions finies');
  return h;
}

// "Note : 14/20 (objectif 12/20 🎯)"
function texteResultat(r) {
  let texte = `Note : ${formaterNote(r.note, r.sur)}`;
  if (r.objectif !== null) texte += ` (objectif ${formaterNote(r.objectif, r.sur)}${r.note >= r.objectif ? ' 🎯' : ''})`;
  return texte;
}

// La phrase complète du statut (dans le détail d'une échéance).
function statutEcheance(e, plan) {
  if (e.terminee) return `<div class="ech-statut ech-ok">✓ Rangé dans l'historique${e.termineeLe ? ` (${dateCourte(e.termineeLe)})` : ''}</div>`;
  if (e.date === plan.jour) return `<div class="ech-statut">📌 ${estLecture(e) ? "C'est le dernier jour !" : "C'est aujourd'hui, bonne chance !"}</div>`;
  if (estLecture(e) && pagesLues(e) >= pagesTotal(e)) return `<div class="ech-statut ech-ok">✓ Livre fini, bravo !</div>`;
  const i = plan.parId[e.id];
  if (!i) return '';
  if (i.manque > 0) return `<div class="ech-statut ech-alerte">⚠️ Pas assez de temps : il manque ${formaterDuree(i.manque * plan.W)}</div>`;
  if (i.retard && i.retard.visible) {
    const quand = i.retard.jusqua <= plan.jour ? "aujourd'hui" : `par jour ${jusqua(i.retard.jusqua, plan.jour)}`;
    return `<div class="ech-statut ech-alerte">⏰ En retard : +${formaterDuree(i.retard.parJour)} ${quand}</div>`;
  }
  if (i.zeroMarge) return `<div class="ech-statut ech-alerte">🟡 Zéro marge : si tu sautes un jour, tu seras en retard</div>`;
  const resteAujourdhui = i.prevuAujourdhui - i.faitsAujourdhui;
  const ligne = estLecture(e) ? plan.lignesDuJour.find(l => l.info === i) : null;
  if (resteAujourdhui > 0 && ligne) {
    const o = objectifLecture(ligne, plan);
    return `<div class="ech-statut">📅 Aujourd'hui : ${pluriel(o.reste, 'page')} à lire (p. ${o.de} → ${o.a})</div>`;
  }
  if (resteAujourdhui > 0) return `<div class="ech-statut">📅 Aujourd'hui : ${pluriel(resteAujourdhui, 'bloc')} à faire</div>`;
  const prochain = Object.keys(i.futur).filter(j => i.futur[j] > 0).sort()[0];
  if (prochain && estLecture(e)) return `<div class="ech-statut">📅 Prochaine séance : ${quandCourt(prochain, plan.jour)} (≈ ${pluriel(Math.round(i.futur[prochain] * plan.W / vitessePlan(e, plan)), 'page')})</div>`;
  if (prochain) return `<div class="ech-statut">📅 Prochaine séance : ${quandCourt(prochain, plan.jour)} (${pluriel(i.futur[prochain], 'bloc')})</div>`;
  if (i.total > 0) return `<div class="ech-statut ech-ok">✓ Révisions terminées, bravo !</div>`;
  return '';
}

function sectionMatieres() {
  const jour = aujourdhui();
  const triees = [...donnees.matieres].sort((a, b) => a.nom.localeCompare(b.nom, 'fr'));
  let h = `<h2 class="titre-section">Mes matières<button class="btn btn-petit btn-discret" data-action="ajouter-matiere" type="button">${ic('plus')}Ajouter</button></h2>
    <section class="carte carte-liste" id="matieres">
      <ul class="liste-matieres">`;
  for (const m of triees) {
    const n = donnees.echeances.filter(e => e.matiereId === m.id && !e.terminee && e.date >= jour).length;
    h += `<li><button class="ligne-matiere" data-action="modifier-matiere" data-id="${m.id}" type="button" style="${styleCouleur(m.couleur)}" aria-label="${echapper(m.nom)}${n ? ` : ${pluriel(n, 'échéance')} à venir` : ''}">
        <span class="rond"></span>
        <span class="nom">${echapper(m.nom)}</span>
        ${n ? `<span class="compteur" aria-hidden="true">${n}</span>` : ''}
        ${ic('chevron', 'chevron')}
      </button></li>`;
  }
  return h + `</ul></section>`;
}

/* ---------- Écran "Chrono" : le moment fort ----------
   Un grand anneau aux couleurs de la matière, qui se vide pendant le bloc.
   Pendant la pause, l'ambiance devient calme (bleu-vert) et l'anneau "respire". */

function afficherChrono() {
  const c = donnees.chrono;
  let h = `<header class="entete"><h1>Chrono</h1></header>`;
  h += carteRessenti();
  h += c ? chronoActif(c) : chronoAuRepos();
  h += resumeBlocsDuJour();
  document.getElementById('vue-chrono').innerHTML = h;
  majAffichageChrono();
}

// Une carte à cocher "Je travaille sur…" (le texte va à la ligne : rien n'est coupé).
function optionSujet(valeur, titre, details, style, coche) {
  return `<label class="option-sujet" style="${style}">
      <input type="radio" name="sujet-chrono" value="${valeur}"${coche ? ' checked' : ''}>
      <span class="option-corps"><strong>${echapper(titre)}</strong><small>${details}</small></span>
    </label>`;
}

// Durée choisie pour le prochain bloc (par défaut : la durée réglée, 25 min).
let dureeChoisie = null;
function dureesPossibles() {
  const t = donnees.reglages.travail;
  return [t, ...[25, 15, 10, 5].filter(m => m < t)].slice(0, 4);
}
function dureeBlocChoisie() {
  return dureesPossibles().includes(dureeChoisie) ? dureeChoisie : donnees.reglages.travail;
}

function chronoAuRepos() {
  const r = donnees.reglages;
  const jour = aujourdhui();
  const plan = planActuel();
  const possibles = donnees.echeances.filter(e => !e.terminee && e.date >= jour).sort(comparerPriorite);
  const reste = e => {
    const i = plan.parId[e.id];
    return i ? Math.max(0, i.prevuAujourdhui - i.faitsAujourdhui) : 0;
  };
  // D'abord les échéances qui ont des blocs prévus aujourd'hui.
  const ordre = [...possibles.filter(e => reste(e) > 0), ...possibles.filter(e => reste(e) === 0)];

  // Échéance proposée : celle choisie avant, sinon la première de la liste.
  let choix = choixChrono;
  if (choix !== '' && !ordre.some(e => e.id === choix)) choix = ordre.length ? ordre[0].id : '';

  const options = ordre.map(e => {
    const n = reste(e);
    let details = libelleQuand(e, jour);
    if (estLecture(e)) {
      const ligne = plan.lignesDuJour.find(l => l.info.echeance.id === e.id);
      const o = ligne ? objectifLecture(ligne, plan) : null;
      details = `Lecture · ${o && o.reste > 0 ? `p. ${o.de} → ${o.a} aujourd'hui` : `page ${pageActuelle(e)} sur ${e.pageFin}`}`;
    } else if (n > 0) details += ` · ${pluriel(n, 'bloc')} prévu${n > 1 ? 's' : ''} aujourd'hui`;
    return optionSujet(e.id, titreEcheance(e), details, styleMatiere(e.matiereId), e.id === choix);
  }).join('') + optionSujet('', 'Étude libre', 'sans échéance', styleCouleur('#b0abff'), choix === '');
  const choisie = choix ? trouverEcheance(choix) : null;

  return `<section class="chrono chrono-repos" id="chrono-repos" style="--phase:${choisie ? couleurMatiere(choisie.matiereId) : '#b0abff'}">
      <div class="anneau anneau-repos" aria-hidden="true">
        <svg viewBox="0 0 120 120"><circle class="anneau-fond" cx="60" cy="60" r="54"></circle><circle class="anneau-progres" cx="60" cy="60" r="54" style="stroke-dashoffset:0"></circle></svg>
        <div class="anneau-centre">
          <span class="chrono-phase">Prêt ?</span>
          <span class="chrono-temps">${formaterChrono(dureeBlocChoisie() * 60000)}</span>
          <span class="anneau-sous" id="repos-sujet">${echapper(choisie ? titreEcheance(choisie) : 'Étude libre')}</span>
        </div>
      </div>
      <div class="bascule durees" role="group" aria-label="Durée du bloc">
        ${dureesPossibles().map(m => `<button type="button" data-action="duree-bloc" data-minutes="${m}" aria-pressed="${m === dureeBlocChoisie()}">${m} min</button>`).join('')}
      </div>
      <button class="btn btn-principal btn-geant" data-action="demarrer" type="button">${ICONES.lecture} Démarrer · ${dureeBlocChoisie()} min</button>
      ${possibles.some(e => e.type === 'test' || e.type === 'examen') ? `<div class="liens-heros"><button class="lien" data-action="examen-blanc" type="button">Examen blanc (sans pause)</button></div>` : ''}
      <fieldset class="choix-sujet"><legend>Je travaille sur…</legend>${options}</fieldset>
      <p class="aide">Travail ${r.travail} min → petite pause ${r.pauseCourte} min. Grande pause de ${r.pauseLongue} min tous les ${r.blocsAvantPauseLongue} blocs.</p>
      ${possibles.length ? '' : `<p class="aide">Astuce : ajoute une échéance pour que tes blocs comptent dans ton plan.</p>`}
    </section>`;
}

function chronoActif(c) {
  const r = donnees.reglages;
  const p = infosPhase(c);
  const couleur = couleurAffichee(c);
  const enPause = !c.debut && c.phase !== 'attente';
  const repos = c.phase === 'pause' || c.phase === 'pauseLongue';
  let info = '';
  if (c.phase === 'travail') {
    const longue = (c.blocsSerie + 1) % r.blocsAvantPauseLongue === 0;
    info = `Bloc n°${c.blocsSerie + 1}${c.dureeTravail && c.dureeTravail < r.travail ? ` (court : ${c.dureeTravail} min)` : ''} · ensuite ${longue ? `grande pause (${r.pauseLongue} min)` : `petite pause (${r.pauseCourte} min)`}`;
  } else if (c.phase === 'attente') {
    info = `Bravo, ${pluriel(c.blocsSerie, 'bloc')} dans cette série 💪`;
  } else {
    info = `Ensuite : bloc n°${c.blocsSerie + 1}`;
  }
  if (c.examenBlanc && c.phase === 'travail') info = `Examen blanc de ${formaterDuree(Math.round(c.dureeMs / 60000))}, sans pause.<br>Pas de cours, pas de téléphone : comme le jour J !`;
  const e = c.echeanceId ? trouverEcheance(c.echeanceId) : null;
  const ligne = e ? planActuel().lignesDuJour.find(l => l.info.echeance.id === e.id) : null;
  const lecture = estLecture(e) && c.phase === 'travail';
  if (lecture && ligne && ligne.prevus) {
    const o = objectifLecture(ligne, planActuel());
    if (o.reste > 0) info += `<br>Objectif : lire jusqu'à la page ${o.a} (${pluriel(o.reste, 'page')})`;
  } else if (ligne && ligne.prevus && !c.examenBlanc) info += `<br>Pour cette échéance aujourd'hui : ${ligne.faits} fait${ligne.faits > 1 ? 's' : ''} sur ${ligne.prevus}`;
  const derniere = e && c.phase === 'travail' && !c.examenBlanc ? derniereNote(e.id) : null;
  const conseil = c.phase === 'travail' && donnees.reglages.conseils ? conseilMethode(c, e) : '';
  const idee = repos && donnees.reglages.ideesPause ? ideePause(c) : '';   // V6
  if (idee) info += `<br><span class="idee-pause">${echapper(idee)}</span>`;

  // Les points sous le temps : où tu en es avant la grande pause.
  const n = r.blocsAvantPauseLongue;
  const faitsCycle = c.phase === 'pauseLongue' ? n : c.blocsSerie % n;
  let points = '';
  for (let k = 0; k < n; k++) points += `<i class="${k < faitsCycle ? 'fait' : (k === faitsCycle && c.phase === 'travail' ? 'en-cours' : '')}"></i>`;

  let boutons;
  if (c.phase === 'attente') {
    boutons = `<div class="pile">
        <button class="btn btn-principal btn-geant" data-action="bloc-suivant" type="button">${ICONES.lecture} Bloc suivant (${c.dureeTravail || r.travail} min)</button>
        <button class="btn btn-plein" data-action="terminer" type="button">Terminer pour l'instant</button>
      </div>`;
  } else {
    const principal = enPause
      ? `<button class="commande principale" data-action="reprendre" type="button"><span class="rond-cmd">${ICONES.lecture}</span>Reprendre</button>`
      : `<button class="commande principale" data-action="pause" type="button"><span class="rond-cmd">${ICONES.pause}</span>Pause</button>`;
    boutons = `<div class="commandes">
        <button class="commande danger" data-action="arreter" type="button"><span class="rond-cmd">${ICONES.stop}</span>Arrêter</button>
        ${principal}
        <button class="commande" data-action="concentration" type="button" aria-label="Mode concentration (écran noir)"><span class="rond-cmd">${ic('lune')}</span>Concentration</button>
      </div>
      ${lecture ? `<div class="pile actions-lecture">
          <button class="btn btn-principal btn-plein" data-action="fini-lecture" type="button">${ic('check')} J'ai fini mes pages</button>
          <button class="btn btn-plein" data-action="allonger-lecture" type="button">${ic('plus')} 5 min de plus</button>
        </div>` : ''}
      ${c.phase !== 'travail' ? `<button class="btn btn-plein" data-action="passer-pause" type="button">${ICONES.suivant} Passer la pause</button>` : ''}`;
  }

  return `<section class="chrono chrono-actif${repos ? ' en-pause' : ''}${enPause ? ' arrete' : ''}" style="--phase:${couleur}">
      <div class="chrono-sujet"><span class="rond" style="${styleCouleur(couleur)}"></span>${echapper(sujetChrono(c))}</div>
      <div class="anneau">
        <svg viewBox="0 0 120 120" aria-hidden="true">
          <circle class="anneau-fond" cx="60" cy="60" r="54"></circle>
          <circle class="anneau-progres" id="anneau" cx="60" cy="60" r="54"></circle>
        </svg>
        <div class="anneau-centre">
          <span class="chrono-phase">${p.libelle}</span>
          <div class="chrono-temps" id="chrono-temps" role="timer" aria-live="off"></div>
          ${c.examenBlanc ? '' : `<span class="serie-points" aria-label="${pluriel(faitsCycle, 'bloc')} sur ${n} avant la grande pause">${points}</span>`}
        </div>
      </div>
      ${derniere ? `<p class="derniere-note">${ic('note')}<span>La dernière fois : « ${echapper(derniere.note)} »</span></p>` : ''}
      <p class="chrono-info">${info}</p>
      ${boutons}
      ${lecture ? `<div class="liens-heros"><button class="lien" data-action="fiche-lecture" data-id="${e.id}" type="button">Noter dans ma fiche de lecture</button></div>` : ''}
      ${conseil ? `<p class="conseil">${ic('etincelles')}<span><strong>Conseil :</strong> ${echapper(conseil)}</span></p>` : ''}
    </section>`;
}

function resumeBlocsDuJour() {
  const jour = aujourdhui();
  const blocs = donnees.blocs.filter(b => b.date === jour);
  if (!blocs.length) return `<p class="aide centre fait-vide">Aucun bloc terminé aujourd'hui pour l'instant.</p>`;
  const total = blocs.reduce((somme, b) => somme + b.minutes, 0);
  const lignes = blocs.slice().reverse().map(b => {
    const e = b.echeanceId ? trouverEcheance(b.echeanceId) : null;
    const nom = e ? nomEcheanceCourt(e, jour) : (b.matiereId ? nomMatiere(b.matiereId) : 'Étude libre');
    const ressenti = b.ressenti ? ` · ${RESSENTIS[b.ressenti].emoji} ${RESSENTIS[b.ressenti].nom}` : '';
    const note = b.note ? ` · « ${echapper(b.note)} »` : '';
    const pages = b.pages !== undefined ? ` · 📖 +${pluriel(b.pages, 'page')}` : '';
    const duree = b.manuel ? `≈ ${b.minutes} min (sans chrono)` : b.examenBlanc ? `📝 examen blanc de ${formaterDuree(b.minutes)}` : `${b.minutes} min`;
    return `<li style="${styleCouleur(b.matiereId ? couleurMatiere(b.matiereId) : '#b0abff')}">
        <span class="rond"></span>
        <span class="texte">${echapper(nom)}<small>${b.manuel ? '' : heure(b.debut) + ' · '}${duree}${pages}${ressenti}${note}</small></span>
        <button class="supprimer-bloc" data-action="supprimer-bloc" data-id="${b.id}" type="button" aria-label="Supprimer ce bloc">${ic('fermer')}</button>
      </li>`;
  }).join('');
  return `<h2 class="titre-section">Fait aujourd'hui<span class="etiquette">${pluriel(blocs.length, 'bloc')} · ${formaterDuree(total)}</span></h2>
    <section class="carte carte-liste">
      <ul class="liste-faits">${lignes}</ul>
    </section>`;
}

// Mise à jour du gros chrono (appelée 2 fois par seconde, sans tout redessiner).
function majAffichageChrono() {
  const c = donnees.chrono;
  const temps = document.getElementById('chrono-temps');
  const anneauProgres = document.getElementById('anneau');
  if (!c || !temps || !anneauProgres) return;
  const circonference = 339.292;  // 2 × π × 54
  if (c.phase === 'attente') {
    temps.textContent = 'Prêt ?';
    temps.classList.add('petit');
    anneauProgres.style.strokeDashoffset = 0;
    return;
  }
  const reste = restantMs(c);
  temps.textContent = formaterChrono(reste);
  temps.classList.remove('petit');
  anneauProgres.style.strokeDashoffset = circonference * (1 - (c.dureeMs > 0 ? reste / c.dureeMs : 0));
}

// Onglet "Chrono" : affiche le temps restant quand un chrono tourne (+ titre de la page).
function majOngletChrono() {
  const c = donnees.chrono;
  const bouton = document.getElementById('onglet-chrono');
  const texte = document.getElementById('onglet-chrono-texte');
  const bandeau = document.getElementById('bandeau-temps');
  if (c && c.phase !== 'attente') {
    const temps = formaterChrono(restantMs(c));
    const p = infosPhase(c);
    texte.textContent = temps;
    bouton.classList.add('chrono-actif');
    bouton.style.setProperty('--phase', couleurAffichee(c));
    if (bandeau) bandeau.textContent = temps;
    document.title = `${temps} · ${p.libelle} – Plan d'étude`;
  } else {
    texte.textContent = 'Chrono';
    bouton.classList.remove('chrono-actif');
    document.title = "Plan d'étude";
  }
}

/* ---------- Résumé de la semaine (le lundi, en haut de "Aujourd'hui") ---------- */

// Visible à partir du lundi, jusqu'à ce que tu le fermes (×).
// V6 : une barre fine sous les tuiles (seulement si tu t'es fixé un objectif).
function barreObjectifSemaine(jour) {
  const o = etatObjectifSemaine(donnees, jour);
  if (!o) return '';
  const texte = o.atteint
    ? `<strong>Objectif de la semaine atteint !</strong>`
    : `Semaine : <strong>${formaterDuree(o.fait)}</strong> / ${formaterDuree(o.objectif)}`;
  return `<button class="objectif-semaine${o.atteint ? ' atteint' : ''}" data-action="voir-objectif" type="button" aria-label="Objectif de la semaine : ${formaterDuree(o.fait)} sur ${formaterDuree(o.objectif)}">
      <span class="objectif-texte">${o.atteint ? '<span aria-hidden="true">🏁</span>' : ic('cible')}<span>${texte}</span><small>${o.atteint ? formaterDuree(o.fait) : `encore ${formaterDuree(o.reste)}`}</small></span>
      <span class="objectif-barre"><i style="width:${Math.round(o.ratio * 100)}%"></i></span>
    </button>`;
}

// V6 : les 4 chiffres du bilan d'un mois.
function noteSurEchelle(pourcent) {
  const sur = donnees.reglages.echelleNote || 20;
  return formaterNote(Math.round(pourcent * sur / 10) / 10, sur);
}
function tuilesBilan(b) {
  const moisAvant = MOIS[Number(moisVoisin(b.mois, -1).slice(5)) - 1];
  const ecart = b.total - b.totalAvant;
  const reference = b.enCours ? `au même moment en ${moisAvant}` : `en ${moisAvant}`;
  const compare = !b.totalAvant ? `pas d'étude ${reference}`
    : ecart === 0 ? `autant qu'${reference}` : `${ecart > 0 ? '+' : '−'}${formaterDuree(Math.abs(ecart))} par rapport ${b.enCours ? `au même moment en ${moisAvant}` : `à ${moisAvant}`}`;
  const sur = donnees.reglages.echelleNote || 20;
  let note = `<span class="tuile-valeur">—</span><span class="tuile-label">pas de note ce mois-ci</span>`;
  if (b.moyenne !== null) {
    const diff = b.moyenneAvant !== null ? Math.round((b.moyenne - b.moyenneAvant) * sur / 10) / 10 : null;
    const delta = diff === null ? pluriel(b.nbNotes, 'note')
      : diff === 0 ? `comme en ${moisAvant}` : `<span class="${diff > 0 ? 'monte' : 'baisse'}">${diff > 0 ? '▲ +' : '▼ −'}${formaterDecimal(Math.abs(diff))}</span> par rapport à ${moisAvant}`;
    note = `<span class="tuile-valeur">${noteSurEchelle(b.moyenne)}</span> <span class="tuile-label">moyenne de tes notes</span> <span class="tuile-delta">${delta}</span>`;
  }
  return `<div class="tuiles">
      <div class="tuile"><span class="tuile-valeur">${formaterDuree(b.total)}</span> <span class="tuile-label">d'étude</span> <span class="tuile-delta">${compare}</span></div>
      <div class="tuile"><span class="tuile-valeur">${b.jours}</span> <span class="tuile-label">jour${b.jours > 1 ? 's' : ''} d'étude</span> <span class="tuile-delta">${pluriel(b.blocs, 'bloc')}</span></div>
      <div class="tuile"><span class="tuile-valeur">${b.top ? echapper(nomMatiere(b.top.id)) : '—'}</span> <span class="tuile-label">${b.top ? `la plus travaillée (${formaterDuree(b.top.minutes)})` : 'matière la plus travaillée'}</span></div>
      <div class="tuile">${note}</div>
    </div>`;
}
// Sur Aujourd'hui, les 7 premiers jours du mois : le bilan du mois d'avant (jusqu'à ce que tu le fermes).
function carteBilanAujourdhui(jour) {
  if (Number(jour.slice(8, 10)) > 7) return '';
  const mois = moisVoisin(moisDe(jour), -1);
  if (donnees.bilanFerme === mois) return '';
  const b = bilanMois(donnees, mois, jour);
  if (!b.total && !b.nbNotes) return '';
  return `<section class="carte resume bilan" aria-label="Bilan du mois">
      <div class="carte-titre"><h2>${ic('trophee')}Ton bilan de ${nomMois(mois)}</h2><button class="fermer-x" data-action="fermer-bilan" data-mois="${mois}" type="button" aria-label="Fermer le bilan">${ic('fermer')}</button></div>
      ${tuilesBilan(b)}
      <button class="lien" data-action="voir-bilan" data-mois="${mois}" type="button">Voir le bilan complet</button>
    </section>`;
}

function carteResumeSemaine(jour) {
  const lundiActuel = lundiDe(jour);
  if (donnees.resumeFerme === lundiActuel) return '';
  const r = resumeSemaine(donnees, ajouterJours(lundiActuel, -7));
  if (!r.total && !r.prevus) return '';   // rien à résumer
  const s = series(donnees, jour);
  const ecart = r.total - r.totalAvant;
  const compare = ecart === 0
    ? "autant que la semaine d'avant"
    : `${ecart > 0 ? '+' : '−'}${formaterDuree(Math.abs(ecart))} par rapport à la semaine d'avant`;
  const blocs = r.prevus !== null
    ? `<span class="tuile-valeur">${r.faits} / ${r.prevus}</span><span class="tuile-label">blocs faits / prévus</span>`
    : `<span class="tuile-valeur">${r.faits}</span><span class="tuile-label">blocs faits</span><span class="tuile-delta">(les blocs prévus sont suivis depuis la V3)</span>`;
  return `<section class="carte resume" aria-label="Résumé de la semaine">
      <div class="carte-titre"><h2>${ic('graphique')}Ta semaine ${texteSemaine(r.lundi)}</h2><button class="fermer-x" data-action="fermer-resume" type="button" aria-label="Fermer le résumé">${ic('fermer')}</button></div>
      <div class="tuiles">
        <div class="tuile"><span class="tuile-valeur">${formaterDuree(r.total)}</span><span class="tuile-label">d'étude</span><span class="tuile-delta">${compare}</span></div>
        <div class="tuile"><span class="tuile-valeur">${r.top ? echapper(nomMatiere(r.top.id)) : '—'}</span><span class="tuile-label">${r.top ? `la plus travaillée (${formaterDuree(r.top.minutes)})` : 'matière la plus travaillée'}</span></div>
        <div class="tuile">${blocs}</div>
        <div class="tuile"><span class="tuile-valeur">🔥 ${pluriel(s.actuelle, 'jour')}</span><span class="tuile-label">d'affilée (record : ${pluriel(s.record, 'jour')})</span></div>
      </div>
      <button class="lien" data-action="aller-stats" type="button">Voir toutes mes stats</button>
    </section>`;
}

/* ---------- Calendrier (dans l'onglet Échéances) ---------- */

function carteCalendrier(plan) {
  const jour = plan.jour;
  const premier = moisCalendrier || jour.slice(0, 8) + '01';
  const d0 = dateDepuisCle(premier);
  const moisSuivant = cleDate(new Date(d0.getFullYear(), d0.getMonth() + 1, 1, 12));
  const debut = lundiDe(premier);
  const fin = ajouterJours(lundiDe(ajouterJours(moisSuivant, -1)), 6);
  const etude = etudeParJour(donnees.blocs);
  const choisi = jourCalendrier || (jour >= premier && jour < moisSuivant ? jour : null);

  let cases = ['L', 'M', 'M', 'J', 'V', 'S', 'D'].map(x => `<span class="cal-jsem" aria-hidden="true">${x}</span>`).join('');
  for (let j = debut; j <= fin; j = ajouterJours(j, 1)) {
    const echs = donnees.echeances.filter(e => e.date === j).sort(comparerPriorite);
    // La petite barre : les blocs prévus (aujourd'hui et après) ou faits (avant), aux couleurs des matières.
    const parts = j >= jour
      ? partsPrevues(plan, j)
      : Object.entries((etude[j] || { parMatiere: {} }).parMatiere).map(([id, minutes]) => ({ id, valeur: minutes }));
    const barre = parts.map(p => `<i style="flex:${p.valeur};--couleur:${couleurId(p.id)}"></i>`).join('');
    const marques = echs.map(e => `<i class="cal-ech ${e.type}" style="--couleur:${couleurMatiere(e.matiereId)}"></i>`).join('');
    const etiquette = capitaliser(dateLongue(j)) + (echs.length ? ' : ' + echs.map(e => nomEcheanceLong(e)).join(', ') : '');
    const special = jourSpecial(j);
    cases += `<button class="cal-jour${j >= premier && j < moisSuivant ? '' : ' hors'}${j === jour ? ' auj' : ''}${j === choisi ? ' choisi' : ''}${special ? (special.minutes === 0 ? ' indispo' : ' special') : ''}" data-action="cal-jour" data-jour="${j}" type="button" aria-label="${echapper(etiquette)}">
        <span class="cal-num">${dateDepuisCle(j).getDate()}</span>
        <span class="cal-marques">${marques}</span>
        <span class="cal-barre">${barre}</span>
      </button>`;
  }
  return `<section class="carte calendrier">
      <div class="cal-entete">
        <button class="cal-nav" data-action="cal-mois" data-sens="-1" type="button" aria-label="Mois précédent">${ic('chevronGauche')}</button>
        <h2>${MOIS[d0.getMonth()]} ${d0.getFullYear()}</h2>
        <button class="cal-nav" data-action="cal-mois" data-sens="1" type="button" aria-label="Mois suivant">${ic('chevron')}</button>
      </div>
      <div class="cal-grille">${cases}</div>
      <div class="cal-legende">
        <span><i class="cal-ech" style="--couleur:var(--texte-2)"></i>test</span>
        <span><i class="cal-ech examen" style="--couleur:var(--texte-2)"></i>examen</span>
        <span><i class="cal-ech lecture" style="--couleur:var(--texte-2)"></i>lecture</span>
        <span><i class="cal-ech devoir" style="--couleur:var(--texte-2)"></i>devoir</span>
        <span><span class="cal-barre"><i style="flex:1;--couleur:var(--texte-2)"></i></span>blocs prévus (ou faits)</span>
      </div>
    </section>
    ${choisi ? detailJourCalendrier(choisi, plan) : '<p class="aide centre">Touche un jour pour voir ce qui est prévu.</p>'}`;
}

// Les blocs prévus un jour donné, par matière.
function partsPrevues(plan, j) {
  return plan.infos
    .map(i => ({ id: i.echeance.matiereId, valeur: j === plan.jour ? i.prevuAujourdhui : (i.futur[j] || 0) }))
    .filter(p => p.valeur > 0);
}

// Ce qui se passe le jour touché dans le calendrier.
function detailJourCalendrier(j, plan) {
  const echs = donnees.echeances.filter(e => e.date === j).sort(comparerPriorite);
  let h = `<section class="carte"><h2>${capitaliser(dateLongue(j))}</h2>`;
  for (const e of echs) {
    h += `<button class="ligne-cal" data-action="detail-echeance" data-id="${e.id}" type="button" style="${styleMatiere(e.matiereId)}">
        ${ic('cible')}
        <span class="texte">${estLecture(e) ? `Fin de lecture : ${echapper(titreEcheance(e))}${e.terminee ? ' (finie)' : ''}` : e.type === 'devoir' ? `À rendre : ${echapper(titreEcheance(e))}${e.terminee ? ' (rendu)' : ''}` : `${nomType(e)} ${echapper(de(nomMatiere(e.matiereId)))}${e.terminee ? ' (passé)' : ''}`}</span>
        ${ic('chevron', 'chevron')}
      </button>`;
  }
  if (j >= plan.jour) {
    const prevus = plan.infos
      .map(i => ({ i, n: j === plan.jour ? i.prevuAujourdhui : (i.futur[j] || 0) }))
      .filter(x => x.n > 0);
    h += prevus.length
      ? `<p class="aide">Prévu :</p><div class="puces" style="margin-top:6px">${prevus.map(x => `<span class="puce" style="${styleMatiere(x.i.echeance.matiereId)}">${estLecture(x.i.echeance) ? `${echapper(titreEcheance(x.i.echeance))} · ≈ ${pluriel(Math.round(x.n * plan.W / vitessePlan(x.i.echeance, plan)), 'page')}` : `${echapper(nomMatiere(x.i.echeance.matiereId))} (${x.i.echeance.type}) · ${pluriel(x.n, 'bloc')}`}</span>`).join('')}</div>`
      : `<p class="aide">Rien de prévu ce jour-là.</p>`;
  }
  if (j <= plan.jour) {
    const faits = etudeParMatiere(donnees.blocs, j, j);
    if (faits.length) h += `<p class="aide">Fait : ${faits.map(x => `${echapper(nomCourtId(x.id))} ${formaterDuree(x.minutes)}`).join(' · ')}</p>`;
    else if (j < plan.jour) h += `<p class="aide">Aucun bloc fait ce jour-là.</p>`;
  }
  const special = jourSpecial(j);
  if (special) {
    h += `<button class="ligne-cal" data-action="modifier-special" data-id="${special.id}" type="button">
        ${ic('lune')}<span class="texte">${echapper(texteSpecial(special))}</span>${ic('chevron', 'chevron')}
      </button>`;
  } else if (j >= plan.jour) {
    h += `<div class="pile"><button class="btn btn-plein" data-action="special-jour" data-jour="${j}" type="button">${ic('lune')} Je ne suis pas dispo ce jour-là</button></div>`;
  }
  return h + `</section>`;
}

function changerMois(sens) {
  const base = dateDepuisCle(moisCalendrier || aujourdhui().slice(0, 8) + '01');
  moisCalendrier = cleDate(new Date(base.getFullYear(), base.getMonth() + sens, 1, 12));
  jourCalendrier = null;
  rafraichir();
}

/* ---------- Écran "Stats" (graphiques dessinés en SVG, sans bibliothèque) ---------- */

// Couleur et nom d'une "matière" de stats ("libre" = étude libre, sans matière).
function couleurId(id) {
  return id === 'libre' ? '#8b93ff' : couleurMatiere(id);
}
function nomCourtId(id) {
  return id === 'libre' ? 'Étude libre' : nomMatiere(id);
}

// Largeur disponible pour un graphique (en pixels), pour que le texte garde sa vraie taille.
function largeurGraphique() {
  const vue = document.getElementById('vue-stats');
  const base = vue && vue.clientWidth ? vue.clientWidth : Math.min(window.innerWidth, 560) - 32;
  return Math.max(240, Math.round(base - 34));   // moins les marges et la bordure de la carte
}

const n1 = v => Math.round(v * 10) / 10;   // arrondi à 0,1 px (pour alléger le dessin)

// Une barre horizontale : bout arrondi à droite, base carrée à gauche.
function barreH(x, y, l, h, r = 4) {
  const rr = Math.min(r, l, h / 2);
  return `M${n1(x)},${n1(y)}H${n1(x + l - rr)}Q${n1(x + l)},${n1(y)} ${n1(x + l)},${n1(y + rr)}V${n1(y + h - rr)}Q${n1(x + l)},${n1(y + h)} ${n1(x + l - rr)},${n1(y + h)}H${n1(x)}Z`;
}
// Une colonne : haut arrondi, base carrée.
function barreV(x, y, l, h, r = 4) {
  const rr = Math.min(r, h, l / 2);
  return `M${n1(x)},${n1(y + h)}V${n1(y + rr)}Q${n1(x)},${n1(y)} ${n1(x + rr)},${n1(y)}H${n1(x + l - rr)}Q${n1(x + l)},${n1(y)} ${n1(x + l)},${n1(y + rr)}V${n1(y + h)}Z`;
}

// Légende (seulement s'il y a au moins 2 matières : sinon le titre suffit).
function legende(ids, forme = 'carre') {
  if (ids.length < 2) return '';
  return `<div class="legende">${ids.map(id => `<span><i${forme === 'point' ? ' class="point"' : ''} style="--couleur:${couleurId(id)}"></i>${echapper(nomCourtId(id))}</span>`).join('')}</div>`;
}

// Un tableau "Voir les chiffres" (pour lire les valeurs sans toucher le graphique).
function tableauChiffres(cle, titre, entetes, lignes) {
  return `<details class="chiffres" data-cle="${cle}"${chiffresOuverts.has(cle) ? ' open' : ''}><summary>${titre}</summary>
      <table><thead><tr>${entetes.map(t => `<th>${t}</th>`).join('')}</tr></thead>
      <tbody>${lignes.length ? lignes.map(l => `<tr>${l.map(c => `<td>${c}</td>`).join('')}</tr>`).join('') : `<tr><td colspan="${entetes.length}">Rien pour l'instant</td></tr>`}</tbody></table>
    </details>`;
}

function afficherStats() {
  const vue = document.getElementById('vue-stats');
  const jour = aujourdhui();
  verifierBadges();
  let h = `<header class="entete"><h1>Stats</h1></header>`;
  if (!donnees.blocs.length && !resultatsAvecEtude(donnees).length) {
    h += `<section class="carte etat-vide">
        <div class="illu">${ic('graphique')}</div>
        <h2>Pas encore de stats</h2>
        <p>Fais ton premier bloc avec le chrono : ta série, tes graphiques et tes badges apparaîtront ici.</p>
        <button class="btn btn-principal btn-plein" data-action="aller-chrono" type="button">${ICONES.lecture} Lancer mon premier bloc</button>
      </section>`;
    vue.innerHTML = h + carteBadges(jour);
    return;
  }
  const L = largeurGraphique();
  h += carteSerie(jour);
  h += carteObjectifSemaine(jour);       // V6
  h += carteParMatiere(jour, L);
  h += cartePrevuFait(jour, L);          // V6
  h += carteLectures(jour);
  h += carte30Jours(jour, L);
  h += carteMoments(jour, L);            // V6
  h += carteNotes(L);
  h += carteEtudeEtNotes(L);
  h += carteBilanMois(jour);             // V6
  h += carteBadges(jour);
  vue.innerHTML = h;
}

/* ---------- V6 : objectif de la semaine ---------- */
function carteObjectifSemaine(jour) {
  const titre = `<div class="carte-titre"><h2>${ic('cible')}Objectif de la semaine</h2>`;
  const o = etatObjectifSemaine(donnees, jour);
  if (!o) {
    return `<section class="carte" id="carte-objectif">${titre}</div>
        <p class="aide" style="margin-top:0">Fixe-toi un temps d'étude pour la semaine : une barre se remplit à chaque bloc.</p>
        <div class="pile"><button class="btn btn-plein" data-action="objectif-fixer" type="button">${ic('plus')} Me fixer un objectif (${formaterDuree(objectifSemainePropose(donnees, jour))})</button></div>
      </section>`;
  }
  const passees = [4, 3, 2, 1].map(k => {
    const lundi = ajouterJours(o.lundi, -7 * k);
    return { lundi, minutes: minutesEntre(donnees, lundi, ajouterJours(lundi, 6)) };
  });
  const parJour = Math.ceil(o.reste / o.joursRestants / 5) * 5;
  return `<section class="carte" id="carte-objectif">${titre}<span class="etiquette">${Math.round(o.fait / o.objectif * 100)} %</span></div>
      <div class="objectif-grand"><strong>${formaterDuree(o.fait)}</strong> <span>sur ${formaterDuree(o.objectif)} cette semaine</span></div>
      <span class="objectif-barre grande${o.atteint ? ' atteint' : ''}"><i style="width:${Math.round(o.ratio * 100)}%"></i></span>
      <p class="aide">${o.atteint ? '🏁 Objectif atteint, bravo !' : `Encore ${formaterDuree(o.reste)} ${o.joursRestants > 1 ? `en ${o.joursRestants} jours (≈ ${formaterDuree(parJour)} par jour)` : "aujourd'hui"}.`}</p>
      <div class="ligne-reglage">
        <div class="libelle">Mon objectif<small>temps d'étude par semaine</small></div>
        <div class="stepper">
          <button type="button" data-action="objectif-moins" aria-label="Baisser l'objectif">−</button>
          <output>${formaterDuree(o.objectif)}</output>
          <button type="button" data-action="objectif-plus" aria-label="Monter l'objectif">+</button>
        </div>
      </div>
      <p class="aide" style="margin-bottom:0">Les 4 semaines d'avant (✓ = objectif actuel atteint) :</p>
      <div class="semaines-passees">${passees.map(p => `<span class="${p.minutes >= o.objectif ? 'ok' : ''}"><small>${dateCourteSansJour(p.lundi)}</small><strong>${formaterDuree(p.minutes)}${p.minutes >= o.objectif ? ' ✓' : ''}</strong></span>`).join('')}</div>
      <button class="lien" data-action="objectif-retirer" type="button">Ne plus avoir d'objectif</button>
    </section>`;
}
function changerObjectifSemaine(action) {
  const r = donnees.reglages;
  const avant = r.objectifSemaine;
  if (action === 'fixer') r.objectifSemaine = objectifSemainePropose(donnees);
  else if (action === 'plus') r.objectifSemaine = borner(avant + 30, 30, 3000);
  else if (action === 'moins') r.objectifSemaine = borner(avant - 30, 30, 3000);
  else r.objectifSemaine = 0;
  sauvegarder();
  afficherStats();
  if (action === 'retirer') proposerAnnulation("Plus d'objectif pour la semaine", () => { r.objectifSemaine = avant; });
  else verifierBadges();
}

/* ---------- V6 : prévu ou fait, par matière (les 30 derniers jours, jusqu'à hier) ---------- */
function graphiquePrevuFait(lignes, L, titre) {
  const hLigne = 34;
  const epaisseur = 14;
  const xBarre = Math.min(118, Math.round(L * 0.34));
  const placeTexte = Math.min(150, 12 + 7.2 * Math.max(...lignes.map(l => l.texte.length)));
  const largeurMax = Math.max(24, L - xBarre - placeTexte);
  const plafond = Math.max(1, ...lignes.map(l => Math.max(l.prevu, l.fait)));
  let svg = '';
  lignes.forEach((l, k) => {
    const y = k * hLigne + (hLigne - epaisseur) / 2;
    const wPrevu = l.prevu ? Math.max(3, l.prevu / plafond * largeurMax) : 0;
    const wFait = l.fait ? Math.max(3, l.fait / plafond * largeurMax) : 0;
    svg += `<text class="g-nom" x="0" y="${n1(y + epaisseur / 2)}" dominant-baseline="central">${echapper(raccourcir(l.nom, Math.max(6, Math.floor((xBarre - 8) / 8))))}</text>`;
    if (wPrevu) svg += `<path d="${barreH(xBarre, y, wPrevu, epaisseur)}" fill="${l.couleur}" fill-opacity="0.28"><title>${echapper(l.nom)} : prévu ${formaterDuree(l.prevu)}</title></path>`;
    if (wFait) svg += `<path d="${barreH(xBarre, y + 3, wFait, epaisseur - 6)}" fill="${l.couleur}"><title>${echapper(l.nom)} : fait ${formaterDuree(l.fait)}</title></path>`;
    svg += `<text class="g-valeur" x="${n1(xBarre + Math.max(wPrevu, wFait) + 6)}" y="${n1(y + epaisseur / 2)}" dominant-baseline="central">${echapper(l.texte)}</text>`;
  });
  return `<svg class="graphique" viewBox="0 0 ${L} ${lignes.length * hLigne}" width="${L}" height="${lignes.length * hLigne}" role="img" aria-label="${echapper(titre)}">${svg}</svg>`;
}
function cartePrevuFait(jour, L) {
  const hier = ajouterJours(jour, -1);
  const debut = ajouterJours(jour, -30);
  const r = prevuFaitParMatiere(donnees, debut, hier);
  const h = `<section class="carte" id="carte-prevu-fait"><div class="carte-titre"><h2>${ic('calendrier')}Prévu ou fait</h2><span class="etiquette">30 derniers jours</span></div>`;
  const lignes = r.lignes.filter(l => l.prevu > 0 && trouverMatiere(l.id))
    .map(l => ({ ...l, nom: nomMatiere(l.id), couleur: couleurMatiere(l.id), ratio: l.fait / l.prevu, texte: `${formaterDuree(l.fait)} / ${formaterDuree(l.prevu)}` }))
    .sort((a, b) => a.ratio - b.ratio || b.prevu - a.prevu);
  if (!lignes.length) {
    return h + `<p class="aide" style="margin-top:0">${r.jours ? "Pas encore de blocs prévus sur les jours suivis." : "Le suivi matière par matière commence aujourd'hui : reviens dans quelques jours pour voir les matières que tu repousses."}</p></section>`;
  }
  const repoussee = lignes.find(l => l.prevu >= 50 && l.ratio < 0.8);
  const depuis = r.premier && r.premier > debut ? `Suivi depuis le ${dateCourteSansJour(r.premier)}, jusqu'à hier.` : "Jusqu'à hier.";
  return h + `<div class="legende-prevu"><span><i></i>fait</span><span><i class="piste"></i>prévu</span></div>
      ${graphiquePrevuFait(lignes, L, 'Temps prévu et temps fait par matière')}
      <p class="aide">${repoussee
        ? `Tu as tendance à repousser <strong>${echapper(repoussee.nom)}</strong> : ${Math.round(repoussee.ratio * 100)} % de ce qui était prévu.`
        : 'Bravo : tu suis ton plan dans toutes tes matières 👍'} ${depuis}</p>
      ${tableauChiffres('prevu-fait', 'Voir les chiffres', ['Matière', 'Prévu', 'Fait', '%'], lignes.map(l => [echapper(l.nom), formaterDuree(l.prevu), formaterDuree(l.fait), `${Math.round(l.ratio * 100)} %`]))}
    </section>`;
}

/* ---------- V6 : tes meilleurs moments de la journée ---------- */
const MIN_BLOCS_MOMENTS = 8;
function carteMoments(jour, L) {
  const moments = momentsEfficaces(donnees, jour);
  const notes = moments.reduce((s, c) => s + c.total, 0);
  const h = `<section class="carte" id="carte-moments"><div class="carte-titre"><h2>${ic('soleil')}Tes meilleurs moments</h2><span class="etiquette">90 jours</span></div>`;
  if (notes < MIN_BLOCS_MOMENTS) {
    return h + `<p class="aide" style="margin-top:0">Après tes blocs, dis si c'était Facile, Ok ou Dur. Dès ${MIN_BLOCS_MOMENTS} blocs notés, tu verras à quel moment de la journée tu travailles le mieux (${notes}/${MIN_BLOCS_MOMENTS}).</p></section>`;
  }
  const avec = moments.filter(c => c.total > 0);
  const assez = avec.filter(c => c.total >= 3);
  const part = (c, cle) => c[cle] / c.total;
  const meilleur = assez.slice().sort((a, b) => part(b, 'facile') - part(a, 'facile') || b.total - a.total)[0];
  const pire = assez.slice().sort((a, b) => part(b, 'dur') - part(a, 'dur') || b.total - a.total)[0];
  let message = 'Pas encore assez de blocs à un même moment pour comparer (il en faut au moins 3).';
  if (meilleur && meilleur.facile) {
    message = `Ton meilleur moment : <strong>${meilleur.nom}</strong> (${Math.round(part(meilleur, 'facile') * 100)} % de blocs faciles). Garde-le pour ce qui est le plus difficile !`;
    if (pire && pire !== meilleur && part(pire, 'dur') >= 0.4) message += ` C'est plus dur ${pire.nom} (${Math.round(part(pire, 'dur') * 100)} % « Dur »).`;
  } else if (meilleur) message = 'Aucun bloc « Facile » pour l\'instant : continue de noter ton ressenti.';
  const lignes = avec.map(c => ({
    nom: c.court,
    couleur: c.total >= 3 ? '#34d399' : '#5d6478',
    valeur: Math.round(part(c, 'facile') * 100),
    texte: c.total >= 3 ? `${Math.round(part(c, 'facile') * 100)} % faciles` : `${pluriel(c.total, 'bloc')} (trop peu)`,
  }));
  return h + `<p class="aide" style="margin-top:0">Part de tes blocs « Facile », selon l'heure où ils ont commencé.</p>
      ${graphiqueBarres(lignes, L, 'Part de blocs faciles selon le moment de la journée', 100)}
      <p class="aide">${message}</p>
      ${tableauChiffres('moments', 'Voir les chiffres', ['Moment', 'Blocs', 'Facile', 'Ok', 'Dur'], avec.map(c => [c.court, c.total, c.facile, c.ok, c.dur]))}
    </section>`;
}

/* ---------- V6 : le bilan du mois (dans les stats, mois par mois) ---------- */
let moisBilan = null;   // le mois affiché (null = le mois en cours)
function carteBilanMois(jour) {
  const actuel = moisDe(jour);
  const dates = donnees.blocs.map(b => b.date).concat(resultatsAvecEtude(donnees).map(x => x.echeance.date)).filter(x => x <= jour).sort();
  const premier = dates.length ? moisDe(dates[0]) : actuel;
  const mois = moisBilan && moisBilan >= premier && moisBilan <= actuel ? moisBilan : actuel;
  const b = bilanMois(donnees, mois, jour);
  const lignes = [];
  lignes.push([ic('cible'), b.prevus !== null ? `<strong>${b.faits} / ${b.prevus}</strong> blocs faits / prévus${b.enCours ? " (jusqu'à aujourd'hui)" : ''}` : `<strong>${pluriel(b.faits, 'bloc')}</strong> fait${b.faits > 1 ? 's' : ''}`]);
  if (b.pages || b.livres.length) lignes.push([ic('livre'), `<strong>${pluriel(b.pages, 'page')}</strong> lue${b.pages > 1 ? 's' : ''}${b.livres.length ? ` · ${b.livres.length > 1 ? 'livres finis' : 'livre fini'} : ${b.livres.map(e => `« ${echapper(titreEcheance(e))} »`).join(', ')}` : ''}`]);
  if (b.examensBlancs) lignes.push([ic('horloge'), `<strong>${b.examensBlancs} examen${b.examensBlancs > 1 ? 's blancs' : ' blanc'}</strong>`]);
  if (b.objectifsFixes) lignes.push([ic('cible'), `Objectif de note atteint : <strong>${b.objectifsAtteints} / ${b.objectifsFixes}</strong>`]);
  for (const p of b.progres) {
    const fleche = p.avant === null ? '' : p.maintenant > p.avant + 0.5 ? ' <span class="monte">▲</span>' : p.maintenant < p.avant - 0.5 ? ' <span class="baisse">▼</span>' : ' =';
    lignes.push([ic('graphique'), `${echapper(nomMatiere(p.id))} : <strong>${noteSurEchelle(p.maintenant)}</strong>${p.nb > 1 ? ` (moyenne de ${p.nb} notes)` : ''}${p.avant !== null ? ` · avant : ${noteSurEchelle(p.avant)}${fleche}` : ''}`]);
  }
  if (b.compris) lignes.push([ic('cerveau'), `<strong>${b.compris} question${b.compris > 1 ? 's comprises' : ' comprise'}</strong> grâce au prof`]);
  if (b.badges.length) lignes.push([ic('medaille'), `Badges : ${b.badges.map(id => { const x = infoBadge(id); return `${x.emoji} ${echapper(x.nom)}`; }).join(', ')}`]);
  return `<section class="carte" id="carte-bilan">
      <div class="bilan-nav">
